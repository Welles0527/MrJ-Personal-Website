/* Calendar-inspired edition: warm paper, ruled cells, and quiet category colors. */
:root{--ink:#252321;--muted:#69645e;--purple:#746a5d;--lavender:#f5e7da;--line:#d9d2ca;--bg:#fbf8f5;--food:#d8a887;--coffee:#b99c7e;--mall:#9db7ca;--park:#a8b691;--bar:#c5aaa0;--other:#b4aaa0;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink)}
body{background:var(--bg)}
button:hover{background:#f4ece4}
button:focus-visible,a:focus-visible,input:focus-visible{outline-color:#a38a6e}
a{color:#6a594a}
.topbar{height:72px;padding:0 26px;gap:30px;background:#fbf8f5;border-bottom:1px solid var(--line)}
.brand{width:230px;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:50%;background:#f1e1d0;color:#665547;box-shadow:none;border:1px solid #e3d2c0}
.brand b{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:20px;font-weight:600;letter-spacing:1px}
.brand small{font-size:9px;letter-spacing:1.7px;color:#8c8178}
.search{width:min(430px,34vw);border:1px solid var(--line);border-radius:6px;background:#fffdfa;color:#786d64}
.search:focus-within{border-color:#a9937c}
.search input{color:var(--ink)}
.city,.private{color:#675e56}
.avatar{border-color:#d9caba;background:#f4e8da;color:#514237}
.layout{grid-template-columns:210px minmax(0,1fr);height:calc(100dvh - 72px)}
.sidebar{background:#fbf8f5;padding:29px 14px 20px}
.nav-label{color:#6d6258;font-size:11px;letter-spacing:1.5px;font-weight:600}
.nav-item{border:1px solid transparent;border-radius:6px;color:#534d47;margin-bottom:5px}
.nav-item:hover{background:#f6eee7;border-color:#e8dfd6}
.nav-item.active{background:#f3e4d5;border-color:#e6d3c0;color:#302820}
.nav-item.active .count{color:#654c3c}
.nav-item .count{color:#918780}
.sidebar-bottom{border-top:1px solid var(--line)}
.collection-num{color:#302a24;font-family:"Noto Serif CJK SC","Songti SC",serif}
.sidebar-bottom p{color:#746b62}
.mini-bar{height:7px;border-radius:3px;background:#e9e4dc}
.mini-bar i{background:#ebd0b8}
.workspace-head{padding:28px 32px 22px;border-bottom:1px solid var(--line);background:#fffcf9}
.heading-label{color:#85776c;font-size:11px;letter-spacing:2px}
.workspace-head h1{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:29px;font-weight:600;letter-spacing:1px}
.heading-sub{color:#625a53}
.mode-switch{background:#f2ede8;border:1px solid var(--line);border-radius:6px;padding:3px}
.mode-switch button{color:#6d6258;border-radius:4px}
.mode-switch button.active{color:#2c2823;border:1px solid #d8cfc6;box-shadow:none;background:#fffdfa}
.filters{padding:12px 32px 17px;background:#fffcf9;border-bottom-color:var(--line)}
.filter-row{margin-top:7px}
.filter-label{color:#73685e;font-weight:600}
.chip{border:1px solid #e3dcd4;border-radius:4px;color:#564e46;background:#fffcf9}

function openBoardBulkEditor(){if(!boardSelection.size)return;const panel=ensureBoardEditor();panel.innerHTML=`<h2>编辑 ${boardSelection.size} 家收藏</h2><form id="board-bulk-form"><label for="board-bulk-category">分类</label><select id="board-bulk-category"><option value="">保持不变</option>${categories.slice(1).map(entry=>`<option value="${esc(entry[0])}">${esc(entry[0])}</option>`).join('')}</select><label for="board-bulk-status">到访状态</label><select id="board-bulk-status"><option value="">保持不变</option><option value="未去">未去</option><option value="已去">已去</option></select><div class="board-editor-actions"><button type="button" data-board-action="close-editor">取消</button><button type="submit" class="primary">保存修改</button></div></form>`;panel.classList.remove('hidden');panel.querySelector('select').focus()}
function openManualFavorite(){const panel=ensureBoardEditor(),name=$('board-add-favorite-name')?.value||'';panel.innerHTML=`<h2>新增收藏</h2><form id="board-manual-favorite-form"><label for="manual-name">店铺名称</label><input id="manual-name" required maxlength="80" value="${esc(name)}"><label for="manual-url">大众点评店铺链接</label><input id="manual-url" type="url" required placeholder="https://www.dianping.com/shop/…"><label for="manual-address">地址</label><input id="manual-address" required maxlength="200"><label for="manual-category">分类</label><select id="manual-category">${options(categories.slice(1).map(c=>c[0]),'美食')}</select><label for="manual-price">美食人均（可选）</label><input id="manual-price" type="number" min="0.01" step="0.01"><p class="board-add-status" role="status">${boardHelperReady?'已连接新增助手，也可切换到自动搜索。':'当前浏览器未连接新增助手，无法自动抓取。请填写店铺信息后保存；自动搜索需要在已启用助手的浏览器中使用。'}</p><div class="board-editor-actions"><button type="button" data-board-action="close-editor">取消</button>${boardHelperReady?'<button type="button" data-board-action="add-favorite">自动搜索</button>':''}<button type="submit" class="primary">保存收藏</button></div></form>`;panel.classList.remove('hidden');panel.querySelector('input').focus()}
function openAddFavorite(){if(!boardHelperReady){openManualFavorite();return}const panel=ensureBoardEditor();panel.innerHTML=`<h2>新增收藏</h2><form id="board-add-favorite-form"><label for="board-add-favorite-name">店铺名称</label><input id="board-add-favorite-name" maxlength="80" required placeholder="例如：福禄居·匠"><p class="board-add-status">输入店名后将从已登录的大众点评中查找并自动补全。</p><div class="board-editor-actions"><button type="button" data-board-action="close-editor">取消</button><button type="button" data-board-action="manual-favorite">手动填写</button><button type="submit" class="primary">搜索并添加</button></div></form>`;panel.classList.remove('hidden');panel.querySelector('input').focus()}
function saveAddedFavorites(){try{accountStorage.setItem(boardAddedFavoritesKey,JSON.stringify(boardAddedFavorites));return true}catch{notify('浏览器无法保存新增收藏');return false}}
function saveDealResult(id,raw){
  if(!id||!items.some(item=>item.id===id))return;
  const status=raw?.status,checkedAt=typeof raw?.checkedAt==='string'?raw.checkedAt:new Date().toISOString();
  const offers=Array.isArray(raw?.offers)?raw.offers.slice(0,40).map(offer=>({title:String(offer.title||'').trim().slice(0,100),price:Number(offer.price),url:String(offer.url||'')})).filter(offer=>offer.title&&Number.isFinite(offer.price)&&offer.price>0&&/^https:\/\/(?:[\w-]+\.)*(?:dianping\.com|meituan\.com)\//.test(offer.url)):[];
  const previous=dealsByShop[id];
  if(status==='found'&&offers.length)dealsByShop[id]={status:'found',offers,checkedAt};
  else if(status==='none')dealsByShop[id]={status:'none',offers:[],checkedAt};
  else if(previous?.status==='found'||previous?.status==='none')dealsByShop[id]={...previous,lastErrorAt:checkedAt};
  else dealsByShop[id]={status:'unknown',offers:[],checkedAt};
  window.dianpingAccountChanged?.();syncBoard();
}
function stopDealsSync(message){clearTimeout(dealsSyncTimer);dealsQueue=[];dealsSyncActive=false;dealRequest='';dealCurrentShop=null;syncBoard();if(message)notify(message)}
function nextDeal(){
  if(!dealsSyncActive)return;
  const shop=dealsQueue.shift();
  if(!shop){stopDealsSync(`团购同步完成：${dealsDone}/${dealsTotal} 家已检查`);return}
  dealCurrentShop=shop;dealRequest=`deals-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
  window.postMessage({source:'shanghai-favorites-board',type:'dianping-helper-deals',requestId:dealRequest,shop:{id:shop.id,url:shop.url||`https://www.dianping.com/shop/${shop.id}`}},location.origin);
  syncBoard();
}
function startDealsSync(){
  if(dealsSyncActive)return;
  if(!boardHelperReady){notify('当前浏览器未连接大众点评新增助手，无法同步团购');return}
  dealsQueue=items.filter(item=>!trash[item.id]&&!deleted[item.id]&&/^[a-zA-Z0-9]+$/.test(item.id));
  dealsTotal=dealsQueue.length;dealsDone=0;
  if(!dealsTotal){notify('没有可同步的收藏商家');return}
  dealsSyncActive=true;nextDeal();
}
function showAddedFavorite(item,inTrash=false){Object.assign(state,{cat:inTrash?'回收站':'全部收藏',sub:'全部',districts:[],metros:[],arrangement:'全部',q:item.name.toLowerCase(),mode:'board'});$('search').value=item.name;closeBoardEditor();render();requestAnimationFrame(()=>{const card=[...$('board').querySelectorAll('.card')].find(card=>card.dataset.boardId===item.id);card?.scrollIntoView({block:'center',behavior:'smooth'})})}
function addFavoriteFromHelper(raw){const item=addedFavoriteItem({...raw,savedAt:new Date().toISOString().slice(0,10)});if(!item){notify('大众点评未返回可用的店铺信息');return}const existing=items.find(row=>row.id===item.id);if(existing){const inTrash=!!(trash[existing.id]||deleted[existing.id]);showAddedFavorite(existing,inTrash);notify(inTrash?`已在回收站：${existing.name}，可点击恢复收藏`:`已找到现有收藏：${existing.name}`);return}boardAddedFavorites.unshift({...raw,savedAt:item.date});if(!saveAddedFavorites())return;items.unshift(item);if(raw.deals)saveDealResult(item.id,raw.deals);showAddedFavorite(item);window.dianpingAccountChanged?.();notify(`已添加：${item.name}${raw.deals?.status==='blocked'?' · 团购信息受限，请稍后同步':''}`)}
function beginDianpingSearch(name){if(!boardHelperReady){const status=ensureBoardEditor().querySelector('.board-add-status');if(status)status.textContent='当前浏览器未连接新增助手。请点击手动填写，或在已启用助手的浏览器中自动搜索。';return}boardAddRequest=`board-add-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const panel=ensureBoardEditor(),status=panel.querySelector('.board-add-status');if(status)status.textContent='正在从大众点评检索店铺信息…';panel.querySelector('input')?.setAttribute('disabled','');panel.querySelector('button[type="submit"]')?.setAttribute('disabled','');window.postMessage({source:'shanghai-favorites-board',type:'dianping-helper-search',requestId:boardAddRequest,name},location.origin)}
function showDianpingCandidates(message){const panel=ensureBoardEditor(),status=panel.querySelector('.board-add-status');if(status)status.textContent='找到多个可能的店铺，请选择一个。';const candidates=Array.isArray(message.candidates)?message.candidates.slice(0,8):[];let list=panel.querySelector('.board-add-candidates');if(!list){list=document.createElement('div');list.className='board-add-candidates';panel.querySelector('form')?.before(list)}list.innerHTML=candidates.map((candidate,index)=>`<button type="button" class="board-add-candidate" data-board-add-candidate="${index}"><strong>${esc(candidate.name||'未命名店铺')}${candidate.score?` <span class="card-score">★ ${esc(candidate.score)}</span>`:''}</strong><span>${esc(candidate.address||candidate.category||'大众点评店铺')}</span></button>`).join('');list._candidates=candidates}
function saveBoardEdit(x,setting=placeSetting(x)){const edit={...savedEdits[x.id],classificationRevision:'board',statusRevision:'board',category:x.category,sub:x.sub,status:x.status,district:x.district,walks:x.walks,setting},previousSetting=x.setting;try{x.setting=setting;accountStorage.setItem(metadataKey,JSON.stringify({...savedEdits,[x.id]:edit}));savedEdits[x.id]=edit;return true}catch{x.setting=previousSetting;notify('浏览器无法保存编辑');return false}}
function deleteBoardSelection(){const selected=[...boardSelection].filter(id=>items.some(x=>x.id===id)&&!trash[id]&&!deleted[id]);if(!selected.length)return;if(!window.confirm(`确认将 ${selected.length} 家收藏移入回收站？\n可在左侧回收站恢复。`))return;selected.forEach(id=>trash[id]=Date.now());try{accountStorage.setItem(trashKey,JSON.stringify(trash))}catch{}boardSelection.clear();boardSelectionMode=false;render();notify(`已将 ${selected.length} 家收藏移入回收站`)}

document.addEventListener('change',event=>{
  const control=event.target.closest('#board [data-board-field]');if(!control)return;
  const x=items.find(item=>item.id===control.dataset.boardId);if(!x)return;
  const previous={category:x.category,sub:x.sub,setting:x.setting};
  const field=control.dataset.boardField;let setting=placeSetting(x);
  if(field==='category'){x.category=control.value;x.sub=hasSubcategory(x.category)?subOptions(x.category,'其他')[0]||'':'';if(x.category!=='美食')x.avgPrice=null;if(!x.setting&& !savedEdits[x.id]?.setting)setting=placeSetting(x)}
  else if(field==='sub')x.sub=control.value;
  else if(field==='setting')setting=control.value;
  if(!saveBoardEdit(x,setting)){x.category=previous.category;x.sub=previous.sub;x.setting=previous.setting}
  render();
},true);
document.addEventListener('click',event=>{
  const select=event.target.closest('[data-board-select]');if(select){event.preventDefault();event.stopImmediatePropagation();setBoardSelection(select.dataset.boardSelect);return}
  const note=event.target.closest('[data-board-note]');if(note){event.preventDefault();event.stopImmediatePropagation();openBoardNote(note.dataset.boardNote);return}
  const candidate=event.target.closest('[data-board-add-candidate]');if(candidate){event.preventDefault();event.stopImmediatePropagation();const list=candidate.closest('.board-add-candidates'),picked=list?._candidates?.[Number(candidate.dataset.boardAddCandidate)];if(picked&&boardAddRequest){const status=ensureBoardEditor().querySelector('.board-add-status');if(status)status.textContent='正在读取大众点评店铺信息…';window.postMessage({source:'shanghai-favorites-board',type:'dianping-helper-select',requestId:boardAddRequest,candidate:picked},location.origin)}return}
  const action=event.target.closest('[data-board-action]');if(!action)return;event.preventDefault();event.stopImmediatePropagation();switch(action.dataset.boardAction){case'manual-favorite':openManualFavorite();break;case'delete-tag':deleteBoardTag();break;case'add-favorite':openAddFavorite();break;case'sync-deals':startDealsSync();break;case'cancel-deals':stopDealsSync('已停止团购同步');break;case'toggle-selection':boardSelectionMode=true;syncBoard();break;case'cancel-selection':boardSelectionMode=false;boardSelection.clear();syncBoard();break;case'edit-selection':openBoardBulkEditor();break;case'delete-selection':deleteBoardSelection();break;case'empty-trash':emptyTrash();break;case'close-editor':closeBoardEditor();break}
},true);
document.addEventListener('submit',event=>{
  if(event.target.id==='board-manual-favorite-form'){event.preventDefault();const url=$('manual-url').value.trim(),match=url.match(/^https:\/\/(?:www\.|m\.)?dianping\.com\/shop\/([a-zA-Z0-9]+)(?:[/?#]|$)/);if(!match){ensureBoardEditor().querySelector('.board-add-status').textContent='请填写有效的大众点评店铺链接。';return}const category=$('manual-category').value;addFavoriteFromHelper({id:match[1],name:$('manual-name').value.trim(),url,address:$('manual-address').value.trim(),category,sub:'其他',city:'上海',avgPrice:category==='美食'?normalizedAveragePrice($('manual-price').value):null});return}
  if(event.target.id==='board-note-form'){event.preventDefault();const panel=$('board-editor'),id=panel.dataset.noteId,text=$('board-note-text').value.trim(),index=Number(panel.dataset.tagIndex),tags=boardTags(id);if(!text)return;if(index>=0)tags[index]=text;else tags.push(text);boardNotes[id]=tags;if(saveBoardNotes()){closeBoardEditor();syncBoard();notify('已保存标签')}return}
  if(event.target.id==='board-bulk-form'){event.preventDefault();const category=$('board-bulk-category').value,status=$('board-bulk-status').value;let count=0;for(const id of boardSelection){const x=items.find(item=>item.id===id);if(!x)continue;if(category){x.category=category;x.sub=category==='美食'?'其他':category}if(status)x.status=status;if(saveBoardEdit(x))count++}closeBoardEditor();render();notify(`已更新 ${count} 家收藏`)}
  if(event.target.id==='board-add-favorite-form'){event.preventDefault();beginDianpingSearch($('board-add-favorite-name').value.trim())}
});
window.addEventListener('message',event=>{if(event.source!==window||event.origin!==location.origin)return;const message=event.data;if(!message||message.source!=='dianping-favorites-helper')return;if(message.type==='ready'){boardHelperReady=true;return}if(message.requestId===dealRequest&&dealsSyncActive){if(message.type==='deals-result'){saveDealResult(dealCurrentShop?.id,message.deals);if(message.deals?.status==='blocked'){stopDealsSync('大众点评要求验证或隐藏团购信息，已停止同步');return}dealsDone++;dealsSyncTimer=setTimeout(nextDeal,800);syncBoard();return}if(message.type==='deals-error'){saveDealResult(dealCurrentShop?.id,{status:'unknown'});stopDealsSync(message.message||'团购同步失败，已停止');return}}if(message.requestId!==boardAddRequest)return;if(message.type==='candidates'){showDianpingCandidates(message);return}if(message.type==='result'){boardAddRequest='';addFavoriteFromHelper(message.shop);return}if(message.type==='error'){boardAddRequest='';const panel=ensureBoardEditor(),status=panel.querySelector('.board-add-status');if(status)status.textContent=message.message||'大众点评检索失败';panel.querySelector('input')?.removeAttribute('disabled');panel.querySelector('button[type="submit"]')?.removeAttribute('disabled');notify(message.message||'大众点评检索失败')}});
window.postMessage({source:'shanghai-favorites-board',type:'dianping-helper-ping'},location.origin);
scheduleBoardSync();
</script>

const collectionRender=render;render=function(...args){const result=collectionRender.apply(this,args);collectionFilterBar.querySelectorAll('[data-filter="arrangement"]').forEach(button=>button.setAttribute('aria-pressed',String(state.arrangement===button.dataset.value)));const arrangementRows=baseRows(),arrangedCount=arrangementRows.filter(item=>hasArrangement(item.id,'solo')||hasArrangement(item.id,'family')).length;arrangementDetails.innerHTML=[['全部','全部',arrangementRows.length],['安排','待安排',arrangementRows.length-arrangedCount],['已安排','已安排',arrangedCount]].map(([value,label,count])=>`<button class="chip ${state.arrangement===value?'active':''}" data-filter="arrangement" data-value="${value}" aria-pressed="${state.arrangement===value}">${label}（${count}）</button>`).join('');collectionFilterBar.querySelector('[data-expand-filter="arrangement"] b').textContent=state.arrangement==='全部'?'全部':`${state.arrangement==='安排'?'待安排':'已安排'}（${state.arrangement==='安排'?arrangementRows.length-arrangedCount:arrangedCount}）`;collectionManage.hidden=state.cat==='回收站';$('collection-page-title').textContent=state.cat==='全部收藏'?'我的收藏':state.cat;updateCollectionCover();for(const key of ['districts','metros'])collectionFilterBar.querySelector(`[data-expand-filter="${key}"] b`).textContent=state[key].length?`${state[key].length} 项`:'全部';return result};

// Apply this verified batch to the standalone preview, respecting its recycle bin.
for(let index=0;index<items.length;index++)if(otherPublicShopDetailsBatch[items[index].id])items[index]=enrichVerifiedShop(items[index],{trash,deleted});
render();
</script>
