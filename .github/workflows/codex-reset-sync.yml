name: Codex reset daily cloud sync

on:
  schedule:
    # 02:00 UTC = 10:00 Asia/Shanghai. GitHub may queue scheduled runs.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-reset-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate source snapshot
        run: node scripts/sync-codex-reset.mjs
      - name: Commit only the Codex snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/super-calendar/codex-reset.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Codex reset snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
