-radius:17px;margin-bottom:9px;text-align:left}.nav span{flex:1}.nav b{font-weight:500;font-size:12px;opacity:.6}.nav.active,.primary{background:linear-gradient(145deg,#bda1ff,#8552ed 70%,#ae8aff);color:white;border:1px solid #dfcfff;box-shadow:inset 1px 2px 5px #ffffff9c,0 8px 14px #8150d449}.aside-note{margin-top:42px;padding:17px;border-radius:20px;background:#ffffff24;border:1px solid #ffffff66;font-size:13px;color:#53525e}.aside-note strong{display:block;margin-bottom:6px;color:#343240}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#258957;margin-right:7px}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px}.topline h2{font-size:28px;margin:0}.subtext{font-size:14px;color:#555360;margin:4px 0 22px}.primary{padding:11px 22px;border-radius:25px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:25px}.stat{position:relative;border-radius:23px;padding:17px 22px;background:linear-gradient(135deg,#ffffff70,#ffffff18);border:1px solid #ffffff92;box-shadow:inset 1px 2px 3px #fff8,6px 9px 13px #484b5722}.stat:nth-child(2){background:linear-gradient(120deg,#baefe17a,#88daca30)}.stat:nth-child(3){background:linear-gradient(120deg,#d6c2ff83,#bcaaff22)}.stat span{font-size:14px;color:#514f5c}.stat strong{display:block;font-size:30px;line-height:1.4;font-weight:600}.stat small{position:absolute;right:20px;bottom:24px;font-size:12px;color:#5a5663}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}.search{flex:1;min-width:190px;border-radius:24px;padding:11px 18px;background:#fff9;box-shadow:inset 1px 2px 3px #fff6}.tabs{display:flex;padding:4px;background:#ffffff30;border-radius:25px;border:1px solid #ffffff65}.tabs button{border:0;background:transparent;padding:7px 17px;border-radius:22px;font-size:14px}.tabs button.active{background:#fffc;box-shadow:2px 4px 8px #5553}.filter{border-radius:22px;background:#ffffff60;padding:8px 13px;max-width:170px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px;align-items:start}.card{border:1px solid #ffffffaa;border-radius:25px;background:linear-gradient(135deg,#ffffff70,#ffffff23);box-shadow:inset 1px 2px 3px #fffa,7px 12px 17px #45424b24;overflow:hidden}.card-head{padding:20px 20px 14px;border-bottom:1px solid #fff8;background:linear-gradient(115deg,var(--tint),#ffffff12)}.card-title{display:flex;align-items:center;justify-content:space-between}.card-title h3{font-size:18px;margin:0}.card-title span{font-size:12px;background:#ffffff70;padding:2px 9px;border-radius:10px}.category-meta{font-size:12px;color:#555260;margin-top:6px}.group{padding:13px 17px 5px}.group h4{font-size:13px;color:#60596a;margin:0 0 7px;font-weight:500;display:flex;align-items:center;gap:7px}.group h4:before{content:'';width:4px;height:12px;background:#ad8adc;border-radius:5px}.task{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid #ffffff45}.check{width:19px;height:19px;flex-shrink:0;border-radius:7px;background:#ffffff50;border:1px solid #8c89947a;padding:0;line-height:17px;margin-top:3px;font-size:13px}.done .check{background:linear-gradient(145deg,#96debd,#48aa80);color:white;border-color:#b8f1d1;box-shadow:inset 1px 1px 3px #fff8}.task-name{flex:1;text-align:left;border:0;background:transparent;padding:0;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.done .task-name{color:#147748}.actions{display:flex;gap:2px}.icon{background:transparent;border:0;padding:1px 5px;opacity:.5;font-size:15px}.icon:hover{opacity:1}.add-row{border:0;background:transparent;font-size:13px;padding:17px 20px;color:#696175;width:100%;text-align:left}.empty{grid-column:1/-1;text-align:center;padding:55px;color:#565363}.footer{display:flex;justify-content:space-between;font-size:12px;color:#53535e;padding:24px 2px 0}dialog{border:1px solid #ffffffb3;border-radius:28px;padding:28px;width:min(480px,92vw);color:#24232c;background:linear-gradient(140deg,#f5ecf9f5,#dbefe9f5);box-shadow:10px 25px 65px #25253666}dialog::backdrop{background:#34344555;backdrop-filter:blur(7px)}dialog h2{margin:0 0 20px;font-size:22px}label{display:block;font-size:14px;margin-bottom:14px}label input,label textarea,label select{display:block;width:100%;margin-top:6px;padding:10px 13px;border-radius:12px;background:#fffb}dialog .buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.secondary{padding:10px 20px;border-radius:24px;background:#ffffff70}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#2c3547eb;color:white;border-radius:20px;padding:10px 22px;z-index:10;font-size:14px}.hidden{display:none}@media(min-width:1500px){.shell{margin:45px auto}}@media(max-width:1200px){.shell{margin:20px}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:180px 1fr;gap:20px}}@media(max-width:760px){.shell{margin:10px;padding:18px;border-radius:25px}.layout{display:block}aside{border:0;padding:0}#nav{display:flex;overflow:auto;gap:6px;margin-bottom:20px}.nav{width:auto;flex-shrink:0;padding:9px 12px;font-size:14px}.nav b,.aside-note,aside .label,.profile span{display:none}.board{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat small{display:none}.stat strong{font-size:25px}.topline h2{font-size:23px}.primary{padding:10px 15px}.toolbar{gap:8px}.search{width:100%;flex-basis:100%}.footer{gap:15px}.brand h1{font-size:21px}}
.back-link{color:#514f5c;text-decoration:none;font-size:14px;white-space:nowrap}.back-link:hover{color:#7340cb}.back-link:focus-visible{outline:3px solid #8d69ee;outline-offset:3px;border-radius:4px}@media(max-width:760px){header{flex-wrap:wrap;gap:16px}.profile{margin-left:auto}.avatar{display:none}}
</style></head><body><div class="shell"><header><div class="brand"><div class="logo">✧</div><div><h1>AI 灵感站</h1><div class="eyebrow">IDEA STUDIO / MRJ</div></div></div><div class="profile"><a class="back-link" href="/officialwebsite/workstation.html">← 返回工作站</a><div class="avatar">J</div></div></header><div class="layout"><aside><div class="label">WORKSPACE</div><nav id="nav"></nav><div class="aside-note"><strong>每一个想法，都值得实现</strong><span class="dot"></span>绿色 · 已完成<br>○ 黑色 · 待创建<br><br>点击事项编辑，勾选标记完成。</div></aside><main><div class="topline"><h2 id="heading">全部灵感</h2><button class="primary" id="new">＋ 添加灵感</button></div><p class="subtext">收集想法，让下一个网页从这里开始。</p><section class="stats"><div class="stat"><span>灵感总数</span><strong id="total"></strong><small>每一个可能</small></div><div class="stat"><span>已经完成</span><strong id="completed"></strong><small id="percent"></small></div><div class="stat"><span>准备创建</span><strong id="pending"></strong><small>下一个精彩</small></div></section><div class="toolbar"><input class="search" id="search" placeholder="⌕  搜索灵感、分类或关键词…" aria-label="搜索灵感"><div class="tabs" id="tabs"><button class="active" data-status="all">全部</button><button data-status="pending">待创建</button><button data-status="done">已完成</button></div><select class="filter" id="subfilter" aria-label="按细分筛选"></select></div><div class="board" id="board"></div><div class="footer"><span id="result"></span><span id="saveInfo">修改自动保存在当前浏览器</span></div></main></div></div><dialog id="editor"><form id="form"><h2 id="dialogTitle">添加灵感</h2><label>要做的事项<input id="title" required maxlength="150" placeholder="记录一个想实现的想法"></label><label>分类<input id="category" list="categories" required maxlength="40" placeholder="选择或输入新分类"><datalist id="categories"></datalist></label><label>细分<input id="subcategory" list="subcategories" required maxlength="40" placeholder="选择或输入新细分"><datalist id="subcategories"></datalist></label><label>状态<select id="status"><option value="pending">准备创建</option><option value="done">已经完成</option></select></label><div class="buttons"><button type="button" class="secondary" id="cancel">取消</button><button class="primary" type="submit">保存灵感</button></div></form></dialog><dialog id="deleteDialog"><h2>删除这条灵感？</h2><p id="deleteText"></p><div class="buttons"><button class="secondary" id="keep">保留</button><button class="primary" id="confirmDelete">确认删除</button></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const seed=[['主页功能','布局元素','登录框设计',1],['主页功能','布局元素','增加一个登录计数器',0],['主页功能','布局元素','项目说明的文字修改',0],['主页功能','内容文字','项目说明的文字修改',0],['主页功能','内容文字','首页最下方的空间太大，增加引导',0],['超级日历','生活日历','登录问题',1],['超级日历','生活日历','颜色调整',0],['超级日历','赛事日历','赛程和首页更新',0],['超级日历','赛事日历','收藏比赛的赛事提醒，喜欢的球员比赛',0],['超级日历','赛事日历','淘汰和胜利做一个亮灯灭灯效果',0],['超级日历','赛事日历','147的排名（年度和累计）',0],['超级日历','赛事日历','制作每个球员每个赛季的比赛线路、成绩波动与排名',0],['超级日历','赛事日历','双方对阵记录',0],['超级日历','赛事日历','斯诺克裁判大数据',0],['超级日历','赛事日历','足球赛事',0],['超级日历','赛事日历','巴萨历史',0],['超级日历','出行日历','导入天气功能',0],['超级日历','出行日历','流行病趋势',0],['超级日历','AI 日历','导入Codex reset提醒',1],['超级日历','健康日历','季节性食品',0],['超级日历','健康日历','香蕉的四个阶段（科普视频）',0],['学习与阅读','阅读','微读圣经',1],['学习与阅读','阅读','创建书架',0],['学习与阅读','阅读','世界简史',0],['学习与阅读','阅读','古代文明史',0],['学习与阅读','阅读','三国演义',0],['学习与阅读','阅读','奥沙利文自传',0],['学习与阅读','咖啡','咖啡学习网站',1],['游戏与卡通','游戏','英雄抽卡日历',0],['游戏与卡通','卡通动漫','圣斗士星矢',0],['游戏与卡通','其他','3D相册',1],['游戏与卡通','其他','12星座',0],['游戏与卡通','其他','MBTI',0],['视频','视频创作','鹅鹅SVG',1]];
const KEY='mrj-idea-studio-v1';let items=seed.map((a,i)=>({id:String(i),cat:a[0],sub:a[1],title:a[2],done:!!a[3]}));try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v)&&v.every(x=>typeof x.title==='string'&&typeof x.cat==='string'&&typeof x.sub==='string'))items=v}catch{}let current='全部灵感',state='all',editing=null,deleting=null;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaults=['主页功能','超级日历','学习与阅读','游戏与卡通','视频'],symbols=['▦','▦','▤','◇','▷'],colors=['#d7cbef7a','#91dfdf78','#f3d7ae85','#b9e4ca85','#edc3dc88'];function cats(){return [...new Set([...defaults,...items.map(x=>x.cat)])]}function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));$('saveInfo').textContent='已保存 · 当前浏览器'}catch{$('saveInfo').textContent='浏览器保存失败，请勿关闭页面'}render()}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function render(){const cs=cats();$('nav').innerHTML=['全部灵感',...cs].map((c,i)=>`<button class="nav ${current===c?'active':''}" data-cat="${esc(c)}">${i===0?'◈':symbols[(i-1)%5]}<span>${esc(c)}</span><b>${items.filter(x=>i===0||x.cat===c).length}</b></button>`).join('');$('heading').textContent=current;const scoped=items.filter(x=>current==='全部灵感'||x.cat===current),done=scoped.filter(x=>x.done).length;$('total').textContent=String(scoped.length).padStart(2,'0');$('completed').textContent=String(done).padStart(2,'0');$('pending').textContent=String(scoped.length-done).padStart(2,'0');$('percent').textContent=`完成率 ${scoped.length?Math.round(done/scoped.length*100):0}%`;let sub=$('subfilter').value;const subs=[...new Set(scoped.map(x=>x.sub))];$('subfilter').innerHTML='<option value="">所有细分</option>'+subs.map(x=>`<option>${esc(x)}</option>`).join('');$('subfilter').value=subs.includes(sub)?sub:'';sub=$('subfilter').value;const q=$('search').value.toLowerCase().trim();const filtered=scoped.filter(x=>(state==='all'||x.done===(state==='done'))&&(!sub||x.sub===sub)&&(`${x.title} ${x.cat} ${x.sub}`).toLowerCase().includes(q));$('board').innerHTML=cs.filter(c=>filtered.some(x=>x.cat===c)).map(c=>{const list=filtered.filter(x=>x.cat===c);return `<article class="card" style="--tint:${colors[cs.indexOf(c)%5]}"><div class="card-head"><div class="card-title"><h3>${esc(c)}</h3><span>${list.length}</span></div><div class="category-meta">${list.filter(x=>x.done).length} 项完成 · ${list.filter(x=>!x.done).length} 项待创建</div></div>${[...new Set(list.map(x=>x.sub))].map(s=>`<section class="group"><h4>${esc(s)}</h4>${list.filter(x=>x.sub===s).map(x=>`<div class="task ${x.done?'done':''}"><button class="check" data-toggle="${esc(x.id)}" aria-label="${x.done?'标记待创建':'标记完成'}：${esc(x.title)}">${x.done?'✓':''}</button><button class="task-name" data-edit="${esc(x.id)}">${esc(x.title)}</button><button class="icon" data-delete="${esc(x.id)}" aria-label="删除：${esc(x.title)}">×</button></div>`).join('')}</section>`).join('')}<button class="add-row" data-add="${esc(c)}">＋ 添加到${esc(c)}</button></article>`}).join('')||'<div class="empty">没有找到相关灵感<br>试试调整筛选，或添加一个新想法。</div>';$('result').textContent=`正在显示 ${filtered.length} 条灵感`;$('categories').innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join('');updateSubs()}
function updateSubs(){$('subcategories').innerHTML=[...new Set([...($('category').value==='学习与阅读'?['AI学习']:[]),...items.filter(x=>x.cat===$('category').value).map(x=>x.sub)])].map(s=>`<option value="${esc(s)}">`).join('')}function openEditor(id=null,cat=null){editing=id;const x=items.find(x=>x.id===id);$('dialogTitle').textContent=x?'编辑灵感':'添加灵感';$('title').value=x?.title||'';$('category').value=x?.cat||cat||(current==='全部灵感'?'主页功能':current);$('subcategory').value=x?.sub||'';$('status').value=x?.done?'done':'pending';updateSubs();$('editor').showModal()}
$('nav').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){current=b.dataset.cat;$('subfilter').value='';render()}};$('tabs').onclick=e=>{const b=e.target.closest('[data-status]');if(!b)return;state=b.dataset.status;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()};$('search').oninput=render;$('subfilter').onchange=render;$('new').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('category').oninput=updateSubs;$('board').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.toggle!==undefined){let x=items.find(x=>x.id===b.dataset.toggle);x.done=!x.done;persist()}if(b.dataset.edit!==undefined)openEditor(b.dataset.edit);if(b.dataset.add!==undefined)openEditor(null,b.dataset.add);if(b.dataset.delete!==undefined){deleting=b.dataset.delete;$('deleteText').textContent=items.find(x=>x.id===deleting).title;$('deleteDialog').showModal()}};$('keep').onclick=()=>$('deleteDialog').close();$('confirmDelete').onclick=()=>{items=items.filter(x=>x.id!==deleting);persist();$('deleteDialog').close();toast('已删除灵感')};$('form').onsubmit=e=>{e.preventDefault();const t=$('title').value.trim(),c=$('category').value.trim(),s=$('subcategory').value.trim();if(!t||!c||!s)return;const x={id:editing||crypto.randomUUID(),title:t,cat:c,sub:s,done:$('status').value==='done'};if(editing)items=items.map(a=>a.id===editing?x:a);else items.push(x);persist();$('editor').close();toast('灵感已保存')};render();
</script></body></html>
