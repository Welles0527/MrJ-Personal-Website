}

 function mergeData(data,outlineOnly){const ids=new Map(data.tree.map(n=>[n.id,crypto.randomUUID()])),itemIds=new Map(data.items.map(x=>[x.id,crypto.randomUUID()]));for(const node of data.tree.filter(n=>n.kind==='cat')){const existing=tree.find(n=>n.kind==='cat'&&n.label===node.label);if(existing)ids.set(node.id,existing.id)}let root;if(outlineOnly)root=ensureCategory(current==='全部灵感'?'其他':current);for(const node of data.tree){const oldParent=node.parent;if(node.kind==='cat'){const existing=tree.find(n=>n.kind==='cat'&&n.label===node.label);if(existing){ids.set(node.id,existing.id);if(node.palette&&!existing.palette)existing.palette=copy(node.palette);continue}}const next={...copy(node),id:ids.get(node.id),parent:oldParent===null?(outlineOnly?root.id:null):ids.get(oldParent)};if(node.kind==='idea')next.itemId=itemIds.get(node.itemId);next.order=children(next.parent).length;tree.push(next)}for(const idea of data.items)items.push({...copy(idea),id:itemIds.get(idea.id),cat:outlineOnly?root.label:idea.cat});for(const bookmark of data.bookmarks)if(!bookmarks.some(b=>b.url===bookmark.url&&b.note===bookmark.note&&b.category===bookmark.category))bookmarks.push({...copy(bookmark),id:crypto.randomUUID()});initializeTree()}
 $('mapImport').onclick=()=>{$('mapImportFile').value='';$('mapImportFile').click()};$('mapImportFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error('文件超过 2 MB');const text=await file.text(),isJson=/\.json$/i.test(file.name);let data;if(isJson){const parsed=JSON.parse(text);if(parsed.format&&!(parsed.format==='mrj-inspiration'&&parsed.schemaVersion===1))throw Error('不支持的备份版本');data=parsed.data||parsed;validStudioSnapshot(data);checkedVersions(data)}else data=parseOutline(text);pendingImport={data:copy(data),outlineOnly:!isJson};$('mapImportMode').value='merge';$('mapImportWarning').classList.add('hidden');$('mapImportConfirm').textContent='追加导入';$('mapImportSummary').textContent=file.name+'：'+data.items.length+' 条灵感、'+data.bookmarks.length+' 项收藏。';$('mapImportDialog').showModal()}catch(error){toast('导入失败：'+error.message)}};

 let paletteSelectedId=null;
 function paletteRoots(){return $('paletteRoot').value?children(null).filter(n=>n.id===$('paletteRoot').value):children(null)}
 function palettePanel(){$('paletteSaveLevels').disabled=true;const roots=paletteRoots(),root=roots[0],theme=root?.palette?.theme||'gray',uniform=roots.every(n=>(n.palette?.theme||'gray')===theme);$('palettePresets').innerHTML=Object.entries(mapPalettes).map(([id,palette])=>'<button type="button" data-palette="'+id+'" class="palette-preset" aria-pressed="'+(uniform&&id===theme)+'"><span class="palette-strip">'+palette.colors.slice(0,7).map(color=>'<i style="background:'+color+'"></i>').join('')+'</span><span>'+palette.name+'</span></button>').join('');const depth=Math.max(1,...roots.map(maxTreeDepth));$('paletteLevels').innerHTML=Array.from({length:depth},(_,i)=>{const level=i+1,example=tree.find(n=>rootFor(n)?.id===root?.id&&nodeDepth(n)===level),color=root?.palette?.levels?.[level]||(theme==='gray'?mapColor(example||root,level,depth):mapPalettes[theme].colors[i%mapPalettes[theme].colors.length]);return '<label><span>第 '+level+' 层</span><input type="color" data-level-color="'+level+'" aria-label="第 '+level+' 层颜色" value="'+color+'"></label>'}).join('');const node=getNode(paletteSelectedId),colors=mapPalettes[rootFor(node)?.palette?.theme||theme].colors;$('paletteNodeName').textContent=node?label(node):'先在脑图中选择一个节点';$('paletteNodeSwatches').innerHTML=colors.map(color=>'<button type="button" data-node-color="'+color+'" aria-label="设置节点颜色 '+color+'" aria-pressed="'+(node?.color===color)+'" style="--swatch:'+color+'" '+(!node?'disabled':'')+'></button>').join('');$('paletteNodeColor').disabled=!node;$('paletteNodeReset').disabled=!node;$('paletteNodeColor').value=node?mapColor(node):'#ffffff'}

 const categoryDialog=document.createElement('dialog');categoryDialog.id='categoryEditor';categoryDialog.innerHTML='<form id="categoryEditForm"><h2>编辑分类</h2><label>名称<input id="categoryEditName" required maxlength="40" autocomplete="off"></label><div id="categoryIconChoices" class="category-icon-choices" role="group" aria-label="分类图标"></div><p id="categoryEditError" role="alert"></p><div class="buttons"><button type="button" id="categoryEditCancel" class="secondary">取消</button><button type="submit" class="primary">保存</button></div></form>';document.body.append(categoryDialog);let categoryEditingId=null,chosenIcon='folder',lastCategoryClick=null;
 function openCategoryEditor(cat){if(!ready||cat==='全部灵感'||categoryDialog.open)return;const root=children(null).find(n=>n.label===cat);if(!root)return;categoryEditingId=root.id;chosenIcon=root.icon||({'主页功能':'home','超级日历':'calendar','学习与阅读':'book','游戏与卡通':'game','视频':'video','其他':'folder'}[root.defaultCategory||root.label]||'folder');$('categoryEditName').value=root.label;$('categoryEditError').textContent='';$('categoryIconChoices').innerHTML=Object.entries(categoryShapes).map(([id,[name]])=>'<button type="button" data-category-icon="'+id+'" aria-label="'+name+'" title="'+name+'" aria-pressed="'+(id===chosenIcon)+'">'+shapeIcon(id)+'</button>').join('');categoryDialog.showModal();$('categoryEditName').focus();$('categoryEditName').select()}

 $('categoryIconChoices').onclick=e=>{const button=e.target.closest('[data-category-icon]');if(!button)return;chosenIcon=button.dataset.categoryIcon;$('categoryIconChoices').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))};$('categoryEditCancel').onclick=()=>categoryDialog.close();$('categoryEditForm').onsubmit=e=>{e.preventDefault();if(!ready)return;const root=getNode(categoryEditingId),name=$('categoryEditName').value.trim();if(!root)return;if(!name||name==='全部灵感'||children(null).some(n=>n.id!==root.id&&n.label===name)){$('categoryEditError').textContent='请输入不重复的分类名称';return}const old=root.label;if(defaults.includes(old)&&!root.defaultCategory)root.defaultCategory=old;root.label=name;root.icon=chosenIcon;for(const node of tree)if(node.kind==='idea'&&rootFor(node)?.id===root.id)getItem(node).cat=name;if(current===old)current=name;for(const [key,value] of [...checkboxViews]){const parts=JSON.parse(key);if(parts[0]===old){checkboxViews.delete(key);checkboxViews.set(JSON.stringify([name,parts[1]]),value)}}categoryDialog.close();persist('编辑分类名称与图标前')};
 let taskClipboard=null,localTaskClipboard=false,clipboardWrite=Promise.resolve();
 function branchClipboard(){const node=getNode(markedNode);if(!node||node.kind==='cat')throw Error('请先选择要复制的任务或分组');const nodes=tree.filter(n=>isWithin(n.id,node.id)).map(n=>({...copy(n),parent:n.id===node.id?null:n.parent})),itemIds=new Set(nodes.filter(n=>n.kind==='idea').map(n=>n.itemId));return {format:'mrj-inspiration-branch',schemaVersion:1,data:{items:copy(items.filter(item=>itemIds.has(item.id))),tree:nodes,bookmarks:[]}}}
 function readBranchClipboard(text){if(typeof text!=='string'||text.length>2000000)throw Error('复制内容过大');const parsed=JSON.parse(text);if(parsed?.format!=='mrj-inspiration-branch'||parsed.schemaVersion!==1)throw Error('剪贴板中没有脑图任务');const data=validStudioSnapshot(parsed.data);if(!data.tree.length||data.tree.length>2000||data.tree.some(n=>n.kind==='cat')||data.tree.filter(n=>n.parent===null).length!==1)throw Error('复制的任务结构无效');const ideaIds=data.tree.filter(n=>n.kind==='idea').map(n=>n.itemId);if(new Set(ideaIds).size!==ideaIds.length||data.items.length!==ideaIds.length)throw Error('复制的任务数据无效');const top=data.tree.find(n=>n.parent===null),byId=new Map(data.tree.map(n=>[n.id,n]));for(const node of data.tree){let depth=0,ancestor=node;while(ancestor){if(++depth>30)throw Error('复制层级过深');if(ancestor.parent===null&&ancestor.id!==top.id)throw Error('复制的任务结构无效');ancestor=byId.get(ancestor.parent)}}return copy(parsed)}
 function pasteBranch(parsed){if(!ready)return;const target=getNode(markedNode);if(!target){toast('请先选择粘贴到的节点');return}const {data}=readBranchClipboard(JSON.stringify(parsed)),ids=new Map(data.tree.map(n=>[n.id,crypto.randomUUID()])),itemIds=new Map(data.items.map(item=>[item.id,crypto.randomUUID()])),root=rootFor(target);for(const item of data.items)items.push({...copy(item),id:itemIds.get(item.id),cat:root.label});let top;for(const node of data.tree){const next={...copy(node),id:ids.get(node.id),parent:node.parent===null?target.id:ids.get(node.parent)};if(node.kind==='idea')next.itemId=itemIds.get(node.itemId);if(node.parent===null){next.order=children(target.id).length;top=next}tree.push(next)}for(const id of ids.values()){const node=getNode(id),item=getItem(node);if(item){const context=contextFor(node);item.cat=context.cat;item.sub=context.sub}}target.collapsed=false;persist('粘贴任务及子任务前');select(top.id);toast('已粘贴 '+data.tree.length+' 个节点，可撤销')}
 function clipboardAllowed(e){return ready&&!inline&&!e.target.closest('input,textarea,select,[contenteditable="true"]')&&!document.querySelector('dialog[open]')&&$('collectionView').classList.contains('hidden')}
