 const fraction=rect?(drag.clientY-rect.top)/rect.height:.5,mode=fraction<.23?'before':fraction>.77?'after':'inside';

 if(drag.rule){hit.dataset.drop=mode;drag.ghost.querySelector('small').textContent=mode==='inside'?'成为「'+label(target)+'」的子节点':(mode==='before'?'放在「':'放在「')+label(target)+(mode==='before'?'」之前（同级）':'」之后（同级）')}
 else drag.ghost.querySelector('small').textContent=target?'此处不能放置':'拖到目标节点：中部改层级，上下边缘改顺序';
}
function dragTick(){if(!drag?.node||!drag.moved)return;const rect=stage.getBoundingClientRect(),top=Math.max(0,rect.top),bottom=Math.min(innerHeight,rect.bottom);if(drag.clientX>rect.left&&drag.clientX<rect.right&&drag.clientY>top&&drag.clientY<bottom){stage.scrollLeft+=drag.clientX<rect.left+32?-12:drag.clientX>rect.right-32?12:0;stage.scrollTop+=drag.clientY<top+32?-12:drag.clientY>bottom-32?12:0;}updateDropTarget();drag.frame=requestAnimationFrame(dragTick)}
stage.addEventListener('pointerdown',e=>{
 if(current==='全部灵感'){suppressClickUntil=0;handledTouchUntil=0;return}
 if(e.button!==0)return;const node=e.target.closest('[data-node]'),button=e.target.closest('button');
 suppressClickUntil=0;handledTouchUntil=0;
 drag={id:e.pointerId,node,button,startX:e.clientX,startY:e.clientY,x:pan.x,y:pan.y,clientX:e.clientX,clientY:e.clientY,moved:false,rule:null};stage.setPointerCapture(e.pointerId);e.preventDefault();
});
stage.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;drag.clientX=e.clientX;drag.clientY=e.clientY;if(!drag.moved&&Math.hypot(dx,dy)<5)return;
 if(!drag.moved){drag.moved=true;if(drag.node){drag.node.classList.add('is-dragging');const ghost=document.createElement('div');ghost.className='node-drag-preview';const name=document.createElement('strong');name.textContent=label(getNode(drag.node.dataset.node));ghost.append(name,document.createElement('small'));document.body.append(ghost);drag.ghost=ghost;drag.frame=requestAnimationFrame(dragTick)}}
 if(drag.node){drag.ghost.style.left=e.clientX+16+'px';drag.ghost.style.top=Math.min(e.clientY+16,innerHeight-100)+'px';updateDropTarget()}
 else{pan={x:drag.x+dx,y:drag.y+dy};$('board').style.transform=`translate(${pan.x}px,${pan.y}px)`;stage.classList.add('is-panning')}
});
function finishDrag(e){
 if(!drag||drag.id!==e.pointerId)return;const completed=drag;drag=null;cancelAnimationFrame(completed.frame);completed.ghost?.remove();completed.node?.classList.remove('is-dragging');stage.classList.remove('is-panning');stage.querySelectorAll('[data-drop]').forEach(el=>delete el.dataset.drop);if(stage.hasPointerCapture(completed.id))stage.releasePointerCapture(completed.id);
 if(completed.moved){suppressClickUntil=performance.now()+300;if(completed.node&&e.type==='pointerup'){if(completed.rule)moveNode(getNode(completed.node.dataset.node),completed.rule);else toast('未改变层级')}}
 else if(e.type==='pointerup'&&completed.button){handledTouchAction=JSON.stringify(completed.button.dataset);handledTouchUntil=performance.now()+450;completed.button.click();e.preventDefault()}
}
stage.addEventListener('pointerup',finishDrag);stage.addEventListener('pointercancel',finishDrag);stage.addEventListener('lostpointercapture',finishDrag);
stage.addEventListener('click',e=>{if(performance.now()<suppressClickUntil||(e.isTrusted&&e.detail>0&&e.target.closest('button')&&JSON.stringify(e.target.closest('button').dataset)===handledTouchAction&&performance.now()<handledTouchUntil)){e.preventDefault();e.stopImmediatePropagation()}},true);
$('mapReset').onclick=()=>{resetMapPosition();drawWires();toast('已复位脑图视图，层级保持不变')};
new ResizeObserver(()=>requestAnimationFrame(drawWires)).observe($('board'));window.addEventListener('resize',drawWires);render();

</script></body></html>
