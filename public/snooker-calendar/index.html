function rankingRows(){const data=rankingYears[state.rankingYear];return data.players.map((name,index)=>{const [cn,flag,country,code]=playerMeta[name]||[name,'🌐','国际','INT'];const prize=data.prizes?.[index]||'';const amount=prize?+prize.replace(/[^0-9]/g,''):0;return {rank:index+1,name,cn,flag,country,code,prize,amount,width:amount?Math.max(18,amount/rankingYears[2026].prizes[0].replace(/[^0-9]/g,'')*100):Math.max(22,100-index*5)}})}

function status(e){return TODAY<e.start?'upcoming':TODAY>e.end?'ended':'live'}
function color(e){return e.id==='world'?(theme==='cream'?'#a01f33':'#ef6b68'):types[e.type].color}
function flag(e){return e.flag||regions[e.region].flag}
function countryCode(e){return e.flag==='🇭🇰'?'HK':({cn:'CN',uk:'GB',eu:'DE',other:'INT'}[e.region]||'INT')}
function eventTitle(e){return `${e.name} · ${countryCode(e)}`}
function dateText(e){return `${Number(e.start.slice(5,7))}.${e.start.slice(8)} – ${Number(e.end.slice(5,7))}.${e.end.slice(8)}`}
function fullDate(e){return `${e.start.replaceAll('-','.')} — ${e.end.slice(5).replace('-','.')}`}
function money(n){return n?'£'+n.toLocaleString('en-GB'):'待核实'}
function filtered(){return events.filter(e=>state.types.has(e.type)&&state.regions.has(e.region)&&state.statuses.has(status(e))&&(state.nav!=='favorites'||state.favorites.has(e.id)))}
function inMonth(e,m){const first=`2026-${String(m+1).padStart(2,'0')}-01`,last=`2026-${String(m+1).padStart(2,'0')}-${new Date(2026,m+1,0).getDate()}`;return e.start<=last&&e.end>=first}
function days(m){const offset=(new Date(2026,m,1).getDay()+6)%7;return Array.from({length:42},(_,i)=>{const d=i-offset+1;return d>0&&d<=new Date(2026,m+1,0).getDate()?d:0})}
function dayString(m,d){return `2026-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function eventIcon(e){return `<span class="event-symbol" style="--event-color:${color(e)}">${icon(types[e.type].icon)}</span>`}
function miniEvent(e){return `<button class="event-mini event-mini-summary" data-event="${e.id}" data-tip="${e.id}" style="--event-color:${color(e)}" aria-label="${eventTitle(e)}，${dateText(e)}，${e.city}，冠军奖金${money(e.prize)}，查看详情">${eventIcon(e)}<span class="event-name">${eventTitle(e)}</span><span class="event-summary"><span>${dateText(e)}</span><span>${e.city}</span><span>${money(e.prize)}</span></span></button>`}
function sidebar(){return `<aside aria-label="导航与筛选"><div class="brand"><div class="brand-mark" aria-hidden="true"><i class="brand-ball-icon"></i></div><div class="wordmark world-calendar-mark" aria-label="WORLD SNOOKER CALENDAR"><span>W<i class="word-ball"></i>RLD</span><span>SN<i class="word-ball"></i><i class="word-ball"></i>KER</span><small>CALENDAR</small></div></div><nav class="nav">${[['year','grid','年度总览'],['schedule','calendar','赛程'],['results','trophy','赛果'],['locations','pin','赛事地点'],['rankings','trophy','世界排名'],['players','user','球员信息'],['favorites','star','我的收藏']].map(([key,i,l])=>`<button data-nav="${key}" class="${state.nav===key?'active':''}">${icon(i)}${l}${key==='favorites'?`<span>${state.favorites.size}</span>`:''}</button>`).join('')}</nav><div class="filter-group"><div class="filter-head">赛事类型<button class="reset" data-reset>重置</button></div>${Object.entries(types).map(([k,t])=>`<label class="check"><input type="checkbox" data-type="${k}" ${state.types.has(k)?'checked':''}><span style="color:${t.color}">${icon(t.icon,'tiny')}</span>${t.label}<span class="count">${events.filter(e=>e.type===k).length}</span></label>`).join('')}</div><div class="filter-group"><div class="filter-head">举办地点</div>${Object.entries(regions).map(([k,r])=>`<label class="check"><input type="checkbox" data-region="${k}" ${state.regions.has(k)?'checked':''}><span class="region-dot" style="--region:${r.color}"></span>${r.label}<span class="count">${events.filter(e=>e.region===k).length}</span></label>`).join('')}</div><div class="sidebar-foot"><strong>每一场，都值得期待。</strong><br>2026 · 世界斯诺克巡回赛</div></aside>`}
function annual(){return `<div class="annual">${cnMonths.map((name,m)=>{const es=filtered().filter(e=>inMonth(e,m));return `<section class="month-card ${m===CURRENT_MONTH?'current':''}"><div class="month-top"><button class="month-title" data-month="${m}" aria-label="查看${name}月历"><b>${String(m+1).padStart(2,'0')}</b><span>${name}</span></button>${m===CURRENT_MONTH?'<span class="current-tag">本月</span>':''}<span class="count">${es.length} 场赛事</span></div><div class="mini-grid">${['一','二','三','四','五','六','日'].map(w=>`<div class="weekday">${w}</div>`).join('')}${days(m).map((d,i)=>{const ds=dayString(m,d),active=es.filter(e=>e.start<=ds&&e.end>=ds);return `<button class="mini-day ${d?'':'empty'} ${i%7>4?'weekend':''} ${active.length?'filled':''} ${ds===TODAY?'today':''}" ${!d?'disabled tabindex="-1"':''} style="--event-color:${active.length?color(active[0]):'transparent'}" data-month="${m}" ${active.length?`data-tip="${active[0].id}"`:''} aria-label="${m+1}月${d}日${active.length?'，'+active.map(e=>e.name).join('，'):''}">${d||''}${active.length?'<i class="day-dot"></i>':''}</button>`}).join('')}</div><div class="month-events">${es.length?es.map(miniEvent).join(''):'<div class="quiet">暂无符合条件的赛事</div>'}</div></section>`}).join('')}</div>`}
function countdown(e){const s=status(e);if(s==='ended')return '';const start=Date.parse(`${TODAY}T00:00:00Z`),target=Date.parse(`${s==='live'?e.end:e.start}T00:00:00Z`),days=Math.max(0,Math.round((target-start)/86400000)+(s==='live'?1:0));return `<span class="event-countdown">${s==='live'?'剩余':'距开赛'} ${days?`${days} 天`:'今日'}</span>`}function winnerField(e,s){const champ=e.champion&&s==="ended"?e.champion:null;const content=champ?'<span class="event-winner" title="照片来源：'+(champ.credit||'WPBSA 官方球员资料')+'" style="display:flex;align-items:center;gap:8px;min-width:0"><img src="'+champ.photo+'" alt="'+(champ.en||champ.name)+' 官方照片" loading="lazy" referrerpolicy="no-referrer" style="width:34px;height:34px;flex:0 0 34px;object-fit:cover;object-position:center 20%;border-radius:50%;border:1px solid var(--line)"><span style="min-width:0"><strong>'+champ.name+'</strong><small style="margin:2px 0 0;font-size:9px">'+(champ.en||'')+' · 冠军</small></span></span>':'<strong style="font-size:12px;color:var(--muted)">'+(s==="ended"?"待补充":"未产生")+'</strong>';return '<span class="event-row-field winner-field" style="display:block!important"><small style="display:block!important">冠军球员</small>'+content+'</span>'}function inlineBracket(e){const s=status(e),rows=(s==='ended'?e.result:e.matches)||[],rounds=[...new Set(rows.map(r=>r[0].split('·').pop().trim()))],source=e.source||calendarSource,content=rows.length?`<div class="inline-bracket-rounds">${rounds.map(round=>`<section class="inline-bracket-round"><h4>${round}</h4>${rows.filter(r=>r[0].split('·').pop().trim()===round).map(r=>`<article class="inline-bracket-match"><small>${r[0].split('·')[0].trim()}</small><div><span>${r[1]}</span><b>${r[2]}</b><span>${r[3]}</span></div></article>`).join('')}</section>`).join('')}</div>`:`<p class="inline-bracket-empty">${s==='ended'?'官方尚未公布可核实的逐轮对阵/赛果。':s==='live'?'暂未录入可核实的实时对阵。':'官方对阵尚未公布或录入。'} <a href="${source}" target="_blank" rel="noopener">查看赛事官方来源 ↗</a></p>`;return `<section class="inline-bracke </style><script id="calendar-tour-script">(() => {
  const key='cue-calendar-tour-v1';
  try{if(localStorage.getItem(key))return}catch{}
  const steps=[
    {title:'切换年历与月历',text:'先在年历把握全年赛程，再切换月历查看每天的比赛。',selector:'.switch'},
