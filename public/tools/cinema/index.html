html{font-size:clamp(16px,1.111111vw,26.6px)}
body{
  min-height:100vh;
  color:#352719;
  background:#471c1d;
  background-image:linear-gradient(#471c1d22,#471c1d22),var(--leather);
  background-size:auto,11rem 4rem;
  font:1rem/1.5 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
}
main{max-width:2394px;padding:1.5625rem 2.8vw 1.75rem 4.3vw}
header{
  position:relative;
  isolation:isolate;
  min-height:8rem;
  justify-content:space-between;
  gap:1.125rem;
  padding:1.3125rem clamp(18px,2.8vw,2.625rem);
  margin:0 0 1.5rem;
  background:linear-gradient(115deg,#2d3e4955,#080d1380),var(--navy);
  background-size:auto,8.25rem 1.625rem;
  border:1px solid #a68a55;
  border-top:.25rem double #c5a56b;
  border-bottom:.25rem double #b6955b;
  border-radius:4px;
  box-shadow:0 2px 5px #1c0e0955,inset 0 0 0 .25rem #10171a,inset 0 0 0 calc(.25rem + 1px) #92764b;
  color:var(--cream);
}
header:before{
  content:'◆';position:absolute;top:-.8125rem;left:51.3%;transform:translateX(-50%);
  width:2.0625rem;border:1px solid #967b50;border-radius:50%;background:#182026;
  color:#d6b478;text-align:center;line-height:1.0625;
}
h1{color:#edd9b4;text-shadow:0 1px 2px #080b1088;font-size:clamp(36px,4.8vw,7.25rem);font-weight:900;line-height:1.15;letter-spacing:.05em}
header img{display:none}
nav{gap:.625rem}
nav button{color:#cfbd9e;font-size:1.07em;padding:.375rem .4375rem}
nav button.on{color:#ffe9ba;border-color:#c1a169}
#search{color:#f6e4c5;background:#10171c;border:1px solid #90754c;border-radius:2rem;width:clamp(185px,22vw,21.25rem);padding:.5rem .875rem}
#search::placeholder{color:#c3b093}
.filters{
  margin:0 .75rem 1.375rem;
  padding:.8125rem clamp(12px,2vw,1.875rem) 1.25rem;
  background:linear-gradient(115deg,#f4e6cb,#ecd9b7);
  border:1px solid #c4ab85;
  border-radius:.75rem .75rem .3125rem .3125rem;
  box-shadow:0 2px #d6bd99;
}
.row{border-color:#95795558}
.label{color:#502c22}
.choices button,.plain,select,.years input{border-radius:5px}
.choices button.on,.brush{clip-path:none;color:#f6e3c0;background:linear-gradient(#293840,#13202a);border-radius:5px}
#results,.drawer{
  background-size:auto,8.6875rem 7.5rem;
  border:.125rem solid #d4a46b;
}
#results{
  padding:.875rem clamp(10px,1.4vw,1.375rem) 1.0625rem;
  background-image:linear-gradient(#21100470,#21100470),var(--wood);
  border-bottom:0;
  border-radius:.3125rem .3125rem 0 0;
}
.tools{color:var(--cream);padding:0 .25rem .6875rem;column-gap:.625rem}
.tools h2{padding:.3125rem 1.0625rem;border:1px solid #ad9058;font-size:1.37em}
.tools small{color:#e1caab}
.tools .plain,.tools select{background:#eddbbb var(--paper);color:#3b2c1c;padding:.25rem .5rem}
.tools select{min-height:2.0625rem}
.rule{border-color:#be986278}
.grid{gap:clamp(10px,1.5vw,23px)}
.card{background:#f0dfc1;border:1px solid #d9bf90;border-radius:7px;padding:8px}
.card.active{outline:2px solid #c49b56;outline-offset:2px}
.poster{border:1px solid #9d7f52}
.save{color:#ffe3b5;background:#1a2631e6;border-color:#cfb381}
.year{background:#64262a;color:#f0dbb8;border-radius:3px}
.title{color:#341f1b}
.age{background:#f5e6cc88}
.ticket{margin:22px 0 12px;padding:13px 8px;background:#efdcbb;border:1px solid #b99a65;border-radius:5px}
.ticket>div:first-child strong{color:#64272d}
.drawer{
  position:relative;display:grid;place-items:center;height:4.5rem;
  background-image:linear-gradient(#51331d70,#51331d70),var(--wood);
  border-radius:0 0 .3125rem .3125rem;
}
.hardware{
  position:relative;width:8.3125rem;height:2.0625rem;margin-top:-.875rem;padding-top:.1875rem;
  border:.1875rem double #c59a57;border-radius:.3125rem;background:#eddbba var(--paper);
  text-align:center;font-size:.85em;letter-spacing:.2em;color:#342315;
}
.hardware:after{
  content:'';position:absolute;top:1.6875rem;left:1.4375rem;right:1.4375rem;height:1rem;
  border:.25rem solid #ab8950;border-top:0;border-radius:0 0 1.4375rem 1.4375rem;
}
.empty{color:var(--cream)}
footer,#status{color:#e0caab}
@media(max-width:700px){main{padding:15px 10px 20px}header{padding:16px;gap:10px;margin-bottom:18px}header:before{left:50%}header nav{order:2;margin:0;gap:2px}header #search{width:100%}.filters{margin:0 3px 20px;padding:8px 12px}.grid{gap:14px}.tools{flex-wrap:wrap}.row{padding:6px 0}.tools h2{font-size:1.1em}.choices{gap:4px}.drawer{height:63px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}

.row{display:grid;grid-template-columns:clamp(125px,12.25vw,12rem) minmax(0,1fr);align-items:center;gap:.5rem;padding:.375rem 0}
.choices{align-items:center;gap:.25rem .5rem}
.choices button{display:inline-flex;align-items:center;justify-content:center;min-height:1.9375rem;line-height:1.2;padding:.3125rem .75rem;margin:0;border:1px solid transparent}
.choices button.on,.row:nth-child(even) .choices button.on{box-shadow:inset 0 1px 0 #ffffff25,0 1px 2px #41271838;border-color:#49332d40;background-image:linear-gradient(180deg,#303e44,#1b2932)}
.row:nth-child(even) .choices button.on{background-image:linear-gradient(180deg,#774043,#59292d)}
.choices label{display:inline-flex;gap:.3125rem;align-items:center}
.choices select{min-height:2rem;field-sizing:content}
.choices select,.years input{padding:.25rem .5rem}
#source{min-width:8rem;max-width:100%}
#country{max-width:min(100%,10.9375rem)}
#more-genres{order:1;max-width:7.8125rem}
#classic{color-scheme:dark;width:.75em;height:.75em}
.years{gap:.75rem}
.years input{width:7.1875rem;min-height:2.125rem}
.poster{height:clamp(225px,25vw,360px);aspect-ratio:auto;background:#201f1e}
.poster img{object-fit:contain;object-position:center}
@media(max-width:650px){.row{grid-template-columns:1fr;gap:3px}.poster{height:300px}.choices button{padding:5px 10px}}


[hidden]{display:none!important}
a{color:#593027;text-underline-offset:.2em}
a:focus-visible,summary:focus-visible{outline:3px solid #567580;outline-offset:3px}
header #search{min-width:0}
nav .nav-count{font:normal .74em/1.2 Georgia,serif;margin-left:4px;opacity:.85}
.filter-toggle{display:none}
.filter-rows .row{gap:.5rem}
.choices{min-width:0}
.choices .sub{font-size:1em;margin-left:.875rem}
.choices :is(input,select):focus-visible{outline-offset:1px}
.filter-tag{color:#735543;font-size:.84em;font-weight:400}
.tools{row-gap:7px}
.score-badge{display:inline-flex;align-items:baseline;gap:4px;max-width:100%;font-size:.8rem;font-weight:600;color:#68462e}
.score-badge b{font:700 1.45rem/1 Georgia,"Times New Roman",serif;color:#692b2d}
.card-actions{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px 7px 2px;padding-top:7px;border-top:1px solid #aa88535e}
.history-score .score-badge{display:inline}
.history-score small{display:block;font-size:.73rem;white-space:nowrap}
.history-score ~ .compare-pick{white-space:nowrap}
.compare-pick,.ticket button{border:1px solid #9e8261;border-radius:4px;color:#453323;font-size:.85em;padding:3px 9px}
.compare-pick[aria-pressed=true]{background:#253741;color:#f8e8ce;border-color:#253741}
.save{display:grid;place-items:center;min-width:36px;min-height:37px}
.poster{display:grid;place-items:center;isolation:isolate;background:linear-gradient(135deg,#283b47,#101a22)}
.poster .fallback,.poster img{position:absolute;inset:0;display:block}
.poster .fallback{inset:14%;border:1px solid #ae95665c;display:grid;place-content:center;padding:12px;text-align:center;line-height:1.45;letter-spacing:.09em;font-size:clamp(1.4rem,2.1vw,2.4rem);color:#decca7;overflow-wrap:anywhere}
.poster img{object-fit:contain;background:#1c2020;visibility:hidden}
.poster img.loaded{visibility:visible}
.poster .stamp{z-index:1}
.year{display:inline-block;font:italic .88em/1.4 Georgia,serif;vertical-align:middle}
.title{overflow-wrap:anywhere}
.meta{color:#483729}
.meta .tags{line-height:1.5}
.detail{margin:18px 0 22px;padding:16px clamp(12px,2vw,24px);background:#efdcbb;border:1px solid #b99a65;border-radius:5px;color:#423225}
.detail h3,.source-sheet h3,.modal h3{font-size:1.15rem;margin:0 0 6px;color:#59292c}
.detail p{margin:3px 0 9px}
.detail .credits{font-size:.9em;color:#664d37}
.detail-head,.modal-head,.page-nav,.compare-tray,.tray-items{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.detail-head,.modal-head{justify-content:space-between}
.dismiss,.small-button{border:1px solid #987e5e;border-radius:4px;padding:4px 10px;background:#f3e4cc;color:#463224}
.detail-head .dismiss{font-size:.84em}
.rating-radar{margin:12px 0;padding:10px 8px;text-align:center;border:1px solid #ac92704f;background:#f2e2c7}
.rating-radar figcaption{font-weight:700;color:#57272b}
.rating-radar svg{display:block;width:100%;max-width:490px;margin:0 auto;overflow:visible}
.rating-radar p{margin:0;color:#6e5846;font-size:.78rem}
.radar-ring,.radar-axis{fill:none;stroke:#aa9274;stroke-width:1}
.radar-tick,.radar-value{fill:#6e5846;font-size:10px}
.radar-label{fill:#442a21;font-size:12px;font-weight:700}
.radar-shape{fill:#90404a30;stroke:#873e46;stroke-width:2.4;stroke-linejoin:round}
polyline.radar-shape{fill:none}
.radar-dot{fill:#873e46;stroke:#f2e2c7;stroke-width:1.2}
.rating-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:#ac92704f;border:1px solid #ac92704f;margin:10px 0}
.rating-cell{background:#f2e2c7;padding:8px 9px;font-size:.82rem;line-height:1.5}
.rating-cell .metric{display:block;font:700 1.17rem/1.4 Georgia,serif;color:#57272b}
.rating-cell small,.metric-note{display:block;color:#6e5846}
.rating-cell .source-name{font-weight:700}
.film-links{display:flex;gap:7px 14px;flex-wrap:wrap;font-size:.87em}
.shelf-row+.shelf-row{margin-top:20px}
#results{min-height:7.25rem}
#results:has(> .empty:only-child){display:grid;place-items:center;padding:1.125rem .75rem .125rem;text-align:center}

.page-nav{justify-content:center;margin:0 0 12px;color:#f1dfbc}
.page-nav:empty{display:none}
.page-nav .plain{background:#ead9bb;color:#432e25}
.page-nav span{font-variant-numeric:tabular-nums}
button:disabled{opacity:.5;cursor:default}

.compare-tray strong{font-size:.9rem}
.tray-items{gap:4px}
.tray-items button{width:auto;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f9e6c5;border:1px solid #8a795a;border-radius:3px;font-size:.78em;padding:2px 6px}
.primary{background:#e8cf9b;border:1px solid #deb976;border-radius:4px;color:#332319;font-weight:bold;padding:4px 12px}

.modal::backdrop{background:#160c0eaa}

.modal h2{font-size:1.4rem}
.table-wrap{max-width:100%;overflow-x:auto}
.compare-table{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.5}
.compare-table :is(td,th){border-bottom:1px solid #b6a08277;padding:8px;text-align:left;vertical-align:top}
.compare-table thead th{color:#632a2b}
.compare-table th:first-child{width:110px;min-width:6em}
.compare-table td{min-width:115px}
.compare-table thead th:not(:first-child){min-width:115px}
.compare-table .metric-note{font-size:.8em}
.footline,.source-sheet{color:#ecd9b5}
footer{padding:1rem 0 .625rem}
.footline{display:flex;justify-content:center;gap:5px 14px;flex-wrap:wrap;align-items:center;font-size:.83rem}
.footline > span + small::before{content:'·';margin-inline-end:8px;color:#cfaf7c}
.footline button,.footline a{color:#f2dcba;text-decoration:underline;text-underline-offset:.22em}
.footline small{font-size:.82rem}
.source-sheet{margin:14px auto 0;max-width:880px;padding:13px 15px;text-align:left;background:#231e1caa;border:1px solid #99703f;border-radius:4px;font: .83rem/1.6 system-ui,sans-serif}
.source-sheet h3{color:#eedbb6}.source-sheet a{color:#f4dfb9}.attribution-links{overflow-wrap:anywhere}
.source-sheet ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:4px 12px;margin:8px 0}
.source-sheet li{display:flex;gap:6px;justify-content:space-between;align-items:baseline;border-bottom:1px solid #b38e5755}
.source-sheet .tmdb-credit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px}
.tmdb-credit img{width:80px;height:auto;vertical-align:middle}
#status:not(:empty){margin:0 0 10px}

}

@media(max-width:650px){

 .filter-rows.mobile-folded{display:none}
 .row{grid-template-columns:1fr}.label{min-width:0}.choices .sub{margin-left:0}.years{margin-top:0}
 .choices button{padding:4px 8px;min-height:34px}
 .tools{display:grid;grid-template-columns:max-content minmax(0,1fr)}
 .tools h2,.tools #reset,.tools .linked-chip{justify-self:start}

 .poster{height:clamp(240px,82vw,335px)}.compare-tray{bottom:4px;padding:7px;max-width:100%;justify-content:space-between}
 .tray-items{display:none}.compare-table :is(td,th){padding:6px}.rating-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
