/* Calendar-inspired edition: warm paper, ruled cells, and quiet category colors. */
:root{--ink:#252321;--muted:#69645e;--purple:#746a5d;--lavender:#f5e7da;--line:#d9d2ca;--bg:#fbf8f5;--food:#d8a887;--coffee:#b99c7e;--mall:#9db7ca;--park:#a8b691;--bar:#c5aaa0;--other:#b4aaa0;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink)}
body{background:var(--bg)}

.nav-item:hover{background:#f6eee7;border-color:#e8dfd6}

.nav-item .count{color:#918780}

.heading-label{color:#85776c;font-size:11px;letter-spacing:2px}
.workspace-head h1{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:29px;font-weight:600;letter-spacing:1px}
.heading-sub{color:#625a53}
.mode-switch{background:#f2ede8;border:1px solid var(--line);border-radius:6px;padding:3px}

.mode-switch button.active{color:#2c2823;border:1px solid #d8cfc6;box-shadow:none;background:#fffdfa}
.filters{padding:12px 32px 17px;background:#fffcf9;border-bottom-color:var(--line)}

async function lookup(x){if(!x.query)return {reason:'地址不完整'};const m=x.query.match(/^(.*?)(\d+)(号|弄)$/);if(!m||m[3]==='弄')return {reason:'需核实门牌'};const u=new URL('https://nominatim.openstreetmap.org/search');u.search=new URLSearchParams({format:'jsonv2',street:m[2]+' '+m[1],city:'上海市',country:'中国',countrycodes:'cn',addressdetails:'1',limit:'5','accept-language':'zh-CN','viewbox':'120.8,31.9,122.1,30.65',bounded:'1'}).toString();const response=await fetch(u,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('地址服务暂不可用');const data=await response.json();if(!Array.isArray(data))throw Error('定位结果无效');const normalized=s=>String(s||'').replace(/\s/g,'');const good=data.filter(p=>{const a=p.address||{},road=a.road||a.pedestrian||'',house=normalized(a.house_number).replace(/号$/,'');return normalized(road)===normalized(m[1])&&house===m[2]&&+p.lat>30.65&&+p.lat<31.9&&+p.lon>120.8&&+p.lon<122.1});if(good.length!==1)return {reason:good.length?'多个匹配，需核实':'未找到门牌匹配'};const p=good[0];positions[x.id]={lat:+p.lat,lon:+p.lon,address:x.address,source:'Nominatim / OpenStreetMap',precision:'门牌 / 建筑位置',matched:p.display_name,queriedAt:new Date().toISOString()};persist();return {success:true}}

async function nominatimMatches(query){const url=new URL('https://nominatim.openstreetmap.org/search');url.search=new URLSearchParams({format:'jsonv2',q:query,countrycodes:'cn',addressdetails:'1',limit:'5','accept-language':'zh-CN',viewbox:'120.8,31.9,122.1,30.65',bounded:'1'}).toString();const response=await fetch(url,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('地图匹配服务暂不可用');const data=await response.json();if(!Array.isArray(data))throw Error('匹配结果无效');const candidates=[],seen=new Set();for(const place of data){const lat=Number(place.lat),lon=Number(place.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<=30.65||lat>=31.9||lon<=120.8||lon>=122.1)continue;const key=place.osm_type&&place.osm_id?`${place.osm_type}:${place.osm_id}`:`${lat.toFixed(5)},${lon.toFixed(5)}`;if(seen.has(key))continue;seen.add(key);candidates.push({lat,lon,name:place.name||String(place.display_name||'地图候选').split(',')[0],displayName:String(place.display_name||''),type:[place.class,place.type].filter(Boolean).join(' · '),key})}return candidates}
async function searchLocationMatches(id){if(geoBusy)return;const item=items.find(row=>row.id===id);if(!item)return;const cleanAddress=String(item.address||'').replace(/[（(][^）)]*[）)]/g,'').trim();if(!cleanAddress||cleanAddress==='地址待补充'){notify('这条收藏没有可用于匹配的地址，请先补充地址。');return}geoBusy=true;geoProgress=0;geoTotal=1;geoNote='';geoMatchResults[id]={status:'searching',candidates:[]};updateMapStatus();openDetails(id);try{let candidates=await nominatimMatches([item.name,cleanAddress,'上海市'].filter(Boolean).join(', '));for(const query of [cleanAddress+'，上海市',item.name+'，上海市']){if(candidates.length)break;await new Promise(resolve=>setTimeout(resolve,1100));candidates=await nominatimMatches(query)}geoMatchResults[id]={status:'ready',candidates};geoProgress=1;openDetails(id);if(!candidates.length)notify('没有找到可确认的地图候选，地址仍保留。')}catch(error){console.warn(error);geoMatchResults[id]={status:'error',candidates:[]};openDetails(id);notify('地图匹配服务暂时无法连接，地址仍保留。')}finally{geoBusy=false;updateMapStatus();if(state.selected===id)openDetails(id)}}

<script>
const boardNotesKey='shanghai-collection-board-notes-v1';
const boardAddedFavoritesKey='shanghai-collection-added-favorites-v1';
let boardNotes={};
let boardSelectionMode=false;
const boardSelection=new Set();
let boardAddRequest='';
let boardHelperReady=false;
let boardAddedFavorites=[];
try{const data=JSON.parse(localStorage.getItem(boardNotesKey)||'{}');if(data&&typeof data==='object'&&!Array.isArray(data))boardNotes=data}catch{}
try{const data=JSON.parse(localStorage.getItem(boardAddedFavoritesKey)||'[]');if(Array.isArray(data))boardAddedFavorites=data.filter(row=>row&&typeof row==='object')}catch{}
function addedFavoriteItem(row){const id=String(row.id||'').trim(),name=String(row.name||'').trim();if(!id||!name)return null;const category=categories.some(entry=>entry[0]===row.category)?row.category:'美食';return importedItem({id,name,address:String(row.address||'地址待补充'),city:String(row.city||'上海'),savedAt:String(row.savedAt||new Date().toISOString().slice(0,10)),category,detailCategory:String(row.detailCategory||row.sub||'其他'),score:String(row.score||''),photo:String(row.photo||''),url:String(row.url||`https://www.dianping.com/shop/${id}`),businessStatus:'unchecked'});}
const persistedAddedItems=boardAddedFavorites.map(addedFavoriteItem).filter(Boolean).filter(item=>!items.some(existing=>existing.id===item.id));
if(persistedAddedItems.length)items.unshift(...persistedAddedItems);

function boardRows(){return filtered()}

  const rows=boardRows(),cards=[...board.querySelectorAll('.card')];
  const toolbarMarkup=boardToolbar();let toolbar=board.querySelector('.board-toolbar');if(!toolbar){board.insertAdjacentHTML('afterbegin',toolbarMarkup);toolbar=board.querySelector('.board-toolbar');boardToolbarState=toolbarMarkup}else if(boardToolbarState!==toolbarMarkup){toolbar.outerHTML=toolbarMarkup;boardToolbarState=toolbarMarkup}
  board.classList.toggle('selection-active',boardSelectionMode);
  cards.forEach((card,index)=>{const x=rows[index];if(!x)return;card.dataset.boardId=x.id;let select=card.querySelector('.board-select');if(!select){select=document.createElement('input');select.type='checkbox';select.className='board-select';select.setAttribute('aria-label',`选择 ${x.name}`);card.prepend(select)}select.dataset.boardSelect=x.id;select.checked=boardSelection.has(x.id);card.classList.toggle('board-selected',boardSelection.has(x.id));let noteButton=card.querySelector('.board-note-button');if(!noteButton){noteButton=document.createElement('button');noteButton.type='button';noteButton.className='board-note-button';noteButton.dataset.boardNote=x.id;card.querySelector('.card-main')?.append(noteButton)}const noteLabel=boardNotes[x.id]?'查看点评':'个人点评';if(noteButton.textContent!==noteLabel)noteButton.textContent=noteLabel;const slot=card.querySelector('[data-board-note-slot]'),noteText=boardNotes[x.id]||'';if(slot){slot.textContent=noteText;slot.title=noteText}card.querySelector('.board-note')?.remove()});

render=function(...args){const result=nativeBoardRender.apply(this,args);scheduleBoardSync();return result};

function setBoardSelection(id){if(boardSelection.has(id))boardSelection.delete(id);else boardSelection.add(id);syncBoard()}

function addFavoriteFromHelper(raw){const item=addedFavoriteItem({...raw,savedAt:new Date().toISOString().slice(0,10)});if(!item){notify('大众点评未返回可用的店铺信息');return}if(items.some(row=>row.id===item.id)){closeBoardEditor();notify('这家店已经在收藏中');return}boardAddedFavorites.unshift({...raw,savedAt:item.date});if(!saveAddedFavorites())return;items.unshift(item);closeBoardEditor();render();notify(`已添加：${item.name}`)}

function saveBoardEdit(x){savedEdits[x.id]={...savedEdits[x.id],classificationRevision:'board',statusRevision:'board',category:x.category,sub:x.sub,status:x.status,district:x.district,walks:x.walks};try{localStorage.setItem(metadataKey,JSON.stringify(savedEdits));return true}catch{notify('浏览器无法保存编辑');return false}}
function deleteBoardSelection(){const selected=[...boardSelection].filter(id=>items.some(x=>x.id===id)&&!trash[id]);if(!selected.length)return;if(!window.confirm(`确认将 ${selected.length} 家收藏移入回收站？\n回收站保留 7 天，之后自动清理。`))return;selected.forEach(id=>trash[id]=Date.now());try{localStorage.setItem(trashKey,JSON.stringify(trash))}catch{}boardSelection.clear();boardSelectionMode=false;render();notify(`已将 ${selected.length} 家收藏移入回收站`)}

document.addEventListener('click',event=>{
  const select=event.target.closest('[data-board-select]');if(select){event.preventDefault();event.stopImmediatePropagation();setBoardSelection(select.dataset.boardSelect);return}
  const note=event.target.closest('[data-board-note]');if(note){event.preventDefault();event.stopImmediatePropagation();openBoardNote(note.dataset.boardNote);return}
  const candidate=event.target.closest('[data-board-add-candidate]');if(candidate){event.preventDefault();event.stopImmediatePropagation();const list=candidate.closest('.board-add-candidates'),picked=list?._candidates?.[Number(candidate.dataset.boardAddCandidate)];if(picked&&boardAddRequest){const status=ensureBoardEditor().querySelector('.board-add-status');if(status)status.textContent='正在读取大众点评店铺信息…';window.postMessage({source:'shanghai-favorites-board',type:'dianping-helper-select',requestId:boardAddRequest,candidate:picked},location.origin)}return}
  const action=event.target.closest('[data-board-action]');if(!action)return;event.preventDefault();event.stopImmediatePropagation();switch(action.dataset.boardAction){case'add-favorite':openAddFavorite();break;case'toggle-selection':boardSelectionMode=true;syncBoard();break;case'cancel-selection':boardSelectionMode=false;boardSelection.clear();syncBoard();break;case'edit-selection':openBoardBulkEditor();break;case'delete-selection':deleteBoardSelection();break;case'close-editor':closeBoardEditor();break}
},true);
document.addEventListener('submit',event=>{
  if(event.target.id==='board-note-form'){event.preventDefault();const id=document.querySelector('#board-editor').dataset.noteId,text=$('board-note-text').value.trim();if(text)boardNotes[id]=text;else delete boardNotes[id];if(saveBoardNotes()){closeBoardEditor();syncBoard();notify(text?'已保存个人点评':'已清除个人点评')}return}
  if(event.target.id==='board-bulk-form'){event.preventDefault();const category=$('board-bulk-category').value,status=$('board-bulk-status').value;let count=0;for(const id of boardSelection){const x=items.find(item=>item.id===id);if(!x)continue;if(category){x.category=category;x.sub=category==='美食'?'其他':category}if(status)x.status=status;if(saveBoardEdit(x))count++}closeBoardEditor();render();notify(`已更新 ${count} 家收藏`)}
  if(event.target.id==='board-add-favorite-form'){event.preventDefault();beginDianpingSearch($('board-add-favorite-name').value.trim())}
});
window.addEventListener('message',event=>{if(event.source!==window||event.origin!==location.origin)return;const message=event.data;if(!message||message.source!=='dianping-favorites-helper')return;if(message.type==='ready'){boardHelperReady=true;return}if(message.requestId!==boardAddRequest)return;if(message.type==='candidates'){showDianpingCandidates(message);return}if(message.type==='result'){boardAddRequest='';addFavoriteFromHelper(message.shop);return}if(message.type==='error'){boardAddRequest='';const panel=ensureBoardEditor(),status=panel.querySelector('.board-add-status');if(status)status.textContent=message.message||'大众点评检索失败';panel.querySelector('input')?.removeAttribute('disabled');panel.querySelector('button[type="submit"]')?.removeAttribute('disabled');notify(message.message||'大众点评检索失败')}});
scheduleBoardSync();
</script>
<script>
document.addEventListener('error',event=>{const image=event.target;if(!(image instanceof HTMLImageElement)||!image.matches('#board .card-photo img[data-fallback],#map-hover-card img[data-fallback],.baidu-shop-tooltip img[data-fallback]')||image.dataset.fallbackApplied)return;image.dataset.fallbackApplied='1';image.src=image.dataset.fallback},true);
</script>
</body>
</html>
