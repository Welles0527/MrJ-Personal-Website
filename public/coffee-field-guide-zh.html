 {id:'beans', n:'01',icon:'bean',title:['Coffee beans','认识咖啡豆'],short:['The bean','咖啡豆'],tag:['KNOW YOUR ORIGINS','从一颗豆开始'],heading:['SMALL BEAN.\nBIG BEGINNINGS.','小小豆子。\n大大起点。'],desc:['Meet the seed, explore coffee species, and get a feel for roast levels.','认识咖啡的种子、常见品种，以及烘焙程度。'],home:['Where it all begins.','一切从这里开始。'],lessons:['seed','species','roast']},
 {id:'processing',n:'02',icon:'sun',title:['Processing','处理工艺'],short:['The process','处理工艺'],tag:['FROM FRUIT TO BEAN','从果实到生豆'],heading:['A DIFFERENT\nKIND OF PROCESS.','不一样的\n处理工艺。'],desc:['Follow natural, washed, and honey processing—one step at a time.','循序了解日晒、水洗与蜜处理，看看生豆是怎样得到的。'],home:['Follow the transformation.','探索转变的过程。'],lessons:['natural','washed','honey']},
 {id:'drinks',n:'03',icon:'cup',title:['Coffee drinks','咖啡饮品'],short:['The cup','杯中咖啡'],tag:['GET TO KNOW YOUR ORDER','读懂你的那一杯'],heading:['SO MANY CUPS.\nFIND YOURS.','各式咖啡。\n找到你的。'],desc:['Explore the coffee menu, from espresso to milk drinks and cold brew.','从浓缩到奶咖，再到冷萃，轻松读懂咖啡菜单。'],home:['Discover your kind of cup.','找到喜欢的那一杯。'],lessons:['espresso','milk','cold']},

];
const LESSONS = [
 {id:'seed',chapter:'beans',title:['A bean is a seed','咖啡豆其实是种子'],intro:['Start with the little fruit behind your daily cup.','先认识藏在日常咖啡背后的那颗果实。'],take:['The coffee story starts with a cherry.','咖啡的故事，从一颗果实开始。'],body:[['Coffee beans are the seeds inside coffee cherries. Processing separates those seeds from the fruit.','咖啡豆是咖啡果实中的种子。处理工艺会将种子与果肉分离。'],['The seeds are then dried, roasted, and ground before brewing.','种子经过干燥、烘焙和研磨，才进入冲煮环节。']],try:['Look at a bag of coffee and find its origin. What would you like to know about that place?','拿起一袋咖啡，找找产地。关于这个地方，你还想了解什么？'],quiz:{q:['What is a coffee bean?','咖啡豆是什么？'],options:[['The seed of a coffee cherry','咖啡果实中的种子'],['A small nut','一种小坚果'],['A dried leaf','一片干燥的叶子']],answer:0},sources:['seed']},
 {id:'species',chapter:'beans',title:['Arabica & robusta','阿拉比卡与罗布斯塔'],intro:['Species are a starting point, not a complete tasting note.','品种是了解咖啡的起点，不是一张完整的风味说明书。'],take:['Species and roast level are different things.','品种与烘焙度，是两回事。'],body:[['Arabica and robusta refer to coffee from two species: Coffea arabica and Coffea canephora. Each includes different varieties.','阿拉比卡与罗布斯塔对应两个咖啡物种：Coffea arabica 与 Coffea canephora，各自又包含不同品种。'],['Growing conditions, processing, and preparation also influence the cup. A species name alone cannot tell you everything about its flavor.','生长环境、处理工艺与制作方式也会影响杯中风味，不能只靠物种名称判断一切。']],try:['Find a species or variety name on a coffee label. Keep it separate from the roast description in your notes.','在包装上找到物种或品种名，在笔记里把它与烘焙度分开记录。'],quiz:{q:['Which label tells you about a species?','哪个名称表示咖啡物种？'],options:[['Dark roast','深度烘焙'],['Arabica','阿拉比卡'],['Espresso','意式浓缩']],answer:1},sources:['species','variety']},
 {id:'roast',chapter:'beans',title:['The roast spectrum','了解烘焙程度'],intro:['Light, medium, dark: a spectrum to explore, not a ranking.','浅、中、深：值得探索的光谱，而不是好坏排名。'],take:['“Espresso roast” is not a fixed roast level.','“意式烘焙”不是固定的烘焙度。'],body:[['Roasting uses heat to transform green coffee. Lighter roasts generally retain more origin character; darker roasts emphasize roast character.','烘焙通过加热改变生豆。浅烘通常保留更多产地特征，深烘更突出烘焙风味。'],['Light, medium, and dark describe broad color ranges. Different roasters may use these names differently.','浅、中、深烘是宽泛的颜色分类，不同烘焙商的命名可能不完全一致。']],try:['Try two roast levels side by side. Record what you notice, rather than deciding which one is “correct.”','并排尝试两种烘焙度，记录自己的感受，不必寻找唯一“正确”的答案。'],quiz:{q:['Is “espresso roast” one universally fixed color?','“意式烘焙”代表全球统一的颜色吗？'],options:[['Yes, always very dark','是的，一定非常深'],['No, it varies by roaster','不是，会因烘焙商而异'],['It means unroasted','它代表未烘焙']],answer:1},sources:['roast']},
 {id:'natural',chapter:'processing',title:['Natural processing','日晒处理'],intro:['Follow the whole cherry through drying.','看看完整的咖啡果实如何干燥。'],take:['The fruit stays around the seed as it dries.','干燥时，果肉仍包裹着种子。'],body:[['In natural processing, whole cherries dry before their dried outer layers are removed.','日晒处理先干燥完整果实，再去除干燥后的外层。'],['Fruity notes can appear, but processing is not a flavor guarantee.','咖啡可能呈现果香，但处理法并不保证特定风味。']],try:['Look for “natural” on a coffee bag. Write your own tasting impression before reading the suggested notes.','找到标注“日晒”的咖啡，先写下自己的感受，再看包装上的风味描述。'],quiz:{q:['What dries in the natural process?','日晒处理干燥的是什么？'],options:[['Roasted grounds','烘焙后的咖啡粉'],['The whole cherry','完整的咖啡果实'],['Only the outer skin','只有果皮']],answer:1},sources:['process']},
 {id:'washed',chapter:'processing',title:['Washed processing','水洗处理'],intro:['A different route from fruit to seed.','从果实到种子的另一条路线。'],take:['Remove the fruit layers before drying.','干燥前，先去除果肉与果胶。'],body:[['Washed processing removes the pulp and mucilage before the seeds are dried in parchment.','水洗处理先去除果肉与果胶，种子带着羊皮纸层干燥。'],['The process can highlight a coffee’s growing conditions and origin character.','这种处理方式有助于表现生长环境与产地特征。']],try:['Compare a washed and a natural coffee. Note the differences without assuming the process explains everything.','对比水洗与日晒咖啡，记录差异，但不要把所有差异都归因于处理法。'],quiz:{q:['In washed processing, when are fruit layers removed?','水洗处理在什么时候去除果肉与果胶？'],options:[['After brewing','冲煮之后'],['After roasting','烘焙之后'],['Before drying','干燥之前']],answer:2},sources:['process']},
 {id:'honey',chapter:'processing',title:['Honey processing','蜜处理'],intro:['The name comes from a sticky layer—not an added ingredient.','名字来自黏稠的果胶，而不是额外添加的配料。'],take:['Honey processing does not mean adding honey.','蜜处理，不是往咖啡里加蜂蜜。'],body:[['The outer fruit is removed while some sticky mucilage remains on the seeds during drying.','去除外层果皮和果肉后，保留部分黏稠果胶进行干燥。'],['How much mucilage remains can vary between producers and processes.','不同生产者与处理方式所保留的果胶量可能不同。']],try:['Find a honey-processed coffee label. Treat its tasting notes as an invitation to explore.','找一款蜜处理咖啡，把风味说明当作探索的邀请，而非固定答案。'],quiz:{q:['Does honey processing require added honey?','蜜处理需要添加蜂蜜吗？'],options:[['No','不需要'],['Yes','需要'],['Only in dark roasts','只有深烘需要']],answer:0},sources:['process']},
 {id:'espresso',chapter:'drinks',title:['Espresso, unpacked','认识意式浓缩'],intro:['A small drink with its own brewing method.','一杯小巧的咖啡，也是一种独立的冲煮方式。'],take:['Espresso is a method, not a bean species.','意式浓缩是冲煮方式，不是咖啡品种。'],body:[['Espresso uses pressure to push hot water through finely ground coffee, creating a concentrated drink.','意式浓缩借助压力，让热水通过细研磨咖啡粉，得到浓缩的咖啡液。'],['Drink it on its own or use it as a base for other drinks. Adding hot water makes an Americano.','可以直接饮用，也可以作为其他饮品的基底。加入热水就成为美式咖啡。']],try:['When reading a café menu, find which drinks start with an espresso base.','看看咖啡店菜单，找出哪些饮品以意式浓缩为基底。'],quiz:{q:['What makes an Americano?','美式咖啡由什么组成？'],options:[['Espresso and hot water','意式浓缩与热水'],['Coffee cherries and milk','咖啡果实与牛奶'],['Milk foam only','只有奶泡']],answer:0},sources:['espresso','drinks']},
 {id:'milk',chapter:'drinks',title:['Latte or cappuccino?','拿铁还是卡布奇诺？'],intro:['Similar ingredients, a different milk experience.','相似的原料，不同的奶咖体验。'],take:['Pay attention to milk and foam—not just the name.','除了名字，也看看牛奶与奶泡。'],body:[['Both use espresso and milk. A latte generally has more steamed milk and a thinner foam layer; a cappuccino emphasizes more foam.','两者都使用意式浓缩与牛奶。拿铁通常蒸汽牛奶更多、泡沫较薄；卡布奇诺更突出奶泡。'],['Recipes and cup sizes vary by café. The cup drawings here are illustrative, not fixed recipes.','不同咖啡店的配方和杯量会变化。这里的杯子图示仅为示意，不是固定配方。']],try:['Ask how your café prepares each drink, then decide which milk texture you enjoy.','问问咖啡师两种饮品怎样制作，再决定自己喜欢哪种奶感。'],quiz:{q:['Which usually has a thinner foam layer?','哪一款通常奶泡较薄？'],options:[['Latte','拿铁'],['Cappuccino','卡布奇诺'],['They must be identical','它们必须完全一样']],answer:0},sources:['milk']},
 {id:'cold',chapter:'drinks',title:['Cold brew ≠ iced coffee','冷萃不等于冰咖啡'],intro:['One describes the brewing process. The other describes a chilled drink.','一个描述冲煮方式，另一个描述冷饮。'],take:['Cold brew is named for how it is brewed.','冷萃的名字，来自它的萃取方式。'],body:[['Cold brew uses room-temperature or cooler water. Conventional iced coffee is brewed hot, then cooled or served over ice.','冷萃使用室温或更低温度的水。常规冰咖啡通常先热萃，再冷却或加冰。'],['Cold brew can also be served warm. Serving temperature alone does not identify the brewing method.','冷萃也可以加热饮用，不能只凭饮用温度判断萃取方式。']],try:['Next time you order an iced drink, ask how the coffee was brewed.','下次点冰咖啡时，问问它使用什么方法萃取。'],quiz:{q:['Can cold brew be served warm?','冷萃可以热着喝吗？'],options:[['No, never','绝对不可以'],['Yes','可以'],['Only with milk','只有加奶才可以']],answer:1},sources:['cold']},
 {id:'pour',chapter:'brewing',title:['The pour-over ritual','认识手冲'],intro:['Explore a hands-on way to make coffee.','了解一种亲手掌握节奏的冲煮方式。'],take:['Water passes through the coffee bed and filter.','让水流过粉层与滤纸。'],body:[['Pour-over is manual filter brewing. You pour water onto grounds in a filter, and brewed coffee drains into the cup or server.','手冲是一种手动过滤冲煮：向滤器中的咖啡粉注水，咖啡液流入杯子或分享壶。'],['A dripper, matching filter, hot-water source, and scale help you repeat your setup.','滤杯、适配的滤纸、热水来源和电子秤，有助于重复自己的冲煮设置。']],try:['Record the coffee mass and water mass of one brew. Change one variable on the next attempt.','记录一次冲煮的咖啡粉量与水量，下一次只改变一个变量。'],quiz:{q:['Which best describes pour-over?','什么最能描述手冲？'],options:[['Water flows through a coffee bed','水流经咖啡粉层'],['Coffee is boiled without a filter','不经过滤直接煮咖啡'],['Coffee stays dry','咖啡粉始终干燥']],answer:0},sources:['pour']},
 {id:'immersion',chapter:'brewing',title:['Steep, then separate','先浸泡，再分离'],intro:['Meet immersion brewing through the French press.','用法压壶了解浸泡式冲煮。'],take:['The grounds and water spend time together.','让咖啡粉与水相处一会儿。'],body:[['In a French press, coffee grounds steep in water before a plunger filter separates the drink from most of the grounds.','法压壶让咖啡粉浸泡在水中，之后通过压杆滤网，将咖啡液与大部分咖啡渣分离。'],['This differs from pour-over, where water travels through the bed. Follow the brewer’s instructions for preparation and cleaning.','这与水流经粉层的手冲不同。使用与清洁时请遵循器具说明。']],try:['Compare the texture of French press coffee with a paper-filtered cup. Use your own words.','对比法压咖啡与滤纸过滤咖啡的口感，用自己的话描述。'],quiz:{q:['Which is an immersion brewer?','哪个属于浸泡式器具？'],options:[['A storage jar','储豆罐'],['A French press','法压壶'],['A grinder','磨豆机']],answer:1},sources:['press','pour']},
 {id:'ratio',chapter:'brewing',title:['Your coffee-to-water ratio','试试粉水比'],intro:['A little arithmetic makes a recipe easier to repeat.','一点简单计算，让配方更容易重复。'],take:['Water mass = coffee mass × ratio.','注水量 = 咖啡粉量 × 比例。'],body:[['A ratio of 1:16 means 16 grams of input water for every gram of coffee. For example, 20 grams of coffee × 16 = 320 grams of water.','1:16 表示每 1 克咖啡粉使用 16 克水。例如：20 克咖啡粉 × 16 = 320 克水。'],['This is an illustrative filter-coffee input ratio, not a universal recipe or an espresso yield ratio. Some water remains in the grounds, so it is not the final beverage mass.','这是示例性的过滤咖啡投入粉水比，不是万能配方，也不是意式浓缩的粉液比。部分水会留在咖啡渣中，因此不等于最终咖啡液重量。']],try:['Use the calculator, write down your chosen setting, then adjust to your taste.','用计算器选择一组设置，记录下来，再根据自己的口味调整。'],quiz:{q:['At 1:16, how much input water for 20 g of coffee?','20 克咖啡粉按 1:16，需要多少克水？'],options:[['36 g','36 克'],['320 g','320 克'],['160 g','160 克']],answer:1},sources:[]},
 {id:'grinder',chapter:'equipment',title:['Get to know your grinder','认识磨豆机'],intro:['From whole beans to the grounds your method needs.','把完整咖啡豆，变成适合冲煮方式的咖啡粉。'],take:['The grind is part of the recipe.','研磨，也是配方的一部分。'],body:[['Different brewing methods use different grind settings. Espresso uses a fine grind; other methods need their own setup.','不同冲煮方式需要不同研磨设置。意式浓缩使用细研磨，其他方法也有相应要求。'],['Grind only what you need just before brewing when possible. Consult your grinder and brewer instructions when adjusting.','条件允许时，在冲煮前研磨当次用量。调整时参考磨豆机与冲煮器具的说明。']],try:['Keep a note of your grinder setting alongside coffee mass and water mass.','把磨豆机刻度与咖啡粉量、注水量一起记下来。'],quiz:{q:['When is a useful time to grind for freshness?','为了新鲜风味，通常什么时候研磨较合适？'],options:[['Just before brewing','冲煮前'],['A year in advance','提前一年'],['After brewing','冲煮后']],answer:0},sources:['espresso','storage']},
 {id:'moka',chapter:'equipment',title:['Meet the moka pot','认识摩卡壶'],intro:['Understand the tool before starting the heat.','先认识器具，再开始加热。'],take:['Never tamp coffee in a moka-pot basket.','摩卡壶粉槽中的咖啡粉，不要压实。'],body:[['For a traditional Bialetti moka pot, fill water to the lower edge of the safety valve, use suitable moka grounds, and do not press them down.','传统 Bialetti 摩卡壶应将水加至安全阀下缘，使用适合摩卡壶的咖啡粉，不要压实。'],['Follow your exact model’s manual. Use the handle; allow the pot to cool before opening. Keep the valve and filter clear.','请遵循具体型号的说明书。使用手柄拿取，冷却后再打开，并保持安全阀与滤网畅通。']],try:['With the pot cool and empty, identify its water chamber, basket, collector, and safety valve.','在壶体冷却且空置时，找找下壶、粉槽、上壶与安全阀。'],quiz:{q:['Should you tamp the grounds in a moka basket?','摩卡壶的咖啡粉需要压实吗？'],options:[['Yes, as firmly as possible','是，越紧越好'],['Only if the pot is small','只有小壶需要'],['No','不需要']],answer:2},sources:['moka']},
 {id:'storage',chapter:'equipment',title:['Keep your beans fresh','储存咖啡豆'],intro:['A small habit for your coffee corner.','给咖啡角加一个简单的小习惯。'],take:['Keep out air, moisture, heat, and light.','远离空气、水分、热量与光照。'],body:[['Use an airtight, opaque container in a cool, dark place. Avoid a sunny counter or a warm spot near an oven.','将咖啡豆放在密封、不透光的容器中，存于阴凉处。避开阳光直射的台面与烤箱附近。'],['Keep whole beans until you need them, and grind for the brew you are about to make.','尽量保存完整咖啡豆，在冲煮前研磨当次所需用量。']],try:['Check where your beans live. Is the container sealed, dry, and away from heat?','看看咖啡豆住在哪里：容器是否密封、干燥，并远离热源？'],quiz:{q:['Which is the better everyday storage spot?','哪种日常储存环境更合适？'],options:[['A sunny windowsill','阳光直射的窗台'],['A sealed opaque container in a cool cupboard','阴凉柜子中的密封避光容器'],['An open bowl beside the oven','烤箱旁的敞口碗']],answer:1},sources:['storage']}

'use strict';
/* All behavior is local. No tracking, API keys, network requests or dependencies. */
const STORAGE_KEY = 'coffee-field-guide-zh-v1';
const knownIds = new Set(LESSONS.map(x => x.id));
let storageAvailable = true;
const freshState = () => ({version:1,lang:'zh',saved:[],completed:[],notes:{},lastLesson:null});
function loadState(){
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(!raw || typeof raw !== 'object') return freshState();
    const clean = freshState();
    clean.lang = raw.lang === 'en' ? 'en' : 'zh';
    for(const key of ['saved','completed']) clean[key] = Array.isArray(raw[key]) ? [...new Set(raw[key].filter(id=>knownIds.has(id)))] : [];
    if(raw.notes && typeof raw.notes === 'object') for(const [id,note] of Object.entries(raw.notes)) if(knownIds.has(id) && typeof note === 'string') clean.notes[id] = note.slice(0,6000);
    if(knownIds.has(raw.lastLesson)) clean.lastLesson = raw.lastLesson;
    return clean;
  }catch(e){storageAvailable=false;return freshState();}
}
let state = loadState();
const ui={roast:'light',process:'natural',filter:'all',savedTab:'saved',coffee:20,ratio:16,finder:null};
const quizAnswers = Object.create(null);
const draftNotes = Object.create(null);
const timer={running:false,elapsed:0,startedAt:0};
const L = text => Array.isArray(text) ? text[state.lang==='zh'?1:0] : text;
const E = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessonBy = id => LESSONS.find(l=>l.id===id);
const chapterBy = id => CHAPTERS.find(c=>c.id===id);
const done = id => state.completed.includes(id);
const saved = id => state.saved.includes(id);
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageAvailable=true;}catch(e){storageAvailable=false;}}
function getRoute(){const bits=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);return {page:bits[0]||'home',id:bits[1]||''};}
function nextLesson(){return lessonBy(state.lastLesson)&&!done(state.lastLesson)?state.lastLesson:LESSONS.find(x=>!done(x.id))?.id||'seed';}

function sourceBlock(keys){return keys.length?`<div class="lesson-sources"><span class="eyebrow">${L(['Read the sources','参考资料'])}</span>${keys.map(k=>`<a href="${SOURCES[k].url}" target="_blank" rel="noopener noreferrer">${E(L(SOURCES[k].name))} ↗</a>`).join('')}</div>`:`<div class="lesson-sources">${L(['Illustrative arithmetic and original practice prompts; not a universal brewing standard.','示例计算与原创练习提示，不代表通用冲煮标准。'])}</div>`;}
function brand(){return `<a class="brand" href="#/home" aria-label="${L(['Coffee field guide, home','咖啡知识指南首页'])}"><span class="brand-mark">${icon('cup')}</span><span><span class="brand-name display">${L(['COFFEE','咖啡'])}</span><small>${L(['THE FIELD GUIDE','知识指南'])}</small></span></a>`;}
function navigation(){
 const r=getRoute();const active=r.page==='lesson'?lessonBy(r.id)?.chapter:r.page;
 return `<nav aria-label="${L(['Main navigation','主导航'])}"><a class="nav-home ${r.page==='home'?'active':''}" ${r.page==='home'?'aria-current="page"':''} href="#/home">${icon('home')}<span>${L(['Start here','从这里开始'])}</span>${icon('arrow','home-arrow')}</a><div class="nav-label">${L(['THE COFFEE TOUR','咖啡探索之旅'])}</div>${CHAPTERS.map(c=>`<a class="nav-item ${active===c.id?'active':''}" href="#/${c.id}" ${active===c.id?'aria-current="page"':''}>${icon(c.icon)}<span>${E(L(c.title))}</span><span class="nav-n">${c.n}</span></a>`).join('')}</nav>`;
}
function renderSidebar(){
 const pc=Math.round(state.completed.length/LESSONS.length*100);
 document.getElementById('sidebar').innerHTML=`${brand()}${navigation()}<div class="sidebar-progress"><div class="progress-label"><span>${L(['YOUR JOURNEY','你的学习进度'])}</span><span class="mono">${pc}%</span></div><div class="progress-track" role="progressbar" aria-label="${L(['Lesson completion','已完成课程'])}" aria-valuenow="${state.completed.length}" aria-valuemin="0" aria-valuemax="15"><div class="progress-fill" style="width:${pc}%"></div></div><p>${state.completed.length} / ${LESSONS.length} ${L(['lessons explored','节已完成'])}<br>${L(['One sip at a time.','一杯一杯，慢慢探索。'])}</p><button class="side-continue" data-act="resume">${L([state.completed.length?'Keep exploring':'Let’s get started',state.completed.length?'继续探索':'开始探索'])}${icon('arrow')}</button></div><div class="side-bottom"><button data-act="about">${L(['ABOUT THIS DEMO','关于这个演示'])}</button><span class="side-flower" aria-hidden="true">✳</span></div>`;
}
function currentTitle(){const r=getRoute();return r.page==='home'?L(['Start here','从这里开始']):r.page==='saved'?L(['My coffee notebook','我的咖啡手记']):r.page==='lesson'?L(lessonBy(r.id)?.title||['Lesson','课程']):L(chapterBy(r.page)?.title||['Page','页面']);}
function renderHeader(){
 document.getElementById('topbar').innerHTML=`<button class="icon-btn mobile-menu" data-act="menu" aria-label="${L(['Open navigation','打开导航'])}">${icon('menu')}</button><div class="crumb"><span>${E(currentTitle())}</span><span class="trail sep">/</span><span class="trail subtle">${L(['A LITTLE COFFEE CURIOSITY','关于咖啡的小小好奇'])}</span></div><div class="header-actions"><button class="search-trigger" data-act="search" aria-label="${L(['Search the guide','搜索咖啡指南'])}">${icon('search')}<span class="search-text">${L(['Search the guide','搜索咖啡知识'])}</span><kbd aria-hidden="true">⌘ K</kbd></button><div class="lang-toggle" aria-label="${L(['Language','语言'])}"><button data-act="lang" data-value="en" lang="en" aria-label="English" class="${state.lang==='en'?'active':''}" aria-pressed="${state.lang==='en'}">EN</button><span>/</span><button data-act="lang" data-value="zh" lang="zh-CN" aria-label="中文" class="${state.lang==='zh'?'active':''}" aria-pressed="${state.lang==='zh'}">中</button></div><a class="saved-trigger" href="#/saved" aria-label="${L(['Saved lessons','已收藏课程'])}: ${state.saved.length}">${icon('bookmark')}<span>${L(['Saved','收藏'])}</span><span class="saved-count">${state.saved.length}</span></a></div>`;

function bookmarkButton(id,extra=''){return `<button class="icon-btn bookmark ${saved(id)?'active':''} ${extra}" data-act="save" data-id="${id}" aria-pressed="${saved(id)}" aria-label="${E(L([saved(id)?'Unsave lesson':'Save lesson',saved(id)?'取消收藏':'收藏本节']))}: ${E(L(lessonBy(id).title))}">${icon('bookmark')}</button>`;}
function lessonCard(l,i){return `<article class="lesson-card"><div class="lesson-num">${String(i+1).padStart(2,'0')} ${done(l.id)?`${icon('check')} ${L(['EXPLORED','已完成'])}`:L(['LESSON','小节'])}</div>${bookmarkButton(l.id)}<h3>${E(L(l.title))}</h3><p>${E(L(l.intro))}</p>${icon('arrow','card-arrow')}<a href="#/lesson/${l.id}" aria-label="${E(L(l.title))}"></a></article>`;}
function chapterPage(c){const complete=c.lessons.filter(done).length;return `<section class="chapter-hero"><div><div class="eyebrow">${c.n} / 05 &nbsp; ${E(L(c.tag))}</div><h1 class="display">${E(L(c.heading))}</h1><p>${E(L(c.desc))}</p><a class="btn btn-primary" href="#/lesson/${c.lessons.find(id=>!done(id))||c.lessons[0]}">${L([complete?'Continue this chapter':'Begin this chapter',complete?'继续本章':'开始本章'])}${icon('arrow')}</a></div><div class="chapter-art">${art(c.icon)}<span class="chapter-index">${L(['CH.','章'])} ${c.n}</span></div></section><section class="chapter-content"><div class="section-head" style="margin-bottom:0"><h2 class="mini-heading display">${L(['A FEW THINGS TO EXPLORE.','几个值得探索的主题。'])}</h2><p>${complete} / 3 ${L(['lessons explored','节已完成'])}</p></div><div class="lesson-list">${c.lessons.map((id,i)=>lessonCard(lessonBy(id),i)).join('')}</div></section><section class="chapter-interactive" id="chapter-interactive">${chapterInteractive(c)}</section><footer class="chapter-footer"><p>${L(['Take your time. Every chapter has its own story.','不用赶路，每一章都有自己的故事。'])}</p>${Number(c.n)<5?`<a class="btn btn-outline btn-small" href="#/${CHAPTERS[Number(c.n)].id}">${L(['Next','下一章'])}: ${E(L(CHAPTERS[Number(c.n)].title))}${icon('arrow')}</a>`:`<a class="btn btn-outline btn-small" href="#/saved">${L(['Open my notebook','打开我的手记'])}${icon('notes')}</a>`}</footer>`;}
const roastProfiles={light:{name:['Light roast','浅度烘焙'],color:'#bc8752',desc:['A lighter color, generally showing more of the coffee’s origin character.','颜色较浅，通常保留更多咖啡的产地特征。']},medium:{name:['Medium roast','中度烘焙'],color:'#88532f',desc:['A middle range on the roast-color spectrum. Compare it with lighter and darker versions.','烘焙色谱中的中间区间，可以与浅烘、深烘对比体验。']},dark:{name:['Dark roast','深度烘焙'],color:'#4b3024',desc:['A darker color and more prominent roast character; the surface may look oily.','颜色更深，烘焙特征更明显，表面可能带有油光。']}};
function roastLab(){const p=roastProfiles[ui.roast];return `<div class="interactive-top"><div><h2 class="mini-heading display">${L(['GET A FEEL FOR THE ROAST.','感受不同烘焙度。'])}</h2><p>${L(['Three starting points. No right or wrong favorite.','三个探索起点，喜欢哪一种都可以。'])}</p></div><span class="tag-small">${L(['TRY IT OUT','动手试一试'])}</span></div><div class="roast-lab"><div class="roast-visual"><div class="roast-beans" style="--bean-color:${p.color}" aria-hidden="true"><span class="roast-bean"></span><span class="roast-bean"></span><span class="roast-bean"></span></div><span class="eyebrow">${L(['THE ROAST SPECTRUM','烘焙色谱'])}</span></div><div class="roast-control"><h3>${E(L(p.name))}</h3><p>${E(L(p.desc))}</p><div class="segmented" aria-label="${L(['Choose roast level','选择烘焙度'])}">${Object.keys(roastProfiles).map(k=>`<button class="${ui.roast===k?'active':''}" aria-pressed="${ui.roast===k}" data-act="roast" data-value="${k}">${L(roastProfiles[k].name)}</button>`).join('')}</div></div></div>${srcInline('roast')}`;}
function processLab(){const p=lessonBy(ui.process);return `<div class="interactive-top"><div><h2 class="mini-heading display">${L(['FOLLOW THE FRUIT.','跟随果实的旅程。'])}</h2><p>${L(['Switch the process to see what changes.','切换处理方式，看看哪里不同。'])}</p></div><span class="tag-small">${L(['COMPARE THE METHODS','对比处理方法'])}</span></div><div class="segmented" aria-label="${L(['Processing method','处理方式'])}">${['natural','washed','honey'].map(k=>`<button class="${ui.process===k?'active':''}" aria-pressed="${ui.process===k}" data-act="process" data-value="${k}">${E(L(lessonBy(k).title))}</button>`).join('')}</div><div class="process-display"><div class="process-flow" aria-hidden="true"><div class="process-point"><span class="flow-dot">${icon('cherry')}</span><small>${L(['Cherry','咖啡果实'])}</small></div>${icon('arrow')}<div class="process-point"><span class="flow-dot">${icon(ui.process==='natural'?'sun':ui.process==='washed'?'drop':'bean')}</span><small>${L(ui.process==='natural'?['Dry whole','整果干燥']:ui.process==='washed'?['Remove fruit','去除果肉']:['Keep mucilage','保留果胶'])}</small></div>${icon('arrow')}<div class="process-point"><span class="flow-dot">${icon('bean')}</span><small>${L(['Dried seed','干燥生豆'])}</small></div></div><div class="process-text"><h3>${E(L(p.title))}</h3><p>${E(L(p.take))}</p><a class="text-link" href="#/lesson/${p.id}">${L(['Explore this process','了解这种处理法'])}${icon('arrow')}</a></div></div><p class="process-note">${L(['Simplified overview; exact workflows vary.','简化流程示意，实际操作会有所不同。'])}</p>${srcInline('process')}`;}
function cupArt(d){return `<div class="cup-drawing ${d.id}" aria-hidden="true"><div class="cup-handle"></div><div class="cup-body">${d.layers.map(layer=>`<span class="cup-layer ${layer}"></span>`).join('')}</div><span class="cup-saucer"></span></div>`;}
function drinksGallery(){const filtered=DRINKS.filter(d=>ui.filter==='all'||d.type===ui.filter);return `<div class="interactive-top"><div><h2 class="mini-heading display">${L(['WHAT’S IN YOUR CUP?','你的杯中有什么？'])}</h2><p>${L(['Explore a drink. Get to know its ingredients.','点开一杯饮品，认识它的组成。'])}</p></div><span class="tag-small">${L(['DRINK EXPLORER','饮品探索'])}</span></div><div class="filter-row" aria-label="${L(['Filter coffee drinks','筛选咖啡饮品'])}">${[['all',['All drinks','全部饮品']],['black',['Black coffee','黑咖啡']],['milk',['With milk','奶咖']],['cold',['Served cold','冷饮']]].map(([k,name])=>`<button class="filter-btn ${ui.filter===k?'active':''}" data-act="filter" data-value="${k}" aria-pressed="${ui.filter===k}">${E(L(name))}</button>`).join('')}</div><div class="drink-grid">${filtered.map(d=>`<button class="drink-card" data-act="drink" data-id="${d.id}">${cupArt(d)}<h3>${E(L(d.name))}</h3><p>${E(L(d.caption))}</p>${icon('northeast')}</button>`).join('')}</div><p class="drink-legend">${L(['Cup layers are illustrative—not measured recipes. Cold brew can also be served warm.','杯中分层仅为示意，并非精确配方；冷萃也可加热饮用。'])}</p>${srcInline('drinks')}${srcInline('milk')}${srcInline('cold')}`;}
function workbench(){return `<div class="interactive-top"><div><h2 class="mini-heading display">${L(['YOUR LITTLE BREW BENCH.','你的冲煮小工作台。'])}</h2><p>${L(['Plan a ratio. Time your ritual. Make it your own.','算算粉水比，计一下时间，找到自己的节奏。'])}</p></div><span class="tag-small">${L(['INTERACTIVE TOOLS','互动小工具'])}</span></div><div class="brew-workbench"><div class="calculator"><div class="tool-kicker">${L(['COFFEE-TO-WATER CALCULATOR','粉水比计算器'])}</div><div class="calc-controls"><div><label class="field-label" for="coffee-mass">${L(['Coffee','咖啡粉'])}</label><div class="number-wrap"><input id="coffee-mass" type="number" min="1" max="200" step="0.5" value="${E(ui.coffee)}" inputmode="decimal" aria-describedby="calc-error"><span>${L(['g','克'])}</span></div></div><div><label class="field-label" for="brew-ratio">${L(['Water per 1 g coffee','每克粉的用水量'])}</label><div class="number-wrap"><select id="brew-ratio">${[12,13,14,15,16,17,18,19,20].map(n=>`<option value="${n}" ${Number(ui.ratio)===n?'selected':''}>1 : ${n}</option>`).join('')}</select></div></div></div><div class="tool-error" id="calc-error" role="status"></div><div class="calc-result" aria-live="polite" aria-atomic="true"><strong id="water-result">${validCoffee(ui.coffee)?formatNum(Number(ui.coffee)*Number(ui.ratio)):'—'}</strong><span>${L(['g of input water','克 注水量'])}</span></div><p class="tool-note">${L(['Example input ratios for filter-style brewing, not espresso. Adjust to taste; not the final drink mass.','过滤式冲煮的示例投入粉水比，不适用于意式浓缩。按口味调整，不等于最终咖啡液重量。'])}</p></div><div class="timer"><div class="tool-kicker">${L(['BREW STOPWATCH','冲煮秒表'])}</div><span class="timer-label">${L(['Your recipe. Your pace.','自己的配方，自己的节奏。'])}</span><div class="timer-output" id="timer-output" role="timer" aria-label="${L(['Elapsed brewing time','已计时时间'])}">${timerText()}</div><div class="timer-actions"><button class="btn btn-primary btn-small" id="timer-toggle" data-act="timer">${icon(timer.running?'pause':'play')}${L(timer.running?['Pause','暂停']:['Start','开始'])}</button><button class="icon-btn" data-act="timer-reset" aria-label="${L(['Reset stopwatch','重置秒表'])}">${icon('reset')}</button></div><p class="tool-note">${L(['Counts up; there is no preset “perfect” brew time.','向上计时；没有预设的“完美”冲煮时间。'])}</p></div></div>`;}
function gearFinder(){return `<div class="interactive-top"><div><h2 class="mini-heading display">${L(['FIND YOUR KIND OF RITUAL.','找到自己的咖啡仪式。'])}</h2><p>${L(['Choose a way to explore, not a shopping list.','选择一种探索方式，而不是一份购物清单。'])}</p></div></div><div class="finder-panel">${art('kettle')}<div><h3>${L(['What does your coffee<br>moment look like?','你的咖啡时刻，<br>是什么样子？'])}</h3><p>${L(['Hands-on pouring, a simple steep, or a stovetop ritual. Start with what sounds good.','亲手注水、简单浸泡，或是炉边的片刻，从感兴趣的方式开始。'])}</p></div><button class="btn btn-primary" data-act="finder">${L(['Find my style','找到我的方式'])}${icon('arrow')}</button></div>`;}
function chapterInteractive(c){return c.id==='beans'?roastLab():c.id==='processing'?processLab():c.id==='drinks'?drinksGallery():c.id==='brewing'?workbench():gearFinder();}
function quizHtml(l){const picked=quizAnswers[l.id];return `<section class="quiz" aria-labelledby="quiz-title"><div class="eyebrow text-accent">${L(['A LITTLE KNOWLEDGE CHECK','小小知识检验'])}</div><h3 id="quiz-title">${E(L(l.quiz.q))}</h3><div class="quiz-options">${l.quiz.options.map((o,i)=>`<button class="quiz-option ${picked===i?(i===l.quiz.answer?'right':'wrong'):''}" data-act="quiz" data-id="${l.id}" data-value="${i}" aria-pressed="${picked===i}">${E(L(o))}</button>`).join('')}</div><p class="quiz-feedback" aria-live="polite">${picked===undefined?L(['Just for practice. You can try again.','用于练习，可以重新尝试。']):picked===l.quiz.answer?L(['That’s it. A little more coffee knowledge, poured in.','答对了，又注入了一点咖啡知识。']):L(['Not quite. Take another look at the lesson and try again.','还差一点，回顾上面的内容再试试。'])}</p></section>`;}
function article(l){const c=chapterBy(l.chapter),i=LESSONS.findIndex(x=>x.id===l.id),ci=c.lessons.indexOf(l.id);const note=Object.hasOwn(draftNotes,l.id)?draftNotes[l.id]:(state.notes[l.id]||'');return `<div class="lesson-header"><a class="back-link" href="#/${c.id}">${icon('back')}${L(['Back to','返回'])} ${E(L(c.title))}</a></div><div class="reading-grid"><article><div class="lesson-meta eyebrow">${L(['CH.','章'])} ${c.n} <span>/</span> ${L(['LESSON','小节'])} ${String(ci+1).padStart(2,'0')} ${done(l.id)?`<span class="done-check">${icon('check')}${L(['EXPLORED','已完成'])}</span>`:''}</div><h1 class="lesson-title display">${E(L(l.title))}</h1><p class="lesson-intro">${E(L(l.intro))}</p><div class="lesson-take"><div class="eyebrow">${L(['THE LITTLE TAKEAWAY','记住这一点'])}</div><p>${E(L(l.take))}</p></div><div class="lesson-body">${l.body.map(p=>`<p>${E(L(p))}</p>`).join('')}</div><div class="try-note"><strong>${L(['TRY THIS NEXT','接下来，试一试'])}</strong><p>${E(L(l.try))}</p></div>${sourceBlock(l.sources)}${l.id==='ratio'?`<div class="chapter-interactive" style="margin-top:24px">${workbench()}</div>`:''}${quizHtml(l)}<div class="lesson-actions"><button class="btn ${done(l.id)?'btn-outline':'btn-primary'}" data-act="complete" data-id="${l.id}" aria-pressed="${done(l.id)}">${icon('check')}${L(done(l.id)?['Explored · undo','已完成 · 撤销']:['Mark as explored','标记为已完成'])}</button><div class="lesson-controls">${i>0?`<a href="#/lesson/${LESSONS[i-1].id}">${icon('back')}${L(['Previous','上一节'])}</a>`:''}${i<LESSONS.length-1?`<a href="#/lesson/${LESSONS[i+1].id}">${L(['Next lesson','下一节'])}${icon('arrow')}</a>`:`<a href="#/saved">${L(['My notebook','我的手记'])}${icon('arrow')}</a>`}</div></div></article><aside class="reader-aside" aria-label="${L(['Chapter navigation and notes','章节导航与笔记'])}"><div class="reader-aside-inner"><div class="eyebrow subtle">${L(['IN THIS CHAPTER','本章内容'])}</div><p class="reader-chapter-title">${E(L(c.title))}</p><nav class="reader-links" aria-label="${L(['Lessons in this chapter','本章小节'])}">${c.lessons.map((id,j)=>`<a class="${id===l.id?'active':''}" href="#/lesson/${id}" ${id===l.id?'aria-current="page"':''}><span class="n">${j+1}.</span>${E(L(lessonBy(id).title))}${done(id)?icon('check'):''}</a>`).join('')}</nav><button class="btn btn-outline btn-small save-lesson" data-act="save" data-id="${l.id}" aria-pressed="${saved(l.id)}">${icon('bookmark')}${L(saved(l.id)?['Saved to my notebook','已收藏到手记']:['Save this lesson','收藏本节'])}</button><div class="reader-note"><label for="lesson-note">${L(['YOUR TASTING NOTES','你的咖啡笔记'])}</label><textarea id="lesson-note" data-id="${l.id}" maxlength="6000" placeholder="${L(['Something you learned, a cup you tried, a thought to keep…','记下新知识、尝过的咖啡，或一个小小想法……'])}">${E(note)}</textarea><button class="btn btn-soft btn-small" data-act="note" data-id="${l.id}">${L(['Save note','保存笔记'])}${icon('notes')}</button><small>${L(['Saved only in this browser.','仅保存在当前浏览器中。'])}</small>${!storageAvailable?`<div class="local-warning">${L(['Storage is blocked; notes will last only for this session. Export your notebook to keep a copy.','浏览器限制了储存；笔记仅在本次会话中保留。请导出手记备份。'])}</div>`:''}</div></div></aside></div>`;}
function savedPage(){let chosen=ui.savedTab==='saved'?LESSONS.filter(x=>saved(x.id)):ui.savedTab==='completed'?LESSONS.filter(x=>done(x.id)):LESSONS.filter(x=>state.notes[x.id]?.trim());return `<section class="saved-header"><span class="eyebrow text-accent">${L(['YOUR LITTLE COFFEE CORNER','你的咖啡小角落'])}</span><h1 class="display">${L(['KEEP THE GOOD STUFF.','留住那些美好。'])}</h1><p>${L(['Saved lessons, explored chapters, and the little notes you want to come back to.','收藏的课程、探索的足迹，还有那些想再翻看的小小笔记。'])}</p></section><div class="saved-toolbar"><div class="segmented">${[['saved',['Saved','已收藏'],state.saved.length],['completed',['Explored','已完成'],state.completed.length],['notes',['Notes','笔记'],Object.values(state.notes).filter(n=>n.trim()).length]].map(([key,label,count])=>`<button data-act="saved-tab" data-value="${key}" class="${ui.savedTab===key?'active':''}" aria-pressed="${ui.savedTab===key}">${L(label)} <span class="mono">${count}</span></button>`).join('')}</div><div class="saved-tools"><button data-act="export">${icon('download')}${L(['Export notebook','导出手记'])}</button></div></div><section class="saved-content">${chosen.length?(ui.savedTab==='notes'?chosen.map(l=>`<article class="note-card"><h3>${E(L(l.title))}</h3><p>${E(state.notes[l.id])}</p><a class="text-link" href="#/lesson/${l.id}">${L(['Return to lesson','返回课程'])}${icon('arrow')}</a></article>`).join(''):`<div class="lesson-list">${chosen.map((l,i)=>lessonCard(l,i)).join('')}</div>`):`<div class="empty-state">${icon(ui.savedTab==='notes'?'notes':ui.savedTab==='completed'?'book':'bookmark')}<h2>${L(ui.savedTab==='notes'?['A blank page, for now.','这一页，等你写。']:ui.savedTab==='completed'?['Your first chapter is waiting.','第一章，正等着你。']:['Make yourself a little collection.','为自己，收集一点喜欢。'])}</h2><p>${L(ui.savedTab==='notes'?['Add a note inside any lesson. It will be waiting for you here.','在课程中写下并保存笔记，就会出现在这里。']:ui.savedTab==='completed'?['Read a lesson and mark it as explored to track your journey.','阅读课程并标记为已完成，记录自己的旅程。']:['Tap the bookmark on a lesson to save it here for another coffee break.','点击课程的收藏图标，下次咖啡时间继续翻看。'])}</p><button class="btn btn-primary" data-act="tour">${L(['Explore the guide','探索咖啡指南'])}${icon('arrow')}</button></div>`}</section><div class="data-note"><span>${L(['Stored locally in this browser, not synced to an account. Export a copy to keep it.','内容保存在本地浏览器，不与账号同步。可导出文件留作备份。'])}</span><button data-act="reset-confirm">${L(['Reset local data','清除本地数据'])}</button></div>`;}
function render(routeChange=false){
 const r=getRoute();
 document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
 document.title=`${currentTitle()} · ${L(['Coffee — The Field Guide','咖啡 — 知识指南'])}`;
 renderSidebar();renderHeader();
 let content;
 if(r.page==='home') content=home();
 else if(r.page==='saved') content=savedPage();
 else if(r.page==='lesson'&&lessonBy(r.id)) {state.lastLesson=r.id;persist();content=article(lessonBy(r.id));}
 else if(chapterBy(r.page)) content=chapterPage(chapterBy(r.page));
 else content=`<div class="not-found"><h1 class="display">${L(['A LITTLE DETOUR.','绕了一个小弯。'])}</h1><p>${L(['This page is not in the guide. Let’s get back to the coffee.','指南中没有这个页面，让我们回到咖啡之旅。'])}</p><a href="#/home" class="btn btn-primary">${L(['Back to the beginning','返回起点'])}${icon('arrow')}</a></div>`;
 document.getElementById('main').innerHTML=`<div class="view">${content}</div>`;
 document.getElementById('main').setAttribute('aria-label',currentTitle());
 if(routeChange){window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
}
function updateInteractive(focusAct='',focusValue=''){
 const r=getRoute();const c=chapterBy(r.page);const host=document.getElementById('chapter-interactive');
 if(c&&host) host.innerHTML=chapterInteractive(c);
 if(focusAct){document.querySelector(`[data-act="${focusAct}"][data-value="${focusValue}"]`)?.focus({preventScroll:true});}
}
const dlg=document.getElementById('dialog');
function showDialog(content,type=''){
 dlg.className=type;
 dlg.innerHTML=`<div class="dialog-inner">${content}</div>`;
 if(!dlg.open) dlg.showModal();
 dlg.scrollTop=0;
}
function dialogHeader(kicker){return `<div class="dialog-top"><span class="eyebrow">${E(kicker)}</span><button class="icon-btn" data-act="close" aria-label="${L(['Close dialog','关闭弹窗'])}">${icon('close')}</button></div>`;}
function tourDialog(){const resume=nextLesson();showDialog(`${dialogHeader(L(['THE COFFEE TOUR','咖啡探索之旅']))}<h2 class="dialog-title display" id="dialog-title">${L(['EVERY CUP<br>HAS A STORY.','每一杯，<br>都有一个故事。'])}</h2><p class="dialog-intro">${L(['Follow the journey from beans to brewing, or jump into the chapter that catches your eye.','从咖啡豆到亲手冲煮，循序探索；也可以直接打开感兴趣的章节。'])}</p><div class="tour-options">${CHAPTERS.map(c=>`<a class="tour-option" href="#/${c.id}"><span class="n">${c.n}</span>${icon(c.icon)}<div><h3>${E(L(c.title))}</h3><p>${E(L(c.home))} ${c.lessons.filter(done).length?` · ${c.lessons.filter(done).length}/3`:''}</p></div>${icon('northeast')}</a>`).join('')}</div><div class="dialog-bottom"><p>${L(['Your place is saved in this browser. No account needed.','进度保存在当前浏览器，无需账号。'])}</p><a class="btn btn-primary" href="#/lesson/${resume}">${L([state.completed.length?'Continue learning':'Start with the bean',state.completed.length?'继续学习':'从咖啡豆开始'])}${icon('arrow')}</a></div>`);}
function searchDialog(){showDialog(`${dialogHeader(L(['A LITTLE HELP FINDING THINGS','找到你的好奇所在']))}<h2 class="dialog-title display" id="dialog-title">${L(['WHAT’S BREWING?','想了解，哪一点？'])}</h2><label class="search-label" for="guide-search">${L(['Search coffee knowledge','搜索咖啡知识'])}</label><input type="search" id="guide-search" class="dialog-search" autocomplete="off" placeholder="${L(['Try “espresso”, “beans”, “ratio”…','试试“拿铁”“研磨”“水洗”……'])}"><div class="eyebrow subtle" id="search-count" aria-live="polite"></div><div class="search-results" id="search-results"></div><div class="search-hint">${L(['ESC TO CLOSE · TAB TO EXPLORE RESULTS','ESC 关闭 · TAB 浏览结果'])}</div>`);updateSearch('');setTimeout(()=>document.getElementById('guide-search')?.focus(),40);}
function updateSearch(q){const query=q.trim().normalize('NFKC').toLowerCase();const results=LESSONS.filter(l=>[...l.title,...l.intro,...l.body.flat(),...chapterBy(l.chapter).title].join(' ').normalize('NFKC').toLowerCase().includes(query));document.getElementById('search-count').textContent=`${results.length} ${L(['LESSONS','节课程'])}`;document.getElementById('search-results').innerHTML=results.length?results.map(l=>`<a class="search-result" href="#/lesson/${l.id}">${icon(chapterBy(l.chapter).icon)}<span><strong>${E(L(l.title))}</strong><small>${E(L(chapterBy(l.chapter).title))}</small></span>${icon('arrow')}</a>`).join(''):`<p class="search-empty">${L(['No lessons found. Try “coffee”, “milk”, “roast”, or a shorter phrase.','没有找到课程，试试“咖啡”“牛奶”“烘焙”或更简短的词。'])}</p>`;}
function finderDialog(result=null){
 const options=[{id:'pour',icon:'drop',title:['Hands-on pouring','亲手掌握注水'],desc:['I like a little ritual and room to experiment.','我喜欢一点仪式感，也愿意尝试。']},{id:'immersion',icon:'cup',title:['A simple steep','简单浸泡'],desc:['I’d like to explore an immersion method.','我想认识浸泡式冲煮。']},{id:'moka',icon:'kettle',title:['A stovetop moment','炉边的咖啡时刻'],desc:['I’m curious about the moka pot.','我对摩卡壶感到好奇。']}];
 if(!result){ui.finder=null;showDialog(`${dialogHeader(L(['FIND YOUR BREWING STYLE','找到你的冲煮方式']))}<h2 class="dialog-title display" id="dialog-title">${L(['YOUR COFFEE.<br>YOUR KIND OF RITUAL.','你的咖啡，<br>你的日常仪式。'])}</h2><p class="dialog-intro">${L(['Which part sounds most like you? Choose a starting point to explore—not a product recommendation.','哪种体验更像你？选择一个知识探索的起点，而非商品推荐。'])}</p><div class="choice-grid">${options.map(o=>`<button class="choice" data-act="finder-result" data-id="${o.id}">${icon(o.icon)}<span><strong>${E(L(o.title))}</strong><small>${E(L(o.desc))}</small></span>${icon('arrow')}</button>`).join('')}</div>`);return;}
 ui.finder=result;
 const info={pour:{name:['Pour-over','手冲咖啡'],art:'drop',text:['Start with manual filter brewing. Learn how water passes through the grounds and how to record your recipe.','从手动过滤冲煮开始，了解水如何流经咖啡粉，以及怎样记录配方。'],source:'pour'},immersion:{name:['French press','法压壶'],art:'cup',text:['Start with immersion: steep the grounds in water, then separate using a plunger filter.','从浸泡式冲煮开始：咖啡粉在水中浸泡，再通过压杆滤网分离。'],source:'press'},moka:{name:['Moka pot','摩卡壶'],art:'kettle',text:['Get to know the chambers, coffee basket, and safety valve. Read your model’s instructions before brewing.','认识壶体、粉槽与安全阀，冲煮前先阅读具体型号说明。'],source:'moka'}}[result];
 showDialog(`${dialogHeader(L(['A PLACE TO START','从这里，开始探索']))}<h2 class="dialog-title display" id="dialog-title">${L(['MEET YOUR<br>NEXT LITTLE RITUAL.','认识你的<br>下个咖啡仪式。'])}</h2><div class="finder-result">${art(info.art)}<div class="eyebrow">${L(['YOUR EXPLORATION STARTS WITH','你的探索可以始于'])}</div><h3>${E(L(info.name))}</h3><p>${E(L(info.text))}</p></div>${srcInline(info.source)}<div class="dialog-bottom"><button class="text-link" data-act="finder">${icon('back')}${L(['Try another style','试试另一种'])}</button><a class="btn btn-primary" href="#/lesson/${result}">${L(['Explore this method','了解这种方法'])}${icon('arrow')}</a></div>`);
}
function drinkDialog(id){const d=DRINKS.find(x=>x.id===id);if(!d)return;showDialog(`${dialogHeader(L(['GET TO KNOW YOUR CUP','认识你的那一杯']))}<div class="drink-detail"><h2 class="dialog-title display" id="dialog-title">${E(L(d.name))}</h2><div class="drink-detail-art">${cupArt(d)}</div><p>${E(L(d.description))}</p>${srcInline(d.source)}<div class="dialog-bottom"><p>${L(['Illustrative cup diagram; proportions vary.','图示仅作说明，实际配方比例可能不同。'])}</p><a class="btn btn-primary" href="#/lesson/${d.lesson}">${L(['Explore the lesson','了解相关课程'])}${icon('arrow')}</a></div></div>`);}
function aboutDialog(){showDialog(`${dialogHeader(L(['THE FIELD GUIDE','咖啡知识指南']))}<h2 class="dialog-title display" id="dialog-title">${L(['BUILT FOR<br>A LITTLE CURIOSITY.','为一点好奇，<br>而生。'])}</h2><div class="about-copy"><p>${L(['An interactive coffee-education prototype inspired by the artwork you supplied. The original “PROGRESS” and “MOTIVATION LOADING...” copy remains in the illustration.','这是依据你提供的图片制作的咖啡知识互动原型。插图保留了原图的“PROGRESS”与“MOTIVATION LOADING...”文字。'])}</p><p><strong>${L(['Your notebook stays here.','你的手记，留在这里。'])}</strong> ${L(['Favorites, progress, language, and saved notes use this browser’s local storage. No account, analytics, or external services are connected. Browser restrictions or clearing site data may remove your progress.','收藏、进度、语言与已保存笔记储存在当前浏览器本地。没有连接账号、统计分析或外部服务。浏览器限制或清除网站数据可能导致进度丢失。'])}</p><p>${L(['Educational descriptions are sourced below; practice prompts and calculator examples are original. No products, prices, ratings, or testimonials are invented.','科普说明参考下列资料；练习提示与计算示例为原创。没有虚构商品、价格、评分或推荐见证。'])}</p></div><div class="dialog-actions"><button class="btn btn-primary btn-small" data-act="sources">${L(['Sources & further reading','资料来源与延伸阅读'])}${icon('book')}</button><button class="btn btn-outline btn-small" data-act="export">${L(['Export my notebook','导出我的手记'])}${icon('download')}</button></div>`);}
function sourcesDialog(){showDialog(`${dialogHeader(L(['SOURCES & FURTHER READING','资料来源与延伸阅读']))}<h2 class="dialog-title display" id="dialog-title">${L(['KEEP EXPLORING.','继续探索。'])}</h2><p class="dialog-intro">${L(['Educational references used in this prototype. Links open externally and need an internet connection. Sources are references, not sponsors.','原型内容参考资料。链接将在外部打开，需要网络连接。资料来源不代表赞助关系。'])}</p><div class="source-list">${Object.values(SOURCES).map(s=>`<a href="${s.url}" target="_blank" rel="noopener noreferrer">${E(L(s.name))}${icon('northeast')}</a>`).join('')}</div>`);}
function mobileMenu(){showDialog(`${dialogHeader(L(['COFFEE · THE FIELD GUIDE','咖啡 · 知识指南']))}<h2 class="sr-only" id="dialog-title">${L(['Navigation','导航'])}</h2>${navigation()}<a class="nav-saved" href="#/saved">${icon('bookmark')}${L(['My notebook','我的手记'])}<span class="nav-n">${state.saved.length}</span></a><div class="side-bottom"><button data-act="about">${L(['ABOUT THIS DEMO','关于这个演示'])}</button><span aria-hidden="true">✳</span></div>`,'nav-dialog');}
let toastTimeout;
function toast(message){const box=document.getElementById('toast');box.textContent=message;box.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>box.classList.remove('show'),3000);}
function goLesson(id){if(dlg.open)dlg.close();if(getRoute().page==='lesson'&&getRoute().id===id){window.scrollTo({top:0,behavior:'smooth'});}else location.hash=`/lesson/${id}`;}
function saveLesson(id){if(!knownIds.has(id))return;const was=saved(id);state.saved=was?state.saved.filter(x=>x!==id):[...state.saved,id];persist();const scroll=window.scrollY;render();window.scrollTo({top:scroll,behavior:'instant'});document.querySelector(`[data-act="save"][data-id="${id}"]`)?.focus({preventScroll:true});toast(L(was?['Removed from your notebook.','已从手记中取消收藏。']:['Saved to your coffee notebook.','已收藏到你的咖啡手记。']));}
function exportNotebook(){
 const payload={app:L(['Coffee — The Field Guide','咖啡 — 知识指南']),version:1,exportedAt:new Date().toISOString(),language:state.lang,saved:state.saved.map(id=>({id,title:L(lessonBy(id).title)})),completed:state.completed.map(id=>({id,title:L(lessonBy(id).title)})),notes:state.notes,lastLesson:state.lastLesson};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=state.lang==='zh'?'我的咖啡手记.json':'my-coffee-notebook.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
 if(!dlg.open)toast(L(['Notebook exported as JSON.','手记已导出为 JSON 文件。']));
}
function confirmReset(){showDialog(`${dialogHeader(L(['YOUR BROWSER DATA','当前浏览器数据']))}<h2 class="dialog-title display" id="dialog-title">${L(['START FRESH?','重新开始？'])}</h2><p class="reset-warning">${L(['This removes saved lessons, completion progress, and notes from this browser. Export your notebook first to keep a copy. This cannot be undone here.','这会删除当前浏览器中的课程收藏、完成进度与笔记。请先导出手记备份，此操作无法在这里撤销。'])}</p><div class="dialog-actions"><button class="btn btn-outline" data-act="close">${L(['Keep my notebook','保留我的手记'])}</button><button class="btn btn-primary" data-act="reset">${L(['Reset local data','清除本地数据'])}</button></div>`);}
function validCoffee(v){const n=Number(v);return v!==''&&Number.isFinite(n)&&n>=1&&n<=200;}
function formatNum(n){return Number.isInteger(n)?String(n):n.toFixed(1);}
function updateCalculation(){const input=document.getElementById('coffee-mass'),ratio=document.getElementById('brew-ratio');if(!input||!ratio)return;ui.coffee=input.value;ui.ratio=Number(ratio.value);const valid=validCoffee(ui.coffee);input.setAttribute('aria-invalid',String(!valid));document.getElementById('water-result').textContent=valid?formatNum(Number(ui.coffee)*ui.ratio):'—';document.getElementById('calc-error').textContent=valid?'':L(['Enter a coffee mass from 1 to 200 g.','请输入 1 到 200 克之间的咖啡粉量。']);}
function elapsed(){return timer.elapsed+(timer.running?Date.now()-timer.startedAt:0);}
function timerText(){const seconds=Math.floor(elapsed()/1000);const minutes=Math.floor(seconds/60);return `${String(minutes).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;}
function updateTimer(){const output=document.getElementById('timer-output');if(output)output.textContent=timerText();const button=document.getElementById('timer-toggle');if(button)button.innerHTML=`${icon(timer.running?'pause':'play')}${L(timer.running?['Pause','暂停']:['Start','开始'])}`;}
setInterval(()=>{if(timer.running){const o=document.getElementById('timer-output');if(o)o.textContent=timerText();}},250);
document.addEventListener('click',event=>{
 if(event.target.closest('.skip')){event.preventDefault();document.getElementById('main').focus({preventScroll:true});return;}
 const hashLink=event.target.closest('a[href^="#/"]');
 if(hashLink&&dlg.open)dlg.close();
 const el=event.target.closest('[data-act]');if(!el)return;
 const {act,id,value}=el.dataset;
 if(act==='close'){dlg.close();return;}
 if(act==='tour'){tourDialog();return;}
 if(act==='search'){searchDialog();return;}
 if(act==='menu'){mobileMenu();return;}
 if(act==='finder'){finderDialog();return;}
 if(act==='finder-result'){finderDialog(id);return;}
 if(act==='drink'){drinkDialog(id);return;}
 if(act==='about'){aboutDialog();return;}
 if(act==='sources'){sourcesDialog();return;}
 if(act==='lang'){if(value!==state.lang){state.lang=value==='zh'?'zh':'en';persist();render();document.querySelector(`[data-act="lang"][data-value="${state.lang}"]`)?.focus({preventScroll:true});}return;}
 if(act==='resume'){goLesson(nextLesson());return;}
 if(act==='save'){saveLesson(id);return;}
 if(act==='roast'){if(!roastProfiles[value])return;ui.roast=value;updateInteractive(act,value);return;}
 if(act==='process'){if(!['natural','washed','honey'].includes(value))return;ui.process=value;updateInteractive(act,value);return;}
 if(act==='filter'){if(!['all','black','milk','cold'].includes(value))return;ui.filter=value;updateInteractive(act,value);return;}
 if(act==='saved-tab'){ui.savedTab=value;const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});document.querySelector(`[data-act="saved-tab"][data-value="${value}"]`)?.focus({preventScroll:true});return;}
 if(act==='complete'){
  if(!knownIds.has(id))return;const was=done(id);state.completed=was?state.completed.filter(x=>x!==id):[...state.completed,id];persist();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});document.querySelector('[data-act="complete"]')?.focus({preventScroll:true});toast(L(was?['Marked as not yet explored.','已撤销完成标记。']:['A little more knowledge, poured in. Progress saved.','又注入了一点知识，进度已保存。']));return;
 }
 if(act==='note'){
  if(!knownIds.has(id))return;const input=document.getElementById('lesson-note');const text=(input?.value||'').trim().slice(0,6000);if(text)state.notes[id]=text;else delete state.notes[id];draftNotes[id]=text;persist();toast(L(storageAvailable?(text?['Your note is saved in this browser.','笔记已保存在当前浏览器。']:['The empty note was removed.','空白笔记已移除。']):['Storage blocked. Export your notebook before closing.','浏览器限制储存，请关闭前导出手记。']));return;
 }
 if(act==='quiz'){
  const l=lessonBy(id);if(!l)return;const answer=Number(value);quizAnswers[id]=answer;const host=el.closest('.quiz');host.outerHTML=quizHtml(l);document.querySelector(`[data-act="quiz"][data-value="${answer}"]`)?.focus({preventScroll:true});return;
 }
 if(act==='timer'){
  if(timer.running){timer.elapsed=elapsed();timer.running=false;}else{timer.startedAt=Date.now();timer.running=true;}updateTimer();return;
 }
 if(act==='timer-reset'){timer.running=false;timer.elapsed=0;timer.startedAt=0;updateTimer();return;}
 if(act==='export'){exportNotebook();return;}
 if(act==='reset-confirm'){confirmReset();return;}
 if(act==='reset'){
  const lang=state.lang;state=freshState();state.lang=lang;for(const k of Object.keys(draftNotes))delete draftNotes[k];for(const k of Object.keys(quizAnswers))delete quizAnswers[k];persist();dlg.close();render();toast(L(['Your local notebook has been reset.','本地手记数据已清除。']));return;
 }
});
document.addEventListener('input',event=>{
 if(event.target.id==='guide-search')updateSearch(event.target.value);
 if(event.target.id==='coffee-mass')updateCalculation();
 if(event.target.id==='lesson-note')draftNotes[event.target.dataset.id]=event.target.value;
});
document.addEventListener('change',event=>{if(event.target.id==='brew-ratio')updateCalculation();});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&dlg.open){event.preventDefault();dlg.close();return;}
 const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable;
 if((event.key.toLowerCase()==='k'&&(event.ctrlKey||event.metaKey))||(!typing&&event.key==='/'&&!dlg.open)){event.preventDefault();searchDialog();}
});
dlg.addEventListener('click',event=>{if(event.target===dlg){const r=dlg.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dlg.close();}});
window.addEventListener('hashchange',()=>{if(dlg.open)dlg.close();render(true);});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){state=loadState();render();}});
render();
</script></body></html>
