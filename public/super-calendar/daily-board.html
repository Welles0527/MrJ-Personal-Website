/* The daily view lives within the existing calendar. Keep its terracotta palette local. */
.daily-view-link {
  display: inline-flex; align-items: center; padding: 7px 11px;
  color: inherit; font: inherit; font-size: 13px; white-space: nowrap; text-decoration: none;
}
.daily-view-link:hover { text-decoration: underline; }
:root[data-theme] body.daily-board-page {
  --db-ink: #fff1e3;
  --db-muted: #efcfbd;
  --db-faint: #e1bcaa;
  --db-line: rgb(255 211 190 / 24%);
  --db-key: #571e18;
  --db-accent: #fac0a0;
  --db-corner: 32px;
  --db-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.81' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' opacity='.32' d='M0 0h160v160H0z'/%3E%3C/svg%3E");
  margin: 0; padding: 0; min-height: 100vh; color-scheme: dark; color: var(--db-ink);
  background: radial-gradient(ellipse at 9% 9%, #bb7164 0, transparent 52%),
    radial-gradient(ellipse at 46% 108%, #873d33 0, transparent 64%),
    linear-gradient(108deg, #9b4e43, #743127 55%, #4a180f) #6b2c23;
  font-family: "DM Sans", "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
.daily-board-page::before, .daily-board-page::after { display: none; }
.daily-board-page #app { display: block; width: 100%; min-height: 100vh; padding: 0; }
.db-shell { --text: var(--db-ink); --muted: var(--db-muted); --purple: var(--db-accent); position: relative; isolation: isolate; min-height: 100vh; color: var(--db-ink); line-height: 1.5; }
.db-shell *, .db-shell *::before, .db-shell *::after { box-sizing: border-box; }
.db-shell :is(h1,h2,h3,p,ul,ol,blockquote) { margin: 0; padding: 0; color: inherit; }
.db-shell :is(button,select,a) { font-family: inherit; color: inherit; }
.db-shell a { text-decoration: none; }
:root[data-theme] .db-shell a { color: var(--db-link, var(--db-ink)); }
.db-shell button, .db-shell select { cursor: pointer; }
.db-shell button { appearance: none; border: 0; border-radius: 0; background: transparent; font-size: inherit; padding: 0; }
.db-shell button:disabled { cursor: default; opacity: .55; }
.db-shell :is(button,select,a,summary):focus-visible { outline: 2px solid #fff0be; outline-offset: 3px; }
.db-shell svg { width: 19px; height: 19px; flex: none; vertical-align: middle; }
.db-shell .db-main { width: min(1332px, 91%); max-width: none; min-width: 0; margin: 0 auto; padding: 0 0 40px; background: transparent; color: inherit; }
.db-topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; min-height: 78px; margin-bottom: 13px; }
.db-brand, .db-clock { display: inline-flex; align-items: center; gap: 11px; white-space: nowrap; }
.db-brand { justify-self: start; font-weight: 650; font-size: 16px; }
.db-back-key { display: inline-grid; place-items: center; flex: none; background: var(--db-key); border-radius: 9px; }
.db-back-key { width: 32px; height: 36px; font: 26px/1 "Segoe UI", sans-serif; padding-bottom: 3px; }
.db-brand:hover .db-back-key { background: #ab5040; }
.db-clock { justify-self: end; color: var(--db-muted); gap: 7px; font-size: 12px; }
.db-clock svg { width: 16px; height: 16px; }
.db-clock b { color: var(--db-ink); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 580; }
.db-shell .db-rail { display: inline-flex; align-items: center; justify-content: center; gap: 2px; width: auto; height: auto; padding: 3px; border: 1px solid rgb(255 221 210 / 20%); border-radius: 13px; background: rgb(80 24 17 / 27%); }
.db-rail button { min-width: 49px; min-height: 33px; border-radius: 9px; font-size: 12px; color: #fbe2d7; }
.db-rail button:hover { background: rgb(255 211 190 / 11%); }
.db-rail button[aria-current] { color: #fff8ee; background: #6a281f; box-shadow: inset 0 1px 0 #ffc7af30; font-weight: 650; }
.db-grid { display: grid; grid-template-columns: minmax(0, .84fr) minmax(0, 1.16fr); gap: clamp(16px, 1.7vw, 27px); align-items: stretch; }
.db-cover, .db-console, .db-shelf { position: relative; isolation: isolate; min-width: 0; border-radius: var(--db-corner); box-shadow: 9px 19px 36px -20px #2b080be6, inset 0 1px 0 rgb(255 221 202 / 12%); }
.db-console::before, .db-weather::before, .db-agenda::before, .db-shelf::before {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit;
  background: var(--db-grain) repeat; background-size: 153px; opacity: .22; mix-blend-mode: soft-light;
}
.db-cover { display: grid; grid-template-rows: minmax(275px, 1fr) auto; overflow: hidden; background: linear-gradient(110deg, #9c5040, #763328 77%, #5c2119); }
.db-heading { position: relative; isolation: isolate; display: flex; flex-direction: column; justify-content: space-between; align-items: start; min-width: 0; padding: clamp(23px,2.15vw,35px); }
.db-cover-image, .db-heading::after { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.db-cover-image { z-index: -2; object-fit: cover; object-position: 65% 49%; filter: saturate(.76) brightness(1.06); }
.db-heading::after { content: ""; z-index: -1; background: linear-gradient(90deg, #57221b7d 0%, #6b2b221a 52%, transparent 70%); }
.db-cover-type { position: relative; padding-top: 20px; }
.db-shell .db-heading h1 { font-size: clamp(48px,4.45vw,73px); line-height: 1.01; letter-spacing: -.065em; font-weight: 665; color: #fff5e9; }
.db-heading p { margin-top: 15px; color: #ffe7d7; font-size: 13px; font-weight: 500; }
.db-heading time { display: inline-flex; align-items: center; gap: 9px; }
.db-heading time span { width: 15px; height: 1px; background: currentColor; opacity: .62; }
.db-brief { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 6px; margin-top: 10px; }
.db-shell .db-brief button { display: inline-flex; align-items: baseline; gap: 6px; min-height: 29px; padding: 4px 9px; border: 1px solid #f4c4a94f; border-radius: 7px; background: #51251deb; color: #fff1e3; font-size: 13px; line-height: 1.4; text-align: left; }
.db-brief button:hover { border-color: #edc0a8; }
.db-brief button i { color: #efba98; font: 16px/1 "Segoe UI",sans-serif; }
.db-draw-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.db-panel { scroll-margin-top: 16px; min-width: 0; }
.db-panel-head, .db-week-heading, .db-weather-head, .db-market-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.db-shell .db-panel h2 { display: flex; align-items: center; gap: 9px; color: var(--db-ink); line-height: 1.35; font-size: 19px; font-weight: 650; letter-spacing: -.035em; }
.db-tile { display: inline-grid; place-items: center; color: #ffcdaf; }
.db-tile svg { width: 21px; height: 21px; }
.db-weather { position: relative; isolation: isolate; margin: -2px 0 0 25px; border-radius: 29px 0 0 0; background: linear-gradient(120deg,#773228,#5d221a 95%); padding: 18px clamp(17px,2vw,28px) 17px; }
.db-weather-hero { position: relative; }
.db-weather-head { justify-content: start; gap: 11px; }
.db-shell .db-weather-head h2 { font-size: 17px; }
.db-weather-head > span { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--db-muted); }
.db-weather-head svg { width: 13px; height: 13px; }
.db-weather-reading { display: flex; align-items: center; gap: 14px; margin: 5px 0 11px; }
.db-weather-high { display: inline-flex; align-items: baseline; gap: 5px; }
.db-weather-high strong { font-size: clamp(42px,3.4vw,57px); font-weight: 520; letter-spacing: -.075em; line-height: 1; font-variant-numeric: tabular-nums; }
.db-weather-reading sup { display: inline-block; vertical-align: top; margin-top: 3px; margin-left: 1px; font-size: .52em; line-height: 1; }
.db-weather-low { display: grid; gap: 1px; }
.db-weather-reading b { font-size: 15px; font-weight: 570; }
.db-weather-reading small { font-size: 13px; color: var(--db-muted); }
.db-week { padding-top: 10px; border-top: 1px solid var(--db-line); }
.db-week-heading h3 { font-size: 13px; font-weight: 580; }
.db-week-heading > span, .db-market-meta, .db-chart-day { color: var(--db-muted); font-size: 11px; }
.db-week ol { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); list-style: none; gap: 3px; margin-top: 5px; }
.db-week li { display: grid; justify-items: center; gap: 2px; padding: 5px 0; border-radius: 8px; }
.db-week li.db-today { background: rgb(244 166 135 / 17%); }
.db-week li b { color: var(--db-muted); font-size: 11px; font-weight: 550; }
.db-week-condition { color: #ffece1; font-size: 11px; line-height: 1.25; }
.db-swatch, .db-no-icon { position: relative; isolation: isolate; display: grid; place-items: center; width: 27px; height: 27px; }
.db-swatch::before { content: ""; position: absolute; z-index: -1; width: 19px; height: 21px; transform: rotate(36deg); border-radius: 6px; background: linear-gradient(105deg,#ded5c8,#bdad9e 55%,#897a6d 57%,#c3b5a7); box-shadow: 2px 2px 3px #320e0c4f; }
.db-swatch:is([data-code="0"],[data-code="1"])::before { background: linear-gradient(105deg,#ecd69c,#d9af65 55%,#a57b40 57%,#dcba78); }
.db-swatch[data-code="2"]::before { background: linear-gradient(105deg,#d7cfaf,#c1bb96 55%,#898b72 57%,#b8b497); }
.db-week .weather-icon { width: 16px; height: 16px; opacity: .84; filter: grayscale(1) contrast(1.32); mix-blend-mode: multiply; }
.db-week-temp { white-space: nowrap; font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
.db-week-temp em { font-size: 10px; margin-left: 3px; color: var(--db-muted); font-style: normal; font-weight: 450; }
.db-weather-error { margin-top: 5px !important; color: #ffdfb4; font-size: 12px; }
.db-weather-error button { text-decoration: underline; font-weight: 600; padding: 3px; }
.db-console { display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(115deg,#744035,#603129 46%,#542b24); }
.db-console::before, .db-agenda::before { opacity: .11; }
.db-market { flex: 1 0 auto; padding: 25px clamp(23px,2.45vw,38px) 17px; }

.db-select-wrap { display: inline-flex; align-items: center; position: relative; max-width: 53%; }
.db-select-wrap select { appearance: none; min-width: 0; max-width: 100%; width: 166px; height: 34px; padding: 0 30px 0 12px; border: 1px solid #dfaa935e; border-radius: 9px; background: #6b2e24; color: var(--db-ink); font-size: 12px; font-weight: 550; text-overflow: ellipsis; }
.db-select-wrap select:hover { background: #60251c; }
.db-select-wrap option, .db-select-wrap optgroup { color: #fff2e7; background: #63281f; }
.db-select-wrap > span { position: absolute; right: 11px; top: 3px; pointer-events: none; font-size: 16px; color: var(--db-muted); }
.db-market-value { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin-top: 15px; }
.db-market-value h3 { font-size: 15px; font-weight: 570; }
.db-market-name { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; margin-bottom: 3px; }
.db-session { padding-left: 9px; border-left: 1px solid var(--db-line); color: #f6d8c0; font-size: 13px; line-height: 1.2; font-variant-numeric: tabular-nums; }
:root[data-theme] .db-shell :is(.db-week-heading,.db-market-value) h3 { color: var(--db-ink); }
.db-market-value h3 small { font-weight: 450; font-size: 10px; margin-left: 6px; color: var(--db-muted); letter-spacing: .09em; }
.db-quote { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.db-quote > strong { font-size: clamp(37px,3.4vw,54px); letter-spacing: -.055em; font-weight: 540; line-height: 1.13; font-variant-numeric: tabular-nums; }
.db-change { border-radius: 5px; padding: 2px 7px; font-size: 12px; font-weight: 620; }
.db-change.up { color: #ffcfbc; background: #79352b; }
.db-change.down { color: #e1e9cf; background: #435140; }
.db-change.flat { color: var(--db-ink); background: #714039; }
.db-market .db-refresh { color: var(--db-muted); width: 32px; height: 32px; border: 1px solid #edb49b4d; border-radius: 9px; font: 19px/1 "Segoe UI Symbol",sans-serif; }
.db-refresh:hover { background: #6e3126; }
.db-market-plot { position: relative; margin-top: 5px; padding-bottom: 18px; }
.db-chart { display: flex; align-items: stretch; gap: 9px; width: 100%; height: clamp(82px,7vw,105px); color: #ffdfbd; }
.db-chart.up { color: #ffb09b; }
.db-chart.down { color: #c5d9b0; }
.db-chart-plot { flex: 1; min-width: 0; }
.db-chart-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.db-gridlines { fill: none; stroke: #f4c8ae42; stroke-width: 1; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
.db-chart-line { fill: none; stroke: currentColor; stroke-width: 2.1; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.db-chart-scale { display: flex; flex-direction: column; justify-content: space-between; text-align: right; padding: 3px 0; width: 53px; color: var(--db-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.db-chart-times { display: flex; justify-content: space-between; margin: 1px 61px 0 0; color: var(--db-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.db-chart-day { position: absolute; bottom: 0; left: 0; font-size: 10px; }
.db-chart-empty { display: grid; place-items: center; height: 100px; border-bottom: 1px dashed var(--db-line); color: var(--db-muted); font-size: 13px; }
.db-market-meta { margin-top: 7px; border-top: 1px solid var(--db-line); padding-top: 7px; font-size: 13px; font-variant-numeric: tabular-nums; }
.db-agenda { position: relative; isolation: isolate; display: grid; grid-template-columns: minmax(0,1.38fr) minmax(0,.78fr); gap: clamp(15px,1.6vw,27px); margin-left: 20px; padding: 20px clamp(17px,2vw,30px) 23px; border-radius: 29px 0 0 0; background: linear-gradient(120deg,#592e26,#45231e 92%); }
.db-tasks { padding-left: clamp(12px,1.45vw,25px); border-left: 1px solid var(--db-line); }
.db-task-empty { display: grid; align-content: start; justify-items: start; gap: 8px; min-height: 122px; padding-top: 16px; }
.db-check-ring { display: grid; place-items: center; width: 29px; height: 29px; border: 1px solid #cf957a78; border-radius: 8px; color: #f4c3a5; font: 16px/1 "Segoe UI Symbol",sans-serif; transform: rotate(-4deg); }
.db-task-empty p, .db-task-count { font-size: 13px; color: var(--db-muted); }
.db-task-empty .db-text-button, .db-draw .db-draw-button { border-radius: 8px; background: #a94f3c; color: #fff4e8; font-size: 12px; font-weight: 580; padding: 6px 10px; }
.db-task-empty .db-text-button:hover, .db-draw-button:hover { background: #be614b; }
.db-task-count { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; margin: 12px 0 7px; }
.db-task-count b { font-size: 25px; line-height: 1; color: var(--db-ink); }
.db-task-count span { margin-left: auto; font-size: 11px; }
.db-task-list { max-height: 170px; overflow-y: auto; scrollbar-width: thin; }
.db-task-list li { list-style: none; border-top: 1px solid var(--db-line); }
.db-task-list button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 0; text-align: left; font-size: 13px; }
.db-task-list button i { display: grid; place-items: center; flex: none; width: 14px; height: 14px; border: 1px solid #d09279; border-radius: 4px; color: #fff6e9; font: 10px/1 sans-serif; }
.db-task-list button strong { font-weight: 550; overflow-wrap: anywhere; }
.db-task-list .db-task-next { border-top: 0; border-left: 2px solid #e3a77f; padding-left: 9px; background: linear-gradient(90deg,#e6b28b1a,transparent); }
.db-task-next strong small { display: block; color: #efbf97; font-size: 11px; font-weight: 550; }
.db-task-list button.done strong { color: var(--db-faint); text-decoration: line-through; }
.db-task-list button.done i { background: #836752; }
.db-task-list button span { color: #f4c990; margin-left: auto; }
.db-task-list button:hover strong, .db-match-link:hover strong { text-decoration: underline; }
.db-sport-row { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 8px; padding-top: 11px; align-items: start; }
.db-sport-row + .db-sport-row { margin-top: 10px; border-top: 1px solid var(--db-line); }
.db-sport-type { --db-link: var(--db-muted); display: inline-flex; align-items: center; gap: 6px; width: fit-content; padding: 3px 0; color: var(--db-muted); font-size: 11px; line-height: 1.4; white-space: nowrap; font-weight: 580; }
.db-event { display: grid; text-align: left; overflow-wrap: anywhere; }
.db-event + .db-event { margin-top: 5px; }
.db-event strong { font-size: 15px; font-weight: 600; line-height: 1.4; }
.db-event small, .db-sport-row p { display: block; color: var(--db-muted); font-size: 13px; line-height: 1.45; }
.db-event .db-score-retry { padding: 2px 4px; color: var(--db-accent); text-decoration: underline; }
.db-next-event { border-left: 2px solid #bf886f; padding-left: 7px; }
.db-next-event strong, .db-next-kickoff { color: #ffcfac; font-size: 13px; }
.db-kickoff { margin-right: 3px; color: #ffcfac; font-size: 14px; font-variant-numeric: tabular-nums; }
.db-fixtures + .db-tournament { margin-top: 3px; }
.db-fixtures + .db-tournament strong { font-size: 13px; }
.db-fixtures { list-style: none; max-height: 136px; overflow-y: auto; scrollbar-width: thin; margin-top: 4px !important; }
.db-fixtures li { font-size: 13px; color: #f9e1d4; line-height: 1.45; margin: 3px 0; }
.db-fixtures li small { display: inline; font-size: 13px; white-space: normal; }
.db-fixture-status, .db-fixture-time, .db-score { color: #d5e3bd; font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.db-fixture-status { margin-right: 3px; }
.db-fixture-time { color: #ffcfac; }
.db-more-fixtures summary { width: fit-content; padding: 4px 0; color: #ffcfad; font-size: 12px; font-weight: 580; cursor: pointer; }
.db-more-fixtures:not([open]) summary span:last-child, .db-more-fixtures[open] summary span:first-child { display: none; }

.db-shelf { grid-column: 1 / -1; display: grid; grid-template-columns: 1.24fr 1fr .8fr; align-items: stretch; padding: 13px 0; background: linear-gradient(106deg,#864333,#6e3026 48%,#5b281f); }
.db-shelf > section { position: relative; min-width: 0; padding: 7px clamp(18px,2vw,30px); }
.db-shelf > section + section { border-left: 1px solid var(--db-line); }
.db-shelf .db-verse { display: flex; flex-direction: column; justify-content: center; min-height: 89px; padding-left: clamp(105px,8.7vw,139px); }
.db-card-back { position: absolute; top: 50%; left: clamp(23px,2.3vw,40px); width: 54px; height: 73px; transform: translateY(-50%) rotate(-9deg); border: 1px solid #bc8267; border-radius: 5px; background: #a75a44; box-shadow: 3px 7px 10px #340e0e60; }
.db-card-back::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: translate(7px,1px) rotate(15deg); border: 1px solid #c39174; border-radius: inherit; background: repeating-linear-gradient(35deg,#ab745a 0 3px,#bc8466 3px 5px); }
.db-card-back i { position: absolute; inset: 0; border: 3px solid #bb8566; border-radius: inherit; background: repeating-radial-gradient(ellipse at 50% 100%,transparent 0 5px,#e4ad812c 5.5px 6.5px),linear-gradient(155deg,#a95f44,#6b3428 80%); box-shadow: inset 0 0 0 1px #e7b48d99; }
.db-card-back i::after { content: ""; position: absolute; inset: 7px 9px; border: 1px solid #eec7a8a8; border-radius: 50%; }
.db-card-back span { position: absolute; inset: 0; display: grid; place-items: center; color: #ffe1bf; font-size: 21px; }
.db-draw { margin-top: 10px; }
.db-draw .db-draw-button { display: inline-flex; gap: 10px; padding: 7px 12px; }
.db-verse-revealed { margin-top: 6px; color: var(--db-ink); }
.db-verse-revealed .db-verse-quote { display: none; }
.db-verse-revealed blockquote { font-size: 14px; font-weight: 530; line-height: 1.6; }
.db-verse-revealed p { margin-top: 3px; color: var(--db-muted); font-size: 11px; }
.db-ai, .db-ai-content, .db-food { display: flex; align-items: center; gap: 14px; }
.db-ai > div { width: 100%; }
.db-ai-content > div:nth-child(2), .db-food > div { min-width: 0; }
.db-ai-content p, .db-food p { font-size: 13px; margin-top: 3px; color: var(--db-muted); }
.db-ai-content > div > small { display: block; margin-top: 3px; font-size: 11px; color: var(--db-faint); }
.db-probability { display: grid; place-items: center; position: relative; flex: none; width: 49px; height: 49px; border-radius: 50%; background: conic-gradient(#ffd4a4 var(--db-prob),#a46854 0); box-shadow: inset 0 1px 1px #ffe4ce54, 2px 4px 8px #380f0d44; }
.db-probability::before { content: ""; position: absolute; inset: 5px; border-radius: inherit; background: linear-gradient(135deg,#844936,#653024); box-shadow: inset 1px 1px 3px #4d211e80; }
.db-probability b { position: relative; font-size: 22px; font-weight: 550; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.db-probability small { font-size: 11px; }
.db-leaf { position: relative; display: block; width: 48px; height: 55px; flex: none; }
.db-leaf::before, .db-leaf::after { content: ""; position: absolute; width: 22px; height: 37px; border-radius: 2px 90% 4px 90%; background: linear-gradient(55deg,#8b9272,#adb18d 50%,#626c54 51%,#939774); box-shadow: 2px 4px 6px #33110e75; }
.db-leaf::before { left: 2px; top: 13px; transform: rotate(-14deg); }
.db-leaf::after { left: 23px; top: 1px; transform: rotate(54deg) scale(.9); }
.db-leaf i { position: absolute; left: 24px; bottom: 0; height: 31px; width: 2px; transform: rotate(15deg); background: #c1b491; }
:root[data-theme] body.daily-board-page :is(#detail,#mj-login) {
  --text: #fff4e9; --muted: #f2ceba; --purple: #ffceab; --surface: #63291f; --surface-strong: #713426; --border: #aa735e; --line: #aa735e;
  color-scheme: dark; border: 1px solid #ca93794d; border-radius: 24px;
  background: linear-gradient(135deg,#934b3b,#60261e); color: #fff4e9; box-shadow: 9px 23px 55px #290c0cb3;
}
body.daily-board-page :is(#detail,#mj-login)::backdrop { background: #29100dd1; backdrop-filter: blur(4px); }
body.daily-board-page :is(#detail,#mj-login) :is(h2,h3,label) { color: #fff4e9; }
body.daily-board-page :is(#detail,#mj-login) p { color: #f7dacc; }
body.daily-board-page #detail :is(.dialog-meta,.detail-note) { background: #5f261d; color: #fce5d5; }
body.daily-board-page :is(#detail,#mj-login) button, body.daily-board-page #detail .primary { border-color: #cd947b77; background: #6d3026; color: #fff2e6; }
body.daily-board-page #mj-login input { border-color: #b57f6b; background: #4f241e; color: #fff4e9; }
body.daily-board-page :is(#detail,#mj-login) :is(input,button,a):focus-visible { outline: 2px solid #ffe6bc; outline-offset: 2px; }
body.daily-board-page :is(#detail,#mj-login) :is(.primary,button[type=submit]) { background: #ac553e; color: #fff4e9; }
@media (min-width: 1600px) {
  .db-topbar { min-height: 92px; margin-bottom: 20px; }
  .db-cover { grid-template-rows: minmax(320px,1fr) auto; }
  .db-market { padding-block: 30px 22px; }
  .db-agenda { padding-block: 24px 28px; }
  .db-shelf { padding-block: 16px; }
}
@media (max-width: 1150px) {
  .db-shell .db-main { width: 94%; }
  .db-grid { grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr); gap: 16px; }
  .db-market { padding: 21px 23px 16px; }
  .db-agenda { grid-template-columns: minmax(0,1.28fr) minmax(0,.72fr); margin-left: 13px; gap: 12px; padding-inline: 17px; }
  .db-sport-row { grid-template-columns: minmax(0,1fr); gap: 1px; }
  .db-sport-type { padding-block: 0; }
  .db-shelf > section { padding-inline: 17px; }
  .db-shelf .db-verse { padding-left: 98px; }
  .db-card-back { left: 24px; }
  .db-ai-content, .db-food { gap: 9px; }
  .db-probability { width: 49px; height: 49px; }
}
@media (max-width: 940px) {
  .db-topbar { min-height: 67px; gap: 13px; }
  .db-grid { grid-template-columns: minmax(0,1fr); }
  .db-cover { display: grid; grid-template-columns: .95fr 1.05fr; grid-template-rows: auto; }
  .db-heading { min-height: 268px; padding: 22px; }
  .db-cover-image { object-position: 69% 50%; }
  .db-weather { align-self: stretch; margin: 13px 0 0 -10px; padding: 19px 18px; }
  .db-weather-reading { margin-block: 11px 12px; }
  .db-market { padding: 22px 27px 14px; }
  .db-agenda { grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); margin-left: 18px; gap: 24px; padding: 18px 25px 21px; }
  .db-sport-row { grid-template-columns: 64px minmax(0,1fr); gap: 7px; }
  .db-rail button { min-width: 43px; }
  .db-shelf { grid-template-columns: 1fr 1fr; padding: 0; }
  .db-shelf > section { padding: 17px 20px; }
  .db-shelf .db-verse { min-height: 115px; }
  .db-shelf .db-food { grid-column: 1/-1; border-left: 0; border-top: 1px solid var(--db-line); }
  .db-shelf .db-food .db-leaf { height: 43px; transform: scale(.78); transform-origin: center; }
}
@media (max-width: 620px) {
  :root[data-theme] body.daily-board-page { --db-corner: 25px; }
  .db-shell .db-main { width: calc(100% - 26px); padding-bottom: 24px; }
  .db-topbar { grid-template-columns: 1fr auto; gap: 9px; padding: 12px 2px 0; margin-bottom: 13px; }

  position:absolute; top:0; right:0; z-index:-1; width:auto; max-width:100%; height:100%;

/* The website navigation uses the same typography as the reference labels. */
.brand, .part a { color: inherit; text-decoration: none; }
.part a:focus-visible, .part a:hover { text-decoration: underline; }
.db-file-note, [hidden] { display: none !important; }
.frame .part { flex-grow: var(--weight, 1); }
.board:not([data-editing]) :is(.grip, .resize) { display: none; }
.board:not([data-editing]) .split { cursor: default; }
.frame.is-moving { z-index: 2; outline: 1px solid #ffe1ba; }
.frame.is-target { outline: 2px solid #ffd2a6; }
#notice { max-width: calc(100% - 24px); width: max-content; text-align: center; }

#detail h2, #detail p { margin-bottom: 12px; }
#detail .dialog-close { float: right; }
#detail a { color: inherit; }
#detail .db-fixtures { padding-left: 18px; }
#detail button, #panel button { touch-action: manipulation; }
.stock-name { position: relative; }
.stock-picker { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
.stock-name:focus-within { outline: 1px solid currentColor; outline-offset: 3px; }
button.row { display: flex; width: 100%; border: 0; border-bottom: 1px solid #ffdda824; border-radius: 0; background: transparent; text-align: left; color: inherit; }
button.row:hover, button.row:focus-visible { background: #ffffff0c; }
.market .change.up { color: #ffc5ac; background: #f7b49319; }
.market .chart-message { position: absolute; left: 28px; bottom: 50px; font-size: 13px; }
#board .custom { overflow-wrap: anywhere; }
.market-refresh { border:0; padding:0; background:transparent; line-height:inherit; }

<style>
.db-amber-content { display:contents; }
.db-grid .db-frame .db-pane, .board > .card:not(.frame) { padding-block-start:36px; }
.db-frame .db-cover-type { margin-block:auto; }
/* The pendant cord sits one third of the image width from the right edge. */
.db-frame .db-heading .db-cover-image { transform:translateX(clamp(-36px,calc(33% - var(--cover-link-space,106px)),0px)); }
.db-grid[data-editing] .db-heading { --cover-link-space:132px; }
.db-pane > .db-pane-calendar {
  position:absolute; z-index:1; top:6px; right:16px; display:inline-flex; align-items:center; gap:4px;
  min-height:24px; padding:2px 8px; border:1px solid color-mix(in srgb,currentColor 26%,transparent); border-radius:20px;
  color:inherit; background:color-mix(in srgb,currentColor 6%,transparent); font:500 12px/1.25 system-ui,"Microsoft YaHei",sans-serif;
  text-decoration:none; white-space:nowrap;
}
.db-grid[data-editing] .db-pane:last-of-type > .db-pane-calendar { right:40px; }
.db-pane > .db-pane-calendar:hover, .db-pane > .db-pane-calendar:focus-visible { text-decoration:underline; text-underline-offset:3px; }
.db-pane > .db-pane-calendar:focus-visible { outline:2px solid currentColor; outline-offset:2px; }
#db-tasks .db-todo-link, #db-tasks .db-todo-action { color:inherit; font:inherit; font-size:12px; text-underline-offset:3px; }

#db-tasks .db-todo-row span { min-width:0; overflow-wrap:anywhere; }
#db-tasks .db-todo-row input:checked + span { text-decoration:line-through; opacity:.68; }
#db-tasks .db-todo-note { margin:7px 0; font-size:13px; line-height:1.5; }

.db-sport-type { gap:4px; }

.db-market-divider:focus-visible { outline:1px solid currentColor; outline-offset:-2px; }

.market .db-market-series .line { justify-content:flex-start; align-items:baseline; font-size:13px; line-height:1.3; }
.market .db-market-series .stock-name small,.market .db-market-series .market-refresh small { font-size:10px; }
.market .db-market-series .market-refresh { white-space:nowrap; line-height:1.25; }
.market .db-market-series .change { margin-inline-start:6px; padding:2px 6px; white-space:nowrap; }

.db-watchlist { min-width:0; text-align:end; }

.db-watchlist li { display:flex; justify-content:flex-end; align-items:baseline; gap:5px; padding-block:4px; line-height:1.25; }
.db-watchlist li + li { border-block-start:1px solid color-mix(in srgb,currentColor 12%,transparent); }
.db-watchlist li span { min-width:0; font-size:13px; overflow-wrap:anywhere; }

<script id="daily-board-amber-view">
function sportIcon(sport) {
  return `<svg class="db-sport-icon" aria-hidden="true" focusable="false"><use href="#db-${sport}-icon"/></svg>`;
}
const AmberBoard = (() => {
  const template = document.getElementById('amber-board-template');
  const selector = id => id === 'cover' ? '.hero' : '#db-' + id;
  let chartPoints = [], chartTone = 'down', chartObserver;

  function mount(root) {
    root.append(template.content.cloneNode(true));
    const canvas = root.querySelector('.plot');
    chartObserver = new ResizeObserver(drawChart);
    chartObserver.observe(canvas);
    if (amberSample) return;
    root.querySelector('.stock-picker').hidden = false;
    root.querySelector('[data-content-source]').textContent = '网站数据 · 食品为附件示例';
    const stamp=root.querySelector('[data-market-date]'), refresh=document.createElement('button');
    refresh.type='button'; refresh.className='market-refresh'; refresh.dataset.dailyAction='market-retry'; refresh.title='刷新行情';
    stamp.before(refresh); refresh.append(stamp);
    root.querySelector('.food h2').innerHTML = '<a href="#health">当季食品</a>';
  }

  // The attachment measures its responsive grid before turning the cards into movable frames.
  function naturalLayout(grid, groups, width) {
    const probe = document.createElement('div');
    probe.className = 'board';
    probe.inert = true;
    probe.setAttribute('aria-hidden', 'true');
    Object.assign(probe.style, {position:'absolute', left:'0', top:'0', width:width+'px', visibility:'hidden', pointerEvents:'none'});
    for (const group of groups) {
      const item = group.items[0];
      const original = template.content.querySelector(selector(item.id));
      const card = original ? original.cloneNode(true) : document.createElement('section');
      // Measuring a second grid must not introduce duplicate document IDs.
      card.removeAttribute('id');
      card.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
      if (!original) { card.className = 'card verse'; card.style.height = '180px'; }
      probe.append(card);
    }
    grid.after(probe);
    const unit = probe.clientWidth || 1, view = {};
    Array.from(probe.children).forEach((el, i) => {
      view[groups[i].items[0].id] = {x:el.offsetLeft/unit, y:el.offsetTop, w:el.offsetWidth/unit, h:el.offsetHeight};
    });
    probe.remove();
    return view;
  }

  function drawChart() {
    const canvas = document.querySelector('#app .plot');
    if (!canvas || !canvas.clientWidth || !canvas.clientHeight) return;
    const w = canvas.clientWidth, h = canvas.clientHeight, d = window.devicePixelRatio || 1;
    canvas.width = w*d; canvas.height = h*d;
    const g = canvas.getContext('2d');
    g.scale(d,d);
    g.strokeStyle = '#ffe7cd27';
    for (const y of [.1,.44,.79]) { g.beginPath(); g.moveTo(0,h*y); g.lineTo(w,h*y); g.stroke(); }
    g.beginPath();
    let firstX = 0, lastX = w;
    if (amberSample) {
      const anchors = [.3,.22,.46,.36,.5,.55,.39,.43,.68,.77,.58,.57,.38];
      for (let i=0; i<=180; i++) {
        const p=i/15, j=Math.floor(p);
        const v=anchors[j]+((anchors[j+1]??anchors[j])-anchors[j])*(p-j)+.045*Math.sin(i*1.7)+.028*Math.cos(i*.67);
        g.lineTo(i*w/180, v*h);
      }
    } else {
      if (!chartPoints.length) return;
      const prices=chartPoints.map(p=>p.value), low=Math.min(...prices), high=Math.max(...prices);
      const y = value => high===low ? h/2 : h*(.82-(value-low)/(high-low)*.68);
      firstX=chartPoints[0].slot*w/241; lastX=chartPoints.at(-1).slot*w/241;
      for (const p of chartPoints) g.lineTo(p.slot*w/241, y(p.value));
      if (chartPoints.length===1) { g.moveTo(firstX-1,y(prices[0])); g.lineTo(firstX+1,y(prices[0])); }
    }
    g.strokeStyle=chartTone==='up'?'#f4b79b':'#c6dda8'; g.lineWidth=1.8; g.stroke();
    g.lineTo(lastX,h); g.lineTo(firstX,h); g.closePath();
    g.fillStyle=chartTone==='up'?'#f2b29113':'#bfd6ab13'; g.fill();
  }

  function market({name,code,price,change,session,stamp,tone,points,chartDate,loading,source}) {
    const market=document.querySelector('#db-market');
    market.querySelector('[data-stock-name]').textContent=name;
    market.querySelector('[data-stock-code]').textContent=code;
    market.querySelector('[data-market-date]').textContent=session;
    market.querySelector('.quote').textContent=price;
    const badge=market.querySelector('.change');
    badge.textContent=change.replace(/^-/, '−'); badge.classList.toggle('up',tone==='up'); badge.hidden=!change;
    market.querySelector('.plot').setAttribute('aria-label',name+' '+(chartDate||'')+'分时走势');
    market.title=[stamp,source].filter(Boolean).join(' · ');
    const message=market.querySelector('.chart-message');
    message.hidden=Boolean(points.length); message.textContent=points.length?'':loading?'正在读取分时走势…':'暂无分时数据';
    chartPoints=points; chartTone=tone;
    drawChart();
  }

  function weather(date, entry, weekday, temp) {
    const item = entry?.days.get(date);
    const title = d => d?.label || weatherCodeLabels[d?.code] || '';
    const symbol = d => {
      if (!d) return '—';
      const code=d.code;
      if (code===0) return '☀';
      if (code===1 || code===2) return '⛅';
      if (code<=48) return '☁';
      if (code>=95) return '⛈';
      if ((code>=71 && code<=77) || code===85 || code===86) return '❄';
      return '☂';
    };
    const days=Array.from({length:7}, (_,i)=>{
      const key=weatherDateOffset(date,i), d=entry?.days.get(key);
      const range=d ? temp(d.high).replace(/°$/,'')+'/'+temp(d.low) : '—';
      return `<span title="${esc(title(d))}">${i?'周'+weekday(key):'今天'}<b>${symbol(d)}</b>${esc(range)}</span>`;
    }).join('');
    return `<h2><a href="#travel">${esc(weatherCity)} · 今日天气</a></h2><div class="conditions"><div class="dial"><span class="temp">${temp(item?.high)}</span></div><div>${esc(title(item)||'暂无预报')}<small>最高 ${temp(item?.high)} · 最低 ${temp(item?.low)}</small></div></div><div class="days">${days}</div>`;
  }

  function sports(date,cue,games,formatTime,shortDate) {
    const fixture=cue?.matches[0], current=cue?.events[0];
    const next=!fixture && (!current || cue.next?.event.id===current.id) ? cue?.next : null;
    const event=fixture?.event||next?.event||current;
    const first=fixture?formatTime.format(new Date(fixture.match.startsAt)):next?shortDate(next.date):'—';
    const cueRow=`<button class="row" type="button" data-cue-detail>${sportIcon('snooker')}<span class="db-event-copy${next?.date>date?' db-upcoming':''}"><time>${esc(first)}</time><span>${esc(event?'斯诺克 · '+event.name:'斯诺克 · 暂无赛程')}</span></span></button>`;
    const game=games[0];

function publicRequest(url, options) {
  if (!navigator.onLine) return Promise.reject(new Error('已离线'));
  return fetch(new URL(url, siteOrigin), {...options, credentials:'omit'});
}

function savedQuote(request) {
  const query = new URLSearchParams('dashboard=' + request);
  if (query.get('dashboard') === 'quotes') return fileData.market.quotes;
  return fileData.market[query.has('index') ? 'index' : query.get('code')];
}

function ensureTravelWeather(date) {
  today = date;
  const key = weatherCity + '|week|' + date;
  const previous = weatherCache.get(key);
  if (previous && Date.now() - previous.fetchedAt < 30 * 60000) return;
  const entry = {days:previous?.days || new Map(Object.entries(fileData.weather.days)), source:weatherSource, saved:previous?.saved ?? true, status:'ready', fetchedAt:Date.now()};
  weatherCache.set(key, entry);
  if (!navigator.onLine) return;
  publicRequest('/api/moji-weather?city='+encodeURIComponent(weatherCity), {cache:'no-store', signal:AbortSignal.timeout(12000)})
    .then(async response => {
      if (!response.ok) throw Error('天气更新失败');
      const data = await response.json();
      if (data.source !== weatherSource || !Array.isArray(data.days)) throw Error('天气格式异常');
      const days = data.days.filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d.date) && Object.hasOwn(weatherCodeLabels,d.code));
      if (!days.some(d => d.date===date)) throw Error('暂无当日天气');
      entry.days = new Map(days.map(d=>[d.date,d]));
      entry.saved = false;
    })
    .catch(() => {entry.error = !entry.days.has(date);})
    .finally(() => {if (weatherCache.get(key)===entry) window.DailyBoard.mount();});
}

async function refreshPublicCalendars() {
  if (!navigator.onLine) return;
  const sources = [

    [siteOrigin + '/officialwebsite/super-calendar/football-latest.json', value => {

    }]
  ];
  await Promise.allSettled(sources.map(async ([url,apply]) => {
    const response = await publicRequest(url,{cache:'no-store',signal:AbortSignal.timeout(10000)});
    if (response.ok) {apply(await response.json());window.DailyBoard.mount();}
  }));
}

  function getMarketData(key, request, refresh) {
    let record = marketData.get(key);
    if (!record) { record = { value: savedQuote(request), saved: true }; marketData.set(key, record); }
    if (record.loading || (record.at && !refresh)) return record;
    if (!navigator.onLine) { record.at = Date.now(); return record; }
    record.loading = true;
    publicRequest(marketApi + request, { signal: AbortSignal.timeout(20000), cache: 'no-store' })
      .then(async response => { if (!response.ok) throw Error(); return response.json(); })
      .then(value => {
        if (request.startsWith('quotes') ? !value.index || !Array.isArray(value.stocks) : !Array.isArray(value.labels) || !Array.isArray(value.series)) throw Error();
        record.value = value;
        record.saved = false;
        record.error = false;
      })
      .catch(() => { record.error = true; })
      .finally(() => {
        record.at = Date.now();
        record.loading = false;
        if (active() && marketData.get(key) === record) renderMarket();
      });
    return record;
  }

  function tradingSlot(label) {
    const minutes = Number(label.slice(11, 13)) * 60 + Number(label.slice(14, 16));
    if (minutes >= 570 && minutes <= 690) return minutes - 570;
    if (minutes >= 780 && minutes <= 900) return minutes - 659;
    return -1;
  }

  function chartPointsFor(record) {
    const chart = record.value;
    const lastLabel = chart?.labels.findLast(label => typeof label === 'string' && /^\d{4}-\d\d-\d\d \d\d:\d\d/.test(label));
    const chartDate = lastLabel?.slice(0, 10);
    const points = [];
    chart?.labels.forEach((label, i) => {
      if (typeof label !== 'string' || !label.startsWith(chartDate + ' ') || !Number.isFinite(chart.series[i])) return;
      const slot = tradingSlot(label);
      if (slot >= 0) points.push({ slot, value: chart.series[i] });
    });
    return {points,chartDate};
  }

  function chartMarkup(record, name, tone) {
    const {points,chartDate}=chartPointsFor(record);
    if (!points.length) return `<div class="db-chart-empty">${record.loading ? '正在读取分时走势…' : '暂无可用分时走势'}</div>`;
    const values = points.map(p => p.value);
    const low = Math.min(...values), high = Math.max(...values);
    const y = value => high === low ? 40 : 72 - (value - low) / (high - low) * 62;
    const coords = points.map(p => `${(p.slot / 241 * 500).toFixed(2)},${y(p.value).toFixed(2)}`);
    const last = coords.at(-1).split(',');
    const firstX = coords[0].split(',')[0];
    return `<div class="db-chart ${tone}" role="img" aria-label="${esc(name)} ${esc(chartDate)}分时走势，最低${price(low)}，最高${price(high)}">
      <div class="db-chart-plot"><svg viewBox="0 0 500 80" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="db-chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="currentColor" stop-opacity=".19"/><stop offset="100%" stop-color="currentColor" stop-opacity=".015"/></linearGradient></defs>
        <path d="M0 11H500 M0 41H500 M0 72H500" class="db-gridlines"/>
        <polygon points="${firstX},80 ${coords.join(' ')} ${last[0]},80" fill="url(#db-chart-fill)" stroke="none"/>
        <polyline points="${coords.join(' ')}" class="db-chart-line"/></svg></div>
      <div class="db-chart-scale"><span>${price(high)}</span><span>${price(low)}</span></div></div>
      <div class="db-chart-times"><span>09:30</span><span>11:30 / 13:00</span><span>15:00</span></div>
      <span class="db-chart-day">分时 · ${esc(chartDate)}</span>`;
  }

  function marketStatus(date, time, quoteDay, quoteTime) {
    const last = quoteDay ? shortDate(quoteDay) + (quoteTime >= '15:00' ? '收盘' : ' ' + quoteTime + ' 报价') : '';
    if (marketClosed(date)) return last ? '休市 · ' + last : '休市';

    if (!quoteDay) return '等待报价';

    if (time < '09:25') return '开盘集合竞价';
    if (time < '09:30') return '等待开盘';
    if (time >= '11:30' && time < '13:00') return '午间休市';
    if (time >= '15:00') return quoteTime >= '15:00' ? '已收盘 · ' + shortDate(date) : '已收盘 · 等待收盘报价';
    return time >= '14:57' ? '收盘集合竞价' : '交易时段';

  function taskState(uid) {
    const day = currentDay(), midnight = Date.parse(day + 'T00:00:00Z');
    // Imported ISO timestamps can carry an offset. Query adjacent date prefixes, then compare instants in Shanghai.
    const prefix = offset => new Date(midnight + offset * 86400000).toISOString().slice(0,10);
    const queries = [{ filter:{date:day}, watcher:null }, { filter:{from:prefix(-1), until:prefix(2)}, watcher:null }];
    return { uid, day, queries, items:null, pending:new Map(), timer:0, read:0, loadError:false, saveError:'' };
  }

  function closeTaskWatch(query) {
    if (query.watcher) void Promise.resolve(query.watcher.close()).catch(()=>{});
    query.watcher = null;
  }
  async function refreshTasks(s = tasks) {
    if (!s.uid || s !== tasks) return;
    const read = ++s.read, api = window.MagicJDailyBoardAccount?.todos;
    try {
      const lists = await Promise.all(s.queries.map(query => api.load(s.uid, query.filter)));
      if (s !== tasks || read !== s.read) return;
      const unique = new Map();
      for (const {todos} of lists) {
        for (const todo of todos) {
          const saved = unique.get(todo.id);
          const versionChange = (todo.syncVersion || 0) - (saved?.syncVersion || 0);
          if (!saved || versionChange > 0 || (versionChange === 0 && Date.parse(todo.updatedAt) > Date.parse(saved.updatedAt))) {
            unique.set(todo.id, todo);
          }
        }
      }
      const order = todo => todo.date === s.day && typeof todo.sortOrder === 'number' ? todo.sortOrder : Date.parse(todo.createdAt) || 0;
      s.items = [...unique.values()].filter(todo => {
        const created = Date.parse(todo.createdAt);
        return !todo.deletedAt && !(todo.placement === 'weekly' && !todo.date)
          && (todo.date === s.day || (Number.isFinite(created) && dayFormat.format(created) === s.day));
      }).sort((a,b) => Number(b.date === s.day) - Number(a.date === s.day) || order(a) - order(b)
        || String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || a.id.localeCompare(b.id));
      s.loadError = false;
      s.queries.forEach((query, index) => {
        const count = lists[index].todos.length;
        if (query.watcher && count >= query.watcher.capacity) closeTaskWatch(query);
        if (query.watcher) return;
        query.watcher = api.watch(s.uid, count+1, () => {
          clearTimeout(s.timer);
          s.timer = setTimeout(()=>refreshTasks(s),150);
        }, () => { if (s === tasks) closeTaskWatch(query); }, query.filter);
      });
    } catch {
      if (s !== tasks || read !== s.read) return;
      s.loadError = true;
    }
    renderTasks();
  }
  function setTodoOwner(uid) {
    if (tasks.uid === uid && tasks.day === currentDay()) return;
    clearTimeout(tasks.timer);
    tasks.queries.forEach(closeTaskWatch);
    tasks = taskState(uid);
    renderTasks();
    void refreshTasks();
  }
  async function toggleTodo(input) {
    setTodoOwner(tasks.uid);
    const s = tasks, todo = s.items?.find(item => item.id === input.dataset.boardTodo);
    if (!todo || s.pending.has(todo.id)) return;
    const completed = input.checked, hadFocus = document.activeElement === input;
    s.pending.set(todo.id, completed);
    s.saveError = '';
    renderTasks();
    try {
      const saved = await window.MagicJDailyBoardAccount.todos.setCompleted(s.uid, todo, completed);
      if (tasks === s) s.items = s.items.map(item => item.id === saved.id ? saved : item);
    } catch {
      s.saveError = '未能确认勾选状态，请核对后再试。';
    } finally {
      if (tasks === s) {
        s.pending.delete(todo.id);
        renderTasks();
        if (hadFocus && document.activeElement === document.body) {
          board()?.querySelector('[data-board-todo="'+CSS.escape(todo.id)+'"]')?.focus({preventScroll:true});
        }
        void refreshTasks(s);
      }
    }
  }
  function resumeTasks() {
    if (tasks.day !== currentDay()) setTodoOwner(tasks.uid);
    else void refreshTasks();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeTasks(); });
  window.addEventListener('online', resumeTasks);

  function scoreScript(url) {
    if (!scoreScripts.has(url)) {
      scoreScripts.set(url, new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = new URL(url, calendarUrl).href;
        const fail = () => {
          clearTimeout(timer);
          scoreScripts.delete(url);
          script.remove();
          reject(new Error('斯诺克赛程组件暂不可用'));
        };
        const timer = setTimeout(fail, 20000);
        script.onload = () => { clearTimeout(timer); resolve(); };
        script.onerror = fail;
        document.head.append(script);
      }));
    }
    return scoreScripts.get(url);
  }

  function refreshSports() {
    if (!active()) return;
    const date = currentDay(), cue = cueAgenda(date), games = footballAgenda(date);
    updatePart('sports', amberBoard ? AmberBoard.sports(date,cue,games,clockFormat,shortDate) : sportsMarkup(date,cue,games));
    updatePart('brief-sports', esc(sportsBrief(date, cue, games)));
  }

  async function loadScores(date) {
    if (!navigator.onLine) { scoreDay = date; return; }
    if (fetchingScores || (scoreDay === date && (!scoreUpdated || Date.now() - scoreUpdated < 300000))) return;
    fetchingScores = true;
    scoreDay = date;
    scoreUpdated = 0;
    refreshSports();
    // The sports calendar's static schedule works while its shared live reader is loading.
    if (!window.CUE_LIVE_SCORES) scoreScript('../snooker-calendar/live-scores.js').then(refreshSports, refreshSports);
    try {
      const loaders = [];
      if (!window.cloudbase?.init) loaders.push(scoreScript('https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js'));
      if (!window.CUE_LOAD_CLOUD_SCORES) loaders.push(scoreScript('../snooker-calendar/cloud-live-scores.js'));
      await Promise.all(loaders);
      if (!active()) { scoreDay = ''; return; }
      const snapshot = await window.CUE_LOAD_CLOUD_SCORES();
      if (snapshot?.events) { cloudScores = snapshot.events; scoreUpdated = Date.now(); }
    } catch { /* The public calendar snapshot remains available if live scores are offline. */ }
    finally { fetchingScores = false; refreshSports(); }
  }

  function countdown(start, date) {
    return `还有 ${dayNumber(start) - dayNumber(date)} 天`;
  }

  function cueFixture({ match, stale }) {
    const round = (match.round || '').replace(/^Round (\d+)( \(Held Over\))?$/i, '第 $1 轮')
      .replace(/^semi[- ]finals?$/i, '半决赛').replace(/^quarter[- ]finals?$/i, '四分之一决赛').replace(/^final$/i, '决赛');
    const underway = ['live', 'ended', 'suspended'].includes(match.status) || match.homeScore > 0 || match.awayScore > 0;
    const score = underway && Number.isInteger(match.homeScore) && Number.isInteger(match.awayScore) ? `<b class="db-score">${match.homeScore}–${match.awayScore}</b>` : 'vs';
    const status = { live: stale ? '上次比分' : '进行中', ended: '已结束', suspended: '暂停' }[match.status];
    const time = clockFormat.format(new Date(match.startsAt));
    const lead = status ? `<b class="db-fixture-status">${status}</b>` : `<b class="db-fixture-time">${time}</b>`;
    const detail = [status ? time : '', round].filter(Boolean).join(' · ');
    return `${lead} ${esc(match.home)} ${score} ${esc(match.away)}${detail ? ` <small>${esc(detail)}</small>` : ''}`;
  }

  function cueAgenda(date) {
    const schedule = window.CUE_TOURNAMENTS;
    if (!Array.isArray(schedule)) return null;
    const tournaments = [...schedule].sort((a, b) => a.start.localeCompare(b.start));
    const current = tournaments.filter(event => event.start <= date && date <= event.end);
    const fixtures = tournaments.flatMap(event => {
      const cached = window.CUE_LIVE_SCORES?.events?.[event.id], live = cloudScores?.[event.id];
      const available = live && (!cached || Date.parse(live.fetchedAt) >= Date.parse(cached.fetchedAt)) ? live : cached;
      const fetched = Date.parse(available?.fetchedAt);
      const stale = !Number.isFinite(fetched) || Date.now() - fetched > 30 * 60000;
      return (available?.matches || [])
      .filter(m => !['cancelled', 'postponed'].includes(m.status) && Number.isFinite(Date.parse(m.startsAt)))
      .map(match => ({ event, match, stale, date: dayFormat.format(new Date(match.startsAt)) }));
    })
      .sort((a, b) => Date.parse(a.match.startsAt) - Date.parse(b.match.startsAt));
    const order = f => f.match.status === 'live' ? Number(f.stale) : f.match.status === 'ended' ? 3 : 2;
    const matches = fixtures.filter(f => f.date === date).sort((a, b) => order(a) - order(b));
    const events = [...new Set([...matches.map(f => f.event), ...current])];
    const nextMatch = fixtures.find(f => f.date > date);
    const upcoming = tournaments.find(event => event.start > date);
    const next = nextMatch && (!upcoming || nextMatch.date <= upcoming.start) ? nextMatch
      : upcoming ? { event: upcoming, date: upcoming.start } : null;
    return { events, matches, next };
  }

  function cueMarkup(date, cue) {
    if (!cue) return '<p>斯诺克赛程暂未载入</p>';
    const rows = cue.events.map(event => {
      const matches = cue.matches.filter(f => f.event === event);
      const location = [event.city, event.venue].filter(Boolean).join(' · ');
      const details = matches.map(f => `<li>${cueFixture(f)}</li>`);
      const extra = details.length > 2 ? `<details class="db-more-fixtures" data-cue-more="${esc(event.id)}"><summary><span>展开其余 ${details.length - 2} 场</span><span>收起对阵</span></summary><ul class="db-fixtures">${details.slice(2).join('')}</ul></details>` : '';
      const pending = fetchingScores || !scoreDay ? '正在读取今日对阵…' : scoreUpdated ? '今日对阵待收录' : '今日对阵未能更新 <button type="button" class="db-score-retry" data-daily-action="scores-retry">重试</button>';
      const info = `<div class="db-tournament"><strong>${esc(event.name)}</strong><small>${shortDate(event.start)}–${shortDate(event.end)}${location ? ' · ' + esc(location) : ''}</small></div>`;
      const fixtures = matches.length ? `<ul class="db-fixtures">${details.slice(0, 2).join('')}</ul>` : `<small>赛事进行中 · ${pending}</small>`;
      return `<div class="db-event">${matches[0]?.match.status === 'live' ? fixtures + info : info + fixtures}${extra}</div>`;
    });
    if (!cue.matches.length && cue.next) {
      const next = cue.next;
      rows.push(`<div class="db-event db-next-event db-upcoming"><strong>${next.match ? '下一场' : '下一项赛事'} ${shortDate(next.date)} · ${countdown(next.date, date)}</strong><small>${esc(next.event.name)}</small>${next.match ? `<div>${cueFixture(next)}</div>` : ''}</div>`);
    }
    return rows.join('') || '<p>今日无比赛，后续赛程待公布</p>';
  }

  function footballAgenda(date) {
    const ordered = [...footballMatches].sort((a, b) => a.start.localeCompare(b.start) || (a.time || '').localeCompare(b.time || ''));
    const todayGames = ordered.filter(m => m.start === date);
    return todayGames.length ? todayGames : ordered.filter(m => m.start > date).slice(0, 1);
  }

  function footballMarkup(date, games) {
    if (!games.length) return '<p>今日无比赛，后续赛程待公布</p>';
    return games.map(m => {
      const versus = m.venue === 'A' ? `${m.opponent} vs 巴萨` : `巴萨 vs ${m.opponent}`;
      const time = m.time || (m.dateTentative ? '日期暂定' : '时间待定');
      const next = m.start !== date ? `<span class="db-next-kickoff">下一场 ${shortDate(m.start)} · ${countdown(m.start, date)}</span>` : '';
      const info = [footballCompetitions[m.competition]?.label, m.time ? '北京时间' : '', Array.isArray(m.score) ? '赛果 ' + m.score.join('–') : ''];
      return `<button type="button" class="db-event db-match-link${m.start>date?' db-upcoming':''}" data-daily-football="${esc(m.id)}">${next}<strong><b class="db-kickoff">${esc(time)}</b> ${esc(versus)}</strong><small>${esc(info.filter(Boolean).join(' · '))}</small></button>`;
    }).join('');
  }

  function sportsBrief(date, cue, games) {
    const game = games.find(m => m.start === date && !Array.isArray(m.score)) || games[0];
    if (game?.start === date) {
      if (Array.isArray(game.score)) return '巴萨赛果已出';
      if (!game.time) return game.dateTentative ? '巴萨赛期待定' : '巴萨开球时间待定';
      return game.time + (game.time > clockFormat.format(new Date()) ? ' 巴萨开赛' : ' 巴萨赛况');
    }
    const live = cue?.matches.filter(f => f.match.status === 'live' && !f.stale).length;
    if (live) return `斯诺克 ${live} 场进行中`;
    if (cue?.matches.length) return `今日斯诺克 ${cue.matches.length} 场`;
    if (cue?.events.length) return '今日斯诺克赛程';
    if (game && (!cue?.next || game.start <= cue.next.date)) return shortDate(game.start) + ' 巴萨比赛';
    return cue?.next ? shortDate(cue.next.date) + ' 斯诺克' : '查看今日赛事';
  }

  function sportsMarkup(date, cue, games) {
    const nextCue=!cue?.events.length && cue?.next?.date>date, nextFootball=games[0]?.start>date;
    return `<div class="db-sport-row"><a class="db-sport-type cue" href="${esc(snookerOverviewUrl)}" title="查看斯诺克完整赛程">${sportIcon('snooker')}<span${nextCue?' class="db-upcoming"':''}>斯诺克</span></a><div>${cueMarkup(date, cue)}</div></div>
      <div class="db-sport-row"><span class="db-sport-type football">${sportIcon('football')}<span${nextFootball?' class="db-upcoming"':''}>足球</span></span><div>${footballMarkup(date, games)}</div></div>`;
  }

  function verseMarkup(date) {
    const [ref, verse] = verses[dayNumber(date) % verses.length];
    if (amberBoard) return '<h2>今日抽卡</h2>'+(drawnOn===date
      ? `<blockquote>${esc(verse)}</blockquote><small>${esc(ref)} · 和合本</small>`
      : '<button type="button" data-daily-action="draw">抽取今日经文</button>');
    if (drawnOn === date) return `<div class="db-verse-revealed"><span class="db-verse-quote" aria-hidden="true">“</span><blockquote>${verse}</blockquote><p>${ref} · 和合本</p></div>`;
    return `<div class="db-draw"><button type="button" class="db-draw-button" data-daily-action="draw">抽取今日经文 <span aria-hidden="true">↗</span></button></div>`;
  }

  function aiMarkup() {
    const value = codexSnapshot?.probability48h;
    const valid = Number.isFinite(value) && value >= 0 && value <= 100;
    const updated = Date.parse(codexSnapshot?.sourceUpdatedAt);
    const old = Number.isFinite(updated) && Date.now() - updated > 36 * 3600000;
    const updateDate = Number.isFinite(updated) ? `${dayFormat.format(updated)} ${clockFormat.format(updated)}` : '';
    if (amberBoard) return `<h2><a href="#ai">AI 重置概率</a></h2><div class="row" title="${esc(updateDate?(old?'历史快照':'来源更新')+' · '+updateDate:'等待读取概率快照')}"><span class="ring">${valid?value+'%':'—'}</span><small>Codex<br>未来 48 小时</small></div>`;
    return `<div class="db-ai-content"><div class="db-probability" style="--db-prob:${valid ? value : 0}%"><b>${valid ? esc(value) + '<small>%</small>' : '—'}</b></div>
      <div><h2>AI 重置概率</h2><p>Codex · 未来 48 小时</p><small>${updateDate ? `${old ? '历史快照' : '来源更新'} · ${updateDate}` : '等待读取概率快照'}</small></div>
      </div>`;
  }

  function bindBoard(root) {
    root.addEventListener('change', event => {
      if (event.target.matches('[data-board-todo]')) { void toggleTodo(event.target); return; }
      if (event.target.id !== 'db-stock') return;
      selected = watchlist.includes(event.target.value) ? event.target.value : 'index';
      renderMarket();
    });
    root.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      const jump = button.dataset.jump || button.dataset.summaryTo;
      if (jump) {
        const target = root.querySelector('#db-' + jump);
        if (button.dataset.summaryTo && target) {
          target.tabIndex = -1;
          target.focus({ preventScroll: true });
        }
        target?.scrollIntoView({ block: 'start', behavior: 'instant' });
        root.querySelector('.db-rail [aria-current]')?.removeAttribute('aria-current');
        root.querySelector(`.db-rail [data-jump="${jump}"]`)?.setAttribute('aria-current', 'true');
      }

      if (button.hasAttribute('data-cue-detail')) {
        const dialog = document.querySelector('#detail'), date = currentDay();
        dialog.innerHTML = '<h2>斯诺克赛程</h2>'+cueMarkup(date,cueAgenda(date))+'<p><a href="'+esc(snookerOverviewUrl)+'">打开斯诺克日历 ↗</a></p><button type="button" data-close>关闭</button>';
        dialog.querySelector('[data-close]').onclick=()=>dialog.close();
        const retry=dialog.querySelector('[data-daily-action="scores-retry"]');
        if (retry) retry.onclick=()=>{dialog.close();scoreDay='';loadScores(date);};
        dialog.showModal();
      }
      if (button.dataset.dailyFootball) footballDetail(button.dataset.dailyFootball);
      switch (button.dataset.dailyAction) {
        case 'todos-retry': void refreshTasks(); break;
        case 'todo-login': root.querySelector('#account,[data-site-auth-login]')?.click(); break;
        case 'draw':
          drawnOn = currentDay();
          try { localStorage.setItem('super-calendar-verse-drawn', drawnOn); } catch {}
          updatePart('verse', verseMarkup(drawnOn));
          break;
        case 'market-retry': renderMarket(true); window.InvestmentCalendar?.refresh(true); break;

        case 'scores-retry': scoreDay = ''; loadScores(currentDay()); break;
        case 'weather-retry':
          weatherCache.delete(`${weatherCity}|week|${currentDay()}`);
          mount();
          break;
      }
    });
  }

  function mount() {
    if (!board()) {
      document.title = amberBoard ? '琥珀玻璃 · 超级日历' : '超级日历';
      document.querySelector('meta[name="theme-color"]').content = amberBoard ? '#39241f' : '#702d24';
      if (amberBoard) AmberBoard.mount(document.getElementById('app'));
      else document.getElementById('app').innerHTML = shell();
      if (active()) {
        const market=board().querySelector('#db-market'), chartContents=[...market.children].slice(1);
        market.firstElementChild.insertAdjacentHTML('afterend', `<div class="db-market-split">
          <div class="db-market-main"><div class="db-market-series" id="db-market-series"></div>
            <ul class="db-invest-events" data-part="investment" aria-label="投资日历事项" hidden></ul></div>
          <div class="db-market-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="调整走势图和自选股宽度" aria-controls="db-market-series" aria-valuenow="60"></div>
          <aside class="db-watchlist" id="db-watchlist" aria-label="自选股涨跌"><ul data-part="watchlist" aria-label="自选股涨跌幅"></ul><small data-watch-note hidden></small></aside></div>`);
        const series = market.querySelector('.db-market-series');
        series.append(...chartContents);
        series.querySelector('.quote')?.after(document.createElement('wbr'));
        const title = market.querySelector('h2'), heading = document.createElement('div');
        heading.className = 'db-market-heading';
        title.before(heading);
        heading.append(title);
        heading.insertAdjacentHTML('beforeend', `<button type="button" class="db-watch-toggle" aria-expanded="true" aria-controls="db-watchlist" aria-label="收起自选股涨跌">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18"/>
            <path class="door-open" d="M6 20V4l8-2v20l-8-2ZM14 4h4v17M11 11.5v1.5"/>
            <path class="door-closed" d="M6 21V4h12v17M14 12h.8"/>
          </svg></button>`);
      }
      board().querySelector('.db-heading').prepend(document.getElementById('daily-board-cover').content.cloneNode(true));
      bindBoard(board());
      linkCalendarPages(board());
      renderTasks();
    }
    const date = currentDay();
    board().dataset.day = date;
    board().querySelector('[data-clock]').textContent = clockFormat.format(new Date());
    setTodoOwner(tasks.uid);
    if (amberSample) return;
    if (amberBoard) updatePart('date', '<a href="#home?view=month" title="查看月历">'+shortDate(date)+' · 星期'+weekday(date)+'</a>');
    else updatePart('date', `<time datetime="${date}">${date.slice(0, 4)} 年 ${shortDate(date)}<span></span>星期${weekday(date)}</time>`);
    ensureTravelWeather(date);
    updatePart('weather', amberBoard ? AmberBoard.weather(date,weatherCache.get(weatherCity+'|week|'+date),weekday,temp) : weatherMarkup(date));
    renderMarket();
    refreshSports();
    updatePart('verse', verseMarkup(date));
    updatePart('ai', aiMarkup());
    loadScores(date);
  }

  setInterval(() => {
    if (document.hidden || !board()) return;
    if (tasks.day !== currentDay() || (tasks.uid && tasks.queries.some(query => !query.watcher))) resumeTasks();
    if (amberSample) { board().querySelector('[data-clock]').textContent=clockFormat.format(new Date()); return; }
    const now = new Date(), date = currentDay(), time = clockFormat.format(now);
    if (board().dataset.day !== date) { mount(); return; }
    const clock = board().querySelector('[data-clock]'), minuteChanged = clock.textContent !== time;
    clock.textContent = time;
    ensureTravelWeather(date);
    loadScores(date);
    const session = !marketClosed(date) && ((time >= '09:15' && time <= '11:30') || (time >= '13:00' && time <= '15:01'));
    const quotes = marketData.get(`quotes|${watchlist.slice(0,200).join(',')}`);
    const refresh = Boolean(session && quotes && !quotes.error && Date.now() - quotes.at >= 60000);
    if (refresh || minuteChanged) renderMarket(refresh);
    if (minuteChanged) refreshSports();
  }, amberSample?10000:30000);
  window.addEventListener('storage', event => {
    if (!active()) return;
    if (event.key === 'super-calendar-verse-drawn') drawnOn = event.newValue || '';
    mount();
  });
  for (const event of ['investment-calendar-update','stock-preferences-cloud-change']) {
    window.addEventListener(event, () => { if (active()) renderMarket(); });
  }
  window.DailyBoard = { active, mount, setTodoOwner };
})();
</script>
<script>if (hosted) {
"use strict";

(function createAccountScopedPositionStorage() {
  const SESSION_KEY = "mywebsite.site-auth-session.v1";
  const STORAGE_PREFIX = "a-share-stock-tracking.position.v1";
  const WATCHLIST_PREFIX = "a-share-stock-tracking.watchlist.v1";
  let cloudWriteQueue = Promise.resolve();
  let cloudWatcher = null;
  let observedAccountKey = "";
  let accountGeneration = 0;
  let writeRevision = 0;
  const pendingWrites = new Map();
  const localWriteRevisions = new Map();
  let syncStatus = { mode: "local", updatedAt: null, error: "", requiresLogin: false };

  function readJson(key) {
    try {
      return JSON.parse(window.localStorage.getItem(key) || "null");
    } catch {
      return null;
    }
  }

  function firstValue(source, keys) {
    if (!source || typeof source !== "object") return "";
    for (const key of keys) {
      const value = source[key];
      if (typeof value === "string" && value.trim()) return value.trim();
      if (typeof value === "number") return String(value);
    }
    return "";
  }

  function hash(value) {
    let result = 2166136261;
    for (let index = 0; index < value.length; index += 1) {
      result ^= value.charCodeAt(index);
      result = Math.imul(result, 16777619);
    }
    return (result >>> 0).toString(36);
  }

  function getAccount() {
    const session = readJson(SESSION_KEY);
    if (typeof session?.expiresAt === "number" && session.expiresAt <= Date.now()) {
      return observeAccount({ key: "guest", label: "访客", signedIn: false });
    }
    const candidates = [
      session,
      session?.user,
      session?.account,
      session?.profile,
      session?.auth?.user
    ];
    const idKeys = ["uid", "userId", "accountId", "openid", "account", "email", "phone"];
    const labelKeys = ["displayName", "nickname", "name", "account", "email", "phone"];
    const id = candidates.map(candidate => firstValue(candidate, idKeys)).find(Boolean);
    const label = candidates.map(candidate => firstValue(candidate, labelKeys)).find(Boolean);

    if (!id) {
      return observeAccount({ key: "guest", label: "访客", signedIn: false });
    }
    return observeAccount({
      key: `account-${hash(id)}`,
      label: label || "已登录账号",
      signedIn: true
    });
  }

  function observeAccount(account) {
    if (observedAccountKey !== account.key) {
      resetCloudAccount(account.key);
    }
    return account;
  }

  function resetCloudAccount(accountKey) {
    closeCloudWatcher();
    observedAccountKey = accountKey;
    accountGeneration += 1;
    syncStatus = { mode: "local", updatedAt: null, error: "", requiresLogin: false };
  }

  function isCurrentAccount(accountKey, generation) {
    return getAccount().key === accountKey && accountGeneration === generation;
  }

  function keyFor(stockId, accountKey = getAccount().key) {
    return `${STORAGE_PREFIX}:${accountKey}:${stockId}`;
  }

  function watchlistKey(accountKey = getAccount().key) {
    return `${WATCHLIST_PREFIX}:${accountKey}`;
  }

  function cleanValue(value) {
    const { _cloudPending, ...clean } = value || {};
    return clean;
  }

  function accountWrites(accountKey) {
    if (!pendingWrites.has(accountKey)) {
      const writes = new Map();
      pendingWrites.set(accountKey, writes);
      const watchlist = readJson(watchlistKey(accountKey));
      const restore = (storageKey, scopeId, value) => {
        if (!value?._cloudPending) return;

    }
    return pendingWrites.get(accountKey);
  }

  function cloudAdapter() {
    return getAccount().signedIn ? window.StockTrackingPreferenceCloud || null : null;
  }

  function setSyncStatus(mode, error = "") {
    syncStatus = {
      mode,
      updatedAt: mode === "cloud" ? new Date().toISOString() : syncStatus.updatedAt,
      error: String(error?.message || error || ""),
      requiresLogin: error?.code === "SITE_AUTH_REQUIRED"
    };
  }

  function dispatchCloudChange() {
    if (typeof window.dispatchEvent !== "function" || typeof window.CustomEvent !== "function") return;
    window.dispatchEvent(new window.CustomEvent("stock-preferences-cloud-change", {
      detail: { ...syncStatus }
    }));
  }

  function localScopes(accountKey = getAccount().key) {
    const prefix = `${STORAGE_PREFIX}:${accountKey}:`;
    const scopes = {};
    for (let index = 0; index < window.localStorage.length; index += 1) {
      const key = window.localStorage.key(index);
      if (!key || !key.startsWith(prefix)) continue;
      const value = readJson(key);
      if (value && typeof value === "object") scopes[key.slice(prefix.length)] = value;
    }
    return scopes;
  }

  function applyCloudSnapshot(snapshot, accountKey, generation, readRevision = Infinity, clearMissingWatchlist = false) {
    if (!snapshot || typeof snapshot !== "object") return;
    if (!isCurrentAccount(accountKey, generation)) return;
    const writes = accountWrites(accountKey);
    const canApply = key => !writes.has(key) && !(localWriteRevisions.get(key) > readRevision);
    const listKey = watchlistKey(accountKey);
    if (canApply(listKey) && (Array.isArray(snapshot.watchlist?.codes) || clearMissingWatchlist)) {
      window.localStorage.setItem(listKey, JSON.stringify({
        codes: normalizeCodes(snapshot.watchlist?.codes),
        updatedAt: snapshot.watchlist?.updatedAt || null
      }));
    }
    const scopes = snapshot.scopes && typeof snapshot.scopes === "object" ? snapshot.scopes : {};
    Object.entries(scopes).forEach(([scopeId, value]) => {
      const storageKey = keyFor(scopeId, accountKey);
      if (!scopeId || !value || typeof value !== "object" || !canApply(storageKey)) return;
      window.localStorage.setItem(storageKey, JSON.stringify(cleanValue(value)));
    });
    updateWriteStatus(accountKey, generation);
  }

  function closeCloudWatcher() {
    if (cloudWatcher && typeof cloudWatcher.close === "function") {
      try { Promise.resolve(cloudWatcher.close()).catch(() => undefined); } catch { /* Already closed. */ }
    }
    cloudWatcher = null;
  }

  function updateWriteStatus(accountKey, generation) {
    if (!isCurrentAccount(accountKey, generation)) return;
    const writes = [...accountWrites(accountKey).values()];
    const failure = writes.find(write => write.error);
    setSyncStatus(failure ? "error" : writes.length ? "saving" : "cloud", failure?.error);
    dispatchCloudChange();
  }

  function queueCloudWrite(record, accountKey, generation, adapter) {
    if (!adapter) {
      record.error = "尚未保存到云端，请登录后重试同步";
      updateWriteStatus(accountKey, generation);
      return cloudWriteQueue;
    }
    record.error = "";
    updateWriteStatus(accountKey, generation);
    cloudWriteQueue = cloudWriteQueue
      .catch(() => undefined)
      .then(async () => {
        const writes = accountWrites(accountKey);
        if (!isCurrentAccount(accountKey, generation) || writes.get(record.storageKey) !== record) return;
        if (record.scopeId === null) {
          await adapter.saveWatchlist(record.value.codes, accountKey);
        } else {
          await adapter.saveScope(record.scopeId, record.value, accountKey);
        }
        if (!isCurrentAccount(accountKey, generation) || writes.get(record.storageKey) !== record) return;
        window.localStorage.setItem(record.storageKey, JSON.stringify(record.value));
        writes.delete(record.storageKey);
        updateWriteStatus(accountKey, generation);
      })
      .catch(error => {
        if (accountWrites(accountKey).get(record.storageKey) === record) record.error = error;
        updateWriteStatus(accountKey, generation);
      });
    return cloudWriteQueue;
  }

  function saveLocalValue(storageKey, scopeId, value, account) {
    const writes = account.signedIn ? accountWrites(account.key) : null;
    window.localStorage.setItem(storageKey, JSON.stringify(account.signedIn ? { ...value, _cloudPending: true } : value));
    if (!writes) return;
    const record = { storageKey, scopeId, value, error: "", revision: ++writeRevision };
    localWriteRevisions.set(storageKey, record.revision);
    writes.set(storageKey, record);
    queueCloudWrite(record, account.key, accountGeneration, cloudAdapter());
  }

  function normalizeCodes(codes) {
    return [...new Set((Array.isArray(codes) ? codes : [])
      .map(code => String(code).padStart(6, "0"))
      .filter(code => /^\d{6}$/.test(code)))];
  }

  function load(stockId) {
    const value = readJson(keyFor(stockId));
    return value && typeof value === "object" ? cleanValue(value) : {};
  }

  function save(stockId, patch) {
    const account = getAccount();
    const nextValue = {
      ...load(stockId),
      ...cleanValue(patch),
      updatedAt: new Date().toISOString()
    };
    saveLocalValue(keyFor(stockId, account.key), String(stockId), nextValue, account);
    return nextValue;
  }

  function loadWatchlist(defaultCodes = []) {
    const stored = readJson(watchlistKey());
    const source = Array.isArray(stored?.codes) ? stored.codes : defaultCodes;
    return normalizeCodes(source);
  }

  function saveWatchlist(codes) {
    const account = getAccount();
    const value = {
      codes: normalizeCodes(codes),
      updatedAt: new Date().toISOString()
    };
    saveLocalValue(watchlistKey(account.key), null, value, account);
    return value;
  }

  async function sync(defaultCodes = []) {
    const account = getAccount();
    const generation = accountGeneration;
    const adapter = cloudAdapter();
    if (!account.signedIn || !adapter || typeof adapter.load !== "function") {
      closeCloudWatcher();
      setSyncStatus(account.signedIn ? "error" : "local", account.signedIn ? "云端同步尚未就绪，请重新登录后重试" : "");
      return { ...syncStatus };
    }

    try {
      await cloudWriteQueue;
      if (!isCurrentAccount(account.key, generation)) return { ...syncStatus };
      for (const record of accountWrites(account.key).values()) queueCloudWrite(record, account.key, generation, adapter);
      await cloudWriteQueue;
      if (!isCurrentAccount(account.key, generation)) return { ...syncStatus };
      if (accountWrites(account.key).size) {
        updateWriteStatus(account.key, generation);
        return { ...syncStatus };
      }
      const readRevision = writeRevision;
      const snapshot = await adapter.load(account.key);
      if (!isCurrentAccount(account.key, generation)) return { ...syncStatus };
      applyCloudSnapshot(snapshot, account.key, generation, readRevision, true);
      if (!cloudWatcher && typeof adapter.watch === "function") {
        cloudWatcher = adapter.watch(
          nextSnapshot => applyCloudSnapshot(nextSnapshot, account.key, generation),
          error => {
            if (!isCurrentAccount(account.key, generation)) return;
            setSyncStatus("error", error);
            dispatchCloudChange();
          },
          account.key
        );
      }
      return { ...syncStatus };
    } catch (error) {
      if (isCurrentAccount(account.key, generation)) setSyncStatus("error", error);
      return { ...syncStatus };
    }
  }

  function flushCloudWrites() {
    const account = getAccount();
    return cloudWriteQueue.then(() => {
      if (!account.signedIn) return;
      const writes = [...accountWrites(account.key).values()];
      const failure = writes.find(write => write.error)?.error;
      if (writes.length) throw new Error(failure?.message || failure || "股票设置尚未确认保存到云端");
    });
  }

  function getSyncStatus() {
    getAccount();
    return { ...syncStatus };
  }

  const onAccountChange = () => {
    const previousKey = observedAccountKey;
    const account = getAccount();
    if (account.key === previousKey) resetCloudAccount(account.key);
  };
  window.addEventListener("site-auth-change", onAccountChange);
  window.addEventListener("storage", event => { if (!event.key || event.key === SESSION_KEY) onAccountChange(); });

  const registerAccount = () => {
    // Other pages import this storage helper for read-only investment views.
    // Only the stock editor owns its pending-write guard and account sync action.
    if (!/\/stock-tracking(?:\/(?:index\.html)?)?$/.test(location.pathname)) return;
    window.MagicJAccount?.register({
      beforeLeave: flushCloudWrites,
      sync: async () => { await cloudWriteQueue; const result = await sync(); if (result.mode !== 'cloud') throw new Error(result.error || '股票云端同步未完成'); }
    });
  };
  window.addEventListener('magicj-account-ready', registerAccount); registerAccount();
  window.StockTrackingAccountStorage = {
    getAccount,
    load,
    save,
    loadWatchlist,
    saveWatchlist,
    sync,
    flushCloudWrites,
    getSyncStatus
  };
})();

}</script>

<script>/* CloudBase snapshot reader. Static snapshots remain the offline fallback. */
(() => {
  const envId = 'magicj-web-d5g9yvowj6862f7a2';
  const sdkUrl = 'https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js';

  async function loadCloudSnapshot() {
    if (!window.cloudbase?.init) throw new Error(`CloudBase SDK unavailable: ${sdkUrl}`);
    const app = window.cloudbase.init({ env: envId, region: 'ap-shanghai' });
    const auth = app.auth();
    const getToken = async () => {
      const hasPersonalAccount = () => Boolean(window.localStorage.getItem('mywebsite.site-auth-session.v1'));
      let existing;
      try {
        existing = await auth.getSession?.();
        if (existing?.error) throw new Error(existing.error.message || 'CloudBase session unavailable');
      } catch (error) {
        // This SDK also reports a fresh visitor's missing credentials as a null scope.
        if (hasPersonalAccount() || !/credentials not found|Cannot read properties of null \(reading 'scope'\)|null is not an object.*scope/i.test(error?.message || '')) throw error;
      }
      const existingToken = existing?.data?.session?.access_token;
      if (existingToken) return existingToken;
      // A temporary failure to restore a personal account must not replace its credentials.
      if (hasPersonalAccount()) throw new Error('Personal session temporarily unavailable; using static scores');
      const anonymous = await auth.signInAnonymously();
      if (anonymous?.error) throw new Error(anonymous.error.message || 'CloudBase anonymous session unavailable');
      return anonymous?.data?.session?.access_token;
    };
    const token = navigator.locks?.request
      ? await navigator.locks.request(`mywebsite.auth:${envId}`, getToken)
      : await getToken();
    if (!token) throw new Error('CloudBase anonymous session unavailable');
    const response = await fetch(`https://${envId}.ap-shanghai.tcb-api.tencentcloudapi.com/web?env=${envId}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        action: 'functions.invokeFunction',
        dataVersion: '2020-01-10',
        env: envId,
        function_name: 'refreshScores',
        request_data: JSON.stringify({ action: 'getSnookerScores' }),
        access_token: token,
        seqId: Math.random().toString(36).slice(2),
      }),
    });
    if (!response.ok) throw new Error(`CloudBase function request failed (${response.status})`);
    const body = await response.json();
    const result = typeof body?.data?.response_data === 'string'
      ? JSON.parse(body.data.response_data)
      : body?.data?.response_data;
    const snapshot = result?.snapshot;
    if (!snapshot || snapshot.version !== 1 || !snapshot.events) {
      throw new Error('CloudBase returned an invalid snooker snapshot');
    }
    return snapshot;
  }

  window.CUE_LOAD_CLOUD_SCORES = () => Promise.race([
    loadCloudSnapshot(),
    new Promise((_, reject) => setTimeout(() => reject(new Error('CloudBase snapshot timeout')), 8000)),
  ]);
})();
