          s.layout=remote.layout; s.revision=remote.revision; display(s.layout); cached(s);
        }
        s.conflict=false; status(s.revision?'布局已同步到账号':'已登录，编辑后将保存到账号');
        return;
      }
      const json=JSON.stringify(s.layout);
      if (remote.json!==json) {
        if (!forceLocal && remote.revision!==s.revision) conflict(s);
        const db=await verified(s), revision=remote.revision+1;
        forceLocal=false;
        const patch={ownerId:s.uid,layout:json,revision};
        let result;
        if (remote.revision===0) {
          // add with a fixed owner id never overwrites a concurrent first save.
          result=await db.add({_id:s.uid,...patch});
        } else {
          result=await db.where({_id:s.uid,ownerId:s.uid,revision:remote.revision}).update(patch);
        }
        assertCurrent(s); checked(result);
        remote=await cloudRecord(s);
        if (remote.json!==json || remote.revision!==revision) conflict(s);
      }
      s.revision=remote.revision; s.conflict=false;
      s.dirty=JSON.stringify(s.layout)!==json;
      cached(s);
      if (!s.dirty) { status('布局已同步到账号'); return; }
    }
  }
  function sync(forceLocal=false) {
    const s=state;
    if (!s.uid) return Promise.resolve();
    if (s.job) return s.job;
    const task=synchronize(s,forceLocal).catch(error=>{
      if (state===s) status(s.conflict?error.message:'账号布局尚未同步，可在设置中重试',true);
      throw error;
    }).finally(()=>{ if (s.job===task) s.job=null; });
    s.job=task;
    return task;
  }
  function sessionHint() {
    try { return JSON.parse(localStorage.getItem(sessionKey))?.uid || null; } catch { return null; }
  }
  async function identify() {
    const seq=++identityCheck;
    if (state.uid && state.uid!==sessionHint()) switchOwner(null);
    const api=window.MagicJDailyBoardAccount;
    if (!api) return;
    try {
      const session=await api.session();
      if (seq!==identityCheck) return;
      const hint=sessionHint();
      if (session?.uid && hint && session.uid!==hint) return;
      switchOwner(session?.uid || null, session?.account);
      if (state.uid) await sync();
    } catch {
      if (seq===identityCheck && !state.uid && sessionHint()) status('暂时无法核实网站账号，可重新打开账号入口',true);
    }
  }
  function accountSettings() {
    if (!state.uid) return;
    button('同步布局',()=>{void sync().catch(()=>{});});
    if (!state.conflict) return;
    button('采用云端布局',async()=>{
      const s=state;
      try {
        const cloud=await cloudRecord(s);
        s.layout=cloud.layout; s.revision=cloud.revision; s.dirty=false; s.conflict=false;
        cached(s); dialog.close(); display(s.layout); status('已恢复云端布局');
      } catch { if (s===state) status('读取云端布局失败，请重试',true); }
    });
    button('用此草稿更新云端',()=>{dialog.close();void sync(true).catch(()=>{});});
  }
  async function restoreSavedView() {
    const s=state;
    try {
      if (s.job) await s.job.catch(()=>{});
      const prior=s.layout, cloud=await cloudRecord(s);
      if (s.layout!==prior || s.job || gesture || pendingDrop) {status('布局正在变动，请稍后再载入');return;}
      if (!cloud.revision) {status('账号尚无已保存视图');return;}
      s.layout=cloud.layout; s.revision=cloud.revision; s.dirty=false; s.conflict=false;
      cached(s); display(s.layout); status('已载入账号视图');
    } catch { if (s===state) status('读取云端布局失败，可重试',true); }
  }
  accountButton.onclick=()=>{
    if (amberBoard && state.uid) {
      panel('账号布局'); message(saveStatus).dataset.saveStatus='';
      button('保存当前视图',()=>{saveLayout();});
      button('载入已存视图',restoreSavedView);
      button('账号管理',()=>{dialog.close();window.MagicJAccount?.openLogin();});
      const logout=document.querySelector('#mj-login [data-account-logout]');
      if (logout) button('退出',()=>{dialog.close();window.MagicJAccount.openLogin();logout.click();});
      button('关闭',()=>dialog.close());
      return;
    }
    if (window.MagicJAccount) {window.MagicJAccount.openLogin();return;}
    panel('网站账号');
    message(location.protocol==='file:'?'离线文件会在此浏览器保存访客布局。账号布局请在网站中打开。':'网站登录入口暂未就绪，请稍后再试。');
    if (location.protocol==='file:') {
      const link=document.createElement('a'); link.textContent='打开网页版超级日历'; link.href=calendarUrl+'#overview'; fields.append(link);
    }
    button('关闭',()=>dialog.close());
  };
  display(state.layout); if (!amberBoard) setEditing(false); status('访客布局保存在此浏览器');
  function accountReady() {
    window.MagicJAccount?.register({sync:()=>sync(),beforeLeave:()=>state.dirty?sync():Promise.resolve()});
    // A sign-in event can precede settlement of the site's previous guest session check.
    // Recheck when the shared toolbar finishes validating the new session.
    const toolbar=document.getElementById('mj-account');
    if (toolbar) new MutationObserver(()=>{
      if ((toolbar.dataset.auth==='signed-in')!==Boolean(state.uid)) void identify();
    }).observe(toolbar,{attributes:true,attributeFilter:['data-auth']});
    void identify();
  }
  window.addEventListener('magicj-account-ready',accountReady);
  window.addEventListener('site-auth-change',()=>{
    if (state.uid!==sessionHint()) switchOwner(null);
    setTimeout(identify,0);
  });
  window.addEventListener('storage',event=>{
    if (!event.key || event.key===sessionKey) {void identify();return;}
    if (event.key===storageKey(state.uid) && !state.dirty && !gesture && !pendingDrop) {
      if (state.uid) void sync().catch(()=>{});
      else {state=stateFor(null);display(state.layout);}
    }
  });
  window.addEventListener('online',identify);
  window.addEventListener('focus',identify);
  if (/^https?:$/.test(location.protocol)) {
    if (window.MagicJAccount) accountReady();
    else {
      const script=document.createElement('script');
      script.src='/officialwebsite/account-entry.js?v=20261123-scheduled-todos';
      script.onerror=()=>status('网站账号服务暂时无法加载，访客编辑仍可保存在本机',true);
      document.head.append(script);
    }
  }
})();
</script>
