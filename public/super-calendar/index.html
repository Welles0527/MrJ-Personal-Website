window.addEventListener('message',event=>{if(!personalPlanFrame||event.source!==personalPlanFrame.contentWindow||event.origin!==location.origin||event.data?.type!=='personal-plan-calendar')return;const value=event.data;if(!['loading','ready','signed-out','error'].includes(value.status))return;clearTimeout(personalPlanTimer);if(value.palette&&typeof value.palette==='object')for(const key of Object.keys(planPalette)){const color=value.palette[key];if(typeof color==='string'&&/^#[0-9a-f]{6}$/i.test(color))planPalette[key]=color}personalPlanState=value.status;personalPlans=value.status==='ready'&&Array.isArray(value.todos)?value.todos.filter(p=>p&&typeof p.id==='string'&&typeof p.title==='string'&&typeof p.note==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&typeof p.completed==='boolean'):[];const d=$('#detail');if(d.open&&d.dataset.planDetailId&&!personalPlans.some(p=>p.id===d.dataset.planDetailId))d.close();if(state.page==='life'&&state.view!=='week')render()});

function monthWordCloud(es,plans){const words=new Map();for(const item of [...plans.map(p=>({title:p.title,color:planColor(p)})),...es.map(e=>({title:e.name,color:eventColor(e)}))]){const title=item.title.trim();if(!title)continue;const key=title+'|'+item.color,word=words.get(key);if(word)word.count++;else words.set(key,{title,color:item.color,count:1})}const sorted=[...words.values()].sort((a,b)=>b.count-a.count||a.title.localeCompare(b.title,'zh-CN')),max=Math.max(1,...sorted.map(w=>w.count));return `<div class="month-word-cloud" role="group" aria-label="本月球形词云，文字越大表示出现次数越多"><div class="month-word-sphere">${sorted.length?sorted.map(w=>`<span class="month-word" style="--word-color:${w.color};--word-size:${max===1?22:Math.round(16+28*Math.log1p(w.count)/Math.log1p(max))}px" title="${esc(w.title)} · ${w.count} 次" aria-label="${esc(w.title)}，${w.count} 次"><span class="month-word-label">${esc(w.title)}</span><sup class="month-word-count" aria-hidden="true">${w.count}</sup></span>`).join(''):'<p class="muted">本月暂无日程</p>'}</div></div>`}
function layoutMonthWordCloud(){const sphere=$('.month-word-sphere');if(!sphere)return;const words=[...sphere.querySelectorAll('.month-word')],size=sphere.clientWidth,radius=size/2-8;if(!words.length)return;let scale=Math.min(1,size/480,Math.sqrt(24/words.length));for(let attempt=0;attempt<12;attempt++){sphere.style.setProperty('--cloud-scale',scale);const placed=[];let fits=true;for(const word of words){const width=word.offsetWidth,height=word.offsetHeight;let point=null;for(let step=0;step<2400;step++){const distance=radius*Math.sqrt(step/2400),angle=step*2.3999632297,x=size/2+Math.cos(angle)*distance-width/2,y=size/2+Math.sin(angle)*distance-height/2;const corners=[[x,y],[x+width,y],[x,y+height],[x+width,y+height]];if(corners.some(([cx,cy])=>Math.hypot(cx-size/2,cy-size/2)>radius))continue;if(placed.some(p=>x<p.x+p.width+3&&x+width+3>p.x&&y<p.y+p.height+3&&y+height+3>p.y))continue;point={x,y,width,height};break}if(!point){fits=false;break}word.style.left=point.x+'px';word.style.top=point.y+'px';placed.push(point)}if(fits)return;scale*=.86}}
window.addEventListener('resize',()=>requestAnimationFrame(layoutMonthWordCloud));

function render(){document.body.classList.toggle('sports-page',state.page==='sports');document.body.classList.toggle('sports-selection-page',state.page==='sports'&&state.category==='全部');if(state.page==='life'&&state.view==='month')state.category='全部';document.body.classList.toggle('life-month-page',state.page==='life'&&state.view==='month');if(state.page==='life'&&!categories().includes(state.category))state.category='全部';if(state.view==='week'&&state.page!=='life')state.view='year';document.body.classList.toggle('life-page',state.page==='life');document.body.classList.toggle('life-week-page',state.page==='life'&&state.view==='week');ensurePersonalPlanSource();document.body.classList.toggle('overview-page',state.page==='overview');if(state.page==='overview'){renderOverview();return}document.documentElement.dataset.theme=theme;const c=calendars[state.page];document.title=`${c.label} · 超级日历`;$('#app').innerHTML=`${sidebar()}<div class="layout"><header class="calendar-topbar"><div class="theme-picker"><label for="theme-select">配色方案</label><span class="theme-swatch" id="theme-preview" aria-hidden="true">${[themes[theme].swatches[0],themes[theme].swatches[1]].map(x=>`<i style="--swatch:${x}"></i>`).join('')}</span><select id="theme-select" aria-label="配色方案">${Object.entries(themes).map(([k,t])=>`<option value="${k}" ${theme===k?'selected':''}>${t.label}</option>`).join('')}</select></div><div class="topbar-period"><button class="mobile-menu" data-action="menu" aria-label="打开导航">${icon('menu')}</button><div class="period-control"><button data-shift="-1" aria-label="${state.view==='year'?'上一年':'上个月'}">‹</button><strong>${state.year} 年${state.view==='month'?' · '+(state.month+1)+' 月':''}</strong><button data-shift="1" aria-label="${state.view==='year'?'下一年':'下个月'}">›</button><button data-action="today">今天</button></div></div><div class="topright"><time datetime="${today}">${Number(today.slice(0,4))}年${Number(today.slice(5,7))}月${Number(today.slice(8))}日</time>${accountButton()}</div></header><main><div class="title-row"><div><p class="eyebrow">${c.en}</p><h1><span>${state.year}</span>${state.page==='home'?'超级日历':c.label}${state.page==='life'&&state.view==='week'?'<small class="life-todo-title">To-Do-List</small>':''}</h1><p class="subtitle">${state.page==='home'?'生活、出行、赛事与 AI，在这里汇合。':{life:'安排日常，留出喜欢的时间。',travel:'从出发到抵达，安排每一段旅程。',sports:'把期待的比赛，放进日历。',ai:'关注发布、活动与学习计划。'}[state.page]} <span> / ${filtered().filter(e=>e.start<=state.year+'-12-31'&&e.end>=state.year+'-01-01').length+(state.page==='life'?personalPlans.filter(p=>p.date.startsWith(state.year+'-')).length:0)} 项日程</span></p></div><div class="title-actions"><div class="switch" aria-label="日历视图"><button data-view="year" class="${state.view==='year'?'active':''}" aria-pressed="${state.view==='year'}">${icon('grid')}年历</button><button data-view="month" class="${state.view==='month'?'active':''}" aria-pressed="${state.view==='month'}">${icon('calendar')}月历</button>${state.page==='life'?`<button data-view="week" class="${state.view==='week'?'active':''}" aria-pressed="${state.view==='week'}">${icon('calendar')}周历</button>`:''}</div><button class="primary" data-action="add"><span aria-hidden="true">＋</span> 新增日程</button></div></div><div class="hub-toolbar"><nav class="topic-tabs" aria-label="主题分类">${categories().map(k=>`<button class="${state.category===k?'active':''}" data-category="${k}" aria-pressed="${state.category===k}">${state.page==='home'&&k!=='全部'?calendars[k].label:k}</button>`).join('')}</nav><form class="search" role="search"><input id="query" aria-label="搜索日程" placeholder="搜索日程" value="${esc(state.query)}"><button type="submit">搜索</button></form></div><div class="month-strip"><div class="year-label">${state.year} 年</div><div class="months">${englishMonths.map((n,m)=>`<button data-month="${m}" class="${state.view==='month'&&state.month===m?'active':''}">${m+1}月<small>${n}</small></button>`).join('')}</div></div><div class="legend-row"><div class="legend">${(state.page==='home'?Object.entries(calendars).filter(([k])=>k!=='home'):[[state.page,c]]).map(([k,v])=>`<span><i style="color:${eventColor({calendar:k})}">${icon(v.icon)}</i>${v.label}</span>`).join('')}</div><span class="hint">${state.view==='year'?'点击月份进入月历':'点击日程查看详情'}</span></div>${state.page==='sports'&&state.category==='全部'?sportsSelection():state.view==='week'?lifeWeekly():state.view==='year'?annual():monthly()}<div class="bottom-note"><span>SUPER CALENDAR</span></div></main></div>`;bind();ensurePersonalPlanSource()}
function bind(){document.querySelectorAll('.nav-link[href="#sports"]').forEach(a=>a.addEventListener('click',()=>{if(state.page==='sports'){state.category='全部';render()}}));let draggedCalendar='';document.querySelectorAll('[data-nav-key]').forEach(item=>{item.ondragstart=e=>{draggedCalendar=item.dataset.navKey;item.classList.add('is-dragging');e.dataTransfer.setData('text/plain',draggedCalendar);e.dataTransfer.effectAllowed='move'};item.ondragover=e=>{e.preventDefault();if(!draggedCalendar||item.dataset.navKey===draggedCalendar)return;const nav=item.parentElement,dragged=nav.querySelector('[data-nav-key="'+draggedCalendar+'"]'),rect=item.getBoundingClientRect();const before=e.clientY<rect.top+rect.height/2;const next=before?item:item.nextElementSibling;if(next!==dragged)nav.insertBefore(dragged,next)};item.ondrop=e=>{e.preventDefault();if(!draggedCalendar)return;navOrder=Array.from(item.parentElement.children).map(node=>node.dataset.navKey);try{localStorage.setItem('super-calendar-nav-order',JSON.stringify(navOrder))}catch{}};item.ondragend=()=>{const nav=item.parentElement;navOrder.forEach(key=>nav.append(nav.querySelector('[data-nav-key="'+key+'"]')));item.classList.remove('is-dragging');draggedCalendar=''};let touchDrag=null;item.onpointerdown=e=>{if(e.pointerType==='mouse')return;touchDrag={id:e.pointerId,y:e.clientY,key:item.dataset.navKey,moved:false}};item.onpointermove=e=>{if(!touchDrag||touchDrag.id!==e.pointerId)return;if(Math.abs(e.clientY-touchDrag.y)>10)touchDrag.moved=true;if(touchDrag.moved){e.preventDefault();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-nav-key]');if(target)moveCalendar(touchDrag.key,target.dataset.navKey)}};item.onpointerup=()=>{if(touchDrag?.moved){item.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()},{capture:true,once:true})}touchDrag=null};item.onpointercancel=()=>touchDrag=null});layoutMonthWordCloud();document.querySelectorAll('[data-life-date]').forEach(b=>b.onclick=()=>showLifeDate(b.dataset.lifeDate));document.querySelectorAll('[data-personal-plan]').forEach(b=>b.onclick=()=>showPersonalPlan(b.dataset.personalPlan));document.querySelectorAll('[data-plan-refresh]').forEach(b=>b.onclick=refreshPersonalPlans);if($('#theme-select'))$('#theme-select').onchange=event=>{theme=event.target.value;$('#theme-preview').innerHTML=[themes[theme].swatches[0],themes[theme].swatches[1]].map(x=>`<i style="--swatch:${x}"></i>`).join('');try{localStorage.setItem('super-calendar-theme-v2-'+state.page,theme)}catch{}if(state.page==='life'&&state.view==='week'){document.documentElement.dataset.theme=theme;$('#life-week-frame')?.contentWindow?.postMessage({type:'calendar-week-theme',theme},location.origin)}else render()};document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.month=+b.dataset.month;state.view='month';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();if(state.view==='week')$('#life-week-frame')?.scrollIntoView({block:'start'})});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{if(state.page==='sports'&&b.dataset.category==='斯诺克'){location.href=snookerOverviewUrl;return}state.category=b.dataset.category;render()});document.querySelectorAll('[data-group]').forEach(b=>b.onchange=()=>{b.checked?state.groups.add(b.dataset.group):state.groups.delete(b.dataset.group);render()});document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{state.status=b.dataset.status;render()});document.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{const n=+b.dataset.shift;if(state.view==='year')state.year+=n;else{const d=new Date(state.year,state.month+n,1);state.year=d.getFullYear();state.month=d.getMonth()}state.year=Math.max(1900,Math.min(2100,state.year));render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='menu')document.body.classList.toggle('menu-open');if(a==='reset'){reset();render()}if(a==='today'){state.year=thisYear;state.month=thisMonth;state.view='month';render()}if(a==='add')openEditor()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>showDetail(b.dataset.event));document.querySelectorAll('[data-add-date]').forEach(b=>b.onclick=()=>openEditor(b.dataset.addDate));if($('#place-filter'))$('#place-filter').onchange=e=>{state.place=e.target.value;render()};$('.search').onsubmit=e=>{e.preventDefault();state.query=$('#query').value.trim();render()}}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('visible'),3000)}
function persist(){try{localStorage.setItem('super-calendar-entries',JSON.stringify(entries));return true}catch{toast('浏览器未允许保存，本次日程仅在当前页面保留。');return false}}
function openEditor(date){const d=$('#editor'),key=state.page==='home'?'life':state.page,start=date||(state.year===thisYear&&state.month===thisMonth?today:dateStr(state.month,1));d.innerHTML=`<button class="dialog-close" aria-label="关闭">×</button><h2 id="editor-title">新增日程</h2><p class="info-note">仅保存在当前浏览器，供你试用日历。</p><form id="entry-form"><label>日程名称<input name="name" required maxlength="80" placeholder="例如：周末散步"></label><div class="form-row"><label>所属日历<select name="calendar">${Object.entries(calendars).filter(([k])=>k!=='home').map(([k,v])=>`<option value="${k}" ${k===key?'selected':''}>${v.label}</option>`).join('')}</select></label><label>分类<select name="category"></select></label></div><div class="form-row"><label>开始日期<input name="start" type="date" value="${start}" required min="1900-01-01" max="2100-12-31"></label><label>结束日期<input name="end" type="date" value="${start}" required min="${start}" max="2100-12-31"></label></div><div class="form-row"><label>场景／范围<select name="place"></select></label><label>地点（选填）<input name="location" maxlength="100" placeholder="输入地点或线上"></label></div><label>备注（选填）<textarea name="note" rows="3" maxlength="1000" placeholder="补充日程说明"></textarea></label><div class="form-actions"><button type="button" data-cancel>取消</button><button class="primary" type="submit">保存日程</button></div></form>`;const f=$('#entry-form'),sync=()=>{const c=calendars[f.elements.calendar.value];f.elements.category.innerHTML=c.categories.map(v=>`<option>${v}</option>`).join('');f.elements.place.innerHTML=c.places.map(v=>`<option>${v}</option>`).join('')};sync();f.elements.calendar.onchange=sync;f.elements.start.onchange=()=>{f.elements.end.min=f.elements.start.value;if(f.elements.end.value<f.elements.start.value)f.elements.end.value=f.elements.start.value};$('.dialog-close',d).onclick=()=>d.close();$('[data-cancel]',d).onclick=()=>d.close();f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.name.trim()){f.elements.name.setCustomValidity('请输入日程名称');f.elements.name.reportValidity();return}if(v.end<v.start)return;entries.push({...v,name:v.name.trim(),id:globalThis.crypto?.randomUUID?.()||'e'+Date.now()});const saved=persist();state.year=Number(v.start.slice(0,4));state.month=Number(v.start.slice(5,7))-1;reset();state.view='month';if(state.page!=='home'&&state.page!==v.calendar){state.page=v.calendar;location.hash=v.calendar}d.close();render();if(saved)toast('日程已保存到当前浏览器')};f.elements.name.oninput=()=>f.elements.name.setCustomValidity('');d.showModal()}
function showDetail(id){delete $('#detail').dataset.planDetailId;const e=entries.find(e=>e.id===id);if(!e)return;if(e.calendar==='sports'&&e.category==='斯诺克'){location.href=snookerOverviewUrl;return}const d=$('#detail');d.innerHTML=`<button class="dialog-close" aria-label="关闭">×</button><div class="event-big-icon" style="--event-color:${eventColor(e)}">${icon(calendars[e.calendar].icon)}</div><h2 id="detail-title">${esc(e.name)}</h2><p class="info-note">${calendars[e.calendar].label} · ${esc(e.category)} · ${labels[status(e)]}</p><div class="dialog-meta"><div><div class="meta-label">日期</div><div class="meta-value">${e.start} — ${e.end}</div></div><div><div class="meta-label">地点</div><div class="meta-value">${esc(e.location)||'未填写'}</div></div></div>${e.note?`<p class="detail-note">${esc(e.note)}</p>`:''}<div class="form-actions"><button class="danger" data-delete>删除日程</button><button class="primary" data-close>完成</button></div>`;$('.dialog-close',d).onclick=$('[data-close]',d).onclick=()=>d.close();$('[data-delete]',d).onclick=()=>{if(confirm('删除这项自建日程？')){entries=entries.filter(x=>x.id!==id);persist();d.close();render()}};d.showModal()}
window.addEventListener('hashchange',()=>{state.page=route();theme=pageTheme(state.page);if(state.page==='life')state.view=location.hash.includes('view=year')?'year':'week';if(location.hash.includes('view=month')){state.view='month';state.year=thisYear;state.month=thisMonth}reset();document.body.classList.remove('menu-open');render();window.scrollTo(0,0)});
