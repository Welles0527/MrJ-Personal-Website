function navigation(){return navOrder().map(id=>{const p=PAGES[id],colors=NAV_COLORS[id],count=id==='reports'?scoped(state.reports).length:null;return `<div class="nav-entry" data-nav-id="${id}" style="--nav-color:${colors[0]};--nav-ink:${colors[1]}"><button class="nav-item ${activePage===id?'active':''}" data-action="navigate" data-page="${id}" ${activePage===id?'aria-current="page"':''}><span class="nav-symbol">${icon(p[3])}</span><span class="nav-text">${p[0]}</span>${count!==null?`<span class="nav-count">${count}</span>`:''}</button><button class="nav-drag-handle" aria-label="调整${p[0]}的位置" title="拖动排序，或按上下方向键移动" data-nav-handle="${id}"><span aria-hidden="true">⠿</span></button></div>`;}).join('');}
let navDrag=null;
async function saveNavOrder(order){await mutate(()=>{state.settings=state.settings||{};state.settings.navOrder=order;});toast('导航顺序已保存');}
function clearNavDrag(){document.querySelector('.nav-drop-indicator')?.remove();document.querySelector('.nav-entry.dragging')?.classList.remove('dragging');document.body.classList.remove('nav-sorting');navDrag=null;}
document.addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-nav-handle]');if(!handle||event.button!==0)return;navDrag={id:handle.dataset.navHandle,pointerId:event.pointerId,x:event.clientX,y:event.clientY,moved:false,index:null};handle.setPointerCapture(event.pointerId);});
document.addEventListener('pointermove',event=>{if(!navDrag||event.pointerId!==navDrag.pointerId)return;if(!navDrag.moved&&Math.hypot(event.clientX-navDrag.x,event.clientY-navDrag.y)<6)return;navDrag.moved=true;event.preventDefault();document.body.classList.add('nav-sorting');const nav=document.querySelector('.sidebar nav'),row=nav.querySelector('[data-nav-id="'+navDrag.id+'"]');row.classList.add('dragging');const others=[...nav.querySelectorAll('.nav-entry')].filter(e=>e!==row);let index=others.findIndex(e=>event.clientY<e.getBoundingClientRect().top+e.getBoundingClientRect().height/2);if(index<0)index=others.length;navDrag.index=index;let indicator=nav.querySelector('.nav-drop-indicator');if(!indicator){indicator=document.createElement('div');indicator.className='nav-drop-indicator';nav.append(indicator);}const top=index<others.length?others[index].getBoundingClientRect().top:others.at(-1).getBoundingClientRect().bottom;indicator.style.top=(top-nav.getBoundingClientRect().top+nav.scrollTop)+'px';indicator.textContent='放在第 '+(index+1)+' 位';},{passive:false});
document.addEventListener('pointerup',async event=>{if(!navDrag||event.pointerId!==navDrag.pointerId)return;const drag=navDrag,order=navOrder().filter(id=>id!==drag.id);clearNavDrag();if(!drag.moved||drag.index===null)return;order.splice(drag.index,0,drag.id);try{await saveNavOrder(order);}catch(e){toast('排序未保存，请重试');}});
document.addEventListener('pointercancel',clearNavDrag);
document.addEventListener('keydown',async event=>{const handle=event.target.closest('[data-nav-handle]');if(event.key==='Escape'&&navDrag){clearNavDrag();return;}if(!handle||!['ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();const id=handle.dataset.navHandle,order=navOrder(),from=order.indexOf(id),to=from+(event.key==='ArrowUp'?-1:1);if(to<0||to>=order.length)return;[order[from],order[to]]=[order[to],order[from]];try{await saveNavOrder(order);document.querySelector('[data-nav-handle="'+id+'"]').focus();}catch(e){toast('排序未保存，请重试');}});

function dispensingSource(id){const seen=new Set();let e=state?.events.find(e=>e.id===id&&e.pid===person);while(e){if(seen.has(e.id))return null;seen.add(e.id);const parent=e.visitEventId||(e.reportId?state.reports.find(r=>r.id===e.reportId&&r.pid===e.pid)?.visitEventId:'');if(!parent)return e;e=state.events.find(x=>x.id===parent&&x.pid===person);}return null;}

function calendarMonth(month,compact,records){const first=new Date(visitYear,month,1).getDay(),days=new Date(visitYear,month+1,0).getDate(),byDate=new Map();for(const e of records){if(!byDate.has(e.date))byDate.set(e.date,[]);byDate.get(e.date).push(e);}const cells=Array.from({length:(first+6)%7},()=>'<span class="calendar-blank" aria-hidden="true"></span>');for(let day=1;day<=days;day++){const date=calendarDate(visitYear,month,day),events=byDate.get(date)||[],people=[...new Set(events.map(e=>e.pid))];cells.push(`<button class="calendar-day ${date===visitDate?'selected':''} ${date===today()?'is-today':''} ${events.length?'has-events':''}" data-action="visit-date" data-date="${date}" aria-label="${date}，${events.length} 条就医记录" ${date===visitDate?'aria-pressed="true"':'aria-pressed="false"'}><span class="day-number">${day}</span>${!compact&&events.length>1?`<small class="calendar-day-count">${events.length} 次</small>`:''}${compact?`<span class="calendar-dots">${events.map(e=>`<i data-calendar-event="${e.id}" title="${esc(e.title)}" style="background:${PATIENT_COLORS[e.pid]||'#708b85'}"></i>`).join('')}</span>`:`<span class="calendar-day-events">${events.map(e=>`<span class="calendar-event" data-calendar-event="${e.id}" title="${esc(pname(e.pid)+' · '+e.title+' · '+(e.hospital||'医院待填写')+' · '+visitDepartment(e))}" style="--patient-color:${PATIENT_COLORS[e.pid]||'#708b85'}">${hospitalName(e.hospital)}<span class="visit-department">${esc(visitDepartment(e))}</span></span>`).join('')}</span>`}</button>`);}return `<section class="calendar-month ${compact?'compact':''}" aria-label="${visitYear}年${month+1}月">${compact?`<button class="calendar-month-title" data-action="visit-month" data-month="${month}">${month+1} 月<span>${records.filter(e=>e.date.startsWith(calendarDate(visitYear,month,1).slice(0,7))).length} 条</span></button>`:''}<div class="calendar-weekdays">${['一','二','三','四','五','六','日'].map(d=>'<span>'+d+'</span>').join('')}</div><div class="calendar-grid">${cells.join function visitsPage(){const records=visitRecords(),prefix=String(visitYear)+(visitView==='month'?'-'+String(visitMonth+1).padStart(2,'0'):''),visible=records.filter(e=>e.date.startsWith(prefix)),selected=visitDateFilter?visible.filter(e=>e.date===visitDate):visible;return `<section class="panel visit-filters"><div class="visit-toolbar"><div class="visit-period"><button class="btn tiny" data-action="visit-prev" aria-label="上一${visitView==='year'?'年':'月'}">${icon('chevron','calendar-prev')}</button><label><span class="sr-only">年份</span><input id="visit-year" type="number" min="1900" max="2100" value="${visitYear}" aria-label="年份"></label>${visitView==='month'?`<select id="visit-month" aria-label="月份">${Array.from({length:12},(_,i)=>`<option value="${i}" ${visitMonth===i?'selected':''}>${i+1} 月</option>`).join('')}</select>`:'<span>年</span>'}<button class="btn tiny" data-action="visit-next" aria-label="下一${visitView==='year'?'年':'月'}">${icon('chevron')}</button><button class="btn tiny" data-action="visit-today">今天</button></div><div class="visit-view-controls"><select id="visit-kind" aria-label="就医类型"><option value="all">全部就医类型</option>${['visit','report','refill','plan'].map(type=>`<option value="${type}" ${visitKind===type?'selected':''}>${TYPES[type][0]}</option>`).join('')}</select><div class="segmented" aria-label="日历视图">${[['month','月历'],['year','年历']].map(([id,label])=>`<button data-action="visit-view" data-view="${id}" class="${visitView===id?'active':''}" aria-pressed="${visitView===id}">${label}</button>`).join('')}${visitView==='year'?`<button class="year-calendar-toggle" data-action="visit-year-toggle" aria-expanded="${visitYearExpanded}" aria-controls="visit-year-calendar" aria-label="${visitYearExpanded?'折叠年历':'展开年历'}" title="${visitYearExpanded?'折叠年历':'展开年历'}">${visitYearExpanded?'−':'+'}</button>`:''}</div></div></div><div class="visit-legend">${state.profiles.filter(p=>person==='all'||p.id===person).map(p=>`<span><i style="background:${PATIENT_COLORS[p let dailyDate='';
const DAILY_BASE=[{key:'systolic',label:'高压',unit:'mmHg'},{key:'diastolic',label:'低压',unit:'mmHg'},{key:'sleepHours',label:'睡眠时长',unit:'小时'}];
function dailyMetricDefinitions(pid){const definitions=DAILY_BASE.map(m=>({...m,show:false,chart:'line'})),known=new Set(definitions.map(m=>m.key)),saved=state.settings?.dailyMetrics?.[pid]||[];const add=(label)=>{const key='custom:'+label;if(!label||known.has(key))return;known.add(key);definitions.push({key,label,unit:label==='夜间起夜'?'次':'',show:false,chart:label==='夜间起夜'?'bar':'line'});};for(const pref of saved)if(pref.key.startsWith('custom:'))add(pref.label);for(const e of state.events.filter(e=>e.pid===pid)){for(const item of e.dailyItems||[])add(item.label);if(e.metric&&e.metric!=='睡眠时长')add(e.metric);}const order=new Map(saved.map((m,i)=>[m.key,i]));return definitions.map(m=>({...m,...saved.find(p=>p.key===m.key),label:m.label})).sort((a,b)=>(order.get(a.key)??saved.length+definitions.findIndex(m=>m.key===a.key))-(order.get(b.key)??saved.length+definitions.findIndex(m=>m.key===b.key)));}
function metricRowControls(pref,removable){return `<div class="metric-options"><label class="metric-overview-label"><input type="checkbox" class="metric-overview" ${pref.show===true?'checked':''} aria-label="在健康总览显示">总览</label><div class="metric-chart-choice" aria-label="图形展示">${[['line','曲线图'],['bar','柱状图']].map(([value,label])=>`<button type="button" data-action="metric-chart" data-chart="${value}" title="${label}" aria-label="${label}" aria-pressed="${(pref.chart||'line')===value}" class="${(pref.chart||'line')===value?'active':''}">${value==='line'?'曲线':'柱状'}</button>`).join('')}</div><div class="metric-move"><button type="button" data-action="metric-move-up" aria-label="上移指标" title="上移指标">↑</button><button type="button" data-action="metric-move-down" aria-label="下移指标" title="下移指标">↓</button></div></div>${removable?`<button type="button" data-action="remove-daily-item" aria-label="移除这条指标">${icon('x','small-icon')}</button>`:'<span></span>'}`;}
function dailyMetricRow(pref,value=''){const base=DAILY_BASE.find(m=>m.key===pref.key);if(!base)return dailyItemRow({label:pref.label,value},pref);const limits=pref.key==='systolic'?'min="40" max="300" step="1"':pref.key==='diastolic'?'min="20" max="200" step="1"':'min="0" max="24" step="0.1"';return `<div class="daily-metric-row" data-metric-key="${pref.key}" data-chart="${pref.chart||'line'}"><button type="button" class="metric-drag" data-metric-handle draggable="true" aria-label="拖动${base.label}排序" title="拖动排序，也可用上下按钮">⠿</button><label for="daily-${pref.key}">${base.label}<small>${base.unit}</small></label><input id="daily-${pref.key}" name="${pref.key}" type="number" ${limits} placeholder="可留空" value="${esc(value)}">${metricRowControls(pref,false)}</div>`;}
function dailyFormPreferences(form,pid){const current=dailyMetricDefinitions(pid),preferences=[],used=new Set();for(const row of form.querySelectorAll('.daily-metric-row')){const custom=row.classList.contains('daily-item-row'),label=custom?row.querySelector('[name="extraLabel"]').value.trim():DAILY_BASE.find(m=>m.key===row.dataset.metricKey)?.label;if(!label)continue;const key=custom?'custom:'+label:row.dataset.metricKey;if(used.has(key))throw new Error('指标名称重复，请合并同名指标。');used.add(key);preferences.push({key,label,show:row.querySelector('.metric-overview').checked,chart:row.dataset.chart==='bar'?'bar':'line'});}for(const pref of current)if(!used.has(pref.key))preferences.push({key:pref.key,label:pref.label,show:pref.show,chart:pref.chart});return preferences.sort((a,b)=>Number(!a.key.startsWith('custom:'))-Number(!b.key.startsWith('custom:')));}
function metricRawValue(e,key){if(key==='systolic'||key==='diastolic')return e[key]===undefined?null:String(e[key]);if(key==='sleepHours')return e.sleepHours!==undefined?String(e.sleepHours):e.metric==='睡眠时长'&&Number.isFinite(e.value)?String(e.value):null;const label=key.slice(7),item=e.dailyItems?.find(item=>item.label===label);return item?item.value:e.metric===label&&Number.isFinite(e.value)?String(e.value):null;}
function numericMetric(raw,defaultUnit=''){const m=String(raw).match(/^\s*([+-]?(?:\d+(?:\.\d+)?|\.\d+))\s*([a-zA-Z\u4e00-\u9fff%/²³μ℃°]*)\s*$/);if(!m||!Number.isFinite(Number(m[1])))return null;return {value:Number(m[1]),unit:m[2]||defaultUnit};}
function dailyMetricSeries(pid,definition){const dates=new Map();for(const e of sorted(state.events.filter(e=>e.pid===pid&&e.type==='symptom')).reverse()){const raw=metricRawValue(e,definition.key);if(raw!==null){const point={date:e.date,raw,...numericMetric(raw,definition.unit)};const existing=dates.get(e.date);if(!existing||e.dailyRecord||!existing.dailyRecord)dates.set(e.date,{...point,dailyRecord:!!e.dailyRecord});}}return [...dates.values()].sort((a,b)=>a.date.localeCompare(b.date));}
function dailyValueTiles(e){return dailyMetricDefinitions(e.pid).map(pref=>{const raw=metricRawValue(e,pref.key);return raw===null?'':`<div class="daily-metric-value" data-metric-key="${esc(pref.key)}"><span>${esc(pref.label)}</span><strong>${esc(raw)}</strong>${pref.unit?`<small>${esc(pref.unit)}</small>`:''}</div>`;}).join('');}
function metricPlot(points,pref){const values=points.map(p=>p.value),min=Math.min(0,...values),max=Math.max(1,...values),span=max-min||1,x=i=>points.length===1?200:70+i*260/(points.length-1),y=v=>116-(v-min)/span*92,format=v=>Number(v.toFixed(2)),color='#83a95a';const guides=[max,(max+min)/2,min].map(v=>`<line x1="52" x2="342" y1="${y(v)}" y2="${y(v)}" stroke="#dfe6df" stroke-dasharray="3 4"/><text x="44" y="${y(v)+3}" text-anchor="end" fill="#8c9c9e" font-size="9">${format(v)}</text>`).join('');const marks=points.map((point,i)=>{const px=x(i),py=y(point.value),label=`${point.date}：${point.raw}${pref.unit&&!String(point.raw).includes(pref.unit)?' '+pref.unit:''}`;return `${pref.chart==='bar'?`<rect x="${px-12}" y="${Math.min(py,y(0))}" width="24" height="${Math.max(1,Math.abs(y(0)-py))}" rx="3" fill="${color}"><title>${esc(label)}</title></rect>`:`<circle cx="${px}" cy="${py}" r="3.5" fill="${color}"><title>${esc(label)}</title></circle>`}<text x="${px}" y="${py-8}" text-anchor="middle" font-size="10" fill="#5c7960">${format(point.value)}</text><text x="${px}" y="139" text-anchor="middle" font-size="9" fill="#8c9c9e">${shortDate(point.date)}</text>`;}).join('');return `<svg class="metric-plot" viewBox="0 0 360 150" role="img" aria-label="${esc(pref.label+'，'+(pref.chart==='bar'?'柱状图':'曲线图')+'，'+points.map(p=>p.date+' '+p.raw).join('；'))}">${guides}${pref.chart!=='bar'?`<polyline points="${points.map((p,i)=>x(i)+','+y(p.value)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`:''}${marks}</svg>`;}
function validateDailyMetricSettings(archive,fail){const saved=archive.settings?.dailyMetrics;if(saved===undefined)return;if(!saved||typeof saved!=='object'||Array.isArray(saved))fail();for(const [pid,prefs] of Object.entries(saved)){if(!archive.profiles.some(p=>p.id===pid)||!Array.isArray(prefs)||prefs.length>500)fail();const keys=new Set();for(const pref of prefs){if(!pref||typeof pref!=='object'||typeof pref.key!=='string'||typeof pref.label!=='string'||!pref.label.trim()||pref.label.length>40||typeof pref.show!=='boolean'||!['line','bar'].includes(pref.chart)||keys.has(pref.key)||(!DAILY_BASE.some(m=>m.key===pref.key)&&pref.key!=='custom:'+pref.label))fail();keys.add(pref.key);}}}
let metricDragRow=null;
function moveMetricRow(row,direction){if(!row)return;const sibling=direction<0?row.previousElementSibling:row.nextElementSibling;if(!sibling)return;row.parentElement.insertBefore(row,direction<0?sibling:sibling.nextElementSibling);}
document.addEventListener('dragstart',event=>{const handle=event.target.closest('[data-metric-handle]');if(!handle)return;metricDragRow=handle.closest('.daily-metric-row');metricDragRow.classList.add('metric-dragging');event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain','daily-metric');});
document.addEventListener('dragover',event=>{const row=event.target.closest('#daily-metric-list .daily-metric-row');if(!metricDragRow||!row||row===metricDragRow||row.parentElement!==metricDragRow.parentElement)return;event.preventDefault();const box=row.getBoundingClientRect();row.parentElement.insertBefore(metricDragRow,event.clientY<box.top+box.height/2?row:row.nextElementSibling);});
document.addEventListener('drop',event=>{if(!metricDragRow)return;event.preventDefault();metricDragRow.classList.remove('metric-dragging');metricDragRow=null;});
document.addEventListener('dragend',()=>{metricDragRow?.classList.remove('metric-dragging');metricDragRow=null;});
document.addEventListener('keydown',event=>{const handle=event.target.closest('[data-metric-handle]');if(!handle||!['ArrowUp','ArrowDown'].includes(event.key))return;event.preventDefault();moveMetricRow(handle.closest('.daily-metric-row'),event.key==='ArrowUp'?-1:1);handle.focus();});

function dailyItemRow(item={label:'',value:''},pref={}){return `<div class="daily-item-row daily-metric-row" data-metric-key="${esc(pref.key||'custom:'+item.label)}" data-chart="${pref.chart||'line'}"><button type="button" class="metric-drag" data-metric-handle draggable="true" aria-label="拖动自定义指标排序" title="拖动排序，也可用上下按钮">⠿</button><input name="extraLabel" class="metric-label-input" aria-label="指标名称" placeholder="指标名称，如尿量" maxlength="40" value="${esc(item.label)}"><textarea name="extraValue" aria-label="指标数值或内容" placeholder="填写数值及单位" maxlength="1000" rows="1">${esc(item.value)}</textarea>${metricRowControls(pref,true)}</div>`;}
function openMetricPicker(){const form=$('#daily-form');if(!form)return;if($('.metric-picker')){$('#metric-new-name').focus();return;}const pid=$('[name="pid"]',form).value,visible=new Set([...form.querySelectorAll('[name="extraLabel"]')].map(el=>el.value.trim())),available=dailyMetricDefinitions(pid).filter(pref=>pref.key.startsWith('custom:')&&!visible.has(pref.label));$('#daily-metric-picker').innerHTML=`<section class="metric-picker" aria-label="选择需要增加的指标"><div class="metric-picker-title">选择已有指标，或输入新指标名称</div><div class="metric-picker-options">${available.map(pref=>`<label><input type="checkbox" name="metric-choice" value="${esc(pref.key)}">${esc(pref.label)}</label>`).join('')}</div><input type="text" id="metric-new-name" maxlength="40" placeholder="新指标名称，如尿量管理" aria-label="新指标名称"><p id="metric-picker-error" role="alert"></p><div class="metric-picker-actions">${actionBtn('cancel-metric-picker','取消','','type="button"','tiny')}${actionBtn('apply-metric-picker','添加所选','','type="button" disabled','tiny primary')}</div></section>`;$('button[form="daily-form"]').disabled=true;$('#metric-new-name').focus();}
function updateMetricPicker(){const picker=$('.metric-picker');if(!picker)return;const selected=picker.querySelector('[name="metric-choice"]:checked')||$('#metric-new-name').value.trim();$('[data-action="apply-metric-picker"]').disabled=!selected;$('#metric-picker-error').textContent='';}
function closeMetricPicker(){$('#daily-metric-picker').innerHTML='';$('button[form="daily-form"]').disabled=false;}
function applyMetricPicker(){const form=$('#daily-form'),picker=$('.metric-picker');if(!form||!picker)return;const pid=$('[name="pid"]',form).value,definitions=dailyMetricDefinitions(pid),visible=new Set([...form.querySelectorAll('[name="extraLabel"]')].map(el=>el.value.trim())),selected=[...picker.querySelectorAll('[name="metric-choice"]:checked')].map(el=>definitions.find(pref=>pref.key===el.value)).filter(Boolean),name=$('#metric-new-name').value.trim();if(name){if(visible.has(name)||DAILY_BASE.some(pref=>pref.label===name)){ $('#metric-picker-error').textContent='该指标已在填写区，请直接填写。';return;}if(!selected.some(pref=>pref.label===name))selected.push(definitions.find(pref=>pref.key==='custom:'+name)||{key:'custom:'+name,label:name,show:false,chart:'line'});}if(!selected.length)return;for(const pref of selected)if(!visible.has(pref.label)){$('#daily-custom-metrics').insertAdjacentHTML('beforeend',dailyItemRow({label:pref.label,value:''},pref));visible.add(pref.label);}closeMetricPicker();$('#daily-custom-metrics').lastElementChild?.querySelector('[name="extraValue"]').focus();}
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('#metric-new-name,[name="metric-choice"]')){event.preventDefault();const button=$('[data-action="apply-metric-picker"]');if(button&&!button.disabled)button.click();}});
function dailyForm(id=''){const e=state.events.find(e=>e.id===id&&e.dailyRecord),pid=e?.pid||preferredPerson(),definitions=dailyMetricDefinitions(pid),custom=(e?.dailyItems||[]).map(item=>({item,pref:definitions.find(pref=>pref.key==='custom:'+item.label)||{key:'custom:'+item.label,label:item.label,show:false,chart:'line'}})),base=definitions.filter(pref=>DAILY_BASE.some(m=>m.key===pref.key));showModal(e?'编辑日常指标':'添加日常指标',`<p class="modal-copy">默认填写血压和睡眠；其他指标按需增加。拖动或用 ↑↓ 排序，勾选总览及图形。</p>${formWrap('daily-form',`<input type="hidden" name="pid" value="${esc(pid)}">${field('personName','家人',pname(pid),'text','readonly')}${field('date','记录日期',e?.date||dailyDate||today(),'date','required max="'+today()+'"')}<div id="daily-metric-list"><div class="daily-metric-heading"><span>自定义指标</span>${actionBtn('add-daily-item','增加指标','plus','type="button"','tiny')}</div><div id="daily-metric-picker"></div><div id="daily-custom-metrics">${custom.map(({item,pref})=>dailyItemRow(item,pref)).join('')}</div><div class="daily-metric-heading metric-base-heading"><span>默认指标</span></div><div id="daily-base-metrics">${base.map(pref=>dailyMetricRow(pref,e?metricRawValue(e,pref.key)??'':'')).join('')}</div></div>`,`data-id="${e?.id||''}"`)}`,(e?recordDeleteButton('event',e.id):'')+submitFooter('daily-form','保存指标'));$('.modal').classList.add('daily-compact','metric-settings-modal');}
function dailyPage(){const records=sorted(scoped(state.events).filter(e=>e.dailyRecord&&(!dailyDate||e.date===dailyDate)));return `<section class="panel daily-filters">${personFilter()}<label>记录日期 <input id="daily-date" type="date" max="${today()}" value="${esc(dailyDate)}" aria-label="筛选记录日期"></label>${dailyDate?actionBtn('daily-all-dates','全部日期','','','tiny'):''}<span class="subtext">共 ${records.length} 份记录</span></section><section class="panel daily-trends">${trendChart(false)}</section><div class="daily-records">${records.map(e=>`<article class="panel daily-card"><div class="panel-header"><div class="panel-title">${personTag(e.pid)}${prettyDate(e.date)}</div>${textBtn('edit-daily','编辑',`data-id="${e.id}"`,'edit')}</div><div class="daily-values">${dailyValueTiles(e)}</div></article>`).join('')||`<section class="panel">${empty('还没有日常指标','填写每天的血压、睡眠时长，也可添加尿量等自定义指标。',actionBtn('add-daily','填写日常指标','plus','','primary'))}</section>`}</div>`;}
async function submitDaily(form,data){const get=k=>String(data.get(k)||'').trim(),old=state.events.find(e=>e.id===form.dataset.id&&e.dailyRecord),pid=old?.pid||get('pid'),date=get('date');if(!profile(pid)||!validDate(date)||date>today())throw new Error('请选择家人，并填写不晚于今天的有效日期。');const high=get('systolic'),low=get('diastolic'),sleep=get('sleepHours');if(Boolean(high)!==Boolean(low))throw new Error('请同时填写高压和低压，或将两项都留空。');let systolic,diastolic,sleepHours;if(high){systolic=numberValue(high,'高压',40,300);diastolic=numberValue(low,'低压',20,200);if(!Number.isInteger(systolic)||!Number.isInteger(diastolic)||systolic<=diastolic)throw new Error('血压请填写整数，高压需高于低压。');}if(sleep!=='')sleepHours=numberValue(sleep,'睡眠时长',0,24);const labels=data.getAll('extraLabel'),values=data.getAll('extraValue'),dailyItems=[];for(let i=0;i<labels.length;i++){const label=String(labels[i]).trim(),value=String(values[i]||'').trim();if(!value)continue;if(!label||label.length>40||value.length>1000)throw new Error('请补全指标名称和数值（名称最多 40 字，内容最多 1000 字）。');dailyItems.push({label,value});}if(dailyItems.length>10)throw new Error('每份记录最多添加 10 条自定义指标。');const preferences=dailyFormPreferences(form,pid),hasValues=systolic!==undefined||sleepHours!==undefined||dailyItems.length>0;if(!hasValues){if(old)throw new Error('请至少保留一项当天的指标数值。');await mutate(()=>{state.settings=state.settings||{};state.settings.dailyMetrics=state.settings.dailyMetrics||{};state.settings.dailyMetrics[pid]=preferences;});closeModal();toast('指标设置已保存');return;}if(state.events.some(e=>e.dailyRecord&&e.pid===pid&&e.date===date&&e.id!==old?.id))throw new Error('这位家人当天已有日常指标，请在列表中编辑补充。');const content=[systolic!==undefined?'血压：'+systolic+' / '+diastolic+' mmHg':'',sleepHours!==undefined?'睡眠时长：'+sleepHours+' 小时':'',...dailyItems.map(item=>item.label+'：'+item.value)].filter(Boolean).join('\n');const entry={id:old?.id||uid(),pid,date,type:'symptom',title:'日常指标',content,dailyRecord:true,dailyItems};if(old?.recordedAt)entry.recordedAt=old.recordedAt;if(systolic!==undefined)Object.assign(entry,{systolic,diastolic});if(sleepHours!==undefined)Object.assign(entry,{sleepHours,metric:'睡眠时长',value:sleepHours});await mutate(()=>{state.settings=state.settings||{};state.settings.dailyMetrics=state.settings.dailyMetrics||{};state.settings.dailyMetrics[pid]=preferences;if(old)state.events[state.events.findIndex(e=>e.id===old.id)]=entry;else state.events.push(entry);});closeModal();toast('日常指标已保存');}
function renderPage(){switch(activePage){case'dashboard':return dashboard();case'profiles':return profilesPage();case'daily':return dailyPage();case'visits':return visitsPage();case'timeline':return timelinePage();case'meds':return medsPage();case'reports':return reportsPage();case'drugs':return drugsPage();case'notes':return notesPage();case'trash':return trashPage();}}

function dashboard(){const meds=currentMeds(),plans=upcoming(),low=meds.filter(m=>daysLeft(m)!==null&&daysLeft(m)<=7);return `<div class="main-grid"><div class="column"><section class="panel dashboard-activity">${dashboardActivity()}</section><section class="panel">${trendChart()}</section></div><div class="column"><section class="panel"><div class="panel-header"><div class="panel-title">${icon('pill')}今日用药<small>${shortDate(today())}</small></div>${textBtn('navigate','用药管理','data-page="meds"')}</div>${doseList(meds)}${low.length?`<div class="hint-box">${icon('info')}<span>${esc(low.map(m=>pname(m.pid)+'的'+m.name).join('、'))}库存较少，可提前安排配药。<br>按手工库存与每日消耗量估算。</span></div>`:''}</section><section class="panel"><div class="panel-header"><div class="panel-title">${icon('calendar')}接下来的复诊</div>${textBtn('add-plan','添加','','plus')}</div>${plans.slice(0,2).map(appointmentCard).join('')||empty('暂无复诊安排','可以记录下次随访时间')}</section><section class="panel"><div class="panel-header"><div class="panel-title">${icon('note')}就诊准备</div>${textBtn('navigate','全部准备','data-page="notes"')}</div>${scoped(state.notes).filter(n=>!n.done).sort((a,b)=>Number(b.pinned)-Number(a.pinned)).slice(0,2).map(n=>`<button class="search-result" data-action="view-note" data-id="${n.id}" style="margin:9px 0"><strong>${esc(n.title)}</strong><small>${esc(pname(n.pid))} · ${esc(n.content.split('\n')[0])}</small></button>`).join('')||empty('还没有备忘')}${textBtn('add-note','记下新的关心','','plus')}</section></div></div>`;}
function previewEvent(e){return `<div class="timeline-row"><span class="event-icon ${e.type}">${icon(TYPES[e.type]?.[1])}</span><div class="timeline-body"><div class="timeline-title"><button data-action="view-event" data-id="${e.id}" style="padding:0;text-align:left">${esc(e.title)}</button><time>${shortDate(e.date)}</time></div><p>${esc(e.content.length>65?e.content.slice(0,65)+'…':e.content)}</p><div class="event-meta">${personTag(e.pid)}${recordLocation(e)}</div></div></div>`;}
function doseList(meds){const slots=meds.flatMap(m=>doseSlots(m).map(slot=>({m,slot}))).sort((a,b)=>a.slot.localeCompare(b.slot));if(!slots.length)return empty('暂无今日用药安排','添加药品并设置打卡时间');let last='';return slots.map(({m,slot})=>{const label=slot!==last?`<div class="med-time">${icon('clock','small-icon')}${esc(slot)} · 按处方核对</div>`:'';last=slot;const done=isTaken(m.id,slot);return `${label}<div class="dose-row"><span class="dose-symbol ${m.pid==='mom'?'purple':''}">${icon('pill')}</span><div class="dose-content"><strong>${esc(m.name)}</strong><small>${esc(pname(m.pid))} · ${esc(m.dose)}</small></div><button class="check-btn ${done?'done':''}" data-action="take" data-id="${m.id}" data-slot="${esc(slot)}" aria-label="${esc(m.name+' '+slot+(done?'撤销打卡':'标记已服'))}">${icon(done?'check':'circle')}${done?'已服用':'标记已服'}</button></div>`;}).join('');}
function appointmentCard(e){return `<div class="appointment"><div class="date-square"><small>${Number(e.date.slice(5,7))} 月</small><strong>${Number(e.date.slice(8,10))}</strong></div><div class="appointment-body"><strong><button data-action="view-event" data-id="${e.id}" style="padding:0;text-align:left">${esc(e.title)}</button></strong><p>${esc(pname(e.pid))} · ${recordLocation(e,true)}</p>${badge(e.date<today()?'日期已过 · 待确认':'待复诊',e.date<today()?'warm':'')}</div><time>${esc(e.time||'未定')}</time></div>`;}
function trendChart(overviewOnly=true){const pid=person==='all'?trendPerson:person,metrics=dailyMetricDefinitions(pid).filter(pref=>!overviewOnly||pref.show).map(pref=>({pref,series:dailyMetricSeries(pid,pref)})).filter(m=>m.series.length);return `<div class="panel-header"><div class="panel-title">${icon('activity')}日常指标趋势</div>${textBtn('add-daily','录入指标','','plus')}</div><div class="metric-overview-list">${metrics.map(({pref,series})=>{const numeric=series.filter(p=>Number.isFinite(p.value)),unit=numeric.at(-1)?.unit||'',points=numeric.filter(p=>p.unit===unit).slice(-7),latest=series.at(-1);return `<section class="metric-overview-chart" data-metric-key="${esc(pref.key)}" data-chart="${pref.chart}"><div class="chart-head"><div><div class="chart-caption">${esc(pref.label)} · ${pref.chart==='bar'?'柱状图':'曲线图'}</div><div class="metric-latest">${esc(latest.raw)}${pref.unit&&!latest.raw.includes(pref.unit)?`<small>${esc(pref.unit)}</small>`:''}</div></div><time>${shortDate(latest.date)}</time></div>${points.length?metricPlot(points,pref):empty('暂无可绘制的数值','可填写数字及单位，例如 1500 mL')}<small class="metric-chart-note">最近 ${points.length} 条可识别、单位一致的数值</small></section>`;}).join('')||empty(overviewOnly?'暂无已选指标数据':'暂无指标趋势',overviewOnly?'在日常指标中填写数值，并勾选总览显示。':'填写日常指标后显示趋势。')}</div>`;}
function profilesPage(){return `${personFilter()}<div class="record-summary" style="margin-top:20px">${state.profiles.filter(p=>person==='all'||p.id===person).map(p=>`<section class="profile-detail"><div class="profile-detail-head"><div class="member-top" style="margin:0">${avatar(p.id,true)}<div><h2>${esc(p.name)}</h2><span class="subtext">${esc(p.age||'未填写')} 岁 · ${esc(p.gender)}</span></div></div>${actionBtn('edit-profile','编辑档案','edit',`data-id="${p.id}"`,'tiny')}</div><div class="detail-grid">${[['过敏史',p.allergies],['血型',p.blood],['紧急联系信息',p.contact],['既往病史',p.history],['照护备注',p.remark]].map(([k,v])=>`<div><label>${k}</label><p>${esc(v||'未填写')}</p></div>`).join('')}</div><div class="panel-header"><div class="panel-title">${icon('activity')}健康关注</div>${textBtn('add-condition','添加疾病',`data-person="${p.id}"`,'plus')}</div>${state.conditions.filter(c=>c.pid===p.id).map(c=>`<div class="condition-row"><div class="inline-pair" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${badge(c.status)}</div><p>首次记录 ${prettyDate(c.date)} · ${esc(c.department||'科室未填')}</p><p>${esc(c.note)}</p><div class="inline-pair" style="justify-content:space-between">${textBtn('condition-timeline','关联时间线',`data-id="${c.id}" data-person="${p.id}"`)}${textBtn('edit-condition','编辑',`data-id="${c.id}"`,'edit')}</div></div>`).join('')||empty('尚未添加健康关注')}${actionBtn('profile-summary','查看就诊摘要','report',`data-id="${p.id}"`,'soft')}</section>`).join('')}</div><div class="settings-note" style="margin-top:20px">${icon('info','small-icon')} 初始档案与年龄均为虚构示例。过敏史未记录代表“未知”，请按实际信息补全。</div>`;}
function filteredEvents(){return sorted(scoped(state.events).filter(e=>!e.dailyRecord&&(timeType==='all'||e.type===timeType)&&(timeCondition==='all'||e.conditionId===timeCondition)&&(!timeFrom||e.date>=timeFrom)&&(!timeTo||e.date<=timeTo)&&(!timeSearch||[e.title,e.visitNotes,e.content,e.hospital,e.doctor,pname(e.pid),condition(e.conditionId)?.name].join(' ').toLowerCase().includes(timeSearch.toLowerCase()))));}
function timelinePage(){let events=filteredEvents();if(timeOrder==='asc')events.reverse();let month='';return `<div class="filterbar">${personFilter()}<select id="condition-filter" aria-label="按疾病筛选"><option value="all">全部疾病</option>${scoped(state.conditions).map(c=>`<option value="${c.id}" ${timeCondition===c.id?'selected':''}>${esc(pname(c.pid)+' · '+c.name)}</option>`).join('')}</select><input id="timeline-search" value="${esc(timeSearch)}" placeholder="搜索病情、医院、医生…" aria-label="搜索时间线"><input type="date" id="time-from" value="${esc(timeFrom)}" aria-label="开始日期"><span class="range-label">至</span><input type="date" id="time-to" value="${esc(timeTo)}" aria-label="结束日期"></div>${timelineTypeTabs()}<div class="page-subbar"><p>共 ${events.length} 条记录 · 保留每一个变化的来龙去脉</p><div class="inline-pair">${timeSearch||timeFrom||timeTo||timeCondition!=='all'?textBtn('reset-timeline','清除筛选','','x'):''}${textBtn('time-order',timeOrder==='desc'?'最新在前':'最早在前','','down')}</div></div><div class="timeline-full">${events.map(e=>{const m=e.date.slice(0,7),label=m!==month?`<div class="month-label">${Number(m.slice(0,4))} 年 ${Number(m.slice(5))} 月</div>`:'';month=m;return label+fullEvent(e);}).join('')||empty('没有找到匹配的记录','试试调整筛选条件，或新增一条记录',actionBtn('add-record','新增记录','plus','','primary'))}</div>`;}
function fullEvent(e){return `<article class="full-event ${e.type==='symptom'?'treatment-progress':''}" data-event-id="${e.id}"><div class="event-date"><strong>${Number(e.date.slice(8))}</strong>${Number(e.date.slice(5,7))} 月</div><span class="event-icon ${e.type}">${icon(TYPES[e.type]?.[1])}</span><div class="event-card"><div class="event-card-head"><div class="event-head-main"><h3>${esc(e.title)}</h3><div class="event-detail-foot"><div class="event-meta">${recordLocation(e,false,true)}${condition(e.conditionId)?badge(condition(e.conditionId).name,'gray'):''}</div><div class="inline-pair">${e.reportId?textBtn('view-report','查看报告',`data-id="${e.reportId}"`,'report'):''}${textBtn('view-event','详情',`data-id="${e.id}"`,'chevron')}</div></div></div><div class="tags">${personTag(e.pid)}${badge(TYPES[e.type]?.[0]||'记录',e.type==='med'?'pink':e.type==='symptom'?'warm':'gray')}</div></div><p>${esc(e.visitNotes??e.content)}</p>${e.type==='med'&&e.beforeDose?`<div class="dose-change"><span><small>调整前</small>${esc(e.beforeDose)}</span>${icon('arrow')}<span><small>调整后</small>${esc(e.afterDose)}</span></div>`:''}${e.type==='symptom'&&e.metric&&Number.isFinite(e.value)?badge(e.metric+' '+e.value+(e.metric==='睡眠时长'?' 小时':' 次'),'warm'):''}${e.type==='refill'&&e.quantity?badge(`配药 ${e.quantity} ${state.meds.find(m=>m.id===e.drugId)?.unit||'单位'}`,'warm'):''}${e.type==='plan'?`<div class="inline-pair">${badge(e.done?'已完成':e.date<today()?'日期已过 · 待确认':'待复诊',e.done?'gray':'warm')}${badge(e.time||'时间待定','gray')}${textBtn('plan-done',e.done?'撤销完成':'标记完成',`data-id="${e.id}"`,'check')}</div>`:''}</div></article>`;}
function medicationCard(m){return `<article class="med-card med-horizontal"><div class="med-identity"><div class="med-card-head"><span class="dose-symbol ${m.pid==='mom'?'purple':''}">${icon('pill')}</span><div class="tags">${personTag(m.pid)}${badge(m.status==='active'?'使用中':'已停用',m.status==='active'?'':'gray')}</div></div><div class="med-photo" data-med-photo="${m.id}">${m.photoFileId?`<span class="subtext">照片加载中…</span>`:`<span>${icon('pill')}<small>添加药品照片</small></span>`}<button type="button" data-action="edit-med" data-id="${m.id}" class="med-photo-upload">${icon('upload','small-icon')}${m.photoFileId?'更换照片':'上传照片'}</button></div><div class="med-title-row"><h3><button type="button" class="med-name-link" data-action="med-instructions" data-id="${m.id}" title="点击查看说明书，双击编辑药品">${esc(m.name)}</button></h3><div class="card-actions">${actionBtn('med-instructions','说明书','book',`data-id="${m.id}"`,'tiny')}${m.status==='active'?actionBtn('change-med','换药 / 调整','edit',`data-id="${m.id}"`,'tiny'):''}</div></div></div><div class="med-information"><div class="med-purpose"><strong>主要功能</strong><p>${esc(m.purpose||DRUGS[m.key]?.use||'尚未填写，可在维护资料中补充')}</p></div><p class="med-regimen"><strong>用药方法</strong><br>${esc(m.dose)}</p><div class="med-generic">${esc(condition(m.conditionId)?.name||'未关联疾病')} · 始于 ${prettyDate(m.start)}</div></div></article>`;}
function medsPage(){if(medsView==='reference')return `<div class="page-subbar"><p>药品说明书</p></div>${drugsPage()}`;const list=scoped(state.meds);return `<div class="page-subbar"><p>${list.length} 种药品</p><div class="inline-pair">${textBtn('navigate-drugs','药品说明书','','book')}${textBtn('dose-history','服药打卡记录','','clock')}${textBtn('interaction','核对当前用药','','shield')}</div></div>${[['active','正在使用'],['stopped','已停用']].map(([status,label])=>{const meds=list.filter(m=>m.status===status);return `<section class="med-status-section" data-med-status="${status}"><div class="med-section-heading"><h2><svg class="med-status-icon ${status}" viewBox="0 0 24 24" aria-hidden="true">${status==='active'?'<rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="m7 12 3.2 3.2L17 8.5" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>':'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m9 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'}</svg>${label}</h2><span>${meds.length} 种</span></div><div class="med-grid">${meds.map(medicationCard).join('')||'<p class="med-empty">暂无'+label+'的药品</p>'}</div></section>`;}).join('')}<section class="panel" style="margin-top:22px"><div class="panel-header"><div class="panel-title">${icon('clock')}今日服药打卡</div>${badge(shortDate(today()),'gray')}</div>${doseList(currentMeds())}</section>`;}
function filteredReports(){return sorted(scoped(state.reports).filter(r=>(reportKind==='all'||r.kind===reportKind)&&(!reportSearch||[r.title,r.hospital,r.summary,condition(r.conditionId)?.name].join(' ').toLowerCase().includes(reportSearch.toLowerCase()))));}
function reportCard(r){return `<article class="report-card"><div class="report-thumb" data-action="view-report" data-id="${r.id}" role="button" tabindex="0" aria-label="预览${esc(r.title)}"><div class="paper-preview"><strong>${esc(r.kind)}</strong>${icon('report')}${'<i></i>'.repeat(6)}</div><span class="file-type">${r.demo?'示例资料':r.mime==='application/pdf'?'PDF':'图片'}</span></div><div class="report-info"><div class="tags" style="margin-bottom:10px">${personTag(r.pid)}${badge(r.kind,'gray')}</div><h3>${esc(r.title)}</h3><p>${prettyDate(r.date)} · ${recordLocation(r)}</p><div class="report-actions">${badge(condition(r.conditionId)?.name||'未关联疾病','gray')}${textBtn('view-report','查看资料',`data-id="${r.id}"`,'chevron')}</div></div></article>`;}
function reportsPage(){const list=filteredReports(),groups=new Map();for(const r of list){const c=condition(r.conditionId),id=c?.id||'unassigned';if(!groups.has(id))groups.set(id,{name:c?.name||'未关联疾病',reports:[]});groups.get(id).reports.push(r);}return `<div class="filterbar reports-toolbar"><select id="report-kind" aria-label="报告类型"><option value="all">全部资料类型</option>${['影像检查','检验报告','门诊病历','处方配药','其他资料'].map(k=>`<option ${reportKind===k?'selected':''}>${k}</option>`).join('')}</select><input id="report-search" placeholder="搜索疾病、报告、医院…" value="${esc(reportSearch)}" aria-label="搜索报告">${actionBtn('upload','上传报告','upload','','primary report-upload')}</div><div class="page-subbar"><p>已归档 ${list.length} 份资料 · 按疾病归类</p><span class="range-label">${LOCAL_PREVIEW?'本地预览附件':'原件已保存到当前账号云端，可随备份导出'}</span></div><div class="report-groups">${[...groups].sort(([a],[b])=>Number(a==='unassigned')-Number(b==='unassigned')).map(([id,group])=>`<section class="report-group" data-condition-id="${esc(id)}"><h2 class="report-group-title">${icon('activity')}${esc(group.name)}<small>${group.reports.length} 份</small></h2><div class="report-grid">${group.reports.map(reportCard).join('')}</div></section>`).join('')||empty('还没有匹配的资料','上传报告并关联疾病后，会在对应疾病下归档。')}</div>`;}
const noteCategories={care:'照护医嘱',life:'日常注意',question:'待问医生'};
function notesPage(){const notes=scoped(state.notes).filter(n=>noteTab==='all'||noteTab==='pinned'&&n.pinned||noteTab==='done'&&n.done||n.category===noteTab).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.date.localeCompare(a.date));return `<div class="filterbar">${personFilter()}<div class="chip-row">${[['all','全部准备'],['pinned','已置顶'],['care','照护医嘱'],['life','日常注意'],['question','待问医生'],['done','已完成']].map(([id,n])=>`<button class="chip ${noteTab===id?'active':''}" data-action="note-tab" data-tab="${id}">${n}</button>`).join('')}</div></div><div class="page-subbar"><p>共 ${notes.length} 条关心 · 医嘱请填写来源和日期</p></div><div class="notes-grid">${notes.map(n=>`<article class="note-card ${n.category} ${n.done?'done':''}"><div class="inline-pair" style="justify-content:space-between"><div class="tags">${personTag(n.pid)}${badge(noteCategories[n.category]||'备忘','gray')}</div><button class="pin-btn ${n.pinned?'pinned':''}" data-action="pin-note" data-id="${n.id}" aria-label="${n.pinned?'取消置顶':'置顶备忘'}">${icon('pin','small-icon')}</button></div><h3>${esc(n.title)}</h3><p>${esc(n.content)}</p><div class="note-source">来源：${esc(n.source||'未填写')}<br>${prettyDate(n.date)}</div><div class="note-card-footer"><button data-action="note-done" data-id="${n.id}" style="padding:0">${icon(n.done?'circlecheck':'circle','small-icon')} ${n.done?'已完成':'标记完成'}</button>${textBtn('edit-note','编辑',`data-id="${n.id}"`,'edit')}</div></article>`).join('')||empty('还没有此类备忘','写下需要注意的事情或下次就诊要问的问题',actionBtn('add-note','添加准备事项','plus','','primary'))}</div>`;}
function openMedInstructions(id){const m=state.meds.find(m=>m.id===id&&m.pid===person);if(!m)return;if(m.key&&Object.hasOwn(DRUGS,m.key)){selectedDrug=m.key;navigate('drugs');return;}showModal(m.name+' · 用药资料',`<p class="modal-copy">此药尚未关联说明书资料，可在维护药品资料时关联已有说明书。</p><section class="settings-card"><h3>主要功能</h3><p>${esc(m.purpose||'未填写')}</p><h3>已登记用药方法</h3><p>${esc(m.dose)}</p></section>`,`${actionBtn('edit-med','维护药品资料','edit',`data-id="${m.id}"`)}${actionBtn('close','关闭')}`);}
function drugsPage(){const available=Object.entries(DRUGS).filter(([key])=>scoped(state.meds).some(m=>m.key===key));if(!available.length)return empty('当前家人暂无可查看的用药资料','先在用药管理中登记药物并关联资料。',actionBtn('navigate','管理当前用药','pill','data-page="meds"','primary'));if(!available.some(([key])=>key===selectedDrug))selectedDrug=available[0][0];const d=DRUGS[selectedDrug];return `<div class="settings-note" style="margin-bottom:20px">${icon('book','small-icon')} 演示资料库收录 4 种药物与 2 组相互作用提示，非实时、非完整说明书。来源为美国 DailyMed 标签；不同地区及剂型可能不同，请以实际产品说明书与医嘱核对。</div><div class="drug-layout"><aside class="drug-list"><input id="drug-search" placeholder="按中文 / 英文名查找…" aria-label="搜索药物资料"><div class="drug-options">${available.map(([k,d])=>`<button class="drug-option ${selectedDrug===k?'active':''}" data-action="select-drug" data-key="${k}" data-drug-name="${esc(d.name+' '+d.en)}"><strong>${d.name}</strong><small>${d.category}</small></button>`).join('')}</div><p id="drug-empty" class="subtext hidden">未收录该药，请咨询药师或查询产品说明书。</p></aside><div><article class="drug-detail"><div class="inline-pair" style="justify-content:space-between;align-items:flex-start"><div><h2>${d.name}</h2><div class="subtext">${d.en}</div></div>${badge(d.category)}</div>${[['info','用途概览',d.use],['pill','使用方法',d.method],['warning','可能的副作用',d.side],['shield','使用注意',d.attention],['activity','药物相互影响',d.interaction]].map(([i,t,c])=>`<section><h3>${icon(i)}${t}</h3><p>${esc(c)}</p></section>`).join('')}<div style="border-top:1px solid var(--line);padding-top:17px"><a class="source-link" href="${d.url}" target="_blank" rel="noopener noreferrer">DailyMed · 查看原始说明书${icon('external')}</a><div class="subtext" style="margin-top:7px">查阅日期：2026.10.23 · 内容为摘要，并非全部风险或适应证</div></div></article><section class="interaction-box"><div class="panel-title">${icon('shield')}核对两种药物</div><div class="subtext" style="margin-top:7px">仅匹配已收录的两组规则，不能据此排除其他风险</div><div class="interaction-selects"><select id="drug-a" aria-label="第一种药物">${available.map(([key,d])=>`<option function interactionOptions(sel){return Object.entries(INTERACTION_KEYS).map(([k,n])=>`<option value="${k}" ${sel===k?'selected':''}>${n}</option>`).join('');}

function collectTrash(kind,id){const key=RECORD_KEYS[kind],entry=kind==='log'?state.logs.find(l=>logID(l)===id):state[key]?.find(x=>x.id===id),root=kind==='log'&&entry?{...entry,pid:state.meds.find(m=>m.id===entry.medId)?.pid,title:'服药打卡 · '+state.meds.find(m=>m.id===entry.medId)?.name}:entry;if(!root||kind==='profile')return null;const chosen=Object.fromEntries(TRASH_KEYS.map(k=>[k,new Set()]));chosen[key].add(id);let changed=true;while(changed){changed=false;const add=(k,id)=>{if(!chosen[k].has(id)){chosen[k].add(id);changed=true;}};for(const m of state.meds)if(chosen.conditions.has(m.conditionId))add('meds',m.id);for(const e of state.events){if(chosen.conditions.has(e.conditionId)||chosen.meds.has(e.drugId)||chosen.meds.has(e.replacementId)||chosen.reports.has(e.reportId)||chosen.events.has(e.visitEventId))add('events',e.id);if(chosen.events.has(e.id)&&e.reportId)add('reports',e.reportId);}for(const r of state.reports)if(chosen.conditions.has(r.conditionId)||chosen.events.has(r.visitEventId))add('reports',r.id);}
 const data=Object.fromEntries(TRASH_KEYS.map(k=>[k,structuredClone(k==='logs'?state.logs.filter(l=>chosen.meds.has(l.medId)||chosen.logs.has(logID(l))):state[k].filter(x=>chosen[k].has(x.id)))]));return {id:uid(),pid:root.pid,kind,title:root.title||root.name||'记录',deletedAt:new Date().toISOString(),data};}
async function moveToTrash(kind,id){const group=collectTrash(kind,id);if(!group)return;await mutate(()=>{state.trash=state.trash||[];state.trash.push(group);for(const k of TRASH_KEYS){if(k==='logs'){const meds=new Set(group.data.meds.map(m=>m.id));const logs=new Set(group.data.logs.map(logID));state.logs=state.logs.filter(l=>!meds.has(l.medId)&&!logs.has(logID(l)));}else{const ids=new Set(group.data[k].map(x=>x.id));state[k]=state[k].filter(x=>!ids.has(x.id));}}for(const e of group.data.events)visitDrafts.delete(e.id);});closeModal();toast('已移入回收站，可恢复');}
function missingReferences(archive){const missing=[];const need=(key,id)=>{if(id&&!archive[key].some(x=>x.id===id))missing.push([key,id]);};for(const key of ['meds','events','reports'])for(const x of archive[key])need('conditions',x.conditionId);for(const e of archive.events){need('meds',e.drugId);need('meds',e.replacementId);need('reports',e.reportId);need('events',e.visitEventId);}for(const r of archive.reports)need('events',r.visitEventId);for(const l of archive.logs)need('meds',l.medId);return missing;}
function restoredArchive(selected){const next=structuredClone(state);for(const k of TRASH_KEYS){const existing=new Set(next[k].map(x=>k==='logs'?x.medId+'|'+x.date+'|'+x.slot:x.id));for(const g of state.trash||[])if(selected.has(g.id))for(const x of g.data[k]){const id=k==='logs'?x.medId+'|'+x.date+'|'+x.slot:x.id;if(!existing.has(id)){next[k].push(structuredClone(x));existing.add(id);}}}next.trash=(state.trash||[]).filter(g=>!selected.has(g.id));return next;}

 for(const e of s.events)if(e.dailyRecord){if(e.type!=='symptom'||typeof e.dailyRecord!=='boolean'||!Array.isArray(e.dailyItems)||e.dailyItems.length>10||e.dailyItems.some(item=>!item||typeof item.label!=='string'||!item.label.trim()||item.label.length>40||typeof item.value!=='string'||!item.value.trim()||item.value.length>1000))fail();if((e.systolic===undefined)!==(e.diastolic===undefined))fail();if(e.systolic!==undefined&&(!safeNumber(e.systolic,40,300)||!safeNumber(e.diastolic,20,200)||!Number.isInteger(e.systolic)||!Number.isInteger(e.diastolic)||e.systolic<=e.diastolic))fail();if(e.sleepHours!==undefined&&(!safeNumber(e.sleepHours,0,24)||e.metric!=='睡眠时长'||e.value!==e.sleepHours))fail();if(e.systolic===undefined&&e.sleepHours===undefined&&!e.dailyItems.length)fail();}

 for(const key of ['events','meds','reports'])for(const o of s[key])if(o.conditionId&&!s.conditions.some(c=>c.id===o.conditionId&&c.pid===o.pid))fail();
 for(const e of s.events){if(e.drugId&&!s.meds.some(m=>m.id===e.drugId&&m.pid===e.pid))fail();if(e.reportId&&!s.reports.some(r=>r.id===e.reportId&&r.pid===e.pid))fail();}

 if(!Array.isArray(raw.attachments)||raw.attachments.length>5000)fail();const files=[],ids=new Set();
 for(const f of raw.attachments){if(!validID(f.id)||ids.has(f.id)||typeof f.name!=='string'||f.name.length>500||!['application/pdf','image/jpeg','image/png','image/webp'].includes(f.type)||typeof f.data!=='string'||f.data.length>14000000||(f.data.length%4!==0||/[^A-Za-z0-9+/=]/.test(f.data)))fail();ids.add(f.id);let bytes;try{bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));}catch{fail();}if(bytes.length>10*1024*1024)fail();files.push({id:f.id,name:f.name,blob:new Blob([bytes],{type:f.type})});}
