function renderPage(){switch(activePage){case'dashboard':return dashboard();case'profiles':return profilesPage();case'daily':return dailyPage();case'visits':return visitsPage();case'timeline':return timelinePage();case'meds':return medsPage();case'reports':return reportsPage();case'drugs':return drugsPage();case'notes':return notesPage();}}
function personFilter(){return `<div class="chip-row">${[['all','全部家人'],...state.profiles.map(p=>[p.id,p.name])].map(([id,n])=>`<button class="chip ${person===id?'active':''}" data-action="person" data-person="${id}">${esc(n)}</button>`).join('')}</div>`;}
function memberCard(p){const last=sorted(state.events.filter(e=>e.pid===p.id&&e.type==='visit'))[0];return `<div class="member-card"><span class="member-flag">${['self','wife'].includes(p.id)?'家人档案':state.settings?.demo?'虚构示例':'家人档案'}</span><div class="member-top">${avatar(p.id,true)}<div><div class="member-name">${esc(p.name)}</div><div class="member-meta">${p.age?esc(p.age)+' 岁 · ':''}${p.gender&&p.gender!=='未填写'?esc(p.gender)+' · ':''}${p.age||p.gender!=='未填写'?'家庭成员':'资料待填写'}</div></div></div><div class="member-bottom"><span>最近就诊 <strong>${shortDate(last?.date)}</strong></span><button data-action="view-profile" data-id="${p.id}">健康档案${icon('chevron')}</button></div></div>`;}
function dashboard(){const meds=currentMeds(),plans=upcoming(),low=meds.filter(m=>daysLeft(m)!==null&&daysLeft(m)<=7),events=sorted(scoped(state.events).filter(e=>e.type!=='plan'&&e.type!=='symptom')).slice(0,4);return `<section class="panel family-overview"><div class="panel-header"><div class="panel-title">${icon('people')}家人的健康档案</div><div class="family-overview-actions">${textBtn('navigate','查看全部','data-page="profiles"')}<div class="hero-art">${heroArt()}</div></div></div><div class="members-grid">${scoped(state.profiles.map(p=>({...p,pid:p.id}))).map(memberCard).join('')}</div></section><div class="main-grid"><div class="column"><section class="panel"><div class="panel-header"><div class="panel-title">${icon('timeline')}最近健康动态<small>每一步，都记得</small></div>${textBtn('navigate','完整时间线','data-page="timeline"')}</div><div class="timeline-preview">${events.map(previewEvent).join('')||empty('还没有健康记录','从一次就诊或病情观察开始')}</div></section><section class="panel">${trendChart()}</section></div><div class="column"><section class="panel"><div class="panel-header"><div class="panel-title">${icon('pill')}今日用药<small>${shortDate(today())}</small></div>${textBtn('navigate','用药管理','data-page="meds"')}</div>${doseList(meds)}${low.length?`<div class="hint-box">${icon('info')}<span>${esc(low.map(m=>pname(m.pid)+'的'+m.name).join('、'))}库存较少，可提前安排配药。<br>按手工库存与每日消耗量估算。</span></div>`:''}</section><section class="panel"><div class="panel-header"><div class="panel-title">${icon('calendar')}接下来的复诊</div>${textBtn('add-plan','添加','','plus')}</div>${plans.slice(0,2).map(appointmentCard).join('')||empty('暂无复诊安排','可以记录下次随访时间')}</section><section class="panel"><div class="panel-header"><div class="panel-title">${icon('note')}就诊准备</div>${textBtn('navigate','全部准备','data-page="notes"')}</div>${scoped(state.notes).filter(n=>!n.done).sort((a,b)=>Number(b.pinned)-Number(a.pinned)).slice(0,2).map(n=>`<button class="search-result" data-action="view-note" data-id="${n.id}" style="margin:9px 0"><strong>${esc(n.title)}</strong><small>${esc(pname(n.pid))} · ${esc(n.content.split('\n')[0])}</small></button>`).join('')||empty('还没有备忘')}${textBtn('add-note','记下新的关心','','plus')}</section></div></div>`;}
function previewEvent(e){return `<div class="timeline-row"><span class="event-icon ${e.type}">${icon(TYPES[e.type]?.[1])}</span><div class="timeline-body"><div class="timeline-title"><button data-action="view-event" data-id="${e.id}" style="padding:0;text-align:left">${esc(e.title)}</button><time>${shortDate(e.date)}</time></div><p>${esc(e.content.length>65?e.content.slice(0,65)+'…':e.content)}</p><div class="event-meta">${personTag(e.pid)}<span>${esc(e.hospital||TYPES[e.type]?.[0])}</span></div></div></div>`;}
function doseList(meds){const slots=meds.flatMap(m=>doseSlots(m).map(slot=>({m,slot}))).sort((a,b)=>a.slot.localeCompare(b.slot));if(!slots.length)return empty('暂无今日用药安排','添加药品并设置打卡时间');let last='';return slots.map(({m,slot})=>{const label=slot!==last?`<div class="med-time">${icon('clock','small-icon')}${esc(slot)} · 按处方核对</div>`:'';last=slot;const done=isTaken(m.id,slot);return `${label}<div class="dose-row"><span class="dose-symbol ${m.pid==='mom'?'purple':''}">${icon('pill')}</span><div class="dose-content"><strong>${esc(m.name)}</strong><small>${esc(pname(m.pid))} · ${esc(m.dose)}</small></div><button class="check-btn ${done?'done':''}" data-action="take" data-id="${m.id}" data-slot="${esc(slot)}" aria-label="${esc(m.name+' '+slot+(done?'撤销打卡':'标记已服'))}">${icon(done?'check':'circle')}${done?'已服用':'标记已服'}</button></div>`;}).join('');}
function appointmentCard(e){return `<div class="appointment"><div class="date-square"><small>${Number(e.date.slice(5,7))} 月</small><strong>${Number(e.date.slice(8,10))}</strong></div><div class="appointment-body"><strong><button data-action="view-event" data-id="${e.id}" style="padding:0;text-align:left">${esc(e.title)}</button></strong><p>${esc(pname(e.pid))} · ${esc(e.hospital||'医院待定')}</p>${badge(e.date<today()?'日期已过 · 待确认':'待复诊',e.date<today()?'warm':'')}</div><time>${esc(e.time||'未定')}</time></div>`;}
function trendChart(){const pid=person==='all'?trendPerson:person,metric=pid==='dad'?'夜间起夜':'睡眠时长',unit=pid==='dad'?'次':'小时',data=sorted(state.events.filter(e=>e.pid===pid&&e.type==='symptom'&&e.metric===metric&&Number.isFinite(e.value))).slice(0,7).reverse(),max=Math.max(pid==='dad'?4:8,...data.map(e=>e.value));return `<div class="panel-header"><div class="panel-title">${icon('activity')}日常观察趋势</div><div class="segmented">${state.profiles.map(p=>`<button data-action="trend" data-id="${p.id}" class="${pid===p.id?'active':''}">${esc(p.name)}</button>`).join('')}</div></div><div class="chart-head"><div><div class="chart-caption">${esc(metric)} · 最近 ${data.length} 条记录</div><div class="chart-value">${data.at(-1)?.value??'—'}<small>${unit}</small></div></div><span class="tag gray">手工记录</span></div>${data.length?`<div class="chart" role="img" aria-label="${esc(metric+data.map(e=>e.date+' '+e.value+unit).join('，'))}"><div class="chart-lines">${[max,max/2,0].map(n=>`<i><span>${Number(n.toFixed(1))}</span></i>`).join('')}</div><div class="bars">${data.map(e=>`<div class="bar" style="height:${Math.max(2,e.value/max*91)}%" title="${esc(e.date+'：'+e.value+unit)}"><span class="bar-val">${e.value}</span><span class="bar-label">${shortDate(e.date)}</span></div>`).join('')}</div></div>`:empty('暂无可绘制的记录','新增病情记录时填写观察指标')}<div class="chart-foot"><span>仅反映已录入数据，不作诊断判断</span>${textBtn('add-symptom','记录今天','','plus')}</div>`;}
function profilesPage(){return `${personFilter()}<div class="record-summary" style="margin-top:20px">${state.profiles.filter(p=>person==='all'||p.id===person).map(p=>`<section class="profile-detail"><div class="profile-detail-head"><div class="member-top" style="margin:0">${avatar(p.id,true)}<div><h2>${esc(p.name)}</h2><span class="subtext">${esc(p.age||'未填写')} 岁 · ${esc(p.gender)}</span></div></div>${actionBtn('edit-profile','编辑档案','edit',`data-id="${p.id}"`,'tiny')}</div><div class="detail-grid">${[['过敏史',p.allergies],['血型',p.blood],['紧急联系信息',p.contact],['既往病史',p.history],['照护备注',p.remark]].map(([k,v])=>`<div><label>${k}</label><p>${esc(v||'未填写')}</p></div>`).join('')}</div><div class="panel-header"><div class="panel-title">${icon('activity')}健康关注</div>${textBtn('add-condition','添加疾病',`data-person="${p.id}"`,'plus')}</div>${state.conditions.filter(c=>c.pid===p.id).map(c=>`<div class="condition-row"><div class="inline-pair" style="justify-content:space-between"><h3>${esc(c.name)}</h3>${badge(c.status)}</div><p>首次记录 ${prettyDate(c.date)} · ${esc(c.department||'科室未填')}</p><p>${esc(c.note)}</p><div class="inline-pair" style="justify-content:space-between">${textBtn('condition-timeline','关联时间线',`data-id="${c.id}" data-person="${p.id}"`)}${textBtn('edit-condition','编辑',`data-id="${c.id}"`,'edit')}</div></div>`).join('')||empty('尚未添加健康关注')}${actionBtn('profile-summary','查看就诊摘要','report',`data-id="${p.id}"`,'soft')}</section>`).join('')}</div><div class="settings-note" style="margin-top:20px">${icon('info','small-icon')} 初始档案与年龄均为虚构示例。过敏史未记录代表“未知”，请按实际信息补全。</div>`;}
function filteredEvents(){return sorted(scoped(state.events).filter(e=>(timeType==='all'||e.type===timeType)&&(timeCondition==='all'||e.conditionId===timeCondition)&&(!timeFrom||e.date>=timeFrom)&&(!timeTo||e.date<=timeTo)&&(!timeSearch||[e.title,e.content,e.hospital,e.doctor,pname(e.pid),condition(e.conditionId)?.name].join(' ').toLowerCase().includes(timeSearch.toLowerCase()))));}
function timelinePage(){let events=filteredEvents();if(timeOrder==='asc')events.reverse();let month='';return `<div class="filterbar">${personFilter()}<select id="condition-filter" aria-label="按疾病筛选"><option value="all">全部疾病</option>${scoped(state.conditions).map(c=>`<option value="${c.id}" ${timeCondition===c.id?'selected':''}>${esc(pname(c.pid)+' · '+c.name)}</option>`).join('')}</select><input id="timeline-search" value="${esc(timeSearch)}" placeholder="搜索病情、医院、医生…" aria-label="搜索时间线"><input type="date" id="time-from" value="${esc(timeFrom)}" aria-label="开始日期"><span class="range-label">至</span><input type="date" id="time-to" value="${esc(timeTo)}" aria-label="结束日期"></div><div class="chip-row">${[['all','全部记录'],...Object.entries(TYPES).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="chip ${timeType===k?'active':''}" data-action="time-type" data-type="${k}">${l}</button>`).join('')}</div><div class="page-subbar"><p>共 ${events.length} 条记录 · 保留每一个变化的来龙去脉</p><div class="inline-pair">${timeSearch||timeFrom||timeTo||timeCondition!=='all'?textBtn('reset-timeline','清除筛选','','x'):''}${textBtn('time-order',timeOrder==='desc'?'最新在前':'最早在前','','down')}</div></div><div class="timeline-full">${events.map(e=>{const m=e.date.slice(0,7),label=m!==month?`<div class="month-label">${Number(m.slice(0,4))} 年 ${Number(m.slice(5))} 月</div>`:'';month=m;return label+fullEvent(e);}).join('')||empty('没有找到匹配的记录','试试调整筛选条件，或新增一条记录',actionBtn('add-record','新增记录','plus','','primary'))}</div>`;}
function fullEvent(e){return `<article class="full-event"><div class="event-date"><strong>${Number(e.date.slice(8))}</strong>${Number(e.date.slice(5,7))} 月</div><span class="event-icon ${e.type}">${icon(TYPES[e.type]?.[1])}</span><div class="event-card"><div class="event-card-head"><h3>${esc(e.title)}</h3><div class="tags">${personTag(e.pid)}${badge(TYPES[e.type]?.[0]||'记录',e.type==='med'?'pink':e.type==='symptom'?'warm':'gray')}</div></div><p>${esc(e.content)}</p>${e.type==='med'&&e.beforeDose?`<div class="dose-change"><span><small>调整前</small>${esc(e.beforeDose)}</span>${icon('arrow')}<span><small>调整后</small>${esc(e.afterDose)}</span></div>`:''}${e.type==='symptom'&&e.metric&&Number.isFinite(e.value)?badge(e.metric+' '+e.value+(e.metric==='睡眠时长'?' 小时':' 次'),'warm'):''}${e.type==='refill'&&e.quantity?badge(`配药 ${e.quantity} ${state.meds.find(m=>m.id===e.drugId)?.unit||'单位'}`,'warm'):''}${e.type==='plan'?`<div class="inline-pair">${badge(e.done?'已完成':e.date<today()?'日期已过 · 待确认':'待复诊',e.done?'gray':'warm')}${badge(e.time||'时间待定','gray')}${textBtn('plan-done',e.done?'撤销完成':'标记完成',`data-id="${e.id}"`,'check')}</div>`:''}<div class="event-detail-foot"><div class="event-meta"><span>${esc([e.hospital,e.doctor].filter(Boolean).join(' · ')||'家人记录')}</span>${condition(e.conditionId)?badge(condition(e.conditionId).name,'gray'):''}</div><div class="inline-pair">${e.reportId?textBtn('view-report','查看报告',`data-id="${e.reportId}"`,'report'):''}${textBtn('view-event','详情',`data-id="${e.id}"`,'chevron')}</div></div></div></article>`;}
function medsPage(){const list=scoped(state.meds).filter(m=>medTab==='all'||m.status===medTab),low=currentMeds().filter(m=>daysLeft(m)!==null&&daysLeft(m)<=7);return `<div class="filterbar">${personFilter()}<div class="chip-row">${[['active','当前用药'],['stopped','已停用'],['all','全部药品']].map(([k,n])=>`<button class="chip ${medTab===k?'active':''}" data-action="med-tab" data-tab="${k}">${n}</button>`).join('')}</div>${textBtn('dose-history','服药打卡记录','','clock')}</div><div class="settings-note">${icon('info','small-icon')} 这里保存的是家庭用药记录。剂量、时间与停换药均以医生处方为准；库存由你手工维护，打卡不会自动扣减。</div>${low.length?`<div class="hint-box" style="margin:16px 0">${icon('refill')}按登记库存估算，${esc(low.map(m=>pname(m.pid)+'的'+m.name).join('、'))}不足 8 天。配药时可登记数量并同步库存。</div>`:''}<div class="page-subbar"><p>${list.length} 种药品 · 方案变更会留在时间线中</p>${textBtn('interaction','核对当前用药','','shield')}</div><div class="med-grid">${list.map(m=>{const days=daysLeft(m);return `<article class="med-card"><div class="med-card-head"><span class="dose-symbol ${m.pid==='mom'?'purple':''}">${icon('pill')}</span><div class="tags">${personTag(m.pid)}${badge(m.status==='active'?'使用中':'已停用',m.status==='active'?'':'gray')}</div></div><h3>${esc(m.name)}</h3><div class="med-generic">${esc(condition(m.conditionId)?.name||'未关联疾病')} · 始于 ${prettyDate(m.start)}</div><p class="med-regimen">${esc(m.dose)}<br><small>打卡时间 ${esc(m.times||'未设置')}</small></p><div class="kv-row"><span>当前库存</span><strong>${m.stock} ${esc(m.unit)}</strong></div><div class="stock-track ${days!==null&&days<=7?'low':''}"><div style="width:${Math.min(100,Math.max(0,(days??0)/30*100))}%"></div></div><div class="kv-row"><span>${days===null?'每日消耗量未填写，暂不能估算':`手工库存约可用 ${days} 天`}</span>${textBtn('refill-med','配药登记',`data-id="${m.id}"`,'plus')}</div><div class="card-actions">${actionBtn('view-med','查看详情','pill',`data-id="${m.id}"`,'tiny')}${m.status==='active'?actionBtn('change-med','换药 / 调整','edit',`data-id="${m.id}"`,'tiny'):''}${m.key&&DRUGS[m.key]?actionBtn('drug','说明书','book',`data-key="${m.key}"`,'tiny'):''}</div></article>`;}).join('')||empty('还没有此类用药记录','添加后可记录服药时间、库存与方案变化',actionBtn('add-med','添加用药','plus','','primary'))}</div>${medTab!=='stopped'?`<section class="panel" style="margin-top:22px"><div class="panel-header"><div class="panel-title">${icon('clock')}今日服药打卡<small>只记录，不改变处方</small></div>${badge(shortDate(today()),'gray')}</div>${doseList(currentMeds())}</section>`:''}`;}
function filteredReports(){return sorted(scoped(state.reports).filter(r=>(reportKind==='all'||r.kind===reportKind)&&(!reportSearch||[r.title,r.hospital,r.summary,condition(r.conditionId)?.name].join(' ').toLowerCase().includes(reportSearch.toLowerCase()))));}
function reportsPage(){const list=filteredReports();return `<div class="filterbar">${personFilter()}<select id="report-kind" aria-label="报告类型"><option value="all">全部资料类型</option>${['影像检查','检验报告','门诊病历','处方配药','其他资料'].map(k=>`<option ${reportKind===k?'selected':''}>${k}</option>`).join('')}</select><input id="report-search" placeholder="搜索报告、医院、结论…" value="${esc(reportSearch)}" aria-label="搜索报告"></div><div class="upload-zone" id="drop-zone" role="button" tabindex="0" data-action="upload" aria-label="上传检查报告">${icon('upload')}<div><strong>把每一份报告，好好收在这里</strong><p>点击上传，或拖入文件 · PDF / JPG / PNG / WEBP · 每份最大 10 MB</p></div><span class="btn soft">选择文件</span></div><div class="page-subbar"><p>已归档 ${list.length} 份资料 · 上传后自动加入时间线</p><span class="range-label">原件保存在当前浏览器，可随备份导出</span></div><div class="report-grid">${list.map(r=>`<article class="report-card"><div class="report-thumb" data-action="view-report" data-id="${r.id}" role="button" tabindex="0" aria-label="预览${esc(r.title)}"><div class="paper-preview"><strong>${esc(r.kind)}</strong>${icon('report')}${'<i></i>'.repeat(6)}</div><span class="file-type">${r.demo?'示例资料':r.mime==='application/pdf'?'PDF':'图片'}</span></div><div class="report-info"><div class="tags" style="margin-bottom:10px">${personTag(r.pid)}${badge(r.kind,'gray')}</div><h3>${esc(r.title)}</h3><p>${prettyDate(r.date)} · ${esc(r.hospital||'医院未填写')}</p><div class="report-actions">${badge(condition(r.conditionId)?.name||'未关联疾病','gray')}${textBtn('view-report','查看资料',`data-id="${r.id}"`,'chevron')}</div></div></article>`).join('')||empty('还没有匹配的资料','上传后可以预览原件，按家人和疾病归档')}</div>`;}
const noteCategories={care:'照护医嘱',life:'日常注意',question:'待问医生'};
function notesPage(){const notes=scoped(state.notes).filter(n=>noteTab==='all'||noteTab==='pinned'&&n.pinned||noteTab==='done'&&n.done||n.category===noteTab).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.date.localeCompare(a.date));return `<div class="filterbar">${personFilter()}<div class="chip-row">${[['all','全部准备'],['pinned','已置顶'],['care','照护医嘱'],['life','日常注意'],['question','待问医生'],['done','已完成']].map(([id,n])=>`<button class="chip ${noteTab===id?'active':''}" data-action="note-tab" data-tab="${id}">${n}</button>`).join('')}</div></div><div class="page-subbar"><p>共 ${notes.length} 条关心 · 医嘱请填写来源和日期</p></div><div class="notes-grid">${notes.map(n=>`<article class="note-card ${n.category} ${n.done?'done':''}"><div class="inline-pair" style="justify-content:space-between"><div class="tags">${personTag(n.pid)}${badge(noteCategories[n.category]||'备忘','gray')}</div><button class="pin-btn ${n.pinned?'pinned':''}" data-action="pin-note" data-id="${n.id}" aria-label="${n.pinned?'取消置顶':'置顶备忘'}">${icon('pin','small-icon')}</button></div><h3>${esc(n.title)}</h3><p>${esc(n.content)}</p><div class="note-source">来源：${esc(n.source||'未填写')}<br>${prettyDate(n.date)}</div><div class="note-card-footer"><button data-action="note-done" data-id="${n.id}" style="padding:0">${icon(n.done?'circlecheck':'circle','small-icon')} ${n.done?'已完成':'标记完成'}</button>${textBtn('edit-note','编辑',`data-id="${n.id}"`,'edit')}</div></article>`).join('')||empty('还没有此类备忘','写下需要注意的事情或下次就诊要问的问题',actionBtn('add-note','添加准备事项','plus','','primary'))}</div>`;}
function drugsPage(){const d=DRUGS[selectedDrug];return `<div class="settings-note" style="margin-bottom:20px">${icon('book','small-icon')} 演示资料库收录 4 种药物与 2 组相互作用提示，非实时、非完整说明书。来源为美国 DailyMed 标签；不同地区及剂型可能不同，请以实际产品说明书与医嘱核对。</div><div class="drug-layout"><aside class="drug-list"><input id="drug-search" placeholder="按中文 / 英文名查找…" aria-label="搜索药物资料"><div class="drug-options">${Object.entries(DRUGS).map(([k,d])=>`<button class="drug-option ${selectedDrug===k?'active':''}" data-action="select-drug" data-key="${k}" data-drug-name="${esc(d.name+' '+d.en)}"><strong>${d.name}</strong><small>${d.category}</small></button>`).join('')}</div><p id="drug-empty" class="subtext hidden">未收录该药，请咨询药师或查询产品说明书。</p></aside><div><article class="drug-detail"><div class="inline-pair" style="justify-content:space-between;align-items:flex-start"><div><h2>${d.name}</h2><div class="subtext">${d.en}</div></div>${badge(d.category)}</div>${[['info','用途概览',d.use],['pill','使用方法',d.method],['warning','可能的副作用',d.side],['shield','使用注意',d.attention],['activity','药物相互影响',d.interaction]].map(([i,t,c])=>`<section><h3>${icon(i)}${t}</h3><p>${esc(c)}</p></section>`).join('')}<div style="border-top:1px solid var(--line);padding-top:17px"><a class="source-link" href="${d.url}" target="_blank" rel="noopener noreferrer">DailyMed · 查看原始说明书${icon('external')}</a><div class="subtext" style="margin-top:7px">查阅日期：2026.10.23 · 内容为摘要，并非全部风险或适应证</div></div></article><section class="interaction-box"><div class="panel-title">${icon('shield')}核对两种药物</div><div class="subtext" style="margin-top:7px">仅匹配已收录的两组规则，不能据此排除其他风险</div><div class="interaction-selects"><select id="drug-a" aria-label="第一种药物">${interactionOptions('mirtazapine')}</select><select id="drug-b" aria-label="第二种药物">${interactionOptions('alprazolam')}</select>${actionBtn('check-pair','查看提示','search','','primary')}</div><div id="pair-result"></div></section></div></div>`;}
function interactionOptions(sel){return Object.entries(INTERACTION_KEYS).map(([k,n])=>`<option value="${k}" ${sel===k?'selected':''}>${n}</option>`).join('');}
function pairResult(a,b){if(a===b)return `<div class="interaction-result"><strong>请选择两种不同的药物</strong>同一种药的重复使用、不同品牌或剂型，也需要医生或药师核对。</div>`;const pair=[a,b].sort().join('|');if(pair==='alprazolam|mirtazapine')return `<div class="interaction-result"><strong>需要医生或药师重点核对</strong>米氮平与阿普唑仑合用可能加重认知与运动能力受损；所引米氮平说明书建议避免与苯二氮䓬类合用。若已有处方，请联系开方医生评估，不自行停药或减量。<br><a class="source-link" href="${DRUGS.mirtazapine.url}" target="_blank" rel="noopener noreferrer">说明书依据 · 第 7 节${icon('external')}</a></div>`;if(pair==='sildenafil|tamsulosin')return `<div class="interaction-result"><strong>可能增加症状性低血压风险</strong>坦索罗辛与西地那非等 PDE5 抑制剂合用可能叠加降压作用。具体能否合用，需要结合剂量、血压和其他药物由医生评估。<br><a class="source-link" href="${DRUGS.tamsulosin.url}" target="_blank" rel="noopener noreferrer">说明书依据 · 第 7.3 节${icon('external')}</a></div>`;return `<div class="interaction-result"><strong>该组合未收录，无法判断</strong>“未匹配”不表示没有相互作用。请将处方药、非处方药、中草药与保健品的完整清单交给医生或药师核对。</div>`;}
function showModal(title,body,footer='',wide=false){if(!$('#modal-root').children.length){modalReturn=document.activeElement;document.body.style.overflow='hidden';}for(const url of activeObjectURLs)URL.revokeObjectURL(url);activeObjectURLs=[];$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">${esc(title)}</h2><button class="close-btn" data-action="close" aria-label="关闭窗口">${icon('x')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div></div>`;setTimeout(()=>{$('.modal input:not([type=file]):not([type=checkbox]):not([readonly]),.modal textarea,.modal select,.modal button')?.focus();},0);}
function closeModal(){for(const url of activeObjectURLs)URL.revokeObjectURL(url);activeObjectURLs=[];$('#modal-root').innerHTML='';document.body.style.overflow='';if(modalReturn?.isConnected)modalReturn.focus();modalReturn=null;}
const field=(name,label,value='',type='text',attrs='')=>`<div class="field ${type==='textarea'?'full':''}"><label for="f-${name}">${label}</label>${type==='textarea'?`<textarea id="f-${name}" name="${name}" maxlength="10000" ${attrs}>${esc(value)}</textarea>`:`<input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='text'?'maxlength="500"':''} ${attrs}>`}</div>`;
const select=(name,label,values,value,attrs='')=>`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}" ${attrs}>${values.map(([v,n])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(n)}</option>`).join('')}</select></div>`;
const personOptions=()=>state.profiles.map(p=>[p.id,p.name]);
const conditionOptions=pid=>[['','不关联疾病'],...state.conditions.filter(c=>c.pid===pid).map(c=>[c.id,c.name])];

const formWrap=(id,body,extra='')=>`<form id="${id}" ${extra}><div id="form-error" role="alert"></div><div class="form-grid">${body}</div></form>`;

function extraRecordFields(type,pid,e={},drugId=''){const m=state.meds.find(m=>m.id===(drugId||e.drugId))||state.meds.find(m=>m.pid===pid&&m.status==='active'),locked=!!e.id;if(type==='med')return `${select('drugId','关联的当前药物 <span class="required">*</span>',medicationOptions(pid),m?.id||'',`required ${locked?'disabled':''}`)}${field('nextName','调整后药物名称',e.nextName||m?.name||'','text',locked?'readonly':'required')}${field('beforeDose','调整前（自动带入）',e.beforeDose||m?.dose||'','text','readonly')}${field('afterDose','调整后用法 <span class="required">*</span>',e.afterDose||'','text',locked?'readonly':'required placeholder="按新处方填写剂量、频次与用法"')}${!locked?field('newTimes','调整后打卡时间',m?.times||'','text','placeholder="例如 08:00,20:00"')+field('newDaily','调整后每日库存消耗量',m?.daily??0,'number','min="0" max="1000" step="0.25"'):''}<div class="field full"><div class="settings-note">更换为不同药物名称时，会保留原药记录并标为停用，新增一条药品记录；新药库存从 0 开始。仅按医嘱登记，不提供换药建议。${locked?'历史方案字段保留原始记录，新的调整请另建记录。':''}</div></div>`;
 if(type==='refill')return `${select('drugId','配药药品 <span class="required">*</span>',medicationOptions(pid),e.drugId||drugId||m?.id||'',`required ${locked?'disabled':''}`)}${field('quantity','本次配药数量 <span class="required">*</span>',e.quantity||'','number',`min="0.25" max="100000" step="0.25" required ${locked?'readonly':''}`)}<div class="field full"><div class="settings-note">新增配药记录时，这个数量会加到所选药品的手工库存中。${locked?'本次仅修改文字；历史配药数量不重复计入库存。':''}</div></div>`;
 if(type==='symptom')return `${select('metric','可选观察指标',[['','仅文字记录'],['夜间起夜','夜间起夜（次）'],['睡眠时长','睡眠时长（小时）']],e.metric||'')}${field('value','指标数值',e.value??'','number','min="0" max="100" step="0.1" placeholder="选了指标后请填写数值"')}`;
 if(type==='plan')return `${field('time','计划时间',e.time||'09:30','time')}${field('department','就诊科室',e.department||'')}`;

function uploadForm(files=null,editId=''){const r=state.reports.find(r=>r.id===editId),pid=r?.pid||preferredPerson();showModal(r?'编辑报告信息':'上传检查报告',`<p class="modal-copy">上传原件并手工填写结论。每份报告会自动关联到健康时间线；此 Demo 不进行 OCR 识别或诊断分析。</p>${formWrap('upload-form',`${select('pid','归属家人',personOptions(),pid,r?'disabled':'')}${field('date','报告 / 就诊日期 <span class="required">*</span>',r?.date||today(),'date','required')}${select('kind','资料类型',['影像检查','检验报告','门诊病历','处方配药','其他资料'].map(n=>[n,n]),r?.kind||'检验报告')}${select('conditionId','关联疾病',conditionOptions(pid),r?.conditionId||'')}${field('title','资料标题',r?.title||'','text','placeholder="不填则使用文件名；多份文件会自动编号"')}${field('hospital','出具医院 / 机构',r?.hospital||'')}${field('summary','报告结论 / 备注',r?.summary||'','textarea','placeholder="抄录报告原文，或记录需要咨询医生的项目"')}${!r?`<div class="field full"><label for="report-files">选择原始文件 <span class="required">*</span></label><input class="file-input" id="report-files" name="files" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" multiple required><small class="subtext">最多 6 份，每份最大 10 MB。原件保存在当前浏览器，不会上传至公共文件空间。</small></div>`:''}`,`data-id="${editId}" data-pid="${pid}"`)}`,submitFooter('upload-form',r?'保存修改':'保存并归档'));if(files){const input=$('#report-files');try{const transfer=new DataTransfer();for(const f of files)transfer.items.add(f);input.files=transfer.files;}catch{toast('请在窗口中重新选择文件。');}}}

const toBase64=blob=>new Promise((resolve,reject)=>{const f=new FileReader();f.onload=()=>resolve(String(f.result).split(',')[1]);f.onerror=()=>reject(new Error('附件读取失败'));f.readAsDataURL(blob);});
async function exportBackup(){const status=$('#backup-status');if(status)status.textContent='正在整理记录和报告原件…';const files=await allFiles();const used=new Set(state.reports.map(r=>r.fileId).filter(Boolean)),attachments=[];for(const f of files.filter(f=>used.has(f.id)))attachments.push({id:f.id,name:f.name,type:f.blob.type,data:await toBase64(f.blob)});if(attachments.length!==used.size)throw new Error('部分报告原件缺失，暂不能导出完整备份，请先恢复原件。');const backup={format:'jiaan-family-health-backup',schema:1,exportedAt:new Date().toISOString(),data:state,attachments};download(new Blob([JSON.stringify(backup)],{type:'application/json'}),'家安_完整备份_'+today()+'.json');if(status)status.textContent=`已生成备份，包含 ${attachments.length} 个报告原件。请在浏览器下载目录查看。`;toast('完整备份已下载');}
const validID=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x);
const validDate=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!Number.isNaN(new Date(x+'T12:00:00+08:00').getTime());
const safeNumber=(x,min=0,max=100000)=>typeof x==='number'&&Number.isFinite(x)&&x>=min&&x<=max;
let stagedBackup=null;
function validateBackup(raw){
 const fail=()=>{throw new Error('这份文件不是完整、有效的家安备份，请选择原始导出的 JSON 文件。');};
 if(raw?.format!=='jiaan-family-health-backup'||raw.schema!==1||raw.data?.schema!==1)fail();const s=raw.data;
 for(const key of ['profiles','conditions','meds','events','reports','notes','logs'])if(!Array.isArray(s[key])||s[key].length>50000)fail();
 if(s.profiles.length<2||s.profiles.length>4||!s.profiles.some(p=>p.id==='dad')||!s.profiles.some(p=>p.id==='mom')||s.profiles.some(p=>!['dad','mom','self','wife'].includes(p.id)))fail();
 const checkStrings=o=>{for(const [k,v] of Object.entries(o)){if(typeof v==='string'&&v.length>15000)fail();if(['__proto__','prototype','constructor'].includes(k))fail();}};
 for(const key of ['profiles','conditions','meds','events','reports','notes']){const ids=new Set();for(const o of s[key]){if(!o||typeof o!=='object'||!validID(o.id)||ids.has(o.id))fail();ids.add(o.id);checkStrings(o);if(key!=='profiles'&&!s.profiles.some(p=>p.id===o.pid))fail();}}
 for(const p of s.profiles)if(typeof p.name!=='string'||!p.name.trim()||p.name.length>30||!['男','女','未填写'].includes(p.gender)||![p.age,p.allergies,p.blood,p.contact,p.history,p.remark].every(x=>typeof x==='string'))fail();
 for(const c of s.conditions)if(!validDate(c.date)||typeof c.name!=='string'||!c.name.trim()||!['持续随访','观察记录','已结束'].includes(c.status))fail();
 for(const m of s.meds)if(!validDate(m.start)||typeof m.name!=='string'||typeof m.dose!=='string'||typeof m.times!=='string'||typeof m.unit!=='string'||!['active','stopped'].includes(m.status)||!safeNumber(m.stock)||!safeNumber(m.daily,0,1000)||(m.key&&!Object.hasOwn(DRUGS,m.key)))fail();
 for(const e of s.events)if(!validDate(e.date)||!Object.hasOwn(TYPES,e.type)||typeof e.title!=='string'||typeof e.content!=='string'||(e.value!==undefined&&!safeNumber(e.value,0,100))||(e.quantity!==undefined&&!safeNumber(e.quantity))||(e.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time)))fail();
 for(const e of s.events)if(e.dailyRecord){if(e.type!=='symptom'||typeof e.dailyRecord!=='boolean'||!Array.isArray(e.dailyItems)||e.dailyItems.length>10||e.dailyItems.some(item=>!item||typeof item.label!=='string'||!item.label.trim()||item.label.length>40||typeof item.value!=='string'||!item.value.trim()||item.value.length>1000))fail();if((e.systolic===undefined)!==(e.diastolic===undefined))fail();if(e.systolic!==undefined&&(!safeNumber(e.systolic,40,300)||!safeNumber(e.diastolic,20,200)||!Number.isInteger(e.systolic)||!Number.isInteger(e.diastolic)||e.systolic<=e.diastolic))fail();if(e.sleepHours!==undefined&&(!safeNumber(e.sleepHours,0,24)||e.metric!=='睡眠时长'||e.value!==e.sleepHours))fail();if(e.systolic===undefined&&e.sleepHours===undefined&&!e.dailyItems.length)fail();}
 for(const n of s.notes)if(!validDate(n.date)||!Object.hasOwn(noteCategories,n.category)||typeof n.title!=='string'||typeof n.content!=='string'||typeof n.source!=='string')fail();
 for(const r of s.reports)if(!validDate(r.date)||typeof r.title!=='string'||typeof r.summary!=='string'||!['影像检查','检验报告','门诊病历','处方配药','其他资料'].includes(r.kind)||(r.fileId&&!validID(r.fileId)))fail();
 for(const key of ['events','meds','reports'])for(const o of s[key])if(o.conditionId&&!s.conditions.some(c=>c.id===o.conditionId&&c.pid===o.pid))fail();
 for(const e of s.events){if(e.drugId&&!s.meds.some(m=>m.id===e.drugId&&m.pid===e.pid))fail();if(e.reportId&&!s.reports.some(r=>r.id===e.reportId&&r.pid===e.pid))fail();}
 for(const l of s.logs)if(!s.meds.some(m=>m.id===l.medId)||!validDate(l.date)||typeof l.slot!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(l.slot)||typeof l.at!=='string'||Number.isNaN(new Date(l.at).getTime()))fail();

document.addEventListener('change',async event=>{const el=event.target,form=el.closest('form');try{if(el.id==='daily-date'){dailyDate=el.value;render();}if(el.id==='visit-year'){const year=Number(el.value);if(!Number.isInteger(year)||year<1900||year>2100){el.value=visitYear;toast('年份请填写 1900 至 2100');return;}visitYear=year;visitDate=calendarDate(visitYear,visitMonth,1);render();}if(el.id==='visit-month'){visitMonth=Number(el.value);visitDate=calendarDate(visitYear,visitMonth,1);render();}if(el.id==='visit-kind'){visitKind=el.value;render();}if(el.id==='condition-filter'){timeCondition=el.value;render();}if(el.id==='time-from'){timeFrom=el.value;render();}if(el.id==='time-to'){timeTo=el.value;render();}if(el.id==='report-kind'){reportKind=el.value;render();}if(el.id==='import-confirm')$('[data-action=confirm-import]').disabled=!el.checked;if(el.id==='clear-confirm')$('[data-action=confirm-clear]').disabled=!el.checked;if(el.id==='backup-file'){await stageImport(el.files[0]);}if(form&&el.name==='pid'){updateConditionSelect(form,el.value);if(form.id==='record-form')$('#record-extra').innerHTML=extraRecordFields($('[name=type]',form).value,el.value);}if(form?.id==='record-form'&&el.name==='type'){$('#record-extra').innerHTML=extraRecordFields(el.value,$('[name=pid]',form).value);}if(form?.id==='record-form'&&el.name==='drugId'&&$('[name=type]',form).value==='med'){const m=state.meds.find(m=>m.id===el.value);if(m){$('[name=nextName]',form).value=m.name;$('[name=beforeDose]',form).value=m.dose;$('[name=newTimes]',form).value=m.times;$('[name=newDaily]',form).value=m.daily;$('[name=conditionId]',form).value=m.conditionId||'';}}if(form?.id==='med-form'&&el.name==='key'&&el.value&&!$('[name=name]',form).value)$('[name=name]',form).value=DRUGS[el.value].name;}catch(e){const box=$('#import-preview');if(box)box.innerHTML=`<div class="form-error">${esc(e.message)}</div>`;else toast(e.message);}});
let inputTimer;
document.addEventListener('input',event=>{const el=event.target;if(el.id==='drug-search'){const q=el.value.trim().toLowerCase(),options=[...document.querySelectorAll('[data-drug-name]')];let count=0;for(const o of options){const show=o.dataset.drugName.toLowerCase().includes(q);o.classList.toggle('hidden',!show);count+=show?1:0;}$('#drug-empty').classList.toggle('hidden',count>0);return;}if(el.id==='timeline-search'||el.id==='report-search'){clearTimeout(inputTimer);const id=el.id,value=el.value,pos=el.selectionStart;inputTimer=setTimeout(()=>{if(id==='timeline-search')timeSearch=value;else reportSearch=value;render();const n=$('#'+id);if(n){n.focus();n.setSelectionRange(pos,pos);}},350);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if($('#modal-root').children.length)closeModal();else if(mobileOpen){mobileOpen=false;render();}}if(event.key==='Tab'&&$('#modal-root').children.length){const elements=[...document.querySelectorAll('.modal button:not([disabled]),.modal input:not([disabled]),.modal select:not([disabled]),.modal textarea:not([disabled]),.modal a[href]')].filter(el=>!el.closest('.hidden')),first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}if(['Enter',' '].includes(event.key)&&event.target.matches('[role=button][data-action]')){event.preventDefault();event.target.click();}});
document.addEventListener('dragover',event=>{const zone=event.target.closest('#drop-zone');if(zone){event.preventDefault();zone.classList.add('dragover');}});
document.addEventListener('dragleave',event=>{const zone=event.target.closest('#drop-zone');if(zone&&!zone.contains(event.relatedTarget))zone.classList.remove('dragover');});
document.addEventListener('drop',event=>{const zone=event.target.closest('#drop-zone');if(zone){event.preventDefault();zone.classList.remove('dragover');uploadForm([...event.dataTransfer.files]);}});
async function init(){try{db=await openDB();state=await readDB('records','main');if(!state){state=seed();await writeDB();}else if(ensureFamilyProfiles(state)){await writeDB();}}catch(e){storageOK=false;db=null;state=state||seed();}render();if(!storageOK)toast('持久存储不可用，本页使用临时模式；请及时导出备份。');}
