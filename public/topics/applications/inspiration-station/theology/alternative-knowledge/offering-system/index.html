<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="从祭的种类、祭司职分、节期日历和献祭数量，系统理解摩西五经中的献祭制度。"
    />
    <title>献祭体系 · 圣经献祭</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0d0906;
        --surface: #17100b;
        --surface-raised: #21150e;
        --cream: #fff0cf;
        --paper: #dfc49b;
        --muted: #a98d6d;
        --gold: #f1bd54;
        --gold-soft: #d49b3c;
        --line: rgba(241, 189, 84, 0.2);
        --line-strong: rgba(241, 189, 84, 0.42);
        --content-width: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: var(--ink);
      }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--paper);
        background:
          radial-gradient(circle at 82% 3%, rgba(175, 102, 33, 0.16), transparent 28rem),
          linear-gradient(180deg, #0a0705, var(--ink) 45%, #080604);
        font-family: "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
        line-height: 1.8;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        opacity: 0.22;
        background-image: radial-gradient(rgba(255, 222, 158, 0.3) 0.65px, transparent 0.65px);
        background-size: 28px 28px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
        pointer-events: none;
      }

      a {
        color: inherit;
      }

      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 4px;
      }

      .reading-progress {
        position: fixed;
        inset: 0 0 auto;
        z-index: 80;
        height: 3px;
        background: rgba(255, 255, 255, 0.04);
      }

      .reading-progress span {
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #bd722b, #ffe29a);
        box-shadow: 0 0 18px rgba(255, 194, 78, 0.48);
      }

      .site-bar {
        position: sticky;
        top: 3px;
        z-index: 60;
        border-bottom: 1px solid var(--line);
        background: rgba(12, 8, 5, 0.87);
        backdrop-filter: blur(18px);
      }

      .site-bar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        width: min(calc(100% - 40px), var(--content-width));
        min-height: 72px;
        margin: 0 auto;
      }

      .back-link,
      .archive-mark {
        display: inline-flex;
        align-items: center;
      }

      .back-link {
        gap: 10px;
        min-height: 44px;
        color: var(--paper);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .back-link svg {
        width: 20px;
        fill: none;
        stroke: var(--gold);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .archive-mark {
        gap: 12px;
        color: var(--muted);
        font: 700 11px/1.4 Georgia, serif;
        letter-spacing: 0.16em;
      }

      .archive-mark strong {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--gold);
      }

      .page-hero {
        position: relative;
        width: min(calc(100% - 40px), var(--content-width));
        margin: 0 auto;
        padding: clamp(72px, 10vw, 130px) 0 clamp(52px, 7vw, 88px);
        border-bottom: 1px solid var(--line);
      }

      .page-hero::after {
        position: absolute;
        right: 0;
        bottom: -0.1em;
        content: "祭";
        color: rgba(241, 189, 84, 0.055);
        font-family: "STKaiti", "KaiTi", serif;
        font-size: clamp(12rem, 31vw, 25rem);
        line-height: 0.72;
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--gold);
        font: 700 11px/1.5 Georgia, serif;
        letter-spacing: 0.22em;
      }

      .page-hero h1 {
        position: relative;
        z-index: 1;
        max-width: 8em;
        margin: 0;
        color: var(--cream);
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        font-size: clamp(58px, 9vw, 108px);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .hero-lead {
        position: relative;
        z-index: 1;
        max-width: 720px;
        margin: 26px 0 0;
        color: var(--paper);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: clamp(17px, 2vw, 22px);
        line-height: 1.9;
      }

      .hero-question {
        display: grid;
        grid-template-columns: repeat(6, auto);
        gap: 8px;
        width: fit-content;
        margin: 34px 0 0;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.025);
      }

      .hero-question span {
        padding: 7px 12px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }

      .hero-question span:first-child {
        color: #2a1709;
        background: linear-gradient(135deg, #ffe4a1, #e9a942);
        font-weight: 800;
      }

      .mobile-toc {
        display: none;
        width: min(calc(100% - 40px), var(--content-width));
        margin: 28px auto 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }

      .mobile-toc summary {
        min-height: 52px;
        padding: 12px 18px;
        color: var(--cream);
        cursor: pointer;
        font-weight: 800;
      }

      .reader-shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: clamp(40px, 6vw, 86px);
        width: min(calc(100% - 40px), var(--content-width));
        margin: 0 auto;
        padding: clamp(48px, 7vw, 84px) 0 120px;
      }

      .toc-panel {
        position: sticky;
        top: 102px;
        align-self: start;
        max-height: calc(100vh - 130px);
        overflow: auto;
        scrollbar-width: thin;
      }

      .toc-panel > p {
        margin: 0 0 16px;
        color: var(--gold);
        font: 700 10px/1.4 Georgia, serif;
        letter-spacing: 0.18em;
      }

      .toc-list {
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .toc-list a {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        gap: 10px;
        padding: 9px 10px;
        border-left: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-decoration: none;
        transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .toc-list a span {
        color: rgba(241, 189, 84, 0.55);
        font: 700 10px/1.7 Georgia, serif;
      }

      .toc-list a:hover,
      .toc-list a.is-current {
        border-color: var(--gold);
        color: var(--cream);
        background: linear-gradient(90deg, rgba(241, 189, 84, 0.09), transparent);
      }

      .toc-note {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .document {
        min-width: 0;
      }

      .document-status {
        min-height: 240px;
        padding-top: 20px;
        color: var(--muted);
      }

      .document-content > p:first-child {
        color: var(--cream);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: clamp(19px, 2.3vw, 25px);
        line-height: 1.9;
      }

      .document-content h1,
      .document-content h2,
      .document-content h3 {
        color: var(--cream);
        font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
        text-wrap: balance;
      }

      .document-content h1 {
        scroll-margin-top: 96px;
        margin: 88px 0 30px;
        padding: 24px 0 18px;
        border-top: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line);
        font-size: clamp(31px, 4vw, 48px);
        line-height: 1.25;
      }

      .document-content h1:first-of-type {
        margin-top: 36px;
      }

      .document-content h2 {
        margin: 52px 0 18px;
        color: #f7d589;
        font-size: clamp(23px, 3vw, 31px);
        line-height: 1.35;
      }

      .document-content h3 {
        margin: 36px 0 14px;
        font-size: 21px;
      }

      .document-content p {
        margin: 0 0 20px;
        font-size: 16px;
      }

      .document-content strong {
        color: #ffe09a;
        font-weight: 800;
      }

      .document-content blockquote {
        position: relative;
        margin: 32px 0;
        padding: 22px 24px 22px 30px;
        border: 1px solid var(--line-strong);
        border-left: 3px solid var(--gold);
        border-radius: 0 15px 15px 0;
        color: var(--cream);
        background:
          linear-gradient(115deg, rgba(241, 189, 84, 0.11), transparent 56%),
          rgba(255, 255, 255, 0.025);
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: clamp(17px, 2vw, 21px);
        line-height: 1.85;
      }

      .document-content ul,
      .document-content ol {
        display: grid;
        gap: 10px;
        margin: 16px 0 28px;
        padding-left: 1.35rem;
      }

      .document-content li::marker {
        color: var(--gold);
      }

      .table-wrap {
        margin: 28px 0 36px;
        overflow-x: auto;
        border: 1px solid var(--line-strong);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.02);
        scrollbar-width: thin;
      }

      .document-content table {
        width: 100%;
        min-width: 650px;
        border-collapse: collapse;
        font-size: 14px;
      }

      .document-content th,
      .document-content td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .document-content th {
        color: var(--cream);
        background: rgba(241, 189, 84, 0.09);
        font-weight: 800;
        white-space: nowrap;
      }

      .document-content tr:last-child td {
        border-bottom: 0;
      }

      .document-content hr {
        height: 1px;
        margin: 70px 0;
        border: 0;
        background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
      }

      .reading-end {
        margin-top: 80px;
        padding: 34px;
        border: 1px solid var(--line-strong);
        border-radius: 20px;
        text-align: center;
        background: linear-gradient(145deg, rgba(241, 189, 84, 0.09), rgba(255, 255, 255, 0.015));
      }

      .reading-end p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
      }

      .reading-end a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        color: #27170a;
        background: linear-gradient(135deg, #ffe7a8, #e9a43c);
        font-weight: 900;
        text-decoration: none;
      }

      @media (max-width: 900px) {
        .hero-question {
          grid-template-columns: repeat(3, auto);
          border-radius: 18px;
        }

        .mobile-toc {
          display: block;
        }

        .mobile-toc .toc-list {
          padding: 0 16px 16px;
        }

        .reader-shell {
          display: block;
        }

        .toc-panel {
          display: none;
        }
      }

      @media (max-width: 600px) {
        .site-bar-inner,
        .page-hero,
        .mobile-toc,
        .reader-shell {
          width: calc(100% - 32px);
        }

        .archive-mark span {
          display: none;
        }

        .page-hero {
          padding-top: 58px;
        }

        .page-hero h1 {
          font-size: clamp(52px, 18vw, 76px);
        }

        .hero-question {
          width: 100%;
          grid-template-columns: repeat(2, 1fr);
        }

        .hero-question span {
          text-align: center;
        }

        .reader-shell {
          padding-top: 38px;
        }

        .document-content h1 {
          margin-top: 64px;
          font-size: 30px;
        }

        .document-content h2 {
          margin-top: 42px;
          font-size: 24px;
        }

        .document-content p,
        .document-content li {
          font-size: 15px;
        }

        .document-content blockquote {
          padding: 18px 18px 18px 22px;
          font-size: 17px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .toc-list a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="reading-progress" aria-hidden="true"><span id="reading-progress-bar"></span></div>

    <header class="site-bar">
      <div class="site-bar-inner">
        <a class="back-link" href="../">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          返回圣经献祭
        </a>
        <div class="archive-mark" aria-label="圣经知识图谱献祭体系">
          <span>BIBLE ATLAS · OFFERING SYSTEM</span>
          <strong>06</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="page-title">
        <p class="eyebrow">THE TORAH OF OFFERINGS · 摩西五经献祭制度</p>
        <h1 id="page-title">献祭体系</h1>
        <p class="hero-lead">把散落在出埃及记、利未记、民数记与申命记中的规定放回同一张制度地图，看清每一章各自回答的问题。</p>
        <div class="hero-question" aria-label="献祭制度的六个问题">
          <span>献什么</span><span>为什么献</span><span>谁来献</span><span>在哪里献</span><span>什么时候献</span><span>献多少</span>
        </div>
      </section>

      <details class="mobile-toc">
        <summary>打开本文目录</summary>
        <ol class="toc-list" data-toc></ol>
      </details>

      <div class="reader-shell">
        <aside class="toc-panel" aria-label="文章目录">
          <p>CONTENTS · 目录</p>
          <ol class="toc-list" data-toc></ol>
          <div class="toc-note">全文按“祭的种类 → 祭司 → 节期 → 数量 → 地点”的顺序展开。</div>
        </aside>

        <article class="document" aria-label="摩西五经献祭体系全文">
          <div id="document-content" class="document-content">
            <p class="document-status">正在载入献祭体系内容……</p>
          </div>
          <footer class="reading-end">
            <p>读完制度全景后，可以回到知识卡继续查看五种核心祭的视觉对比。</p>
            <a href="../#offering-explorer">返回圣经献祭</a>
          </footer>
        </article>
      </div>
    </main>

    <script>
      const contentRoot = document.querySelector("#document-content");
      const progressBar = document.querySelector("#reading-progress-bar");

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function renderInline(value) {
        return escapeHtml(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      }

      function splitTableRow(line) {
        return line.trim().replace(/^\||\|$/g, "").split("|").map((cell) => cell.trim());
      }

      function isTableDivider(line) {
        return /^\s*\|?\s*:?-{3,}/.test(line) && line.includes("|");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        const toc = [];
        let index = 0;
        let sectionNumber = 0;

        while (index < lines.length) {
          const line = lines[index].trim();

          if (!line) {
            index += 1;
            continue;
          }

          if (line === "---") {
            html.push("<hr />");
            index += 1;
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            const level = heading[1].length;
            const title = heading[2];
            const id = level === 1 ? `section-${String(++sectionNumber).padStart(2, "0")}` : "";
            if (level === 1) toc.push({ id, title });
            html.push(`<h${level}${id ? ` id="${id}"` : ""}>${renderInline(title)}</h${level}>`);
            index += 1;
            continue;
          }

          if (line.startsWith(">")) {
            const quote = [];
            while (index < lines.length && lines[index].trim().startsWith(">")) {
              quote.push(lines[index].trim().replace(/^>\s?/, ""));
              index += 1;
            }
            html.push(`<blockquote>${renderInline(quote.join(" "))}</blockquote>`);
            continue;
          }

          if (line.startsWith("|") && index + 1 < lines.length && isTableDivider(lines[index + 1])) {
            const header = splitTableRow(lines[index]);
            index += 2;
            const rows = [];
            while (index < lines.length && lines[index].trim().startsWith("|")) {
              rows.push(splitTableRow(lines[index]));
              index += 1;
            }
            const head = `<thead><tr>${header.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead>`;
            const body = `<tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`).join("")}</tbody>`;
            html.push(`<div class="table-wrap" role="region" aria-label="可横向滚动的数据表" tabindex="0"><table>${head}${body}</table></div>`);
            continue;
          }

          if (/^[*-]\s+/.test(line)) {
            const items = [];
            while (index < lines.length && /^[*-]\s+/.test(lines[index].trim())) {
              items.push(lines[index].trim().replace(/^[*-]\s+/, ""));
              index += 1;
            }
            html.push(`<ul>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ul>`);
            continue;
          }

          if (/^\d+\.\s+/.test(line)) {
            const items = [];
            while (index < lines.length && /^\d+\.\s+/.test(lines[index].trim())) {
              items.push(lines[index].trim().replace(/^\d+\.\s+/, ""));
              index += 1;
            }
            html.push(`<ol>${items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ol>`);
            continue;
          }

          const paragraph = [line];
          index += 1;
          while (index < lines.length) {
            const next = lines[index].trim();
            if (!next || next === "---" || /^(#{1,3})\s+/.test(next) || next.startsWith(">") || /^[*-]\s+/.test(next) || /^\d+\.\s+/.test(next) || (next.startsWith("|") && index + 1 < lines.length && isTableDivider(lines[index + 1]))) break;
            paragraph.push(next);
            index += 1;
          }
          html.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
        }

        return { html: html.join("\n"), toc };
      }

      function mountToc(items) {
        document.querySelectorAll("[data-toc]").forEach((list) => {
          list.innerHTML = items.map((item, index) => `
            <li><a href="#${item.id}"><span>${String(index + 1).padStart(2, "0")}</span>${escapeHtml(item.title)}</a></li>
          `).join("");
        });

        const sections = items.map((item) => document.querySelector(`#${item.id}`)).filter(Boolean);
        const observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          document.querySelectorAll("[data-toc] a").forEach((link) => {
            link.classList.toggle("is-current", link.hash === `#${visible.target.id}`);
          });
        }, { rootMargin: "-15% 0px -72%" });
        sections.forEach((section) => observer.observe(section));
      }

      function updateProgress() {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const percentage = scrollable > 0 ? Math.min(100, (window.scrollY / scrollable) * 100) : 0;
        progressBar.style.width = `${percentage}%`;
      }

      fetch("./content.md")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then((markdown) => {
          const rendered = renderMarkdown(markdown);
          contentRoot.innerHTML = rendered.html;
          mountToc(rendered.toc);
        })
        .catch(() => {
          contentRoot.innerHTML = "<p class=\"document-status\">内容载入失败，请刷新页面后重试。</p>";
        });

      window.addEventListener("scroll", updateProgress, { passive: true });
      updateProgress();
    </script>
  </body>
</html>
