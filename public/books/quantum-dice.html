<body>
<header class="top"><a class="back" href="../ai-bookshelf.html">← 书架</a><div class="book-title">上帝掷骰子吗？<small>曹天元 · 量子物理史话</small></div><div class="tools"><button data-panel="contents" aria-label="打开目录">目录</button><button data-panel="search" aria-label="搜索正文">搜索</button><button data-panel="settings" aria-label="阅读设置">Aa</button><button data-panel="saved" aria-label="书签与笔记">书签</button></div></header>

<section id="settings" hidden><h3>字号</h3><div class="option-row"><button id="smaller" aria-label="缩小字号">A−</button><span id="font-size"></span><button id="larger" aria-label="增大字号">A＋</button></div><h3>阅读主题</h3><div class="option-row" id="themes"><button data-theme="paper">暖纸</button><button data-theme="white">纯白</button><button data-theme="night">夜读</button></div><label>行距<select id="leading"><option value="1.65">紧凑</option><option value="1.95">舒适</option><option value="2.3">宽松</option></select></label><label>正文宽度<select id="measure"><option value="620">窄</option><option value="760">适中</option><option value="920">宽</option></select></label><h3>阅读模式</h3><div class="option-row"><button id="text-mode" aria-pressed="true">文字排版</button><button id="original-mode" aria-pressed="false">原版图文</button></div><p>文字模式可调整字号、搜索和摘录；原版图文完整保留 PDF 插图、公式与版式，可点击页面放大。</p><h3>跳转原书页码</h3><form class="jump" id="jump-form"><input id="page-number" type="number" min="1" max="179" aria-label="原书页码" required><span>/ 179</span><button>前往</button></form><h3>阅读记录</h3><p>位置、书签和笔记保存在本浏览器。可导出留存或导入恢复。</p><div class="option-row"><button id="export">导出记录</button><button id="import">导入记录</button><input type="file" id="records-file" accept=".json" hidden><button id="restart">从头阅读</button><button id="complete">标记读完</button></div></section>

</aside>
