<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《圆桌派》第一季至第八季节目单，查看各期主题、嘉宾和 ZIP0 播放入口。">
  <meta name="theme-color" content="#101210">
  <title>圆桌派 · 第一季至第八季</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101210;
      --surface: #171a17;
      --border: #2d332b;
      --text: #f1f3ef;
      --muted: #a7afa4;
      --accent: #ccf47d;
      --drawer-duration: 280ms;
      --drawer-easing: cubic-bezier(.22, .7, .24, 1);
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: clip;
      background: var(--background);
      color: var(--text);
    }

    .gallery-viewport {
      contain: paint;
    }

    .collection {
      --collection-gap: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(320px, 35%, 500px);
      align-items: start;
      gap: var(--collection-gap);
      width: min(100% - 48px, 1536px);
      margin-inline: auto;
      padding-block: 38px 48px;
      container-type: inline-size;
    }

    .series-layout {
      --left-drawer-width: min(50vw, 100% - 280px);
      position: relative;
      min-width: 0;
      scroll-margin-block-start: 16px;
    }

    .series {
      display: grid;
      gap: 20px;
      min-width: 0;
      container-type: inline-size;
      transition: margin-inline-start var(--drawer-duration) var(--drawer-easing);
    }

    .intro {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 27px 34px 30px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(108deg, #191e16 16%, #182016 70%, #202a19);
    }

    .intro::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: clamp(-96px, 7vw - 90px, 48px);
      width: clamp(242px, 37vw, 400px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 23px, #ccf47d20 24px 25px);
      mask-image: radial-gradient(circle closest-side, #000 62%, transparent 100%);
      content: "";
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      line-height: 1.4;
    }

    .category::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 7px 0 10px;
      font-size: clamp(2.75rem, 6vw, 4.1rem);
      font-weight: 750;
      letter-spacing: 0.04em;
      line-height: 1.06;
    }

    .intro-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .guest-directory-home {
      min-width: 0;
    }

    .guest-directory {
      padding: 17px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    .guest-directory-label {
      margin: 0;
      padding: 4px;
      border: 1px solid #ccf47d40;
      border-radius: 7px;
      background: #20281b;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;
    }

    .guest-directory-count {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      white-space: nowrap;
    }

    .guest-directory-note {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: end;
    }

    .guest-directory-note:not(:empty) {
      margin-bottom: 12px;
    }

    .guest-groups {
      --roster-gap: 8px;
      display: grid;
      grid-template-areas: "female female female divider male male male male";
      grid-template-columns: repeat(3, minmax(0, 1fr)) max-content repeat(4, minmax(0, 1fr));
      align-items: start;
      gap: var(--roster-gap);
    }

    .guest-group:first-of-type {
      grid-area: female;
    }

    .guest-group:last-of-type {
      grid-area: male;
    }

    .guest-group-divider {
      grid-area: divider;
      display: flex;
      flex-direction: column;
      gap: var(--roster-gap);
      align-items: center;
      align-self: stretch;
    }

    .guest-group-divider::after {
      flex: 1;
      width: 1px;
      background: var(--border);
      content: "";
    }

    .guest-group h3 {
      margin: 0 0 8px;
      font-size: 0.85rem;
      font-weight: 650;
      text-align: center;
    }

    .guest-directory-status,
    .guest-retry {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .guest-directory-status {
      margin: 0 0 4px;
    }

    .guest-retry,
    .drawer-roster-toggle {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      font-family: inherit;
      cursor: pointer;
    }

    .drawer-roster-toggle {
      display: none;
    }

    .guest-avatars {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px var(--roster-gap);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .guest-avatars[data-gender="male"] {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .guest-avatar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      justify-items: center;
      inline-size: 100%;
      min-inline-size: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      line-height: 1.35;
      text-align: center;
      cursor: pointer;
    }

    .guest-avatar-photo {
      display: grid;
      inline-size: min(100%, 128px);
      aspect-ratio: 1;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #283325;
      color: var(--accent);
      font-size: 1rem;
    }

    .guest-avatar-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .guest-avatar-label {
      inline-size: max-content;
      max-inline-size: calc(100% + var(--roster-gap));
      overflow-wrap: anywhere;
    }

    .guest-avatar:is(:hover, :focus-visible, [aria-expanded="true"]) .guest-avatar-photo {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .guest-avatar.is-in-season .guest-avatar-photo {
      border-color: var(--accent);
    }

    .guest-tooltip {
      position: fixed;
      inset: 0 auto auto 0;
      z-index: 3;
      width: min(248px, 100vw - 24px);
      padding: 10px 12px;
      border: 1px solid #526345;
      border-radius: 9px;
      background: #20281b;
      color: var(--text);
      box-shadow: 0 10px 24px #0007;
      font-size: 0.85rem;
      line-height: 1.5;
      pointer-events: none;
    }

    .guest-tooltip span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .guest-appearance-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
      padding: 8px 0 8px 12px;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .seasons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      min-width: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .season {
      display: block;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      background: #171d19;
      object-fit: contain;
    }

    .season-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 13px 11px;
      border-top: 1px solid var(--border);
    }

    .season-info time {
      display: block;
      margin-block-start: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .season-title {
      display: block;
      font-size: 1rem;
      font-weight: 680;
      line-height: 1.35;
    }

    .watch-icon {
      display: grid;
      flex: 0 0 32px;
      height: 32px;
      place-items: center;
      border: 1px solid #ccf47d36;
      border-radius: 50%;
      background: #ccf47d0d;
      color: var(--accent);
      font-size: 1.02rem;
      line-height: 1;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .season:is(:hover, :focus-visible, .is-season-selected) {
      border-color: var(--accent);
    }

    .season:is(:hover, :focus-visible, .is-season-selected) .watch-icon {
      background-color: var(--accent);
      color: var(--background);
    }

    .season:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .season-drawer {
      position: absolute;
      inset-block: 0;
      display: flex;
      flex-direction: column;
      visibility: hidden;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      transition: transform var(--drawer-duration) var(--drawer-easing),
        visibility 0s var(--drawer-duration);
    }

    .episode-drawer {
      z-index: 1;
      inset-inline-start: 0;
      width: var(--left-drawer-width);
      transform: translateX(-100%);
    }

    .guest-drawer {
      z-index: 2;
      inset-inline-start: calc(100% + var(--collection-gap));
      width: calc(100cqi - 100% - var(--collection-gap));
      container: guest-details / inline-size;
      transform: translateX(100%);
    }

    .season-drawer.is-open {
      visibility: visible;
      transform: translateX(0);
      transition-delay: 0s;
    }

    .drawer-header {
      display: flex;
      flex: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 23px 26px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(110deg, #222b1b, var(--surface));
    }

    .drawer-header h2 {
      margin: 0;
      font-size: clamp(1.25rem, 4.5vw, 1.8rem);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .drawer-heading {
      flex: 1;
      min-width: 0;
    }

    .drawer-title-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 12px;
    }

    .drawer-guest-intro {
      flex: 1 1 155px;
      min-width: 0;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .drawer-meta,
    .drawer-status {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .drawer-close {
      flex: 0 0 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--background);
      color: inherit;
      font: inherit;
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    .drawer-close:hover,
    .drawer-close:focus-visible {
      border-color: var(--accent);
    }

    .drawer-scroll {
      flex: 1;
      min-height: 0;
      padding: 16px 26px 28px;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #5b694b transparent;
    }

    .drawer-status {
      margin: 0 0 12px;
    }

    .drawer-fallback {
      color: var(--accent);
      text-underline-offset: 3px;
    }

    .episode-list,
    .episode-guests {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .episode-list {
      display: grid;
      gap: 8px;
    }

    .episode-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--background);
    }

    .episode-row:has(.episode-select[aria-expanded="true"]) {
      border-color: #53643f;
      background: #20281b;
    }

    .episode-select {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 10px 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.45;
      text-align: start;
      cursor: pointer;
    }

    .episode-select:hover {
      color: var(--accent);
    }

    .episode-title {
      overflow-wrap: anywhere;
    }

    .episode-watch:not([hidden]) {
      display: grid;
      min-height: 40px;
      margin: 5px 6px 5px 0;
      padding-inline: 14px;
      place-items: center;
      border: 1px solid #ccf47d42;
      border-radius: 7px;
      background: #ccf47d14;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .episode-watch:is(:hover, :focus-visible) {
      background: var(--accent);
      color: var(--background);
    }

    .episode-number {
      color: var(--accent);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .episode-guests {
      display: grid;
      gap: 12px;
    }

    .episode-guest {
      --portrait-size: 96px;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--background);
    }

    .guest-photo {
      display: grid;
      flex: 0 0 var(--portrait-size);
      height: var(--portrait-size);
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
      background: #283325;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .guest-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .guest-name,
    .guest-background {
      display: block;
      overflow-wrap: anywhere;
    }

    .guest-name {
      margin-block-end: 5px;
      font-size: 1.125rem;
      line-height: 1.3;
    }

    .guest-background {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .guest-name a {
      color: inherit;
      text-decoration: none;
    }

    .guest-name a:hover,
    .guest-name a:focus-visible {
      color: var(--accent);
      text-decoration: underline;
    }

    .season-drawer :is(button, a):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (min-width: 901px) and ((hover: hover) or (pointer: fine) or (pointer: none)) {
      .collection:has(.episode-drawer.is-open) {
        grid-template-columns: minmax(0, 1fr) clamp(265px, 30%, 460px);
      }

      .series-layout:has(.episode-drawer.is-open) .series {
        margin-inline-start: calc(var(--left-drawer-width) + 12px);
      }

      .series-layout:has(.episode-drawer.is-open) .intro {
        padding-inline: 8px 12px;
      }

      .series-layout:has(.episode-drawer.is-open) h1 {
        font-size: clamp(2.5rem, 4.6vw, 4.1rem);
      }
    }

    @container (max-width: 680px) {
      .seasons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @container (max-width: 475px) {
      .season-info {
        gap: 4px;
        padding-inline: 8px;
      }

      .watch-icon {
        flex-basis: 24px;
        height: 24px;
      }
    }

    @container guest-details (max-width: 325px) {
      .guest-drawer .drawer-header {
        padding-inline: 16px;
      }

      .guest-drawer .drawer-scroll {
        padding-inline: 12px;
      }

      .guest-drawer .episode-guest {
        --portrait-size: 64px;
        gap: 10px;
        padding: 10px;
      }
    }

    @media (max-width: 900px), (hover: none) and (pointer: coarse) {
      .collection {
        grid-template-columns: minmax(0, 1fr);
        width: min(100% - 32px, 640px);
      }

      .series-layout {
        --left-drawer-width: 100%;
      }

      .series {
        transition: transform var(--drawer-duration) var(--drawer-easing);
      }

      .drawer-roster-toggle:not([hidden]) {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        margin-bottom: 12px;
        color: var(--accent);
        font-size: 0.85rem;
      }

      .series-layout:has(.episode-drawer.is-open) .series {
        transform: translateX(calc(100% + 16px));
      }

      .guest-drawer {
        inset-inline-start: 0;
        width: 100%;
      }
    }

    @media (max-width: 710px) {
      .collection {
        gap: 14px;
        padding-block: 22px 32px;
      }

      .series {
        gap: 14px;
      }

      .intro {
        padding: 22px 21px 24px;
      }

      .guest-directory {
        padding: 12px 10px;
      }

      #drawer-roster {
        margin-inline: -8px;
      }

      #drawer-roster .guest-directory {
        padding-inline: 6px;
      }

      .guest-groups {
        --roster-gap: 6px;
      }

      .guest-avatars {
        row-gap: 10px;
      }

      .guest-avatar {
        font-size: 0.78rem;
      }

      .guest-avatar-label {
        text-wrap: balance;
      }

      .seasons {
        gap: 12px;
      }

      .drawer-header {
        padding: 18px 16px;
      }

      .drawer-scroll {
        padding: 12px 16px 22px;
      }

      .episode-guest {
        --portrait-size: 80px;
        gap: 12px;
        padding: 12px;
      }

      .episode-title,
      .guest-background {
        text-wrap: balance;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .series .guest-directory-home:not(:has(.guest-directory)) {
        display: none;
      }

      .guest-groups {
        --roster-gap: 8px;
        grid-template: "divider" auto "female" auto "male" auto / minmax(0, 1fr);
      }

      .guest-group-divider {
        align-items: flex-start;
      }

      .guest-group-divider::after {
        display: none;
      }

      .guest-directory-label {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }

      .guest-group:not([hidden]) {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: var(--roster-gap);
      }

      .guest-group h3 {
        margin: 0;
      }

      .guest-avatars {
        display: flex;
        gap: var(--roster-gap);
        padding: 4px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scrollbar-width: none;
      }

      .guest-avatars::-webkit-scrollbar {
        display: none;
      }

      .guest-avatars > li {
        flex: 0 0 clamp(34px, 5vw, 44px);
      }

      .seasons {
        inline-size: 100cqi;
        justify-self: center;
        zoom: 0.7;
      }
    }

    @media (min-width: 1125px) and (hover: none) and (pointer: coarse) {
      .collection {
        width: min(100% - 32px, 820px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --drawer-duration: 0s;
      }

      .season,
      .watch-icon {
        transition: none;
      }
    }
  </style>
  <script src="./season-drawer.js?v=57967a3f15f6" defer></script>
</head>
<body>
  <div class="gallery-viewport">
    <main class="collection" id="season-gallery" data-touch-layout>
      <div class="series-layout">
        <div class="series">
          <header class="intro">
            <p class="category">文化访谈</p>
            <h1>圆桌派</h1>
            <p class="intro-note">全 8 季 · 选择一季查看各期节目与嘉宾</p>
          </header>

          <ul class="seasons" aria-label="第一季至第八季">
            <li>
              <a class="season" data-season="1" href="https://zip0.com/watch?source=mdzy&amp;id=35769&amp;episode=1">
                <img class="cover" src="./covers/season-01.jpg" width="270" height="405" alt="">
                <div class="season-info">
                  <div><span class="season-title">第一季</span><time datetime="2016">2016</time></div>
                  <span class="watch-icon" aria-hidden="true">→</span>
                </div>
              </a>
            </li>
            <li>
              <a class="season" data-season="2" href="https://zip0.com/watch?source=mdzy&amp;id=35764&amp;episode=1">
                <img class="cover" src="./covers/season-02.jpg" width="270" height="360" alt="">
