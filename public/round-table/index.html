<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《圆桌派》第一季至第八季，选择一季即可前往 ZIP0 对应的播放页。">
  <meta name="theme-color" content="#101210">
  <title>圆桌派 · 第一季至第八季</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101210;
      --surface: #171a17;
      --border: #2d332b;
      --text: #f1f3ef;
      --muted: #a7afa4;
      --accent: #ccf47d;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
    }

    .collection {
      width: min(100% - 64px, 1000px);
      margin-inline: auto;
      padding-block: 38px 48px;
    }

    .intro {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin-block-end: 22px;
      padding: 27px 34px 30px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(108deg, #191e16 16%, #182016 70%, #202a19);
    }

    .intro::before {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: clamp(-96px, 7vw - 90px, 48px);
      width: clamp(242px, 37vw, 400px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 50%;
      background: repeating-radial-gradient(circle, transparent 0 23px, #ccf47d20 24px 25px);
      mask-image: radial-gradient(circle closest-side, #000 62%, transparent 100%);
      content: "";
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.13em;
      line-height: 1.4;
    }

    .category::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 7px 0 10px;
      font-size: clamp(2.75rem, 6vw, 4.1rem);
      font-weight: 750;
      letter-spacing: 0.04em;
      line-height: 1.06;
    }

    .intro-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .seasons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .season {
      display: block;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease;
    }

    .cover {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 3;
      background: #171d19;
      object-fit: contain;
    }

    .season-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 13px 11px;
      border-top: 1px solid var(--border);
    }

    .season-info time {
      display: block;
      margin-block-start: 3px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .season-title {
      display: block;
      font-size: 1rem;
      font-weight: 680;
      line-height: 1.35;
    }

    .watch-icon {
      display: grid;
      flex: 0 0 32px;
      height: 32px;
      place-items: center;
      border: 1px solid #ccf47d36;
      border-radius: 50%;
      background: #ccf47d0d;
      color: var(--accent);
      font-size: 1.02rem;
      line-height: 1;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .season:is(:hover, :focus-visible) {
      border-color: var(--accent);
    }

    .season:is(:hover, :focus-visible) .watch-icon {
      background-color: var(--accent);
      color: var(--background);
    }

    .season:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 710px) {
      .collection {
        width: min(100% - 32px, 496px);
        padding-block: 22px 32px;
      }

      .intro {
        margin-block-end: 16px;
        padding: 22px 21px 24px;
      }

      .seasons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .season,
      .watch-icon {
        transition: none;
      }
    }
  </style>
</head>
