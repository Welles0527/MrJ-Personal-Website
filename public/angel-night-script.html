    :root{--ink:#241a16;--muted:#55432f}

<body>
  <div class="book">
    <span class="corner tl" aria-hidden="true">❦</span><span class="corner tr" aria-hidden="true">❦</span><span class="corner bl" aria-hidden="true">❦</span><span class="corner br" aria-hidden="true">❦</span>
    <header class="masthead">
      <p class="eyebrow">A CHRISTMAS STAGE PLAY · REHEARSAL EDITION</p>
      <h1>天使之夜</h1>
      <p class="subtitle">排练台词本</p>
      <div class="mast-rule" aria-hidden="true">✦</div>
      <p class="credits"><span>总策划 <b>高志华</b></span><span>总导演 <b>Gloria</b></span><span>制片人 <b>Mark</b></span></p>
      <section class="rehearsal-schedule" aria-labelledby="rehearsalTitle">
        <h3 id="rehearsalTitle">排练时间</h3>
        <ol><li>12月2日 <span>周二</span></li><li>12月9日 <span>周二</span></li><li>12月16日 <span>周二</span></li></ol>
      </section>
    </header>
    <div class="paper">
      <section class="cast-panel" aria-labelledby="castTitle">
          <p class="section-kicker">THE CAST</p>
          <div class="cast-heading"><h2 id="castTitle">角色与台词</h2><label class="only-self"><input id="onlySelf" type="checkbox">仅显示本人台词</label></div>
          <button class="all-roles" id="showAll" type="button" aria-pressed="true">全部角色 · 显示所有台词</button>
          <div class="role-list" id="roleList"></div>
      </section>
      <div class="working-area">
        <aside class="scene-index" aria-labelledby="sceneIndexTitle">

          <nav class="scene-grid" id="sceneNav" aria-label="跳转到场景"></nav>
        </aside>
        <main class="script-panel" id="scriptPanel">
          <div class="script-intro"><div><p class="section-kicker">THE SCRIPT</p><h2>逐场台词</h2></div></div>
          <p class="focus-status" id="focusStatus" role="status" aria-live="polite">当前显示全部角色台词</p>
          <div id="scenes"></div>
        </main>
      </div>
      <aside class="source-notes" aria-labelledby="notesTitle"><h2 id="notesTitle">原稿说明</h2><ul id="sourceNotes"></ul></aside>
      <footer class="book-footer">天使之夜 · 排练台词本</footer>
    </div>
  </div>
  <script>
    const SCRIPT = {"title":"天使之夜","credits":{"总策划":"高志华","总导演":"Gloria","制片人":"Mark"},"cast":[{"role":"天使长","actor":"徐厚祥"},{"role":"可爱天使","actor":"刘然"},{"role":"活泼天使","actor":"凌洁"},{"role":"马利亚","actor":"Gloria"},{"role":"约瑟","actor":"Welles"},{"role":"老板娘","actor":"Sandy"},{"role":"牧羊人1","actor":"高志华"},{"role":"牧羊人2","actor":"阿亮"},{"role":"博士1","actor":"Mark"},{"role":"博士2","actor":"Tom"},{"role":"博士3","actor":"Jerry"},{"role":"博士4","actor":"待分配"},{"role":"博士5","actor":"待分配"},{"role":"旁白","actor":"Jenna"}],"scenes":[{"id":"scene-1","title":"马利亚家","sourceHeading":"第一景 马利亚家","inferred":false,"items":[{"type":"stage","text":"（背景音乐）：我心尊主为大"},{"type":"dialogue","role":"旁白","text":"2026年前上帝差遣天使加百列到加利利一个叫拿撒勒的城去，要传话给一个童女，名叫马利亚;这个童女已经跟大卫家族一个名叫约瑟的男子订了婚。瞧，天使们来了。。。"},{"type":"dialogue","role":"天使长","text":"快一点，等一下迟到了就有你们好看了！"},{"type":"dialogue","role":"可爱天使","text":"急什么！反正她又跑不掉！"},{"type":"dialogue","role":"活泼天使","text":"对啊！"},{"type":"dialogue","role":"天使长","text":"这一件事情可是关系到未来人类的整个发展与命运的！"},{"type":"dialogue","role":"可爱天使","text":"那关我们什么事?我们又不是人类！"},{"type":"dialogue","role":"天使长","text":"你知不知道我们是什么?"},{"type":"dialogue","role":"可爱天使","text":"是天使！"},{"type":"dialogue","role":"天使长","text":"天使是做什么用的?"},{"type":"dialogue","role":"可爱天使","text":"人类常认为我们天使就是有翅膀，长得很帅(美) ，供大家参观娱乐的！"},{"type":"dialogue","role":"活泼天使","text":"其实，天使是一个灵！他是超越肉体的，飞来飞去接CASE！"},{"type":"dialogue","role":"天使长","text":"天使都是服役的灵，是要服务人类的！所以人类要是过得很好，我们的生活就会很喜乐\n如果一天到晚都是纷争的话，那我们会很担忧的。"},{"type":"dialogue","role":"可爱天使","text":"对！所以这件事情一定要快一点办成！"},{"type":"dialogue","role":"活泼天使","text":"为了我们天使的未来！一刻都不能延迟！走，快点上路吧！"},{"type":"stage","text":"(可爱天使、活泼天使一起作一个准备飞翔的动作)"},{"type":"dialogue","role":"可爱天使","text":"到了！"},{"type":"dialogue","role":"活泼天使","text":"怎么这么快！"},{"type":"dialogue","role":"可爱天使","text":"你忘了我们是天使吗?"},{"type":"dialogue","role":"活泼天使","text":"对对对！"},{"type":"dialogue","role":"天使长","text":"那就是马利亚了！你们快一点把上头交代要说的话说一说！"},{"type":"dialogue","role":"可爱天使","text":"我有带稿子！来来来！好！你去念！"},{"type":"dialogue","role":"活泼天使","text":"不行，我每次和人类说话我就会害羞！"},{"type":"dialogue","role":"可爱天使","text":"没关系，一回生二回熟！多说几次就好了。"},{"type":"dialogue","role":"活泼天使","text":"我真的不行。"},{"type":"dialogue","role":"可爱天使","text":"没问题，我相信你。"},{"type":"dialogue","role":"天使长","text":"122117386号天使！也该是你操练的时候了！"},{"type":"dialogue","role":"可爱天使","text":"师父英明！师父英明！师父英明！"},{"type":"dialogue","role":"可爱天使","text":"（出于真心地）加油！我们会为你祷告的。"},{"type":"stage","text":"(活泼天使出现在马利亚面前，喷雾。)"},{"type":"dialogue","role":"马利亚","text":"是天使，有天使出现了！"},{"type":"dialogue","role":"活泼天使","text":"蒙……大……恩……的……女……子。"},{"type":"stage","text":"(因为紧张发出语焉不详的怪声音。)"},{"type":"dialogue","role":"马利亚","text":"这是什么声音，我听不太懂！莫非这就是天使的语言，真的是凡人不能了解?"},{"type":"dialogue","role":"天使长","text":"我来说好了！马利亚不要怕，你在主的面前已经蒙恩了。你将会怀孕并生下一个儿子，你要给他取名叫耶稣。"},{"type":"dialogue","role":"可爱天使","text":"一定要取这个名字，不能乱取。"},{"type":"dialogue","role":"天使长","text":"上帝要把他祖先大卫王的宝座给他，他要做王直到永远！他的国也没有穷尽！"},{"type":"dialogue","role":"马利亚","text":"我还没有出嫁怎么可以发生这种事情。"},{"type":"dialogue","role":"天使长","text":"帝所要做奇妙的工作，他的意念是高过我们的意念，他的道路是高过我们的道路！ (对马利亚)抱歉！圣灵要降临在你身上，至高者的能力要荫庇你。因此你所生的婴孩，必称为神的儿子。因为出于神的话，没有一句不带有能力！"},{"type":"dialogue","role":"马利亚","text":"我是上帝的使女，情愿照他的话成就在我的身上。"},{"type":"stage","text":"曲 目：我心尊主为大"},{"type":"stage","text":"(三位天使下，场上只留下一光区，马利亚独自一人安静的祷告，在旁有一位舞者以象征她心境的方式舞蹈。)"},{"type":"dialogue","role":"旁白","text":"于是天使离开了她。马利亚就由圣灵怀了孕。她的未婚夫约瑟为人正直，知道了此事，不愿意公开羞辱她，却有意要秘密解除婚约。他正在考虑这事，天使们又来向他显现了。。。"}]},{"id":"scene-2","title":"约瑟家","sourceHeading":"第二景：约瑟家","inferred":false,"items":[{"type":"dialogue","role":"天使长","text":"你看看你们干的好事，说什么休息一下就好，一休息就休息了十几天，结果重要的事情到现在都还没办好！"},{"type":"dialogue","role":"可爱天使","text":"这也是没有办法的事情?祷告的人实在太少了！我工作起来都没有动力！"},{"type":"dialogue","role":"天使长","text":"现在马利亚怀孕的事情传到她的未婚夫那里去了！听说他要把马利亚休掉！"},{"type":"dialogue","role":"可爱天使","text":"什么?"},{"type":"dialogue","role":"天使长","text":"所以还不快走！"},{"type":"dialogue","role":"活泼天使","text":"那我们要快一点走！"},{"type":"dialogue","role":"可爱天使","text":"到了！"},{"type":"dialogue","role":"活泼天使","text":"这么快！"},{"type":"dialogue","role":"可爱天使","text":"因为我们是天使，所以速度当然快！"},{"type":"dialogue","role":"天使长","text":"他就是约瑟！我要进入他的梦中告诉他这个好消息。”\n大卫的子孙，约瑟，不要怕，只管娶过你的妻子马利亚，因她所怀的孕是从圣灵而来的。你要给他取名叫耶稣。"},{"type":"dialogue","role":"可爱天使","text":"耶稣这个名字的意思就是『他要将他的百姓从罪恶中拯救出来！"},{"type":"dialogue","role":"活泼天使","text":"或是称他为\"以马内利\"，就是神与我们同在的意思！"},{"type":"stage","text":"曲 目：小伯利恒歌--organ"},{"type":"stage","text":"(舞台的前方用默剧的表现方式呈现出："}]},{"id":"scene-3","title":"伯利恒的店家门口","sourceHeading":"第三景：伯利恒的店家门口","inferred":false,"items":[{"type":"dialogue","role":"旁白","text":"约瑟听完话就醒来，娶了马利亚。那时候，罗马皇帝奥古斯都颁布命令，要罗马帝国的人民都办理户口登记，大家都回本乡去办理登记。约瑟就带着怀孕接近生产的马利亚，回伯利恒登记！他们来到一间客栈前，约瑟让马利亚坐在一颗石头上休息，随即便去敲门。)"},{"type":"dialogue","role":"老板娘","text":"来了。"},{"type":"dialogue","role":"约瑟","text":"请问一下你们还有没有住宿的地方。"},{"type":"dialogue","role":"老板娘","text":"没了。"},{"type":"dialogue","role":"约瑟","text":"等一下！等一下！请你帮帮忙！ ！我妻子快要生了！"},{"type":"dialogue","role":"老板娘","text":"没有！没有！大家为了要配合政府的人口统计，\n每个人都从外地赶回来，怎么可能有空房间。你去看看别家好了！"},{"type":"dialogue","role":"马利亚","text":"怎么样?"},{"type":"dialogue","role":"约瑟","text":"都客满了！你还好吧?"},{"type":"dialogue","role":"马利亚","text":"还好！"},{"type":"dialogue","role":"约瑟","text":"我们就在这里休息一下！"},{"type":"dialogue","role":"马利亚","text":"好！"},{"type":"stage","text":"(可爱天使、活泼天使上场)"},{"type":"dialogue","role":"可爱天使","text":"说时迟那时快！我们又来了！"},{"type":"dialogue","role":"活泼天使","text":"我们是要来见证万王之王万主之主的降临！"},{"type":"dialogue","role":"可爱天使","text":"不得了了，万王之王现在已经要出生了，居然连个降生的地方都没有。"},{"type":"dialogue","role":"活泼天使","text":"这是我们的时刻了！"},{"type":"dialogue","role":"可爱天使","text":"哇哈哈！马利亚！现场的观众你们想看我们俩变什么！"},{"type":"dialogue","role":"活泼天使","text":"要什么有什么！变什么是什么！"},{"type":"dialogue","role":"可爱天使","text":"那我先变一个瑞金医院妇产科……"},{"type":"dialogue","role":"活泼天使","text":"那时代有瑞金医院?"},{"type":"dialogue","role":"可爱天使","text":"外加总统病房！"},{"type":"dialogue","role":"活泼天使","text":"总统病房都出来了！"},{"type":"dialogue","role":"可爱天使","text":"200位当今最红牌的妇产科医生！"},{"type":"dialogue","role":"活泼天使","text":"红牌?你这样说，医生好像酒店的小姐！"},{"type":"dialogue","role":"可爱天使","text":"3000位年轻貌美的护士！"},{"type":"dialogue","role":"活泼天使","text":"这又不是在选嫔妃，而且生一个孩子哪用得到这么多医生护士?"},{"type":"dialogue","role":"可爱天使","text":"这是场面！有没有用不重要，重点是把场面作起来！"},{"type":"dialogue","role":"活泼天使","text":"把炒面作起来……炒面?"},{"type":"dialogue","role":"可爱天使","text":"是场面！不是炒面！以后跟著我多学着点！注意了！现在我要把瑞金医院变出来！看我的……"},{"type":"dialogue","role":"天使长","text":"(打可爱天使)你在做什么?"},{"type":"dialogue","role":"活泼天使","text":"报告师父！他在变魔术！"},{"type":"dialogue","role":"天使长","text":"变什么?"},{"type":"dialogue","role":"可爱天使","text":"师父我跟你说，我们看见耶稣快要降生了！你看看这里！居然连一个住的地方都没有！所以我打算帮马利亚和耶稣变一间妇产科医院，让他们舒服一点！然后再多变一些医生护士，我们就把这个场面给做起来了！"},{"type":"dialogue","role":"天使长","text":"那你以后一定很忙！"},{"type":"dialogue","role":"可爱天使","text":"为什么?"},{"type":"dialogue","role":"天使长","text":"以后你服事这个万王之王，是不是还要帮他变出贵族双语幼稚园、森林小学、明星学校，长大后还要变车子、房子、妻子、儿子、金子、鞋子、袜子、裤子、帽子、桃子、李子……最后再变一个总统府给他。"},{"type":"dialogue","role":"可爱天使","text":"(想一想)那我们真的是会很忙！"},{"type":"dialogue","role":"可爱天使","text":"耶稣是来世上享乐的吗?如果是，他待在天上就好了，下来做什么?"},{"type":"dialogue","role":"活泼天使","text":"“耶稣是为人类的罪而来受苦的，还有？（天使想不起来后面该说什么了，于是看看天使长，）"},{"type":"dialogue","role":"天使长","text":"是的，耶稣是为人类的罪而来受苦的，他要被钉十字架受死并三天后复活。"},{"type":"dialogue","role":"可爱天使","text":"是的，因此凡相信他的人，就必要得永生。"},{"type":"dialogue","role":"天使长","text":"“我们先回去吧看看事情的发展吧。”"},{"type":"dialogue","role":"约瑟","text":"你再忍一忍！"},{"type":"dialogue","role":"马利亚","text":"啊！我恐怕是快要生了！"},{"type":"dialogue","role":"约瑟","text":"这怎么办才好！ (回去找老板娘)求求你帮个忙！\n我的妻子快要生了！你可不可以空一个房间给我们！"},{"type":"dialogue","role":"老板娘","text":"我不是说过我已经没有空房间了吗！你快一点走开！"},{"type":"dialogue","role":"约瑟","text":"求求你！"},{"type":"stage","text":"(老板娘正要把门板上，天使长使了一个魔法)"},{"type":"dialogue","role":"老板娘","text":"好吧！可是只剩下马槽可以用！"},{"type":"dialogue","role":"约瑟","text":"没关系，有就好了！"},{"type":"stage","text":"(约瑟扶著马利亚入内)"},{"type":"dialogue","role":"天使长","text":"(对可爱天使)你先去通知一些该通知的人，准备迎接救世主的降临！"},{"type":"dialogue","role":"活泼天使","text":"好兴奋喔！这真的是历史性的一刻！"},{"type":"dialogue","role":"天使长","text":"是啊！你看看在旧约有多少处预言圣婴的降世，一直到现在终于要实现了！人类的历史终于要改变了！"},{"type":"dialogue","role":"活泼天使","text":"师父我想进去看看这历史性的一刻！"},{"type":"dialogue","role":"天使长","text":"进去吧！"},{"type":"stage","text":"曲 目：马槽歌--choir"},{"type":"dialogue","role":"活泼天使","text":"师父！师父！恭喜！恭喜！生了！生了！"},{"type":"dialogue","role":"天使长","text":"恭喜？（？ 表示惊喜质疑。）是男的吧！"},{"type":"dialogue","role":"活泼天使","text":"不是！是公的！"},{"type":"dialogue","role":"天使长","text":"什么公的！"},{"type":"dialogue","role":"活泼天使","text":"旁边有一只母羊生了一只小公羊。！师父你看！ (拿出一只道具小羊 )"},{"type":"stage","text":"老板娘的声音从后方传来。"},{"type":"dialogue","role":"老板娘","text":"生了！生了！是一个男孩子，好可爱！"},{"type":"dialogue","role":"活泼天使","text":"师父这次是真的生了，进去看看好不好！"},{"type":"dialogue","role":"天使长","text":"(犹豫一下)好！我们进去看！"},{"type":"stage","text":"(马槽歌演唱)"}]},{"id":"scene-4","title":"旷野报喜","sourceHeading":null,"inferred":true,"items":[{"type":"dialogue","role":"旁白","text":"在旷野中有一群牧羊人，天使向他们显现，报给他们大好的信息。"},{"type":"dialogue","role":"天使长","text":"我报给你们大喜的信息！是关乎万民的！因为在今天大卫的城里，为你们生了救主，就是主基督。你们要看见一个婴孩，包著布，卧在马槽里，那就是记号了！"},{"type":"dialogue","role":"活泼天使","text":"不是还有一群博士要见圣婴耶稣吗?"},{"type":"dialogue","role":"可爱天使","text":"我知道，可是我找了很久都没有找到他们。"},{"type":"dialogue","role":"天使长","text":"你把星星拿出来用了吗?"},{"type":"dialogue","role":"可爱天使","text":"对了！那个星星！很重要的星星。"}]},{"id":"scene-5","title":"博士循星而来","sourceHeading":null,"inferred":true,"items":[{"type":"stage","text":"（可爱天使在舞台上方拿出一颗星星，众博士从观众席走上舞台，沿路问观众是否知道救世主降生的地方，忽然看见那一颗星星。）"},{"type":"dialogue","role":"博士1","text":"你们看！那一颗星星！"},{"type":"dialogue","role":"博士1","text":"它开始移动了，我们快跟上！我们快去看看！"},{"type":"dialogue","role":"博士2","text":"我们快去看看！"},{"type":"dialogue","role":"博士1","text":"星星停在这，我想应该就是这里了！"},{"type":"dialogue","role":"博士2","text":"真的有一位婴孩。"},{"type":"dialogue","role":"博士3","text":"我想他一定就是救世主！"},{"type":"dialogue","role":"博士4","text":"我们还是问一下好了！"},{"type":"dialogue","role":"博士5","text":"请问这个婴孩的父亲是哪一位?"},{"type":"dialogue","role":"约瑟","text":"我就是。"},{"type":"dialogue","role":"博士1","text":"我们会来这是因为这孩子非常的特别！"},{"type":"dialogue","role":"约瑟","text":"我知道，因为这个婴孩是我的妻子接受圣灵怀孕而生的！"},{"type":"dialogue","role":"博士2","text":"真的！我们找他找好久了！"},{"type":"dialogue","role":"博士3","text":"太好了！快一点把礼物拿出来I"},{"type":"dialogue","role":"博士4","text":"这是我们要送给圣婴的礼物！"},{"type":"dialogue","role":"博士5","text":"这里有黄金、乳香、没药送给孩子做礼物！"},{"type":"dialogue","role":"天使长","text":"永生的耶和华，我主啊！我的眼睛已经看见你的救恩，就是你在万民前所预备的，是照亮外邦人的光，又是你民以色列的荣耀。(对约瑟、马利亚说)这孩子被立是要叫以色列中许多人跌倒，许多人兴起。"},{"type":"dialogue","role":"马利亚","text":"你的意思是说……"},{"type":"dialogue","role":"天使长","text":"时候到了你就会知道！他将会牺牲自己，成为世人的救赎！"},{"type":"dialogue","role":"可爱天使","text":"恩，不如我们把这天定作一个节日。全世界的人都为纪念他的降生欢呼庆祝.因为这是圣婴降生的日子."},{"type":"dialogue","role":"活泼天使","text":"对,那么就叫”Christmas，圣诞节”吧！"},{"type":"dialogue","role":"可爱天使","text":"好啊，好啊！那就让我们一起庆祝吧！我们一起说：哈利路亚！！！圣诞快乐！！！"},{"type":"stage","text":"全剧演员都上来一起谢幕。"},{"type":"stage","text":"[剧终]齐唱普世欢腾"}]}],"sourceNotes":["原稿明确标出前三景；“旷野报喜”和“博士循星而来”是为阅读整理的分段。","演员表列出三位博士，台词另有博士4、博士5，暂标为待分配。","原稿注明“缺牧羊人戏份”；牧羊人1、牧羊人2保留在演员表，字数为零。","演员表写“旁边：Jenna”，正文写“解说”；本页按旁白统计，排练前请核对。","剧情摘要提及圣殿，正文没有单列圣殿场景。"]};
    const ROLE_COLORS = {
      '天使长':'#802653','可爱天使':'#844609','活泼天使':'#075a81','马利亚':'#12603e',
      '约瑟':'#704018','老板娘':'#9a302d','牧羊人1':'#6b5b0c','牧羊人2':'#526520',
      '博士1':'#5b3994','博士2':'#075f68','博士3':'#9b3361','博士4':'#35549b',
      '博士5':'#8f4027','旁白':'#425c59'
    };
    const counts = new Map(SCRIPT.cast.map(person => [person.role, 0]));
    const actors = new Map(SCRIPT.cast.map(person => [person.role, person.actor]));
    const dialogue = SCRIPT.scenes.flatMap(scene => scene.items.filter(item => item.type === 'dialogue'));
    const countText = text => [...text.replace(/[（(][^（）()]*[）)]/g, '')].filter(char => /[\p{L}\p{N}]/u.test(char)).length;
    for (const item of dialogue) counts.set(item.role, (counts.get(item.role) || 0) + countText(item.text));
    const make = (tag, className, value) => { const node = document.createElement(tag); if (className) node.className = className; if (value !== undefined) node.textContent = value; return node; };
    const sceneNav = document.getElementById('sceneNav');
    const sceneContainer = document.getElementById('scenes');
    const roleList = document.getElementById('roleList');
    const onlySelf = document.getElementById('onlySelf');
    const roleButtons = new Map();
    let focusedRole = null;

    SCRIPT.scenes.forEach((scene, index) => {
      const lines = scene.items.filter(item => item.type === 'dialogue');
      const number = String(index + 1).padStart(2, '0');
      const link = make('a', 'scene-link');
      link.href = '#' + scene.id;
      link.append(make('span', 'roman', 'SCENE ' + number), make('strong', '', scene.title), make('small', '', lines.length + ' 句台词 · ' + new Set(lines.map(item => item.role)).size + ' 位角色'));
      sceneNav.append(link);

      const section = make('section', 'scene-section');
      section.id = scene.id;
      const heading = make('h2', 'scene-title');
      heading.id = scene.id + '-title';
      heading.append(make('span', 'scene-ordinal', number), document.createTextNode(scene.title));
      section.setAttribute('aria-labelledby', heading.id);
      section.append(heading, make('p', 'scene-note', scene.inferred ? '按剧情整理的阅读分段' : scene.sourceHeading));
      scene.items.forEach(item => {
        if (item.type === 'stage') {
          section.append(make('p', 'stage', item.text));
          return;
        }
        const line = make('article', 'dialogue');
        line.dataset.role = item.role;
        line.style.setProperty('--role-ink', ROLE_COLORS[item.role] || '#50463d');
        const speaker = make('span', 'speaker', item.role);
        if (actors.has(item.role)) speaker.append(make('small', '', actors.get(item.role)));
        line.append(speaker, make('p', 'speech', item.text));
        section.append(line);
      });
      sceneContainer.append(section);
    });

    SCRIPT.cast.forEach(person => {
      const button = make('button', 'role-option');
      button.type = 'button';
      button.dataset.role = person.role;
      button.setAttribute('aria-pressed', 'false');
      button.style.setProperty('--role-ink', ROLE_COLORS[person.role] || '#50463d');
      button.append(make('span', 'role-swatch'));
      const name = make('span', 'role-name', person.actor);
      name.append(make('small', '', person.role));
      button.append(name, make('span', 'role-count', (counts.get(person.role) || 0).toLocaleString('zh-CN') + ' 字'));
      button.addEventListener('click', () => setFocus(focusedRole === person.role ? null : person.role));
      roleList.append(button);
      roleButtons.set(person.role, button);
    });

    function setFocus(role) {
      focusedRole = role;
      document.getElementById('showAll').setAttribute('aria-pressed', String(role === null));
      for (const [name, button] of roleButtons) button.setAttribute('aria-pressed', String(role === name));
      let firstLine = null;
      document.querySelectorAll('.dialogue').forEach(line => {
        const selected = role !== null && line.dataset.role === role;
        line.classList.toggle('is-focus', selected);
        line.hidden = onlySelf.checked && role !== null && !selected;
        if (selected && !firstLine) firstLine = line;
      });
      document.querySelectorAll('.scene-section').forEach((section, index) => {
        const hidden = role !== null && ![...section.querySelectorAll('.dialogue')].some(line => line.dataset.role === role);
        section.hidden = hidden;
        sceneNav.children[index].hidden = hidden;
      });
      document.getElementById('focusStatus').textContent = role === null ? '当前显示全部角色台词' : firstLine ? (onlySelf.checked ? '仅显示：' : '正在聚焦：') + role + ' · ' + (counts.get(role) || 0).toLocaleString('zh-CN') + ' 字；已跳至第一句' : role + '在原稿中没有台词';
      if (firstLine) firstLine.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
    }
    document.getElementById('showAll').addEventListener('click', () => setFocus(null));
    onlySelf.addEventListener('change', () => setFocus(focusedRole));
    for (const note of SCRIPT.sourceNotes) document.getElementById('sourceNotes').append(make('li', '', note));
  </script>
</body>
</html>
