    const SCRIPT = {"title":"天使之夜","credits":{"总策划":"高志华","总导演":"Gloria","制片人":"Mark"},"cast":[{"role":"天使长","actor":"徐厚祥"},{"role":"可爱天使","actor":"刘然"},{"role":"活泼天使","actor":"凌洁"},{"role":"马利亚","actor":"Gloria"},{"role":"约瑟","actor":"Welles"},{"role":"老板娘","actor":"Sandy"},{"role":"牧羊人1","actor":"高志华"},{"role":"牧羊人2","actor":"阿亮"},{"role":"博士1","actor":"Mark"},{"role":"博士2","actor":"Tom"},{"role":"博士3","actor":"Jerry"},{"role":"博士4","actor":"待分配"},{"role":"博士5","actor":"待分配"},{"role":"旁白","actor":"Jenna"}],"scenes":[{"id":"scene-1","title":"马利亚家","sourceHeading":"第一景 马利亚家","inferred":false,"items":[{"type":"stage","text":"（背景音乐）：我心尊主为大"},{"type":"dialogue","role":"旁白","text":"2026年前上帝差遣天使加百列到加利利一个叫拿撒勒的城去，要传话给一个童女，名叫马利亚;这个童女已经跟大卫家族一个名叫约瑟的男子订了婚。瞧，天使们来了。。。"},{"type":"dialogue","role":"天使长","text":"快一点，等一下迟到了就有你们好看了！"},{"type":"dialogue","role":"可爱天使","text":"急什么！反正她又跑不掉！"},{"type":"dialogue","role":"活泼天使","text":"对啊！"},{"type":"dialogue","role":"天使长","text":"这一件事情可是关系到未来人类的整个发展与命运的！"},{"type":"dialogue","role":"可爱天使","text":"那关我们什么事?我们又不是人类！"},{"type":"dialogue","role":"天使长","text":"你知不知道我们是什么?"},{"type":"dialogue","role":"可爱天使","text":"是天使！"},{"type":"dialogue","role":"天使长","text":"天使是做什么用的?"},{"type":"dialogue","role":"可爱天使","text":"人类常认为我们天使就是有翅膀，长得很帅(美) ，供大家参观娱乐的！"},{"type":"dialogue","role":"活泼天使","text":"其实，天使是一个灵！他是超越肉体的，飞来飞去接CASE！"},{"type":"dialogue","role":"天使长","text":"天使都是服役的灵，是要服务人类的！所以人类要是过得很好，我们的生活就会很喜乐\n如果一天到晚都是纷争的话，那我们会很担忧的。"},{"type":"dialogue","role":"可爱天使","text":"对！所以这件事情一定要快一点办成！"},{"type":"dialogue","role":"活泼天使","text":"为了我们天使的未来！一刻都不能延迟！走，快点上路吧！"},{"type":"stage","text":"(可爱天使、活泼天使一起作一个准备飞翔的动作)"},{"type":"dialogue","role":"可爱天使","text":"到了！"},{"type":"dialogue","role":"活泼天使","text":"怎么这么快！"},{"type":"dialogue","role":"可爱天使","text":"你忘了我们是天使吗?"},{"type":"dialogue","role":"活泼天使","text":"对对对！"},{"type":"dialogue","role":"天使长","text":"那就是马利亚了！你们快一点把上头交代要说的话说一说！"},{"type":"dialogue","role":"可爱天使","text":"我有带稿子！来来来！好！你去念！"},{"type":"dialogue","role":"活泼天使","text":"不行，我每次和人类说话我就会害羞！"},{"type":"dialogue","role":"可爱天使","text":"没关系，一回生二回熟！多说几次就好了。"},{"type":"dialogue","role":"活泼天使","text":"我真的不行。"},{"type":"dialogue","role":"可爱天使","text":"没问题，我相信你。"},{"type":"dialogue","role":"天使长","text":"122117386号天使！也该是你操练的时候了！"},{"type":"dialogue","role":"可爱天使","text":"师父英明！师父英明！师父英明！"},{"type":"dialogue","role":"可爱天使","text":"（出于真心地）加油！我们会为你祷告的。"},{"type":"stage","text":"(活泼天使出现在马利亚面前，喷雾。)"},{"type":"dialogue","role":"马利亚","text":"是天使，有天使出现了！"},{"type":"dialogue","role":"活泼天使","text":"蒙……大……恩……的……女……子。"},{"type":"stage","text":"(因为紧张发出语焉不详的怪声音。)"},{"type":"dialogue","role":"马利亚","text":"这是什么声音，我听不太懂！莫非这就是天使的语言，真的是凡人不能了解?"},{"type":"dialogue","role":"天使长","text":"我来说好了！马利亚不要怕，你在主的面前已经蒙恩了。你将会怀孕并生下一个儿子，你要给他取名叫耶稣。"},{"type":"dialogue","role":"可爱天使","text":"一定要取这个名字，不能乱取。"},{"type":"dialogue","role":"天使长","text":"上帝要把他祖先大卫王的宝座给他，他要做王直到永远！他的国也没有穷尽！"},{"type":"dialogue","role":"马利亚","text":"我还没有出嫁怎么可以发生这种事情。"},{"type":"dialogue","role":"天使长","text":"帝所要做奇妙的工作，他的意念是高过我们的意念，他的道路是高过我们的道路！ (对马利亚)抱歉！圣灵要降临在你身上，至高者的能力要荫庇你。因此你所生的婴孩，必称为神的儿子。因为出于神的话，没有一句不带有能力！"},{"type":"dialogue","role":"马利亚","text":"我是上帝的使女，情愿照他的话成就在我的身上。"},{"type":"stage","text":"曲 目：我心尊主为大"},{"type":"stage","text":"(三位天使下，场上只留下一光区，马利亚独自一人安静的祷告，在旁有一位舞者以象征她心境的方式舞蹈。)"},{"type":"dialogue","role":"旁白","text":"于是天使离开了她。马利亚就由圣灵怀了孕。她的未婚夫约瑟为人正直，知道了此事，不愿意公开羞辱她，却有意要秘密解除婚约。他正在考虑这事，天使们又来向他显现了。。。"}]},{"id":"scene-2","title":"约瑟家","sourceHeading":"第二景：约瑟家","inferred":false,"items":[{"type":"dialogue","role":"天使长","text":"你看看你们干的好事，说什么休息一下就好，一休息就休息了十几天，结果重要的事情到现在都还没办好！"},{"type":"dialogue","role":"可爱天使","text":"这也是没有办法的事情?祷告的人实在太少了！我工作起来都没有动力！"},{"type":"dialogue","role":"天使长","text":"现在马利亚怀孕的事情传到她的未婚夫那里去了！听说他要把马利亚休掉！"},{"type":"dialogue","role":"可爱天使","text":"什么?"},{"type":"dialogue","role":"天使长","text":"所以还不快走！"},{"type":"dialogue","role":"活泼天使","text":"那我们要快一点走！"},{"type":"dialogue","role":"可爱天使","text":"到了！"},{"type":"dialogue","role":"活泼天使","text":"这么快！"},{"type":"dialogue","role":"可爱天使","text":"因为我们是天使，所以速度当然快！"},{"type":"dialogue","role":"天使长","text":"他就是约瑟！我要进入他的梦中告诉他这个好消息。”\n大卫的子孙，约瑟，不要怕，只管娶过你的妻子马利亚，因她所怀的孕是从圣灵而来的。你要给他取名叫耶稣。"},{"type":"dialogue","role":"可爱天使","text":"耶稣这个名字的意思就是『他要将他的百姓从罪恶中拯救出来！"},{"type":"dialogue","role":"活泼天使","text":"或是称他为\"以马内利\"，就是神与我们同在的意思！"},{"type":"stage","text":"曲 目：小伯利恒歌--organ"},{"type":"stage","text":"(舞台的前方用默剧的表现方式呈现出："}]},{"id":"scene-3","title":"伯利恒的店家门口","sourceHeading":"第三景：伯利恒的店家门口","inferred":false,"items":[{"type":"dialogue","role":"旁白","text":"约瑟听完话就醒来，娶了马利亚。那时候，罗马皇帝奥古斯都颁布命令，要罗马帝国的人民都办理户口登记，大家都回本乡去办理登记。约瑟就带着怀孕接近生产的马利亚，回伯利恒登记！他们来到一间客栈前，约瑟让马利亚坐在一颗石头上休息，随即便去敲门。)"},{"type":"dialogue","role":"老板娘","text":"来了。"},{"type":"dialogue","role":"约瑟","text":"请问一下你们还有没有住宿的地方。"},{"type":"dialogue","role":"老板娘","text":"没了。"},{"type":"dialogue","role":"约瑟","text":"等一下！等一下！请你帮帮忙！ ！我妻子快要生了！"},{"type":"dialogue","role":"老板娘","text":"没有！没有！大家为了要配合政府的人口统计，\n每个人都从外地赶回来，怎么可能有空房间。你去看看别家好了！"},{"type":"dialogue","role":"马利亚","text":"怎么样?"},{"type":"dialogue","role":"约瑟","text":"都客满了！你还好吧?"},{"type":"dialogue","role":"马利亚","text":"还好！"},{"type":"dialogue","role":"约瑟","text":"我们就在这里休息一下！"},{"type":"dialogue","role":"马利亚","text":"好！"},{"type":"stage","text":"(可爱天使、活泼天使上场)"},{"type":"dialogue","role":"可爱天使","text":"说时迟那时快！我们又来了！"},{"type":"dialogue","role":"活泼天使","text":"我们是要来见证万王之王万主之主的降临！"},{"type":"dialogue","role":"可爱天使","text":"不得了了，万王之王现在已经要出生了，居然连个降生的地方都没有。"},{"type":"dialogue","role":"活泼天使","text":"这是我们的时刻了！"},{"type":"dialogue","role":"可爱天使","text":"哇哈哈！马利亚！现场的观众你们想看我们俩变什么！"},{"type":"dialogue","role":"活泼天使","text":"要什么有什么！变什么是什么！"},{"type":"dialogue","role":"可爱天使","text":"那我先变一个静安区中心医院妇产科……"},{"type":"dialogue","role":"活泼天使","text":"那时代有静安区中心医院?"},{"type":"dialogue","role":"可爱天使","text":"外加总统病房！"},{"type":"dialogue","role":"活泼天使","text":"总统病房都出来了！"},{"type":"dialogue","role":"可爱天使","text":"200位当今最红牌的妇产科医生！"},{"type":"dialogue","role":"活泼天使","text":"红牌?你这样说，医生好像酒店的小姐！"},{"type":"dialogue","role":"可爱天使","text":"3000位年轻貌美的护士！"},{"type":"dialogue","role":"活泼天使","text":"这又不是在选嫔妃，而且生一个孩子哪用得到这么多医生护士?"},{"type":"dialogue","role":"可爱天使","text":"这是场面！有没有用不重要，重点是把场面作起来！"},{"type":"dialogue","role":"活泼天使","text":"把炒面作起来……炒面?"},{"type":"dialogue","role":"可爱天使","text":"是场面！不是炒面！以后跟著我多学着点！注意了！现在我要把静安区中心医院变出来！看我的……"},{"type":"dialogue","role":"天使长","text":"(打可爱天使)你在做什么?"},{"type":"dialogue","role":"活泼天使","text":"报告师父！他在变魔术！"},{"type":"dialogue","role":"天使长","text":"变什么?"},{"type":"dialogue","role":"可爱天使","text":"师父我跟你说，我们看见耶稣快要降生了！你看看这里！居然连一个住的地方都没有！所以我打算帮马利亚和耶稣变一间妇产科医院，让他们舒服一点！然后再多变一些医生护士，我们就把这个场面给做起来了！"},{"type":"dialogue","role":"天使长","text":"那你以后一定很忙！"},{"type":"dialogue","role":"可爱天使","text":"为什么?"},{"type":"dialogue","role":"天使长","text":"以后你服事这个万王之王，是不是还要帮他变出贵族双语幼稚园、森林小学、明星学校，长大后还要变车子、房子、妻子、儿子、金子、鞋子、袜子、裤子、帽子、桃子、李子……最后再变一个总统府给他。"},{"type":"dialogue","role":"可爱天使","text":"(想一想)那我们真的是会很忙！"},{"type":"dialogue","role":"可爱天使","text":"耶稣是来世上享乐的吗?如果是，他待在天上就好了，下来做什么?"},{"type":"dialogue","role":"活泼天使","text":"“耶稣是为人类的罪而来受苦的，还有？（天使想不起来后面该说什么了，于是看看天使长，）"},{"type":"dialogue","role":"天使长","text":"是的，耶稣是为人类的罪而来受苦的，他要被钉十字架受死并三天后复活。"},{"type":"dialogue","role":"可爱天使","text":"是的，因此凡相信他的人，就必要得永生。"},{"type":"dialogue","role":"天使长","text":"“我们先回去吧看看事情的发展吧。”"},{"type":"dialogue","role":"约瑟","text":"你再忍一忍！"},{"type":"dialogue","role":"马利亚","text":"啊！我恐怕是快要生了！"},{"type":"dialogue","role":"约瑟","text":"这怎么办才好！ (回去找老板娘)求求你帮个忙！\n我的妻子快要生了！你可不可以空一个房间给我们！"},{"type":"dialogue","role":"老板娘","text":"我不是说过我已经没有空房间了吗！你快一点走开！"},{"type":"dialogue","role":"约瑟","text":"求求你！"},{"type":"stage","text":"(老板娘正要把门板上，天使长使了一个魔法)"},{"type":"dialogue","role":"老板娘","text":"好吧！可是只剩下马槽可以用！"},{"type":"dialogue","role":"约瑟","text":"没关系，有就好了！"},{"type":"stage","text":"(约瑟扶著马利亚入内)"},{"type":"dialogue","role":"天使长","text":"(对可爱天使)你先去通知一些该通知的人，准备迎接救世主的降临！"},{"type":"dialogue","role":"活泼天使","text":"好兴奋喔！这真的是历史性的一刻！"},{"type":"dialogue","role":"天使长","text":"是啊！你看看在旧约有多少处预言圣婴的降世，一直到现在终于要实现了！人类的历史终于要改变了！"},{"type":"dialogue","role":"活泼天使","text":"师父我想进去看看这历史性的一刻！"},{"type":"dialogue","role":"天使长","text":"进去吧！"},{"type":"stage","text":"曲 目：马槽歌--choir"},{"type":"dialogue","role":"活泼天使","text":"师父！师父！恭喜！恭喜！生了！生了！"},{"type":"dialogue","role":"天使长","text":"恭喜？（？ 表示惊喜质疑。）是男的吧！"},{"type":"dialogue","role":"活泼天使","text":"不是！是公的！"},{"type":"dialogue","role":"天使长","text":"什么公的！"},{"type":"dialogue","role":"活泼天使","text":"旁边有一只母羊生了一只小公羊。！师父你看！ (拿出一只道具小羊 )"},{"type":"stage","text":"老板娘的声音从后方传来。"},{"type":"dialogue","role":"老板娘","text":"生了！生了！是一个男孩子，好可爱！"},{"type":"dialogue","role":"活泼天使","text":"师父这次是真的生了，进去看看好不好！"},{"type":"dialogue","role":"天使长","text":"(犹豫一下)好！我们进去看！"},{"type":"stage","text":"(马槽歌演唱)"}]},{"id":"scene-4","title":"旷野报喜","sourceHeading":null,"inferred":true,"items":[{"type":"dialogue","role":"旁白","text":"在旷野中有一群牧羊人，天使向他们显现，报给他们大好的信息。"},{"type":"dialogue","role":"天使长","text":"我报给你们大喜的信息！是关乎万民的！因为在今天大卫的城里，为你们生了救主，就是主基督。你们要看见一个婴孩，包著布，卧在马槽里，那就是记号了！"},{"type":"dialogue","role":"活泼天使","text":"不是还有一群博士要见圣婴耶稣吗?"},{"type":"dialogue","role":"可爱天使","text":"我知道，可是我找了很久都没有找到他们。"},{"type":"dialogue","role":"天使长","text":"你把星星拿出来用了吗?"},{"type":"dialogue","role":"可爱天使","text":"对了！那个星星！很重要的星星。"}]},{"id":"scene-5","title":"博士循星而来","sourceHeading":null,"inferred":true,"items":[{"type":"stage","text":"（可爱天使在舞台上方拿出一颗星星，众博士从观众席走上舞台，沿路问观众是否知道救世主降生的地方，忽然看见那一颗星星。）"},{"type":"dialogue","role":"博士1","text":"你们看！那一颗星星！"},{"type":"dialogue","role":"博士1","text":"它开始移动了，我们快跟上！我们快去看看！"},{"type":"dialogue","role":"博士2","text":"我们快去看看！"},{"type":"dialogue","role":"博士1","text":"星星停在这，我想应该就是这里了！"},{"type":"dialogue","role":"博士2","text":"真的有一位婴孩。"},{"type":"dialogue","role":"博士3","text":"我想他一定就是救世主！"},{"type":"dialogue","role":"博士4","text":"我们还是问一下好了！"},{"type":"dialogue","role":"博士5","text":"请问这个婴孩的父亲是哪一位?"},{"type":"dialogue","role":"约瑟","text":"我就是。"},{"type":"dialogue","role":"博士1","text":"我们会来这是因为这孩子非常的特别！"},{"type":"dialogue","role":"约瑟","text":"我知道，因为这个婴孩是我的妻子接受圣灵怀孕而生的！"},{"type":"dialogue","role":"博士2","text":"真的！我们找他找好久了！"},{"type":"dialogue","role":"博士3","text":"太好了！快一点把礼物拿出来I"},{"type":"dialogue","role":"博士4","text":"这是我们要送给圣婴的礼物！"},{"type":"dialogue","role":"博士5","text":"这里有黄金、乳香、没药送给孩子做礼物！"},{"type":"dialogue","role":"天使长","text":"永生的耶和华，我主啊！我的眼睛已经看见你的救恩，就是你在万民前所预备的，是照亮外邦人的光，又是你民以色列的荣耀。(对约瑟、马利亚说)这孩子被立是要叫以色列中许多人跌倒，许多人兴起。"},{"type":"dialogue","role":"马利亚","text":"你的意思是说……"},{"type":"dialogue","role":"天使长","text":"时候到了你就会知道！他将会牺牲自己，成为世人的救赎！"},{"type":"dialogue","role":"可爱天使","text":"恩，不如我们把这天定作一个节日。全世界的人都为纪念他的降生欢呼庆祝.因为这是圣婴降生的日子."},{"type":"dialogue","role":"活泼天使","text":"对,那么就叫”Christmas，圣诞节”吧！"},{"type":"dialogue","role":"可爱天使","text":"好啊，好啊！那就让我们一起庆祝吧！我们一起说：哈利路亚！！！圣诞快乐！！！"},{"type":"stage","text":"全剧演员都上来一起谢幕。"},{"type":"stage","text":"[剧终]齐唱普世欢腾"}]}],"sourceNotes":["原稿明确标出前三景；“旷野报喜”和“博士循星而来”是为阅读整理的分段。","演员表列出三位博士，台词另有博士4、博士5，暂标为待分配。","原稿注明“缺牧羊人戏份”；牧羊人1、牧羊人2保留在演员表，字数为零。","演员表写“旁边：Jenna”，正文写“解说”；本页按旁白统计，排练前请核对。","剧情摘要提及圣殿，正文没有单列圣殿场景。"]};

      const link = make('a', 'scene-link');
      link.href = '#' + scene.id;
      link.append(make('span', 'roman', 'SCENE ' + number), make('strong', '', scene.title), make('small', '', lines.length + ' 句台词 · ' + new Set(lines.map(item => item.role)).size + ' 位角色'));
      sceneNav.append(link);
      const sceneChoice = make('label');
      const sceneCheckbox = make('input');
      sceneCheckbox.type = 'checkbox';
      sceneCheckbox.value = scene.id;
      sceneChoice.append(sceneCheckbox, document.createTextNode(number + ' ' + scene.title));
      mobileSceneOptions.append(sceneChoice);

      const section = make('section', 'scene-section');
      section.id = scene.id;
      const thumbnail = make('img', 'scene-thumbnail');
      thumbnail.src = 'angel-night-scene-' + (index + 1) + '.jpg';
      thumbnail.alt = scene.title + '的视频背景参考画面';
      thumbnail.width = 640;
      thumbnail.height = 360;
      thumbnail.loading = 'lazy';
      const heading = make('h2', 'scene-title');
      heading.id = scene.id + '-title';
      heading.append(make('span', 'scene-ordinal', number), document.createTextNode(scene.title));
      section.setAttribute('aria-labelledby', heading.id);
      section.append(thumbnail, heading);
      scene.items.forEach(item => {
        if (item.type === 'stage') {
          if (/舞台|上场|下场|入内|门板|声音从后方|谢幕|剧终|准备飞翔|出现在/.test(item.text)) section.append(make('p', 'stage', item.text));
          return;
        }
        const line = make('article', 'dialogue');
        line.dataset.role = item.role;
        line.style.setProperty('--role-ink', ROLE_COLORS[item.role] || '#50463d');
        const speaker = make('span', 'speaker', item.role);
        if (actors.has(item.role)) speaker.append(make('small', '', '（' + actors.get(item.role) + '）'));
        line.append(speaker, make('p', 'speech', item.text));
        section.append(line);
      });
      sceneContainer.append(section);
    });

    SCRIPT.cast.forEach(person => {
      const roleOption = make('option', '', person.actor + ' · ' + person.role);
      roleOption.value = person.role;
      mobileRoleSelect.append(roleOption);
      const castCard = make('div', 'mobile-cast-card');
      castCard.style.setProperty('--role-ink', ROLE_COLORS[person.role] || '#50463d');
      castCard.append(make('strong', '', person.role), make('span', '', person.actor));
      document.getElementById('mobileCastList').append(castCard);
      const button = make('button', 'role-option');
      button.type = 'button';
      button.dataset.role = person.role;
      button.setAttribute('aria-pressed', 'false');
      button.style.setProperty('--role-ink', ROLE_COLORS[person.role] || '#50463d');
      button.append(make('span', 'role-swatch'));
      const name = make('span', 'role-name', person.actor);
      name.append(make('small', '', person.role));
      button.append(name, make('span', 'role-count', (counts.get(person.role) || 0).toLocaleString('zh-CN') + ' 字'));
      button.addEventListener('click', () => setFocus(focusedRole === person.role ? null : person.role));
      roleList.append(button);
      roleButtons.set(person.role, button);
    });

    const readButton = document.getElementById('mobileReadButton');
    const desktopReadButton = document.getElementById('desktopReadButton');
    const readStatus = document.getElementById('mobileReadStatus');
    const originalAudio = new Audio('angel-night-original-audio.mp3');
    originalAudio.preload = 'auto';
    const sceneAudioRanges = [[0, 181], [181, 230], [230, 420], [420, 464], [464, 544]];
    let readingRanges = [];
    let readingIndex = 0;
    function stopReading() {
      originalAudio.pause();
      readingRanges = [];
      readButton.setAttribute('aria-pressed', 'false');
      readButton.querySelector('span').textContent = '语音朗读';
      desktopReadButton.setAttribute('aria-pressed', 'false');
      desktopReadButton.setAttribute('aria-label', '语音朗读');
      desktopReadButton.title = '语音朗读';
      readStatus.textContent = '';
    }
    function playReadingRange() {
      const range = readingRanges[readingIndex];
      if (!range) { stopReading(); readStatus.textContent = '原声播放结束'; return; }
      originalAudio.currentTime = range[0];
      originalAudio.play().catch(() => {
        if (readButton.getAttribute('aria-pressed') !== 'true') return;
        stopReading();
        readStatus.textContent = '原声播放失败，请重试';
      });
    }
    originalAudio.addEventListener('timeupdate', () => {
      if (readingRanges[readingIndex] && originalAudio.currentTime >= readingRanges[readingIndex][1] - 0.08) {
        readingIndex++;
        playReadingRange();
      }
    });
    originalAudio.addEventListener('ended', () => { stopReading(); readStatus.textContent = '原声播放结束'; });
    readButton.addEventListener('click', () => {
      if (readButton.getAttribute('aria-pressed') === 'true') { stopReading(); return; }
      const selectedScenes = [...mobileSceneOptions.querySelectorAll('input:checked')].map(input => SCRIPT.scenes.findIndex(scene => scene.id === input.value));
      const indexes = selectedScenes.length ? selectedScenes : SCRIPT.scenes.map((_, index) => index);
      if (focusedRole) {
        readingRanges = indexes.flatMap(index => (window.ANGEL_AUDIO_CUES[index] || [])
          .filter(cue => cue[0] === focusedRole).map(cue => [cue[1], cue[2]]));
        readStatus.textContent = readingRanges.length ? '播放视频原声中，未匹配的台词会跳过' : '当前角色在所选场景中没有可匹配的原声';
      } else {
        readingRanges = indexes.map(index => sceneAudioRanges[index]);
        if (!selectedScenes.length) readingRanges = [[0, originalAudio.duration || 544]];
        readStatus.textContent = '播放视频原声中';
      }
      if (!readingRanges.length) return;
      readingIndex = 0;
      readButton.setAttribute('aria-pressed', 'true');
      readButton.querySelector('span').textContent = '停止朗读';
      desktopReadButton.setAttribute('aria-pressed', 'true');
      desktopReadButton.setAttribute('aria-label', '停止朗读');
      desktopReadButton.title = '停止朗读';
      playReadingRange();
    });
    desktopReadButton.addEventListener('click', () => readButton.click());

    function setFocus(role, scrollToLine = true) {
      if (readButton.getAttribute('aria-pressed') === 'true') stopReading();
      focusedRole = role;
      mobileRoleSelect.value = role || '';
      const selectedPerson = SCRIPT.cast.find(person => person.role === role);
      document.getElementById('mobileRoleLabel').textContent = selectedPerson ? (selectedPerson.actor === '待分配' ? selectedPerson.role : selectedPerson.actor) : '角色筛选';
      mobileSceneOptions.querySelectorAll('label').forEach(label => {
        const scene = SCRIPT.scenes.find(item => item.id === label.querySelector('input').value);
        label.classList.toggle('no-role-lines', role !== null && !scene.items.some(item => item.type === 'dialogue' && item.role === role));
      });
      document.getElementById('showAll').setAttribute('aria-pressed', String(role === null));
      for (const [name, button] of roleButtons) button.setAttribute('aria-pressed', String(role === name));
      const mobile = matchMedia('(max-width:700px)').matches;
      const query = (mobile ? mobileSearchInput : document.getElementById('desktopSearchInput')).value.trim().toLocaleLowerCase();
      const selectedScenes = mobile ? new Set([...mobileSceneOptions.querySelectorAll('input:checked')].map(input => input.value)) : new Set();
      let firstLine = null;
      document.querySelectorAll('.dialogue').forEach(line => {
        const selected = role !== null && line.dataset.role === role;
        line.classList.toggle('is-focus', selected);
        line.hidden = (onlySelf.checked && role !== null && !selected) || (query !== '' && !line.textContent.toLocaleLowerCase().includes(query));
        if (!line.hidden && (selected || role === null) && !firstLine && (!selectedScenes.size || selectedScenes.has(line.closest('.scene-section').id))) firstLine = line;
      });
      let visibleScenes = 0;
      document.querySelectorAll('.scene-section').forEach((section, index) => {
        const hasRole = role === null || [...section.querySelectorAll('.dialogue')].some(line => line.dataset.role === role);
        const hasMatch = query === '' || !!section.querySelector('.dialogue:not([hidden])');
        const hidden = !hasRole || !hasMatch || (selectedScenes.size > 0 && !selectedScenes.has(section.id));
        section.hidden = hidden;
        sceneNav.children[index].hidden = hidden;
        if (!hidden) visibleScenes++;
        section.querySelectorAll('.stage').forEach(stage => { stage.hidden = query !== ''; });
      });
      document.getElementById('emptyState').hidden = visibleScenes !== 0;
      if (scrollToLine && firstLine && !firstLine.closest('.scene-section').hidden) firstLine.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
    }
    document.getElementById('showAll').addEventListener('click', () => setFocus(null));
    onlySelf.addEventListener('change', () => { mobileOnlySelf.checked = onlySelf.checked; setFocus(focusedRole, false); });
    mobileOnlySelf.addEventListener('change', () => { onlySelf.checked = mobileOnlySelf.checked; setFocus(focusedRole, false); });
    mobileRoleSelect.addEventListener('change', () => setFocus(mobileRoleSelect.value || null));
    mobileSceneOptions.addEventListener('change', () => { setFocus(focusedRole, false); resetSceneFilterTimer(); });
    mobileSearchInput.addEventListener('input', () => setFocus(focusedRole, false));
    document.getElementById('desktopSearchInput').addEventListener('input', () => setFocus(focusedRole, false));

    const mobileScenePanel = document.getElementById('mobileScenePanel');
    const mobileSceneButton = document.getElementById('mobileSceneButton');
    let sceneFilterTimer;
    function closeSceneFilter() {
      clearTimeout(sceneFilterTimer);
      mobileScenePanel.hidden = true;
      document.body.classList.remove('scene-filter-open');
      mobileSceneButton.setAttribute('aria-expanded', 'false');
    }
    function resetSceneFilterTimer() {
      clearTimeout(sceneFilterTimer);
      if (!mobileScenePanel.hidden) sceneFilterTimer = setTimeout(closeSceneFilter, 2000);
    }
    mobileScenePanel.addEventListener('pointerdown', resetSceneFilterTimer);
    mobileScenePanel.addEventListener('keydown', resetSceneFilterTimer);
    function closeMobileFilters() {
      closeSceneFilter();
      document.getElementById('mobileSearchPanel').hidden = true;
      document.getElementById('mobileSearchButton').setAttribute('aria-expanded', 'false');
    }
    function showMobileView(view, scrollTop = true) {
      const valid = ['script', 'video', 'cast', 'schedule', 'props', 'discussion'];
      if (!valid.includes(view)) view = 'script';
      document.body.dataset.view = view;
      for (const name of valid.slice(1)) document.getElementById('mobile' + name[0].toUpperCase() + name.slice(1) + 'View').hidden = name !== view;
      document.querySelectorAll('.mobile-bottom-nav button').forEach(button => {
        if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      document.querySelectorAll('.workspace-nav button[data-view]').forEach(button => {
        if (button.dataset.view === view) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
      if (scrollTop && matchMedia('(max-width:700px)').matches) window.scrollTo({top: 0, behavior: 'instant'});
    }
    function navigateMobile(view) {
      showMobileView(view);
      location.hash = 'view-' + view;
    }
    document.querySelectorAll('.mobile-view h2').forEach(title => {
      const back = make('button', 'desktop-back', '← 返回逐场台词');
      back.type = 'button';
      back.addEventListener('click', () => {
        navigateMobile('script');
        document.querySelector('.working-area').scrollIntoView({block:'start'});
      });
      title.after(back);
    });
    document.querySelectorAll('.mobile-filter-tabs button[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        const panel = document.getElementById('mobile' + button.dataset.filter[0].toUpperCase() + button.dataset.filter.slice(1) + 'Panel');
        const wasOpen = !panel.hidden && document.body.dataset.view === 'script';
        navigateMobile('script');
        if (button.dataset.filter === 'scene') {
          if (wasOpen) closeSceneFilter();
          else {
            panel.hidden = false;
            document.body.classList.add('scene-filter-open');
            button.setAttribute('aria-expanded', 'true');
            resetSceneFilterTimer();
          }
        } else {
          closeSceneFilter();
          panel.hidden = wasOpen;
          button.setAttribute('aria-expanded', String(!wasOpen));
          if (!wasOpen) mobileSearchInput.focus();
        }
      });
    });
    const mobileToolbar = document.querySelector('.mobile-toolbar');
    const updateMobileToolbarPosition = () => {
      const bounds = mobileToolbar.getBoundingClientRect();
      document.documentElement.style.setProperty('--mobile-toolbar-height', bounds.height + 'px');
      document.documentElement.style.setProperty('--mobile-toolbar-bottom', bounds.bottom + 'px');
    };
    new ResizeObserver(updateMobileToolbarPosition).observe(mobileToolbar);
    window.addEventListener('scroll', updateMobileToolbarPosition, {passive:true});
    updateMobileToolbarPosition();
    document.getElementById('mobileHome').addEventListener('click', () => navigateMobile('script'));
    document.querySelectorAll('.mobile-bottom-nav button').forEach(button => {
      button.addEventListener('click', () => { closeMobileFilters(); navigateMobile(button.dataset.view); });
    });
    document.querySelectorAll('.workspace-nav button[data-view]').forEach(button => {
      button.addEventListener('click', () => navigateMobile(button.dataset.view));
    });
    window.addEventListener('hashchange', () => showMobileView(location.hash.startsWith('#view-') ? location.hash.slice(6) : 'script'));
    matchMedia('(max-width:700px)').addEventListener('change', () => setFocus(focusedRole, false));
    showMobileView(location.hash.startsWith('#view-') ? location.hash.slice(6) : 'script', false);
    window.addEventListener('pageshow', () => {
      if (!location.hash || location.hash === '#view-script') window.scrollTo(0, 0);
    });

    const readLocalList = key => {
      try { const value = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(value) ? value : []; }
      catch { return []; }
    };
    const saveLocalList = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
    const propsKey = 'angel-night-props-v1';
    let props = readLocalList(propsKey);
    function renderProps() {
      for (const category of ['physical', 'digital']) {
        const container = document.getElementById(category + 'Props');
        container.replaceChildren();
        const items = props.filter(item => item.category === category);
        document.getElementById(category + 'Count').textContent = String(items.length);
        for (const item of items) {
          const row = make('div', 'prop-item' + (item.done ? ' is-done' : ''));
          const check = make('input');
          check.type = 'checkbox';
          check.checked = !!item.done;
          check.setAttribute('aria-label', '完成' + item.name);
          check.addEventListener('change', () => { item.done = check.checked; saveLocalList(propsKey, props); renderProps(); });
          const remove = make('button', '', '删除');
          remove.type = 'button';
          remove.setAttribute('aria-label', '删除' + item.name);
          remove.addEventListener('click', () => { props = props.filter(entry => entry.id !== item.id); saveLocalList(propsKey, props); renderProps(); });
          row.append(check, make('span', '', item.name), remove);
          container.append(row);
        }
      }
    }
    document.getElementById('propForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('propName');
      const name = input.value.trim();
      if (!name) return;
      props.push({id: newId(), name, category: document.getElementById('propCategory').value, done: false});
      saveLocalList(propsKey, props);
      input.value = '';
      renderProps();
    });
    renderProps();

    const discussionCollection = 'angelNightDiscussions';
    const discussionStatus = document.getElementById('discussionStatus');
    const discussionForm = document.getElementById('discussionForm');
    let discussionDbPromise;
    let discussions = [];
    function connectDiscussions() {
      if (!discussionDbPromise) discussionDbPromise = new Promise((resolve, reject) => {
        if (window.cloudbase) { resolve(window.cloudbase); return; }
        const script = document.createElement('script');
        script.src = 'https://static.cloudbase.net/cloudbase-js-sdk/3.5.2/cloudbase.full.js';
        script.onload = () => resolve(window.cloudbase);
        script.onerror = () => { script.remove(); reject(new Error('CloudBase SDK unavailable')); };
        document.head.append(script);
      }).then(async cloudbase => {
        if (!cloudbase) throw new Error('CloudBase SDK unavailable');
        const app = cloudbase.init({env: 'magicj-web-d5g9yvowj6862f7a2'});
        const auth = app.auth({persistence: 'local'});
        const state = await auth.getLoginState();
        if (!state?.user?.uid) {
          const result = await auth.signInAnonymously();
          if (result?.error) throw result.error;
        }
        return app.database();
      }).catch(error => { discussionDbPromise = null; throw error; });
      return discussionDbPromise;
    }
    function renderDiscussions() {
      const container = document.getElementById('discussionList');
      container.replaceChildren();
      for (const item of discussions) {
        const card = make('article', 'discussion-item');
        const header = make('header');
        header.append(make('strong', '', String(item.name).slice(0, 30)), make('time', '', new Date(item.createdAtIso).toLocaleString('zh-CN')));
        card.append(header, make('p', '', item.text));
        container.append(card);
      }
    }
    async function refreshDiscussions() {
      discussionStatus.textContent = '正在加载大家的意见…';
      try {
        const db = await connectDiscussions();
        const result = await db.collection(discussionCollection).orderBy('createdAtIso', 'desc').limit(100).get();
        discussions = (Array.isArray(result.data) ? result.data : []).filter(item => typeof item.name === 'string' && typeof item.text === 'string' && Number.isFinite(Date.parse(item.createdAtIso)));
        renderDiscussions();
        discussionStatus.textContent = '所有访客都可以填写，无需注册。';
      } catch {
        discussionStatus.textContent = '共享讨论暂时无法连接，请稍后重试。';
      }
    }
    discussionForm.addEventListener('submit', async event => {
      event.preventDefault();
      const input = document.getElementById('discussionText');
      const nameInput = document.getElementById('discussionName');
      const name = nameInput.value.trim();
      const text = input.value.trim();
      if (!name) { discussionStatus.textContent = '请填写您的名字。'; nameInput.focus(); return; }
      if (!text) { discussionStatus.textContent = '请填写排练意见。'; input.focus(); return; }
      const button = discussionForm.querySelector('button[type="submit"]');
      button.disabled = true;
      discussionStatus.textContent = '正在发表意见…';
      try {
        const db = await connectDiscussions();
        const newItem = {name, text, createdAtIso: new Date().toISOString()};
        await db.collection(discussionCollection).add(newItem);
        discussions.unshift(newItem);
        renderDiscussions();
        input.value = '';
        await refreshDiscussions();
      } catch {
        discussionStatus.textContent = '发表失败，内容仍在输入框中，请稍后重试。';
      } finally {
        button.disabled = false;
      }
    });
    window.addEventListener('hashchange', () => { if (location.hash === '#view-discussion') refreshDiscussions(); });
    if (document.body.dataset.view === 'discussion') refreshDiscussions();
  </script>
</body>
</html>
